  resumo:"Substância que o próprio corpo produz para controlar a dor e a inflamação (atua no sistema canabinoide, mas não dá 'barato'). Tem evidência crescente para dor crônica e neuropática, com ótima tolerância. Alternativa segura em dor de difícil controle.",
  blocos:[{d:"Dor crônica / neuropática",n:"B",t:"600-1200 mg/dia; reduz a dor crônica e neuropática, bem tolerada."}],
  dose:"600-1200 mg/dia (micronizada).",seg:"Muito bem tolerada, sem dependência. Pode ser adjuvante de analgésicos.",mani:"Palmitoiletanolamida (PEA) micronizada 600 mg — 30 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Nutracêutico."},
 {id:"boswellia_akba",nome:"Boswellia (AprèsFlex/alto AKBA)",sci:"Boswellia serrata",classe:"Fitoterápico",tags:["osteoartrite","inflamação","articular"],
  resumo:"Versão de boswellia padronizada para alto teor do ativo principal (AKBA) e melhor absorção (ex.: AprèsFlex/Aflapin). O AKBA inibe uma via inflamatória diferente da dos anti-inflamatórios comuns. Voltada a dor articular, com efeito que aparece em dias.",
  blocos:[{d:"Osteoartrite / dor articular",n:"B",t:"100 mg/dia da forma de alto AKBA; reduz dor articular, início em poucos dias."}],
  dose:"100 mg/dia (forma de alta absorção, ex.: AprèsFlex).",seg:"Desconforto no estômago/intestino leve. Bem tolerada.",mani:"Boswellia (AprèsFlex, alto AKBA) 100 mg — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Fitoterápico."},
 {id:"rosehip",nome:"Roseira-brava (rosa-mosqueta oral)",sci:"Rosa canina",classe:"Fitoterápico",tags:["osteoartrite","articular","vitamina C","antioxidante"],
  resumo:"Fruto da roseira-brava, rico em vitamina C e num componente anti-inflamatório (galactolipídio). Por via oral tem evidência razoável na osteoartrite, reduzindo dor e o uso de analgésicos. Diferente do óleo de rosa-mosqueta (que é para a pele).",
  blocos:[{d:"Osteoartrite",n:"B",t:"Pó padronizado 5 g/dia; reduz dor articular e o uso de analgésicos."}],
  dose:"Pó padronizado 2,5-5 g/dia.",seg:"Bem tolerado. Rico em vitamina C.",mani:"Roseira-brava (pó padronizado) 2,5 g — tomar 1-2x/dia.",reg:"Fitoterápico / alimento."},
 {id:"pinebark2",nome:"Pinha-marítima + vitamina C (forma)",sci:"",classe:"Fitoterápico",tags:["circulação","pele","veias"],
  resumo:"Combinação de picnogenol (casca de pinheiro, melhora a circulação e o colágeno) com vitamina C, que potencializa o efeito sobre os vasos e a pele. Usada em insuficiência venosa, microcirculação e firmeza cutânea.",
  blocos:[{d:"Circulação / veias / pele",n:"B",t:"Picnogenol + vitamina C; melhora microcirculação e suporte ao colágeno."}],
  dose:"Picnogenol 100 mg + vitamina C, conforme rótulo.",seg:"Bem tolerado. Cautela com remédios que afinam o sangue.",mani:"Picnogenol 50 mg + Vitamina C 200 mg — 1-2x/dia.",reg:"Fitoterápico / nutracêutico."},
 {id:"diosmin2",nome:"Rusco (gilbarbeira)",sci:"Ruscus aculeatus",classe:"Fitoterápico",tags:["insuficiência venosa","varizes","hemorroidas"],
  resumo:"Raiz europeia venotônica, que aumenta o tônus das veias e reduz o inchaço das pernas. Frequentemente combinada à diosmina/hesperidina. Usada em insuficiência venosa, varizes e hemorroidas. Padronização pelas ruscogeninas.",
  blocos:[{d:"Insuficiência venosa / pernas inchadas",n:"B",t:"Padronizado em ruscogeninas; reduz inchaço e sintomas das pernas."}],
  dose:"Extrato padronizado em ruscogeninas, conforme rótulo.",seg:"Bem tolerado. Desconforto no estômago/intestino leve.",mani:"Rusco (ext. padr. ruscogeninas) 150 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico."},
 {id:"gotu_vein",nome:"Centella (foco venoso)",sci:"Centella asiatica",classe:"Fitoterápico",tags:["insuficiência venosa","celulite","cicatrização"],
  resumo:"A centella asiática no uso venoso e estético: melhora a microcirculação, fortalece a parede das veias e estimula o colágeno. Estudada em insuficiência venosa (pernas pesadas/inchadas) e em celulite/firmeza. Padronização TTFCA.",
  blocos:[{d:"Insuficiência venosa",n:"B",t:"Extrato titulado 60-120 mg/dia; melhora microcirculação e inchaço das pernas."},{d:"Celulite / firmeza",n:"C",t:"Estimula colágeno; sinal estético modesto."}],
  dose:"Extrato titulado em triterpenos, 60-120 mg/dia.",seg:"Lesão no fígado rara em uso prolongado. Cautela na gravidez.",mani:"Centella (ext. titulado) 60 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"green_coffee2",nome:"Garcínia + cromo (forma)",sci:"",classe:"Fitoterápico",tags:["saciedade","peso","açúcar"],
  resumo:"Combinação popular de emagrecimento juntando garcínia (que teoricamente reduz a formação de gordura e a fome) e cromo (açúcar/desejo por doce). Importante ser honesto: o efeito real sobre o peso é pequeno, e a garcínia tem alerta de risco para o fígado.",
  blocos:[{d:"Saciedade / peso",n:"D",t:"Efeito pequeno sobre o peso; garcínia com alerta hepático."}],
  dose:"Conforme rótulo (efeito modesto).",seg:"A garcínia já teve relatos de lesão no fígado — cautela e atenção a sinais.",mani:"Garcínia 500 mg + Cromo 200 mcg — uso com cautela.",reg:"Fitoterápico (cautela)."},
 {id:"yerba_mate",nome:"Erva-mate",sci:"Ilex paraguariensis",classe:"Estimulante",tags:["energia","foco","antioxidante","metabolismo"],
  resumo:"Folha sul-americana do chimarrão/tererê, rica em cafeína e antioxidantes. Dá energia e foco como o café, com antioxidantes próprios e sinal modesto sobre o metabolismo e o colesterol. Atenção: bebida muito quente em excesso associa-se a câncer de esôfago.",
  blocos:[{d:"Energia / foco",n:"B",t:"Fonte de cafeína; energia e atenção, com antioxidantes."},{d:"Metabolismo / colesterol",n:"C",t:"Sinal modesto."}],
  dose:"Chá/extrato conforme uso (atento à cafeína total).",seg:"Contém cafeína. Beber muito quente cronicamente associa-se a câncer de esôfago — deixar amornar.",mani:"Erva-mate (extrato) 500 mg — 60 cápsulas.\nTomar 1 cápsula pela manhã.",reg:"Estimulante / alimento."},
 {id:"theaflavin",nome:"Chá preto (teaflavinas)",sci:"Camellia sinensis",classe:"Fitoterápico",tags:["colesterol","antioxidante","cardiovascular"],
  resumo:"O chá preto (a mesma planta do chá-verde, mas fermentada) é rico em teaflavinas, antioxidantes com sinal sobre o colesterol e a função dos vasos. Diferente do chá-verde (que tem EGCG), com perfil cardiovascular próprio.",
  blocos:[{d:"Colesterol / cardiovascular",n:"C",t:"Teaflavinas; sinal de redução modesta do colesterol LDL."}],
  dose:"Extrato padronizado em teaflavinas, conforme rótulo.",seg:"Contém cafeína. Bem tolerado.",mani:"Chá preto (ext. padr. teaflavinas) 350 mg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Fitoterápico / alimento."},
 {id:"matcha",nome:"Matchá",sci:"Camellia sinensis",classe:"Estimulante",tags:["energia","foco","antioxidante","EGCG"],
  resumo:"Chá-verde em pó integral (a folha inteira moída), então mais concentrado em EGCG, L-teanina e cafeína que o chá-verde comum. A combinação natural de cafeína com L-teanina dá energia e foco 'limpos', sem o nervosismo do café puro.",
  blocos:[{d:"Energia / foco limpo",n:"B",t:"Cafeína + L-teanina natural; energia e atenção sem nervosismo."},{d:"Antioxidante / metabolismo",n:"C",t:"Rico em EGCG."}],
  dose:"1-2 g de pó/dia (ou conforme uso).",seg:"Contém cafeína. Preferir fonte com baixo teor de metais/chumbo.",mani:"Matchá (pó) 1 g — preparar em água quente, pela manhã.",reg:"Alimento / estimulante."},
 {id:"reishi_calm",nome:"Reishi (sono/estresse)",sci:"Ganoderma lucidum",classe:"Fitoterápico",tags:["sono","estresse","imunidade","calmante"],
  resumo:"O cogumelo reishi no uso calmante: tradicionalmente chamado de 'cogumelo da imortalidade', é usado para acalmar a mente, melhorar o sono e modular a imunidade. Os triterpenos teriam efeito relaxante. Evidência ainda de baixa qualidade, mas perfil seguro.",
  blocos:[{d:"Sono / estresse",n:"C",t:"Triterpenos com efeito calmante; sinal de melhora do sono, evidência fraca."},{d:"Imunidade",n:"C",t:"Beta-glucanos imunomoduladores."}],
  dose:"Extrato padronizado, 1-2 g/dia.",seg:"Cautela com remédios que afinam o sangue e que baixam a imunidade.",mani:"Reishi (ext. padr.) 500 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico / cogumelo funcional."}
,
 {id:"lactisbreve",nome:"Bifidobacterium breve",sci:"",classe:"Probiótico",tags:["intestino","bebê","imunidade"],
  resumo:"Cepa de probiótico importante na flora de bebês e crianças. Estudada para cólica, eczema infantil e suporte imune, além da saúde intestinal geral. Faz parte das primeiras bactérias que colonizam o intestino do recém-nascido.",
  blocos:[{d:"Saúde intestinal / imunidade infantil",n:"C",t:"Importante na flora infantil; sinal em eczema e suporte imune."}],
  dose:"1-10 bilhões/dia.",seg:"Cautela em imunidade muito baixa.",mani:"Bifidobacterium breve 5 bilhões — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Probiótico."},
 {id:"lactisplantarum",nome:"Lactobacillus plantarum",sci:"",classe:"Probiótico",tags:["intestino irritável","inchaço","imunidade"],
  resumo:"Cepa robusta que sobrevive bem à passagem pelo estômago e tem evidência para a síndrome do intestino irritável, reduzindo dor abdominal e inchaço. Também estudada para imunidade e colesterol. Versátil e bem tolerada.",
  blocos:[{d:"Síndrome do intestino irritável",n:"B",t:"Reduz dor abdominal e inchaço no intestino irritável."}],
  dose:"10 bilhões/dia.",seg:"Cautela em imunidade muito baixa.",mani:"Lactobacillus plantarum 10 bilhões — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Probiótico."},
 {id:"akkermansia",nome:"Akkermansia muciniphila",sci:"",classe:"Probiótico",tags:["metabolismo","barreira intestinal","peso"],
  resumo:"Bactéria que vive na camada de muco do intestino e está ligada a um metabolismo saudável — pessoas magras e metabolicamente sadias tendem a ter mais dela. A forma pasteurizada (morta) mostrou sinal sobre peso, açúcar e colesterol em estudo humano. Área quente de pesquisa.",
  blocos:[{d:"Metabolismo / barreira intestinal",n:"C",t:"Forma pasteurizada; sinal sobre peso, açúcar e colesterol em estudo-piloto."}],
  dose:"10 bilhões/dia (forma pasteurizada).",seg:"Bem tolerada nos estudos. Dados ainda emergindo.",mani:"Akkermansia muciniphila (pasteurizada) — conforme rótulo.\nTomar 1x/dia.",reg:"Probiótico / nutracêutico."},
 {id:"esporulados",nome:"Probiótico de esporos (Bacillus)",sci:"",classe:"Probiótico",tags:["intestino","disbiose","estabilidade"],
  resumo:"Probióticos na forma de esporos (Bacillus), que são como 'sementes' resistentes ao calor e ao ácido do estômago — não precisam de geladeira e chegam vivos ao intestino. Usados em disbiose e como probiótico estável. Atenção em quem tem imunidade muito baixa.",
  blocos:[{d:"Disbiose / saúde intestinal",n:"C",t:"Esporos resistentes que colonizam bem; sinal em disbiose."}],
  dose:"2-4 bilhões/dia.",seg:"Cautela em imunidade muito baixa. Geralmente bem tolerado.",mani:"Probiótico de esporos (Bacillus) — conforme rótulo.\nTomar 1x/dia.",reg:"Probiótico."},
 {id:"vitb2_high",nome:"Riboflavina (enxaqueca)",sci:"Vitamina B2",classe:"Vitamina",tags:["enxaqueca","energia","mitocondrial"],
  resumo:"A vitamina B2 em dose alta é uma das opções com melhor evidência para PREVENIR crises de enxaqueca (não trata a dor aguda). Ela melhora a produção de energia nas células do cérebro. O efeito aparece após cerca de 3 meses de uso contínuo.",
  blocos:[{d:"Prevenção de enxaqueca",n:"B",t:"400 mg/dia; reduz a frequência das crises (efeito após ~3 meses)."}],
  dose:"400 mg/dia (uso contínuo para prevenção).",seg:"Muito segura. Deixa a urina amarelo-fluorescente (inofensivo).",mani:"Riboflavina 200 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Vitamina / suplemento."},
 {id:"vitb3_niacin",nome:"Niacina (vitamina B3 flush)",sci:"Ácido nicotínico",classe:"Vitamina",tags:["colesterol","HDL","circulação"],
  resumo:"A forma da B3 que causa o 'flush' (rubor e calor na pele). Em dose alta, é um remédio antigo para colesterol — aumenta o HDL ('bom') e baixa triglicérides. Caiu de uso por causa do desconforto e por não reduzir eventos no coração nos estudos modernos.",
  blocos:[{d:"Colesterol (HDL/triglicérides)",n:"B",t:"Dose alta eleva o HDL e baixa triglicérides; benefício clínico questionado."}],
  dose:"Dose alta é uso médico (titulada para reduzir o rubor).",seg:"Rubor intenso, coceira; em dose alta pode afetar fígado, açúcar e ácido úrico. Uso de dose alta é médico.",mani:"Niacina — uso de dose alta sob orientação médica.",reg:"Vitamina / medicamento."},
 {id:"vitb3_inositol",nome:"Niacina sem rubor (hexaniacinato)",sci:"",classe:"Vitamina",tags:["colesterol","circulação"],
  resumo:"Forma da niacina que não causa o rubor/calor desconfortável. A má notícia honesta: por ser tão suave, ela quase não tem o efeito sobre o colesterol que a niacina comum tem. Acaba sendo uma vitamina B3 de manutenção, não um tratamento de colesterol.",
  blocos:[{d:"Colesterol",n:"D",t:"Sem rubor, mas com pouco ou nenhum efeito sobre o colesterol."}],
  dose:"Conforme rótulo (efeito sobre lipídios é fraco).",seg:"Bem tolerada (sem rubor), mas pouco eficaz para colesterol.",mani:"Niacina sem rubor 500 mg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Vitamina / suplemento."},
 {id:"vitk2_mk4",nome:"Vitamina K2 (MK-4)",sci:"Menaquinona-4",classe:"Vitamina",tags:["ossos","osteoporose"],
  resumo:"Outra forma da vitamina K2 (a MK-4), diferente da MK-7. Foi usada no Japão em dose muito alta como remédio para osteoporose. A MK-7 (de absorção mais longa) é a preferida em suplementos do dia a dia; a MK-4 exige doses bem maiores.",
  blocos:[{d:"Osteoporose (dose alta)",n:"B",t:"Dose alta (45 mg) usada como remédio para osteoporose no Japão."}],
  dose:"MK-4: 45 mg/dia (dose-remédio) ou doses menores em suplemento.",seg:"ANULA O EFEITO do remédio que afina o sangue varfarina (Marevan).",mani:"Vitamina K2 (MK-4) — conforme objetivo e orientação.",reg:"Vitamina / medicamento."},
 {id:"retinilpalmitato",nome:"Betacaroteno",sci:"Provitamina A",classe:"Vitamina",tags:["antioxidante","pele","visão"],
  resumo:"Pigmento alaranjado (cenoura, abóbora) que o corpo converte em vitamina A conforme a necessidade — por isso é uma forma mais segura de vitamina A (não acumula como o retinol). Antioxidante. Atenção importante: em fumantes, doses altas aumentam o risco de câncer de pulmão.",
  blocos:[{d:"Fonte segura de vitamina A / antioxidante",n:"B",t:"O corpo converte conforme a necessidade; mais seguro que o retinol."}],
  dose:"Pela dieta ou conforme rótulo.",seg:"FUMANTES: doses altas aumentam o risco de câncer de pulmão — evitar suplemento em quem fuma.",mani:"Betacaroteno 6 mg — 60 cápsulas.\nTomar 1 cápsula/dia (evitar se fumante).",reg:"Vitamina / suplemento."},
 {id:"vitc_ester",nome:"Vitamina C (Ester-C)",sci:"Ascorbato de cálcio",classe:"Vitamina",tags:["imunidade","estômago sensível","absorção"],
  resumo:"Forma 'não ácida' da vitamina C (ascorbato de cálcio), que pega menos no estômago — boa para quem tem estômago sensível à vitamina C comum. Vem com metabólitos que, segundo o fabricante, ficam mais tempo nas células. Mesma função da vitamina C.",
  blocos:[{d:"Imunidade / antioxidante (estômago sensível)",n:"C",t:"Forma suave ao estômago; mesma função da vitamina C."}],
  dose:"500-1000 mg/dia.",seg:"Suave ao estômago. Fornece um pouco de cálcio.",mani:"Vitamina C (Ester-C) 500 mg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Vitamina / suplemento."},
 {id:"acerola_natural",nome:"Vitamina C natural (acerola/camu)",sci:"",classe:"Vitamina",tags:["imunidade","antioxidante","natural"],
  resumo:"Vitamina C de fontes naturais como acerola e camu-camu, que vêm com bioflavonoides e outros antioxidantes da fruta — diferente do ácido ascórbico sintético isolado. Muitos preferem por trazer a 'matriz' completa, embora a vitamina C em si seja a mesma molécula.",
  blocos:[{d:"Imunidade / antioxidante",n:"C",t:"Vitamina C com a matriz da fruta; mesma evidência da vitamina C."}],
  dose:"Fornecendo 100-500 mg de vitamina C/dia.",seg:"Bem tolerada. Acidez em doses altas.",mani:"Vitamina C natural (acerola/camu-camu) 500 mg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Vitamina / alimento."},
 {id:"magcitrato2",nome:"Magnésio citrato",sci:"",classe:"Mineral",tags:["constipação","câimbra","absorção"],
  resumo:"Magnésio ligado ao ácido cítrico, uma das formas mais bem absorvidas e com efeito laxante suave — por isso é ótimo para quem tem magnésio baixo E prisão de ventre ao mesmo tempo. Em dose alta solta o intestino (isso pode ser bom ou ruim, conforme o objetivo).",
  blocos:[{d:"Magnésio + constipação",n:"B",t:"Bem absorvido e laxante suave; bom quando há falta de magnésio e prisão de ventre."}],
  dose:"Equivalente a 200-400 mg de magnésio/dia.",seg:"Solta o intestino em dose alta. Cautela em problema nos rins.",mani:"Magnésio citrato (equiv. 200 mg de magnésio) — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Mineral / suplemento."},
 {id:"magcloreto",nome:"Cloreto de magnésio",sci:"",classe:"Mineral",tags:["magnésio","reposição","tópico"],
  resumo:"Forma de magnésio bem absorvida, popular como 'magnésio P.A.' (uso oral) e também na forma tópica ('óleo de magnésio', passado na pele). Repõe o magnésio do corpo. A forma oral pode soltar o intestino em dose alta.",
  blocos:[{d:"Reposição de magnésio",n:"B",t:"Bem absorvido; repõe o magnésio do corpo."}],
  dose:"Conforme rótulo (equiv. 200-300 mg de magnésio).",seg:"Solta o intestino em dose alta. Cautela em problema nos rins.",mani:"Cloreto de magnésio (equiv. 250 mg de magnésio) — conforme rótulo.\nTomar 1x/dia.",reg:"Mineral / suplemento."},
 {id:"zincoorotato",nome:"Zinco orotato/gluconato",sci:"",classe:"Mineral",tags:["imunidade","pele","absorção"],
  resumo:"Formas bem absorvidas de zinco (orotato, gluconato), usadas para imunidade, pele e correção de deficiência. O gluconato é a base das pastilhas de zinco para resfriado. Como todo zinco, megadose por muito tempo prejudica o cobre.",
  blocos:[{d:"Imunidade / pele (deficiência)",n:"C",t:"Formas bem absorvidas; corrigem a deficiência de zinco."}],
  dose:"15-30 mg de zinco elementar/dia.",seg:"Enjoo em jejum. Megadose crônica causa falta de cobre.",mani:"Zinco gluconato (15 mg elementar) — 60 cápsulas.\nTomar 1 cápsula/dia com refeição.",reg:"Mineral / suplemento."},
 {id:"selenometionina",nome:"Selênio (selenometionina)",sci:"",classe:"Mineral",tags:["tireoide","antioxidante","fertilidade"],
  resumo:"A forma orgânica e bem absorvida de selênio. Cofator de enzimas antioxidantes e do metabolismo da tireoide. Usado em tireoidite de Hashimoto (pode reduzir os anticorpos) e na fertilidade masculina. Janela estreita: o excesso é tóxico (selenose).",
  blocos:[{d:"Tireoidite de Hashimoto",n:"C",t:"100-200 mcg/dia; pode reduzir os anticorpos da tireoide."},{d:"Fertilidade masculina / antioxidante",n:"C",t:"Melhora parâmetros do espermatozoide."}],
  dose:"100-200 mcg/dia.",seg:"Janela estreita — não exceder 400 mcg (risco de selenose: queda de cabelo, unhas frágeis).",mani:"Selênio (selenometionina) 100 mcg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Mineral / suplemento."},
 {id:"iodoalga",nome:"Iodo (de alga/kelp)",sci:"",classe:"Mineral",tags:["tireoide","deficiência"],
  resumo:"Fonte natural de iodo a partir de algas marinhas (kelp). O iodo é matéria-prima dos hormônios da tireoide. Atenção dupla: tanto a falta quanto o excesso de iodo prejudicam a tireoide, e o teor nas algas varia muito — o que pode levar a doses excessivas sem querer.",
  blocos:[{d:"Deficiência de iodo",n:"A",t:"Repõe iodo; importante na gestação e onde o sal não é iodado."}],
  dose:"150 mcg/dia (gestação 220-250 mcg).",seg:"Excesso pode desencadear problema de tireoide. O teor nas algas varia — cuidado com doses altas. Cautela em tireoidopatia.",mani:"Iodo (de kelp) 150 mcg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Mineral / suplemento."},
 {id:"cromolevedura",nome:"Cromo (de levedura)",sci:"",classe:"Mineral",tags:["controle glicêmico","desejo por doce"],
  resumo:"Cromo de fonte natural (levedura enriquecida), que alguns consideram melhor aproveitado que o picolinato. O cromo participa da ação da insulina; ajuda modestamente no açúcar e na vontade de doce. Efeito pequeno, como as outras formas.",
  blocos:[{d:"Controle do açúcar / desejo por doce",n:"C",t:"Efeito pequeno; mais visível em quem tem deficiência."}],
  dose:"200-400 mcg/dia.",seg:"Bem tolerado nas doses usuais.",mani:"Cromo (levedura) 200 mcg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Mineral / suplemento."},
 {id:"vanadium_no",nome:"Potássio (citrato/cloreto)",sci:"",classe:"Mineral",tags:["pressão","câimbra","reposição"],
  resumo:"Mineral essencial para a pressão, o coração e os músculos. A maioria das pessoas consome pouco (pouca fruta e verdura) e muito sódio — o desequilíbrio piora a pressão. A reposição é cuidadosa: em excesso, sobretudo com certos remédios ou problema nos rins, é perigosa.",
  blocos:[{d:"Pressão arterial",n:"B",t:"Mais potássio na dieta reduz a pressão; suplemento em casos específicos."},{d:"Câimbra / reposição",n:"C",t:"Repõe perdas (suor, diuréticos)."}],
  dose:"Pela dieta de preferência; suplemento conforme orientação.",seg:"PERIGO de potássio alto com remédios de pressão (tipo IECA/losartana), poupadores de potássio e em problema nos rins. Não suplementar por conta própria nessas situações.",mani:"Potássio (citrato) — uso conforme orientação médica.",reg:"Mineral / medicamento."},
 {id:"silicioacido",nome:"Silício (cavalinha/bambu)",sci:"",classe:"Mineral",tags:["cabelo","unhas","ossos","colágeno"],
  resumo:"Mineral que participa da formação do colágeno e da matriz dos ossos, cabelo, unhas e pele. Fontes vegetais comuns são a cavalinha e o bambu. A forma de ácido ortossilícico estabilizado é a mais bem absorvida. Suporte de tegumento e ossos.",
  blocos:[{d:"Cabelo / unhas / pele",n:"C",t:"Cofator do colágeno; sinal modesto em força de cabelo e unha."}],
  dose:"Fornecendo ~10 mg de silício/dia.",seg:"Bem tolerado. A cavalinha em uso prolongado pode reduzir a tiamina (B1).",mani:"Silício (bambu/cavalinha) 300 mg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Mineral / nutracêutico."},
 {id:"germanio",nome:"Coenzima B12 (adenosilcobalamina)",sci:"",classe:"Vitamina",tags:["energia","mitocondrial","neuropatia"],
  resumo:"Uma das duas formas ativas da vitamina B12 (a outra é a metilcobalamina). A adenosilcobalamina atua dentro da mitocôndria, no metabolismo da energia. Algumas fórmulas combinam as duas formas ativas para cobrir as duas funções da B12.",
  blocos:[{d:"Energia / deficiência de B12",n:"B",t:"Forma ativa mitocondrial; corrige a deficiência junto da metilcobalamina."}],
  dose:"1000 mcg/dia (ou combinada com metilcobalamina).",seg:"Muito segura. Investigar a causa da deficiência.",mani:"Adenosilcobalamina 1000 mcg — 60 cápsulas.\nTomar 1/dia.",reg:"Vitamina / suplemento."},
 {id:"folinico",nome:"Ácido folínico",sci:"",classe:"Vitamina",tags:["folato","gestação","quimioterapia"],
  resumo:"Forma ativa do folato diferente do metilfolato, que não depende de várias enzimas para funcionar. É usada na medicina junto a certas quimioterapias (resgate) e em condições de metabolismo do folato. Em suplemento, é uma alternativa ao metilfolato.",
  blocos:[{d:"Folato (forma ativa alternativa)",n:"B",t:"Forma ativa que contorna bloqueios enzimáticos do folato."}],
  dose:"Conforme indicação.",seg:"Pode mascarar deficiência de B12 — repor B12 junto.",mani:"Ácido folínico 400 mcg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Vitamina / medicamento."},
 {id:"piridoxamina",nome:"Vitamina B6 (piridoxamina)",sci:"",classe:"Vitamina",tags:["glicação","rim","neuropatia"],
  resumo:"Forma da vitamina B6 estudada por bloquear a 'glicação' (o açúcar grudando nas proteínas e danificando-as, processo do envelhecimento e das complicações do diabetes). Pesquisa em proteção dos rins no diabetes. Diferente da B6 comum (piridoxina).",
  blocos:[{d:"Proteção contra glicação (diabetes)",n:"D",t:"Bloqueia a glicação em estudos; uso clínico ainda em construção."}],
  dose:"Conforme rótulo.",seg:"Como toda B6, excesso crônico causa formigamento — respeitar o teto total de B6.",mani:"Piridoxamina 25 mg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Vitamina / nutracêutico."},
 {id:"pqq_only",nome:"PQQ (pirroloquinolina quinona)",sci:"",classe:"Nutracêutico",tags:["mitocondrial","energia","cognição"],
  resumo:"Composto que, em modelos, estimula a criação de novas mitocôndrias (as 'usinas de energia' das células) e protege os neurônios. Usado para energia e cognição, frequentemente com CoQ10. Evidência humana ainda preliminar.",
  blocos:[{d:"Energia / função mitocondrial",n:"C",t:"10-20 mg/dia; estimula novas mitocôndrias em modelos, dados humanos preliminares."},{d:"Cognição",n:"D",t:"Sinal inicial em memória."}],
  dose:"10-20 mg/dia.",seg:"Bem tolerado nas doses usuais. Dados de longo prazo escassos.",mani:"PQQ 20 mg — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Nutracêutico."},
 {id:"alphaketo",nome:"Cetoanálogos de aminoácidos",sci:"",classe:"Aminoácido",tags:["doença renal crônica","proteína"],
  resumo:"Versões 'sem nitrogênio' de aminoácidos essenciais, usadas em quem tem doença renal crônica avançada e precisa restringir proteína. Fornecem os aminoácidos sem sobrecarregar os rins com os resíduos nitrogenados. Uso médico específico, sob nutricionista/nefrologista.",
  blocos:[{d:"Doença renal crônica (dieta de baixa proteína)",n:"B",t:"Permite restringir proteína preservando a nutrição; uso nefrológico."}],
  dose:"Dose médica conforme a função renal.",seg:"Uso é supervisionado por nefrologista/nutricionista. Não é para o público geral.",mani:"Cetoanálogos — uso conforme prescrição em doença renal.",reg:"Medicamento / nutracêutico clínico."},
 {id:"wheatgerm",nome:"Octacosanol (gérmen de trigo)",sci:"",classe:"Nutracêutico",tags:["energia","endurance","performance"],
  resumo:"Álcool graxo do óleo de gérmen de trigo, promovido para energia, resistência e desempenho físico. A evidência é antiga e fraca. É o principal componente do policosanol. Perfil seguro, mas benefício pouco comprovado.",
  blocos:[{d:"Energia / resistência",n:"D",t:"Promovido para endurance; evidência fraca e antiga."}],
  dose:"Conforme rótulo.",seg:"Bem tolerado. Contém glúten (gérmen de trigo).",mani:"Octacosanol 10 mg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Nutracêutico."},
 {id:"royaljelly2",nome:"Pólen de abelha",sci:"",classe:"Nutracêutico",tags:["energia","alergia","nutritivo"],
  resumo:"Grãos de pólen coletados pelas abelhas, ricos em proteínas, vitaminas e antioxidantes. Promovido como 'superalimento' energético e para alergias (dessensibilização). A evidência é fraca e há risco real de alergia grave em sensíveis.",
  blocos:[{d:"Energia / nutricional",n:"D",t:"Promovido como superalimento; evidência clínica fraca."}],
  dose:"Conforme rótulo.",seg:"RISCO de alergia grave (anafilaxia) em pessoas alérgicas a pólen/abelha. Testar com cautela.",mani:"Pólen de abelha — conforme rótulo (cautela em alérgicos).",reg:"Alimento / nutracêutico."},
 {id:"chlorelladetox",nome:"Spirulina + chlorella (forma)",sci:"",classe:"Nutracêutico",tags:["antioxidante","detox","nutritivo","vegano"],
  resumo:"Dupla de algas verdes ricas em proteína, clorofila e antioxidantes. A spirulina tem melhor sinal sobre colesterol/alergia; a chlorella é promovida para 'detox' de metais. Juntas, são um suplemento nutritivo de fonte vegetal. Exigir fonte certificada (risco de contaminantes).",
  blocos:[{d:"Nutricional / antioxidante",n:"C",t:"Spirulina com sinal metabólico; chlorella mais tradicional."}],
  dose:"3-5 g/dia (parede celular quebrada na chlorella).",seg:"Risco de contaminação — exigir fonte certificada. Spirulina: evitar em fenilcetonúria.",mani:"Spirulina 2 g + Chlorella 2 g — comprimidos.\nTomar ao longo do dia.",reg:"Nutracêutico / alga."},
 {id:"moringa",nome:"Moringa",sci:"Moringa oleifera",classe:"Fitoterápico",tags:["nutritivo","açúcar","colesterol","antioxidante"],
  resumo:"Folha da 'árvore milagrosa', muito nutritiva (vitaminas, minerais, proteína) e antioxidante. Tem sinal modesto sobre açúcar e colesterol. Usada como suplemento nutricional e fitoterápico metabólico, sobretudo em regiões tropicais.",
  blocos:[{d:"Açúcar / colesterol",n:"C",t:"Pó/extrato; sinal modesto sobre glicemia e lipídios."},{d:"Nutricional / antioxidante",n:"C",t:"Rica em micronutrientes."}],
  dose:"Pó 2-6 g/dia, ou extrato.",seg:"Pode baixar o açúcar e a pressão (cautela com remédios). A raiz é tóxica — usar só a folha.",mani:"Moringa (folha, pó/extrato) — 2-6 g/dia.\nTomar 1x/dia.",reg:"Fitoterápico / alimento."},
 {id:"ginkgomemo",nome:"Sálvia (cognição)",sci:"Salvia officinalis",classe:"Fitoterápico",tags:["memória","cognição","acetilcolina"],
  resumo:"A sálvia comum (do tempero) tem componentes que preservam a acetilcolina (neurotransmissor da memória), mecanismo parecido com remédios de Alzheimer. Estudos pequenos mostram melhora de memória e atenção em adultos saudáveis e com declínio leve.",
  blocos:[{d:"Memória / cognição",n:"C",t:"Extrato padronizado; sinal de melhora da memória e atenção."}],
  dose:"Extrato padronizado, conforme rótulo.",seg:"Doses altas do óleo (tujona) podem ser neurotóxicas — preferir extratos sem tujona. Evitar na gravidez.",mani:"Sálvia (ext. padr., baixa tujona) 300 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico."},
 {id:"rosemary",nome:"Alecrim",sci:"Rosmarinus officinalis",classe:"Fitoterápico",tags:["memória","foco","antioxidante","digestão"],
  resumo:"Erva aromática com antioxidantes (ácido carnósico, rosmarínico). Há sinal de que melhora memória e atenção (até o cheiro do óleo essencial é estudado para isso). Também digestiva e anti-inflamatória. Segura no uso culinário e em extratos.",
  blocos:[{d:"Memória / atenção",n:"C",t:"Extrato/aroma; sinal de melhora da memória e do alerta."},{d:"Digestão / antioxidante",n:"D",t:"Uso tradicional digestivo."}],
  dose:"Extrato conforme rótulo (ou uso culinário).",seg:"Doses medicinais altas: cautela na gravidez e em epilepsia. Uso culinário é seguro.",mani:"Alecrim (extrato) 250 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico / alimento."},
 {id:"lemonbalm2",nome:"Erva-cidreira (foco/calma)",sci:"Melissa officinalis",classe:"Fitoterápico",tags:["ansiedade","foco","calma","palpitação"],
  resumo:"A melissa (erva-cidreira) acalma sem dar muito sono e, curiosamente, melhora a atenção em situações de estresse. Tradicional para ansiedade, palpitações nervosas e digestão. Combina relaxamento com leve melhora cognitiva — boa para 'ansiedade que atrapalha o foco'.",
  blocos:[{d:"Ansiedade / calma com foco",n:"B",t:"300-600 mg de extrato; reduz a ansiedade e pode melhorar a atenção."},{d:"Palpitação nervosa / digestão",n:"C",t:"Uso tradicional calmante e digestivo."}],
  dose:"300-600 mg/dia de extrato padronizado.",seg:"Sonolência em doses altas. Cautela em hipotireoidismo (dados conflitantes) e com calmantes.",mani:"Erva-cidreira (ext. padr.) 300 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"skullcap",nome:"Escutelária",sci:"Scutellaria",classe:"Fitoterápico",tags:["ansiedade","sono","inflamação"],
  resumo:"Erva calmante; há duas: a americana (Scutellaria lateriflora, para ansiedade/sono) e a chinesa (baicalensis, anti-inflamatória, com baicalina). A americana é tradicional para ansiedade e tensão nervosa, com sinal inicial. Evitar produtos adulterados (já houve casos de toxicidade hepática por adulteração).",
  blocos:[{d:"Ansiedade / sono",n:"C",t:"Escutelária americana; efeito calmante, evidência inicial."}],
  dose:"Extrato conforme rótulo.",seg:"Risco de lesão no fígado com produtos adulterados — usar fonte confiável. Cautela com calmantes.",mani:"Escutelária (ext. padr.) 350 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico."},
 {id:"californiapoppy",nome:"Papoula-da-califórnia",sci:"Eschscholzia californica",classe:"Fitoterápico",tags:["ansiedade","sono","insônia"],
  resumo:"Planta calmante (não confundir com a papoula do ópio — não causa dependência) usada para ansiedade e insônia leve. Os alcaloides têm efeito sedativo suave e ansiolítico. Frequentemente combinada à valeriana. Evidência sobretudo tradicional.",
  blocos:[{d:"Ansiedade / insônia leve",n:"C",t:"Efeito calmante e sedativo suave; tradicional para o sono."}],
  dose:"Extrato conforme rótulo, à noite.",seg:"Sonolência. Cautela com calmantes e na gravidez.",mani:"Papoula-da-califórnia (ext.) 300 mg — 60 cápsulas.\nTomar 1 cápsula à noite.",reg:"Fitoterápico."},
 {id:"magnolia",nome:"Magnólia (honokiol)",sci:"Magnolia officinalis",classe:"Fitoterápico",tags:["ansiedade","sono","cortisol","estresse"],
  resumo:"Casca de magnólia usada na medicina chinesa; os componentes honokiol e magnolol têm ação calmante (sistema GABA) e ajudam a baixar o cortisol. Usada para ansiedade, estresse e sono, frequentemente em fórmulas de controle do cortisol.",
  blocos:[{d:"Ansiedade / estresse / cortisol",n:"C",t:"Honokiol/magnolol acalmam e ajudam a reduzir o cortisol."},{d:"Sono",n:"C",t:"Efeito sedativo suave."}],
  dose:"Extrato padronizado em honokiol, conforme rótulo.",seg:"Sonolência. Cautela com calmantes e na gravidez.",mani:"Magnólia (ext. padr. honokiol) 250 mg — 60 cápsulas.\nTomar 1 cápsula à noite.",reg:"Fitoterápico."},
 {id:"phellodendron",nome:"Felodendro",sci:"Phellodendron amurense",classe:"Fitoterápico",tags:["estresse","cortisol","ansiedade"],
  resumo:"Casca usada na medicina chinesa, frequentemente combinada à magnólia em fórmulas de controle do estresse e do cortisol (ex.: Relora). Os alcaloides teriam efeito calmante e sobre o equilíbrio do cortisol. Evidência preliminar.",
  blocos:[{d:"Estresse / cortisol",n:"C",t:"Combinado à magnólia; reduz estresse e cortisol em estudos pequenos."}],
  dose:"Conforme fórmula (geralmente com magnólia).",seg:"Cautela com calmantes. Dados de longo prazo limitados.",mani:"Felodendro + Magnólia (Relora) — conforme rótulo.\nTomar 1-2x/dia.",reg:"Fitoterápico."},
 {id:"cordycepsenergy",nome:"Cordyceps (energia/pulmão)",sci:"Cordyceps militaris",classe:"Fitoterápico",tags:["energia","performance","pulmão","libido"],
  resumo:"Cogumelo tradicional para energia, fôlego e libido. A cordicepina melhoraria o uso de oxigênio e a função pulmonar. Usado por atletas e em recuperação respiratória. Os estudos são pequenos e heterogêneos, mas o uso é amplo e seguro.",
  blocos:[{d:"Energia / fôlego / performance",n:"C",t:"Pode melhorar o uso de oxigênio; estudos pequenos."},{d:"Libido",n:"D",t:"Uso tradicional."}],
  dose:"1-3 g/dia de extrato.",seg:"Cautela com remédios que afinam o sangue e que baixam a imunidade.",mani:"Cordyceps (ext. padr.) 500 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico / cogumelo funcional."},
 {id:"macagelatin",nome:"Maca gelatinizada",sci:"Lepidium meyenii",classe:"Fitoterápico",tags:["libido","energia","digestão"],
  resumo:"Maca peruana 'gelatinizada' (pré-cozida para remover o amido), o que facilita a digestão e concentra os ativos — boa para quem tem desconforto com a maca crua. Mesmos usos: libido, energia e disposição, com melhor tolerância digestiva.",
  blocos:[{d:"Libido / energia",n:"C",t:"Forma mais digerível; mesmos usos da maca para libido e disposição."}],
  dose:"1,5-3 g/dia.",seg:"Melhor tolerada que a maca crua. Cautela em condições sensíveis a hormônios (dados escassos).",mani:"Maca gelatinizada 1,5 g — 60 doses.\nTomar 1,5-3 g/dia.",reg:"Fitoterápico / alimento."},
 {id:"safedmusli",nome:"Safed musli",sci:"Chlorophytum borivilianum",classe:"Fitoterápico",tags:["libido","testosterona","energia"],
  resumo:"Raiz indiana, o 'viagra herbal' da medicina ayurvédica, tradicional para libido, vigor e fertilidade masculina. As saponinas teriam efeito sobre desempenho e testosterona. Evidência majoritariamente pré-clínica e tradicional.",
  blocos:[{d:"Libido / vigor masculino",n:"D",t:"Tradicional ayurvédico; evidência clínica limitada."}],
  dose:"Extrato conforme rótulo.",seg:"Dados de segurança formais limitados.",mani:"Safed musli (ext. padr.) 500 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico."},
 {id:"fadogia",nome:"Fadogia agrestis",sci:"",classe:"Fitoterápico",tags:["testosterona","libido"],
  resumo:"Arbusto africano que ganhou popularidade recente para testosterona e libido masculina, impulsionado por divulgação na internet. ATENÇÃO: a evidência humana é praticamente inexistente e há sinais de toxicidade (testículos, rins) em estudos com animais. Cautela alta.",
  blocos:[{d:"Testosterona / libido",n:"D",t:"Popular na internet, mas SEM evidência humana e com sinal de toxicidade em animais."}],
  dose:"Não recomendado fora de pesquisa (sinais de toxicidade).",seg:"ALERTA: toxicidade testicular e renal em animais; sem dados de segurança humana. Cautela alta.",mani:"Uso não recomendado pela falta de segurança comprovada.",reg:"Fitoterápico (cautela)."},
 {id:"turkesterone",nome:"Turkesterona",sci:"Ajuga turkestanica",classe:"Nutracêutico",tags:["massa magra","performance","ecdisteroide"],
  resumo:"Um 'ecdisteroide' (hormônio de inseto/planta) popularizado para ganho muscular, com a promessa de efeito anabólico sem ser hormônio humano. A evidência real em pessoas é fraca e a qualidade dos produtos no mercado é muito variável (muitos têm pouco do ativo).",
  blocos:[{d:"Massa magra / performance",n:"D",t:"Muito promovido, mas evidência humana fraca e produtos inconsistentes."}],
  dose:"Conforme rótulo (qualidade muito variável).",seg:"Dados de segurança de longo prazo escassos. Mercado com produtos adulterados/subdosados.",mani:"Turkesterona — conforme rótulo (cautela com a procedência).",reg:"Nutracêutico."},
 {id:"ecdysterone",nome:"Ecdisterona",sci:"",classe:"Nutracêutico",tags:["massa magra","performance"],
  resumo:"Outro ecdisteroide (do espinafre e de outras plantas), também promovido para ganho muscular. Um estudo alemão chamou atenção, mas a evidência geral ainda é limitada. Já esteve na mira de listas antidoping por suspeita de efeito. Qualidade dos produtos varia.",
  blocos:[{d:"Massa magra / performance",n:"D",t:"Sinal num estudo isolado; evidência geral limitada."}],
  dose:"Conforme rótulo.",seg:"Já discutida em antidoping — atletas devem checar regras. Dados de segurança limitados.",mani:"Ecdisterona — conforme rótulo.",reg:"Nutracêutico."},
 {id:"tongkatlongjack",nome:"Tongkat Ali (foco testosterona)",sci:"Eurycoma longifolia",classe:"Fitoterápico",tags:["testosterona","estresse","fertilidade"],
  resumo:"O tongkat ali (longjack), padronizado e bem estudado entre os fitoterápicos de testosterona. Libera a testosterona 'presa' (ligada à SHBG) e reduz o cortisol do estresse. Tem evidência melhor que a maioria dos 'boosters'. Padronização: 1-2% eurycomanona.",
  blocos:[{d:"Testosterona / estresse (homens)",n:"B",t:"200-400 mg/dia padronizado; eleva a testosterona livre e reduz o cortisol."},{d:"Fertilidade masculina",n:"C",t:"Sinal em parâmetros do espermatozoide."}],
  dose:"200-400 mg/dia de extrato padronizado (1-2% eurycomanona).",seg:"Cautela em câncer sensível a hormônios. Insônia em dose alta à noite.",mani:"Tongkat Ali (ext. padr. 2%) 200 mg — 60 cápsulas.\nTomar 1 cápsula pela manhã.",reg:"Fitoterápico."}
,
 {id:"espinheira2",nome:"Mil-folhas (aquileia)",sci:"Achillea millefolium",classe:"Fitoterápico",tags:["digestão","cólica menstrual","cicatrização"],
  resumo:"Erva tradicional europeia e brasileira, usada para digestão, cólicas menstruais e, por fora, para feridas (cicatrizante e estanca sangramento). Os flavonoides e o azuleno têm ação anti-inflamatória e antiespasmódica. Uso consagrado, evidência clínica modesta.",
  blocos:[{d:"Digestão / cólica",n:"D",t:"Uso tradicional antiespasmódico e digestivo."},{d:"Cicatrização (tópico)",n:"D",t:"Tradicional para feridas."}],
  dose:"Chá ou extrato conforme rótulo.",seg:"Alergia a plantas da família da camomila. Evitar na gravidez (pode estimular o útero).",mani:"Mil-folhas (extrato) 300 mg — 60 cápsulas.\nTomar 1 cápsula após as refeições.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"calendula",nome:"Calêndula (tópica)",sci:"Calendula officinalis",classe:"Fitoterápico",tags:["pele","cicatrização","anti-inflamatório","tópico"],
  resumo:"Flor de uso principalmente tópico, com registro para cicatrização, inflamações da pele e mucosas. Os triterpenos têm ação anti-inflamatória e regeneradora. Usada em pomadas para assaduras, feridas leves e irritações de pele. Muito segura no uso externo.",
  blocos:[{d:"Cicatrização / inflamação de pele (tópico)",n:"B",t:"Pomada/creme; favorece a cicatrização e acalma a pele."}],
  dose:"Pomada/creme tópico, aplicar 2-3x/dia na área.",seg:"Alergia a plantas da família da camomila. Uso principalmente tópico.",mani:"Calêndula (pomada/creme) — uso tópico 2-3x/dia.",reg:"Fitoterápico tópico (lista ANVISA)."},
 {id:"babosatopica",nome:"Babosa (aloe tópico)",sci:"Aloe vera",classe:"Fitoterápico",tags:["queimadura","pele","cicatrização","tópico"],
  resumo:"O gel da babosa por fora: refrescante e cicatrizante, com boa evidência para queimaduras leves (incluindo de sol), feridas e irritações de pele. Acalma e hidrata. Diferente do uso oral (que tem outras indicações e cautelas).",
  blocos:[{d:"Queimadura leve / pele (tópico)",n:"B",t:"Gel; acelera a cicatrização de queimaduras leves e acalma a pele."}],
  dose:"Gel tópico, aplicar na área conforme necessário.",seg:"Uso tópico bem tolerado. Suspender se irritar.",mani:"Babosa (gel) — uso tópico na pele/queimadura.",reg:"Fitoterápico tópico."},
 {id:"hamamelis",nome:"Hamamélis",sci:"Hamamelis virginiana",classe:"Fitoterápico",tags:["hemorroidas","varizes","pele","tópico"],
  resumo:"Casca/folha adstringente, de uso tópico, tradicional para hemorroidas, varizes, pele oleosa e irritações. Os taninos 'fecham' os tecidos e reduzem inchaço e sangramento. Base de muitos tônicos faciais e pomadas para hemorroidas.",
  blocos:[{d:"Hemorroidas / pele (tópico)",n:"C",t:"Adstringente tópico; alívio de hemorroidas e irritações de pele."}],
  dose:"Tópico (pomada, água de hamamélis), conforme uso.",seg:"Uso tópico. O uso oral prolongado de taninos não é recomendado.",mani:"Hamamélis (pomada/água) — uso tópico na área.",reg:"Fitoterápico tópico (lista ANVISA)."},
 {id:"confrei",nome:"Confrei (tópico)",sci:"Symphytum officinale",classe:"Fitoterápico",tags:["contusão","entorse","cicatrização","tópico"],
  resumo:"Raiz/folha de uso EXCLUSIVAMENTE tópico, com boa evidência para contusões, entorses e dores musculares (a alantoína acelera a recuperação do tecido). IMPORTANTE: o uso oral é proibido — contém alcaloides que causam dano grave ao fígado.",
  blocos:[{d:"Contusão / entorse / dor (tópico)",n:"B",t:"Pomada; acelera a recuperação de contusões e entorses e alivia a dor."}],
  dose:"Pomada tópica, aplicar na área 2-3x/dia (pele íntegra).",seg:"USO ORAL É PROIBIDO (dano grave ao fígado). Só tópico, em pele íntegra, por tempo limitado. Não na gravidez.",mani:"Confrei (pomada) — uso tópico na área (nunca oral).",reg:"Fitoterápico tópico (lista ANVISA)."},
 {id:"tanchagem",nome:"Tanchagem",sci:"Plantago major",classe:"Fitoterápico",tags:["garganta","tosse","cicatrização","anti-inflamatório"],
  resumo:"Folha tradicional para inflamações de garganta e boca e, por fora, para a pele. A mucilagem e os taninos acalmam e protegem as mucosas. Base de muitos xaropes e gargarejos para garganta inflamada. Uso popular amplo.",
  blocos:[{d:"Inflamação de garganta / boca",n:"C",t:"Gargarejo/xarope; alívio de garganta e boca inflamadas."}],
  dose:"Gargarejo, xarope ou extrato conforme uso.",seg:"Bem tolerada. Uso tópico e local.",mani:"Tanchagem (xarope/extrato) — conforme rótulo.\nGargarejo ou xarope para garganta.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"malva",nome:"Malva",sci:"Malva sylvestris",classe:"Fitoterápico",tags:["garganta","tosse","boca","anti-inflamatório"],
  resumo:"Flores e folhas ricas em mucilagem, que formam uma camada protetora e calmante sobre as mucosas. Tradicional para garganta inflamada, tosse seca e inflamações da boca (gengiva, afta). Suave e segura, muito usada em gargarejos e chás.",
  blocos:[{d:"Garganta / boca inflamada / tosse seca",n:"C",t:"Mucilagem demulcente; acalma garganta, boca e tosse seca."}],
  dose:"Chá, gargarejo ou extrato conforme uso.",seg:"Muito bem tolerada.",mani:"Malva (extrato/chá) — gargarejo ou chá para garganta.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"eucalipto",nome:"Eucalipto",sci:"Eucalyptus globulus",classe:"Fitoterápico",tags:["tosse","congestão","expectorante","respiratório"],
  resumo:"Folha rica em eucaliptol (cineol), descongestionante e expectorante. Usado por inalação (vapor) e em xaropes/pomadas para gripe, tosse e nariz entupido — abre as vias respiratórias e fluidifica o muco. Base de muitos descongestionantes.",
  blocos:[{d:"Congestão / tosse (respiratório)",n:"B",t:"Inalação/xarope; descongestiona e ajuda a soltar o muco."}],
  dose:"Inalação (vapor) ou xarope/pomada conforme uso.",seg:"O óleo puro NÃO deve ser ingerido (tóxico). Cautela em crianças pequenas (não aplicar perto do nariz de bebês).",mani:"Eucalipto (xarope/inalação) — conforme rótulo.\nInalação de vapor para congestão.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"mentol_resp",nome:"Mentol/cânfora (tópico respiratório)",sci:"",classe:"Fitoterápico",tags:["congestão","tosse","peito","tópico"],
  resumo:"Combinação clássica das pomadas para o peito (tipo Vick): mentol e cânfora dão a sensação de 'abrir o nariz' e aliviam a tosse por reflexo. Uso tópico no peito/costas. Atenção: não usar no nariz de bebês nem ingerir.",
  blocos:[{d:"Congestão / tosse (tópico no peito)",n:"C",t:"Sensação de desobstrução e alívio da tosse; uso tópico."}],
  dose:"Pomada no peito/costas conforme uso (não em bebês <2 anos).",seg:"NÃO aplicar no nariz, em mucosas ou em bebês pequenos (risco respiratório). Não ingerir.",mani:"Pomada de mentol/cânfora — uso tópico no peito.",reg:"Fitoterápico tópico / medicamento."},
 {id:"tomilho",nome:"Tomilho",sci:"Thymus vulgaris",classe:"Fitoterápico",tags:["tosse","bronquite","expectorante","antimicrobiano"],
  resumo:"Erva aromática com timol, expectorante e com ação antimicrobiana nas vias respiratórias. Tradicional para tosse e bronquite, ajudando a soltar o catarro. Base de xaropes europeus para tosse. Também digestiva.",
  blocos:[{d:"Tosse / bronquite (expectorante)",n:"B",t:"Xarope/extrato; ajuda a soltar o catarro e alivia a tosse."}],
  dose:"Xarope ou extrato conforme rótulo.",seg:"Bem tolerado. O óleo puro é concentrado — não ingerir sem diluir.",mani:"Tomilho (xarope/extrato) — conforme rótulo.\nPara tosse com catarro.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"alteia",nome:"Altéia (marshmallow)",sci:"Althaea officinalis",classe:"Fitoterápico",tags:["tosse seca","garganta","gastrite","mucilagem"],
  resumo:"Raiz riquíssima em mucilagem, que forma um gel protetor sobre as mucosas irritadas. Excelente para tosse seca e garganta irritada (acalma o reflexo de tosse) e também para a mucosa do estômago. Muito suave e segura.",
  blocos:[{d:"Tosse seca / garganta irritada",n:"B",t:"Mucilagem; acalma a tosse seca e a garganta."},{d:"Gastrite / mucosa",n:"C",t:"Protege a mucosa do estômago."}],
  dose:"Xarope, pastilha ou extrato conforme uso.",seg:"Muito bem tolerada. Distanciar de outros remédios (a mucilagem reduz a absorção).",mani:"Altéia (xarope/pastilha) — conforme rótulo.\nPara tosse seca e garganta.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"erva_doce",nome:"Anis (erva-doce)",sci:"Pimpinella anisum",classe:"Fitoterápico",tags:["gases","cólica","digestão","amamentação"],
  resumo:"Semente aromática, carminativa (solta os gases) e digestiva, tradicional para cólicas, inchaço e como chá para cólica de bebê. Também usada para estimular a produção de leite. Suave e muito segura nas doses culinárias/chá.",
  blocos:[{d:"Gases / cólica / digestão",n:"C",t:"Chá/extrato; alívio de gases e cólicas digestivas."}],
  dose:"Chá ou extrato após as refeições.",seg:"Bem tolerado. Cautela em câncer sensível a hormônios (efeito fitoestrogênico leve).",mani:"Anis (extrato/chá) — após as refeições.",reg:"Fitoterápico / alimento."},
 {id:"camomila_topica",nome:"Camomila (tópica/colírio)",sci:"Matricaria chamomilla",classe:"Fitoterápico",tags:["olhos","pele","inflamação","tópico"],
  resumo:"A camomila por fora: compressas para olhos irritados/conjuntivite leve e para a pele inflamada (assadura, irritação). O bisabolol e a apigenina acalmam a inflamação local. Uso tópico tradicional e seguro (atento à alergia).",
  blocos:[{d:"Olhos / pele irritada (tópico)",n:"C",t:"Compressa; acalma olhos e pele irritados."}],
  dose:"Compressa de chá frio nos olhos ou na pele.",seg:"Alergia a plantas da família da camomila (pode irritar os olhos em sensíveis). Usar chá bem coado.",mani:"Camomila (compressa) — uso tópico em olhos/pele.",reg:"Fitoterápico tópico."},
 {id:"erva_baleeira",nome:"Erva-baleeira",sci:"Varronia curassavica",classe:"Fitoterápico",tags:["anti-inflamatório","articular","tópico","dor"],
  resumo:"Planta brasileira (também chamada maria-preta), de uso tópico anti-inflamatório, com registro para dores musculares e articulares. O alfa-humuleno tem ação anti-inflamatória. Base de pomadas e géis brasileiros para dor. Uso consagrado nacional.",
  blocos:[{d:"Dor muscular / articular (tópico)",n:"B",t:"Pomada/gel; alívio anti-inflamatório local de dores."}],
  dose:"Pomada/gel tópico, aplicar na área 2-3x/dia.",seg:"Uso tópico bem tolerado.",mani:"Erva-baleeira (pomada/gel) — uso tópico na dor.",reg:"Fitoterápico tópico (lista ANVISA)."},
 {id:"aroeira",nome:"Aroeira",sci:"Schinus terebinthifolius",classe:"Fitoterápico",tags:["cicatrização","ginecológico","anti-inflamatório","tópico"],
  resumo:"Casca de árvore brasileira, com registro para uso ginecológico (gel vaginal, cervicite/vaginose) e cicatrizante. Os taninos têm ação anti-inflamatória, adstringente e antimicrobiana. Fitoterápico nacional bem estabelecido para essas indicações.",
  blocos:[{d:"Cicatrização / ginecológico (tópico)",n:"B",t:"Gel; ação cicatrizante e anti-inflamatória, inclusive uso ginecológico."}],
  dose:"Gel/uso tópico conforme orientação.",seg:"Pode causar alergia de pele em sensíveis (parente da manga). Uso tópico.",mani:"Aroeira (gel) — uso tópico conforme orientação.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"romã",nome:"Romã (casca)",sci:"Punica granatum",classe:"Fitoterápico",tags:["garganta","antioxidante","pressão","próstata"],
  resumo:"A casca/fruto da romã é rica em punicalaginas, antioxidantes potentes. A casca é tradicional para garganta inflamada (gargarejo); o suco/extrato tem sinal sobre pressão, e há pesquisa em câncer de próstata. Versátil entre o tradicional e o metabólico.",
  blocos:[{d:"Garganta inflamada (gargarejo)",n:"C",t:"Gargarejo da casca; ação adstringente e anti-inflamatória local."},{d:"Pressão / antioxidante",n:"C",t:"Suco/extrato; sinal modesto sobre pressão e antioxidante."}],
  dose:"Gargarejo (casca) ou extrato/suco (metabólico).",seg:"Bem tolerada. O extrato pode interagir com remédios (enzimas do fígado).",mani:"Romã (extrato/casca) — gargarejo ou suplemento.",reg:"Fitoterápico / alimento."},
 {id:"cha_verde_topico",nome:"Chá-verde (tópico/EGCG)",sci:"Camellia sinensis",classe:"Fitoterápico",tags:["pele","acne","verrugas genitais","tópico"],
  resumo:"O chá-verde por fora: o EGCG tem registro como pomada para verrugas genitais (HPV) e é estudado para acne e fotoenvelhecimento. Antioxidante e anti-inflamatório na pele. Diferente do uso oral (metabolismo/energia).",
  blocos:[{d:"Verrugas genitais (HPV) - tópico",n:"A",t:"Pomada de EGCG (sinecatequinas); tratamento aprovado para verrugas genitais."},{d:"Acne / pele",n:"C",t:"Tópico; sinal em acne e antienvelhecimento."}],
  dose:"Pomada conforme orientação (verrugas) ou cosmético.",seg:"Uso tópico bem tolerado. A pomada para verrugas é de prescrição.",mani:"Chá-verde/EGCG (pomada) — uso tópico conforme orientação.",reg:"Fitoterápico tópico / medicamento."},
 {id:"cranberrypac",nome:"Cranberry (alto PAC)",sci:"Vaccinium macrocarpon",classe:"Fitoterápico",tags:["infecção urinária","prevenção"],
  resumo:"Cranberry padronizado em alta concentração de PAC (proantocianidinas tipo A), o componente que impede a bactéria de grudar na bexiga. A padronização importa muito: só com ≥36 mg de PAC há evidência de prevenir infecção urinária de repetição. É prevenção, não tratamento.",
  blocos:[{d:"Infecção urinária de repetição (prevenção)",n:"B",t:"≥36 mg de PAC/dia; reduz a recorrência de infecção urinária em mulheres."}],
  dose:"Extrato com ≥36 mg de PAC/dia.",seg:"Bem tolerado. Cautela com o remédio que afina o sangue varfarina.",mani:"Cranberry (ext. 36 mg PAC) — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Fitoterápico."},
 {id:"dmannose",nome:"D-manose",sci:"",classe:"Nutracêutico",tags:["infecção urinária","prevenção","bexiga"],
  resumo:"Açúcar simples que não é metabolizado e sai na urina, onde 'gruda' na bactéria E. coli (a principal causa de infecção urinária) e a impede de aderir à bexiga, sendo eliminada no xixi. Tem boa evidência para prevenir infecção urinária de repetição.",
  blocos:[{d:"Infecção urinária de repetição (prevenção)",n:"B",t:"2 g/dia; previne a recorrência tão bem quanto antibiótico profilático em estudo."}],
  dose:"2 g/dia (prevenção) ou 2-3 g 2-3x/dia (sintomas iniciais).",seg:"Bem tolerada. Cautela em diabéticos (é um açúcar, mas pouco absorvido).",mani:"D-manose 2 g — pó.\nTomar 2 g/dia em água.",reg:"Nutracêutico."},
 {id:"hibiscoflor",nome:"Hibisco (vinagreira)",sci:"Hibiscus sabdariffa",classe:"Fitoterápico",tags:["pressão","colesterol","diurético"],
  resumo:"O hibisco (vinagreira/azedinha) como chá ou extrato tem boa evidência para baixar a pressão (ação parecida com remédios que relaxam os vasos) e sinal sobre o colesterol. É um dos chás com melhor evidência cardiovascular, além de saboroso e seguro.",
  blocos:[{d:"Pressão arterial",n:"B",t:"Chá/extrato; reduz a pressão em pré-hipertensos de forma consistente."},{d:"Colesterol",n:"C",t:"Efeito modesto sobre lipídios."}],
  dose:"Chá: 1-2 xícaras/dia; ou extrato equivalente.",seg:"Hipotensão com remédios de pressão. Cautela na gravidez.",mani:"Hibisco (extrato seco) 250 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico / alimento."},
 {id:"valeriana2",nome:"Lúpulo",sci:"Humulus lupulus",classe:"Fitoterápico",tags:["sono","ansiedade","menopausa"],
  resumo:"A mesma planta que dá amargor à cerveja, mas aqui pelo efeito calmante e sedativo suave. Tradicional para insônia e ansiedade, quase sempre combinada à valeriana (a dupla é clássica para o sono). Também tem fitoestrógenos, estudados na menopausa.",
  blocos:[{d:"Insônia / ansiedade",n:"C",t:"Sedativo suave; melhor combinado à valeriana para o sono."},{d:"Fogachos (menopausa)",n:"C",t:"Fitoestrógenos; sinal modesto em fogachos."}],
  dose:"Extrato conforme rótulo, à noite (ou com valeriana).",seg:"Sonolência. Cautela com álcool e calmantes. Fitoestrógeno — cautela em câncer sensível a hormônios.",mani:"Lúpulo (ext.) 200 mg + Valeriana 300 mg — 30 cápsulas.\nTomar 40 min antes de dormir.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"linden",nome:"Tília",sci:"Tilia",classe:"Fitoterápico",tags:["ansiedade","sono","calmante"],
  resumo:"Flores tradicionalmente usadas como chá calmante para ansiedade, agitação e dificuldade de dormir, sobretudo de origem nervosa. Efeito suave, popular para crianças e idosos. Evidência sobretudo tradicional.",
  blocos:[{d:"Ansiedade / sono (leve)",n:"D",t:"Chá calmante tradicional; evidência clínica limitada."}],
  dose:"Chá ou extrato à noite.",seg:"Muito bem tolerada. Sonolência leve.",mani:"Tília (extrato/chá) — à noite.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"mulungu",nome:"Mulungu",sci:"Erythrina",classe:"Fitoterápico",tags:["ansiedade","insônia","calmante"],
  resumo:"Casca de árvore brasileira, tradicional como calmante para ansiedade e insônia. Os alcaloides têm efeito sedativo e ansiolítico. Frequentemente em fórmulas calmantes nacionais com passiflora e valeriana. Uso popular amplo, evidência clínica modesta.",
  blocos:[{d:"Ansiedade / insônia",n:"C",t:"Sedativo e ansiolítico tradicional; evidência clínica limitada."}],
  dose:"Extrato conforme rótulo.",seg:"Sonolência. Pode baixar a pressão. Cautela com calmantes e remédios de pressão.",mani:"Mulungu (ext.) 300 mg — 60 cápsulas.\nTomar 1 cápsula à noite.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"valeriana_brasil",nome:"Maracujá (Passiflora)",sci:"Passiflora incarnata",classe:"Fitoterápico",tags:["ansiedade","insônia","calmante"],
  resumo:"O maracujá (passiflora) é um dos calmantes naturais mais usados e estudados no Brasil, com registro para ansiedade. Potencializa o sistema de relaxamento do cérebro (GABA), dando efeito ansiolítico sem sedar muito. Base de muitos calmantes fitoterápicos.",
  blocos:[{d:"Ansiedade",n:"B",t:"Extrato padronizado; reduz a ansiedade, com bom perfil de segurança."},{d:"Insônia",n:"C",t:"Melhora subjetiva do sono."}],
  dose:"Extrato seco 200-400 mg/dia.",seg:"Sonolência. Cautela com calmantes. Evitar antes de dirigir.",mani:"Maracujá/Passiflora (ext. seco) 200 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"valerianafort",nome:"Valeriana (forma forte)",sci:"Valeriana officinalis",classe:"Fitoterápico",tags:["insônia","ansiedade"],
  resumo:"Valeriana em extrato concentrado e padronizado, o calmante fitoterápico mais conhecido para o sono. Atua no sistema de relaxamento do cérebro (GABA). A evidência objetiva para insônia é heterogênea, mas muita gente relata melhora — e o perfil é seguro.",
  blocos:[{d:"Insônia",n:"C",t:"300-600 mg de extrato 30-60 min antes de dormir; melhora subjetiva do sono."},{d:"Ansiedade",n:"C",t:"Efeito calmante leve."}],
  dose:"300-600 mg de extrato seco antes de dormir.",seg:"Sonolência. Cautela com álcool e calmantes. Não dirigir após.",mani:"Valeriana (ext. seco) 300 mg — 60 cápsulas.\nTomar 1-2 cápsulas 40 min antes de dormir.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"griffonia",nome:"Griffonia (5-HTP natural)",sci:"Griffonia simplicifolia",classe:"Fitoterápico",tags:["humor","sono","saciedade","serotonina"],
  resumo:"Semente africana que é a fonte natural do 5-HTP (matéria-prima da serotonina). Usada para humor, sono e controle do apetite. Mesmas indicações e cautelas do 5-HTP — sobretudo, não combinar com antidepressivos que mexem na serotonina.",
  blocos:[{d:"Humor / saciedade / sono",n:"C",t:"Fonte de 5-HTP; matéria-prima da serotonina, evidência modesta."}],
  dose:"Padronizada em 5-HTP, conforme rótulo.",seg:"NÃO combinar com antidepressivos que mexem na serotonina (tipo ISRS ou IMAO) — risco de excesso de serotonina.",mani:"Griffonia (padr. 5-HTP) 100 mg — 30 cápsulas.\nTomar 1 cápsula no fim da tarde.",reg:"Fitoterápico."},
 {id:"centelha",nome:"Centelha (foco cognitivo)",sci:"Centella asiatica",classe:"Fitoterápico",tags:["cognição","ansiedade","circulação"],
  resumo:"A centella asiática (gotu kola) no uso de mente: melhora a circulação cerebral, reduz a ansiedade e dá suporte à memória. Tradicional como 'erva da longevidade' na Índia. Complementa o uso para veias e pele com o ângulo cognitivo.",
  blocos:[{d:"Cognição / ansiedade",n:"C",t:"Extrato titulado; sinal modesto em memória e ansiedade."}],
  dose:"Extrato titulado, conforme rótulo.",seg:"Lesão no fígado rara em uso prolongado. Cautela na gravidez.",mani:"Centella (ext. titulado) 300 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"cogumelo_juba2",nome:"Leão-da-juba (foco/humor)",sci:"Hericium erinaceus",classe:"Fitoterápico",tags:["cognição","humor","ansiedade","nervos"],
  resumo:"O cogumelo leão-da-juba no ângulo do humor e do foco: além de estimular o fator de crescimento dos nervos (memória), tem sinal de redução de ansiedade e irritabilidade em estudos pequenos. Popular como nootrópico natural e suporte ao humor.",
  blocos:[{d:"Cognição / memória",n:"C",t:"Estimula o crescimento de nervos; sinal em cognição."},{d:"Humor / ansiedade",n:"C",t:"Sinal de redução de ansiedade e irritabilidade."}],
  dose:"1-3 g/dia de extrato padronizado.",seg:"Bem tolerado. Raros casos de alergia de pele/respiratória.",mani:"Leão-da-juba (ext. padr.) 500 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico / cogumelo funcional."},
 {id:"saffron_eye",nome:"Crocina (açafrão antioxidante)",sci:"",classe:"Nutracêutico",tags:["visão","antioxidante","humor"],
  resumo:"A crocina é o pigmento antioxidante isolado do açafrão, responsável por boa parte dos seus efeitos sobre a retina (visão) e o humor. Vendida em formas padronizadas. Mesma base de evidência do açafrão, concentrada no ativo.",
  blocos:[{d:"Visão / antioxidante",n:"C",t:"Antioxidante da retina; sinal na degeneração macular inicial."},{d:"Humor",n:"C",t:"Parte do efeito do açafrão sobre o humor."}],
  dose:"Conforme padronização (equivalente ao açafrão).",seg:"Bem tolerada nas doses usuais.",mani:"Crocina (açafrão padr.) — conforme rótulo.\nTomar 1x/dia.",reg:"Nutracêutico."},
 {id:"luteina_zea",nome:"Luteína + zeaxantina (forma)",sci:"",classe:"Nutracêutico",tags:["visão","mácula","luz azul","telas"],
  resumo:"A dupla de pigmentos que se concentra na mácula (centro da visão), filtrando a luz azul e protegendo a retina do estresse oxidativo. Base da fórmula AREDS2 para degeneração macular e usada para a fadiga visual de quem passa o dia em telas.",
  blocos:[{d:"Saúde da mácula / fadiga visual",n:"B",t:"10 mg luteína + 2 mg zeaxantina/dia; protege a mácula e reduz a fadiga visual."}],
  dose:"Luteína 10 mg + zeaxantina 2 mg/dia.",seg:"Muito bem tolerada.",mani:"Luteína 10 mg + Zeaxantina 2 mg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Nutracêutico."},
 {id:"astaxanthin2",nome:"Astaxantina (forma)",sci:"",classe:"Nutracêutico",tags:["antioxidante","pele","olhos","recuperação"],
  resumo:"Carotenoide vermelho de microalga, um dos antioxidantes mais potentes (atravessa para o cérebro e a retina). Usado para a pele (fotoproteção), olhos, recuperação muscular e como antioxidante geral. Dá o tom rosado ao salmão e ao flamingo.",
  blocos:[{d:"Antioxidante / pele",n:"C",t:"4-12 mg/dia; antioxidante potente, sinal em fotoproteção e elasticidade da pele."},{d:"Olhos / recuperação muscular",n:"C",t:"Antioxidante com tropismo ocular e muscular."}],
  dose:"4-12 mg/dia, com refeição gordurosa.",seg:"Bem tolerada. Pode dar leve pigmentação rosada em dose muito alta.",mani:"Astaxantina 4 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia com refeição.",reg:"Nutracêutico."},
 {id:"calcio_citrato",nome:"Cálcio citrato",sci:"",classe:"Mineral",tags:["ossos","absorção","sem estômago ácido"],
  resumo:"Forma de cálcio que se absorve bem mesmo sem ácido no estômago — boa para idosos e para quem usa remédio de azia (que reduz o ácido). Prende menos o intestino que o carbonato. Lembrando: a prioridade é o cálcio da dieta; o suplemento é para casos específicos.",
  blocos:[{d:"Saúde óssea (em déficit)",n:"B",t:"Bem absorvido sem ácido estomacal; útil em idosos e usuários de remédio de azia."}],
  dose:"Conforme a necessidade (preferir o cálcio da dieta).",seg:"O suplemento isolado tem debate sobre risco cardiovascular e pedra nos rins. Fracionar e não exceder.",mani:"Cálcio citrato (500 mg elementar) — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia com refeição.",reg:"Mineral / suplemento."},
 {id:"vitd_k2_d",nome:"Vitamina D3 (forma alta absorção)",sci:"Colecalciferol",classe:"Vitamina",tags:["ossos","imunidade"],
  resumo:"Vitamina D3 (a forma que o corpo produz no sol), preferida sobre a D2 por ser mais eficaz em elevar o nível no sangue. Importante para ossos, imunidade e músculos. A dose é individual, guiada pelo exame — repor em quem tem deficiência é onde mais ajuda.",
  blocos:[{d:"Correção de deficiência",n:"A",t:"Eleva o nível no sangue; o maior benefício é corrigir a deficiência."}],
  dose:"Conforme o exame (manutenção 1000-2000 UI/dia).",seg:"Megadose sem controle: risco de excesso de cálcio. Dosar o nível.",mani:"Vitamina D3 2000 UI — 60 cápsulas.\nTomar 1 cápsula/dia com refeição.",reg:"Vitamina / suplemento."},
 {id:"omega3_conc",nome:"Ômega-3 concentrado (alta pureza)",sci:"",classe:"Ácido graxo",tags:["triglicérides","coração","pureza"],
  resumo:"Óleo de peixe altamente concentrado e purificado (forma de éster etílico ou triglicéride re-esterificado), com muito EPA/DHA por cápsula e baixo nível de contaminantes. Importante para atingir as doses terapêuticas (2-4 g) sem tomar muitas cápsulas.",
  blocos:[{d:"Triglicérides altos",n:"A",t:"2-4 g/dia de EPA+DHA concentrado; reduz os triglicérides de forma robusta."},{d:"Coração / humor",n:"B",t:"Adjuvante cardiovascular e de humor."}],
  dose:"1-4 g/dia de EPA+DHA, conforme objetivo.",seg:"Arrotos, desconforto digestivo. Cautela com remédios que afinam o sangue em dose alta.",mani:"Ômega-3 concentrado (alta pureza) 1 g — 60 cápsulas.\nTomar 1-2 cápsulas 1-2x/dia.",reg:"Suplemento / medicamento conforme apresentação."},
 {id:"vitamina_b_complex2",nome:"Levedura nutricional",sci:"",classe:"Nutracêutico",tags:["complexo B","vegano","proteína","nutritivo"],
  resumo:"Levedura desativada (não fermenta), rica em proteína completa e vitaminas do complexo B, com sabor que lembra queijo. Muito usada por veganos para enriquecer pratos e como fonte natural de complexo B. As versões fortificadas trazem B12 adicionada.",
  blocos:[{d:"Complexo B / nutricional (vegano)",n:"C",t:"Fonte natural de complexo B e proteína; versões fortificadas têm B12."}],
  dose:"1-2 colheres/dia (uso alimentar).",seg:"Bem tolerada. Cautela em quem precisa evitar leveduras.",mani:"Levedura nutricional (flocos) — 1-2 colheres/dia na comida.",reg:"Alimento / nutracêutico."},
 {id:"clorofila",nome:"Clorofila (clorofilina)",sci:"",classe:"Nutracêutico",tags:["desodorizante","antioxidante","detox"],
  resumo:"O pigmento verde das plantas (na forma estável clorofilina). Usada como desodorizante interno (reduz odor corporal e de feridas) e promovida como antioxidante/'detox'. A evidência de desodorização tem base; as alegações de detox/emagrecimento, nem tanto.",
  blocos:[{d:"Desodorizante interno",n:"C",t:"Reduz odor corporal e de feridas; uso estabelecido."},{d:"Antioxidante / detox",n:"D",t:"Alegações populares sem boa evidência."}],
  dose:"100-300 mg/dia (clorofilina).",seg:"Pode dar coloração esverdeada nas fezes/urina (inofensivo). Bem tolerada.",mani:"Clorofila (clorofilina) 100 mg — 60 cápsulas.\nTomar 1 cápsula 1-3x/dia.",reg:"Nutracêutico / alimento."},
 {id:"berberina_pure",nome:"Berberina (forma pura)",sci:"",classe:"Nutracêutico",tags:["açúcar","colesterol","resistência à insulina","fígado"],
  resumo:"A berberina pura (cloridrato), um dos nutracêuticos com evidência mais forte: ativa a mesma via metabólica do exercício (AMPK), melhorando o açúcar, o colesterol e a gordura do fígado, às vezes de forma comparável a remédios. Limitada pela baixa absorção e por interações.",
  blocos:[{d:"Açúcar / resistência à insulina",n:"A",t:"500 mg 2-3x/dia; reduz o açúcar de forma comparável a remédios em alguns estudos."},{d:"Colesterol / gordura no fígado",n:"B",t:"Reduz colesterol e melhora a gordura do fígado."}],
  dose:"500 mg 2-3x/dia, antes das refeições.",seg:"Desconforto digestivo. Interfere em enzimas do fígado (muda o efeito de outros remédios). Contraindicada na gravidez e amamentação. Pode baixar muito o açúcar com remédios de diabetes.",mani:"Berberina HCl 500 mg — 90 cápsulas.\nTomar 1 cápsula antes das refeições.",reg:"Nutracêutico."},
 {id:"cromo_pico_pure",nome:"Picolinato de cromo (forma)",sci:"",classe:"Mineral",tags:["açúcar","desejo por doce","peso"],
  resumo:"A forma mais comum e barata de cromo, bem absorvida. Participa da ação da insulina; ajuda modestamente no controle do açúcar e na vontade de comer doce. O efeito é pequeno e mais visível em quem tem deficiência ou diabetes.",
  blocos:[{d:"Controle do açúcar / desejo por doce",n:"C",t:"200-400 mcg/dia; efeito pequeno, melhor em diabéticos."}],
  dose:"200-400 mcg/dia.",seg:"Bem tolerado nas doses usuais.",mani:"Picolinato de cromo 200 mcg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Mineral / suplemento."},
 {id:"alfalipoico_r",nome:"Ácido alfa-lipoico R (forma)",sci:"R-ALA",classe:"Nutracêutico",tags:["neuropatia diabética","antioxidante","açúcar"],
  resumo:"A forma 'R' do ácido alfa-lipoico, que é a natural e biologicamente ativa (o suplemento comum mistura R e S). Mais potente por miligrama. Usada na neuropatia do diabetes (formigamento, dor nos pés) e como antioxidante metabólico.",
  blocos:[{d:"Neuropatia diabética",n:"B",t:"Forma ativa; melhora os sintomas de formigamento e dor nos pés do diabetes."}],
  dose:"R-ALA 100-300 mg/dia (em jejum).",seg:"Pode baixar o açúcar (cautela com remédios de diabetes). Desconforto digestivo leve.",mani:"Ácido alfa-lipoico R 150 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia em jejum.",reg:"Nutracêutico."},
 {id:"coq10_ubiquinol2",nome:"Coenzima Q10 (ubiquinol)",sci:"",classe:"Nutracêutico",tags:["coração","energia","estatina","fertilidade"],
  resumo:"A forma reduzida e mais bem absorvida da CoQ10 — preferida em idosos e em quem tem absorção comprometida. Importante para a energia do coração e das células. Usada na dor muscular por estatina, insuficiência cardíaca e fertilidade.",
  blocos:[{d:"Dor muscular por estatina / coração",n:"B",t:"100-300 mg/dia; alivia a dor muscular da estatina em parte das pessoas."},{d:"Fertilidade / energia",n:"C",t:"Suporte à qualidade do óvulo/espermatozoide e à energia."}],
  dose:"100-300 mg/dia com refeição gordurosa.",seg:"Bem tolerado. Pode reduzir o efeito do remédio que afina o sangue varfarina.",mani:"Coenzima Q10 (ubiquinol) 100 mg — 60 cápsulas.\nTomar 1 cápsula 1-3x/dia com refeição.",reg:"Nutracêutico."}
];

var APP=document.getElementById('app');
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function best(s){var o={A:0,B:1,C:2,D:3},m="D";s.blocos.forEach(function(b){if(o[b.n]<o[m])m=b.n;});return m;}
function get(id){for(var i=0;i<DATA.length;i++)if(DATA[i].id===id)return DATA[i];}
function getC(id){for(var i=0;i<COMBOS.length;i++)if(COMBOS[i].id===id)return COMBOS[i];}
function clsOf(s){return CLASSES[s.classe]||CLASSES["Fitoterápico"];}
function svg(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}

function cardHTML(s,mt,i){
  var lv=best(s),cl=clsOf(s);
  return '<div class="card rise" style="animation-delay:'+(i*45)+'ms" onclick="openDetail(\''+s.id+'\')">'+
    '<span class="bar" style="background:'+cl.c+'"></span>'+
    '<div class="ico" style="background:'+cl.c+'22;color:'+cl.c+'">'+svg(cl.ic)+'</div>'+
    '<div class="mid"><div class="nm">'+esc(s.nome)+'</div>'+
    '<div class="cl">'+esc(s.classe.replace(' (alcaloide)',''))+(s.sci?' · '+esc(s.sci):'')+'</div>'+
    (mt?'<div class="mt">↳ '+esc(mt)+'</div>':'')+'</div>'+
    '<span class="lvl '+lv+'">'+lv+'</span></div>';
}
function comboCardHTML(co,i){
  var pills='';co.comps.slice(0,3).forEach(function(c){pills+='<span class="cpill">'+esc(c.nome)+'</span>';});
  if(co.comps.length>3)pills+='<span class="cpill more">+'+(co.comps.length-3)+'</span>';
  return '<div class="combo rise" style="animation-delay:'+(i*55)+'ms" onclick="openCombo(\''+co.id+'\')">'+
    '<div class="glow" style="background:'+co.c+'"></div>'+
    '<div class="top"><div class="cico" style="background:'+co.c+'22;color:'+co.c+'">'+svg(co.ic)+'</div>'+
    '<div><div class="cn">'+esc(co.nome)+'</div><div class="cf">'+esc(co.fim)+'</div></div></div>'+
    '<div class="pills">'+pills+'</div></div>';
}

var WHEEL_PICKS=["berb","curc","ome","ashwa","cre","mela","sere","rho"];
function wheelHTML(){
  // monta satélites em círculo; conteúdo contra-rotaciona p/ ficar legível
  var n=WHEEL_PICKS.length,R=124,sats='';
  for(var i=0;i<n;i++){
    var s=get(WHEEL_PICKS[i]); if(!s) continue;
    var ang=(i/n)*2*Math.PI - Math.PI/2;
    var x=Math.cos(ang)*R, y=Math.sin(ang)*R;
    var cl=clsOf(s), lv=best(s);
    var nm=s.nome.length>11?s.nome.slice(0,10)+'…':s.nome;
    sats+='<div class="sat" style="transform:translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px)" onclick="openDetail(\''+s.id+'\')">'+
      '<div class="sat-spin">'+
        '<span class="sb '+lv+'">'+lv+'</span>'+
        '<div class="si" style="color:'+cl.c+'">'+svg(cl.ic)+'</div>'+
        '<div class="sn">'+esc(nm)+'</div>'+
      '</div></div>';
  }
  return '<div class="wheel-sect">'+
    '<div class="wheel-cap"><div class="t">Em destaque</div><div class="a" onclick="goTab(\'az\')">ver todos</div></div>'+
    '<div class="wheel-stage" id="wheelStage">'+
      '<div class="wheel-orbit"></div>'+
      '<div class="wheel-rot" id="wheelRot">'+sats+'</div>'+
      '<div class="wheel-core"><div class="ce">'+DATA.length+'</div><div class="cd"></div><div class="cl">ativos</div></div>'+
    '</div>'+
    '<div class="wheel-hint">toque em um ativo · toque no centro para pausar</div></div>';
}
