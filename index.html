  refs:[{au:"Schoeneck M, Iggman D",yr:2021,jr:"Nutr Metab Cardiovasc Dis",ty:"Revisão sistemática de revisões/meta-análises (GRADE)",fd:"Alimentos ricos em fibra solúvel como o psyllium reduzem o LDL com evidência de alta qualidade (queda ao menos moderada, 0,20–0,40 mmol/L).",doi:"10.1016/j.numecd.2020.12.032"}],
  blocos:[{d:"Constipação",n:"A",t:"Fibra solúvel; melhora consistência e frequência."},{d:"Dislipidemia (LDL)",n:"A",t:"Reduz LDL de forma consistente."},{d:"Controle glicêmico",n:"B",t:"Atenua picos glicêmicos pós-prandiais."}],
  dose:"5–10 g/dia com bastante água.",seg:"Tomar com muita água (risco de obstrução). Distanciar de outros fármacos (1–2h).",mani:"Psyllium (casca) 5 g — dose diária.\nDiluir 5 g em 200 mL de água, 1–2x/dia.",reg:"Fibra / suplemento."},
 {id:"agpc",nome:"Alfa-GPC",sci:"Alfa-glicerofosfocolina",classe:"Nutracêutico",tags:["cognição","performance","foco"],
  resumo:"Forma de colina altamente biodisponível (alfa-glicerofosfocolina), precursora da acetilcolina e da fosfatidilcolina das membranas. Usada para cognição e como ergogênico; em head-to-head, superou a citicolina na demência.",
  blocos:[{d:"Cognição",n:"C",t:"Fonte de colina; sinal modesto em atenção e memória."},{d:"Performance / força",n:"C",t:"Pode aumentar potência em estudos pequenos."}],
  dose:"300–600 mg/dia.",seg:"Desconforto no estômago/intestino, dor de cabeça. Dados de longo prazo limitados.",mani:"Alfa-GPC 300 mg — 60 cápsulas.\nTomar 1 cápsula 1–2x/dia.",reg:"Nutracêutico."},
 {id:"citi",nome:"Citicolina",sci:"CDP-colina",classe:"Nutracêutico",tags:["cognição","memória"],
  resumo:"Intermediário natural na síntese da fosfatidilcolina, componente das membranas dos neurônios. Fornece colina (precursora da acetilcolina) e citidina, dando suporte estrutural e de neurotransmissão. Mais usada em declínio cognitivo vascular e recuperação após derrame (derrame (AVC)); head-to-head, a alfa-GPC saiu ligeiramente à frente.",
  refs:[{au:"Sagaro GG, Amenta F",yr:2025,jr:"Front Neurol",ty:"Revisão sistemática + meta-análise (3 RCTs, n=358)",fd:"Citicolina melhora condições clínicas na demência, mas foi inferior à alfa-GPC nesse desfecho; sem diferença em memória/fluência verbal.",doi:"10.3389/fneur.2025.1649661"}],
  blocos:[{d:"Recuperação pós-AVC / cognição vascular",n:"B",t:"Sinal positivo em alguns RCTs."},{d:"Memória / foco",n:"C",t:"Benefício modesto."}],
  dose:"250–500 mg 2x/dia.",seg:"Bem tolerada. desconforto leve no estômago/intestino.",mani:"Citicolina 500 mg — 60 cápsulas.\nTomar 1 cápsula 1–2x/dia.",reg:"Nutracêutico."},
 {id:"reishi",nome:"Reishi",sci:"Ganoderma lucidum",classe:"Fitoterápico",tags:["imunidade","insônia","fadiga"],
  resumo:"Cogumelo medicinal (Ganoderma lucidum) da tradição chinesa. Os beta-glucanos e triterpenos têm ação imunomoduladora; o uso oncológico adjuvante e no sono apoia-se em evidência de baixa qualidade.",
  blocos:[{d:"Imunidade / qualidade de vida",n:"C",t:"Sinais em pacientes oncológicos como adjuvante; baixa qualidade."},{d:"Sono",n:"C",t:"Uso tradicional; evidência limitada."}],
  dose:"1–3 g/dia de extrato.",seg:"Desconforto no estômago/intestino. Cautela com remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel) e remédios que baixam a imunidade (usados em transplante e em doenças autoimunes).",mani:"Reishi (ext.) 500 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico / cogumelo funcional."},
 {id:"cord",nome:"Cordyceps",sci:"Cordyceps militaris",classe:"Fitoterápico",tags:["performance","fadiga"],
  resumo:"Fungo (Cordyceps militaris) usado como tônico de energia e desempenho. A hipótese é melhora da utilização de oxigênio; os estudos de performance são pequenos e heterogêneos.",
  refs:[{au:"Chen S et al.",yr:2010,jr:"J Altern Complement Med",ty:"RCT duplo-cego controlado por placebo (n=20)",fd:"Cs-4 (Cordyceps sinensis) 333 mg 3x/dia por 12 semanas elevou o limiar metabólico e ventilatório em idosos saudáveis; sem mudança no VO2 máx.",doi:"10.1089/acm.2009.0226"}],
  blocos:[{d:"Performance / VO2",n:"C",t:"Sinal pequeno em capacidade aeróbica; estudos heterogêneos."},{d:"Fadiga",n:"C",t:"Uso tradicional."}],
  dose:"1–3 g/dia de extrato.",seg:"Desconforto no estômago/intestino. Cautela com remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel) e remédios que baixam a imunidade (usados em transplante e em doenças autoimunes).",mani:"Cordyceps (ext.) 500 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico / cogumelo funcional."},
 {id:"schi",nome:"Schisandra",sci:"Schisandra chinensis",classe:"Adaptógeno",tags:["fadiga","estresse","suporte hepático"],
  resumo:"Baga (Schisandra chinensis) adaptógena da medicina chinesa, de sabor dos 'cinco sabores'. As lignanas têm ação antioxidante e hepatoprotetora em modelos pré-clínicos.",
  blocos:[{d:"Estresse / fadiga",n:"C",t:"Adaptógeno; evidência preliminar."},{d:"Suporte hepático",n:"C",t:"Sinal em enzimas; baixa qualidade."}],
  dose:"500–1000 mg/dia de extrato.",seg:"Desconforto no estômago/intestino, azia. Cautela na gestação.",mani:"Schisandra (ext.) 500 mg — 60 cápsulas.\nTomar 1 cápsula 1–2x/dia.",reg:"Fitoterápico."},
 {id:"eleu",nome:"Eleuterococo",sci:"Eleutherococcus senticosus",classe:"Adaptógeno",tags:["fadiga","estresse"],
  resumo:"Raiz do 'ginseng siberiano' (Eleutherococcus senticosus), adaptógeno clássico. Os eleuterosídeos modulam a resposta ao estresse; a evidência clínica de antifadiga é fraca e mista.",
  blocos:[{d:"Fadiga",n:"C",t:"Ginseng siberiano; evidência fraca e mista."}],
  dose:"300–1200 mg/dia de extrato.",seg:"Insônia em doses altas. Cautela em hipertensão.",mani:"Eleuterococo (ext.) 300 mg — 60 cápsulas.\nTomar 1 cápsula 1–2x/dia.",reg:"Fitoterápico."},
 {id:"dhea",nome:"DHEA",sci:"Dehidroepiandrosterona",classe:"Hormônio",tags:["função sexual","saúde suprarrenal","libido"],
  resumo:"Hormônio precursor (produzido na suprarrenal) que o corpo converte em estrógenos e androgênios. Por ser um hormônio, exige prescrição e monitorização — não é suplemento banal.",
  refs:[{au:"Elraiyah T et al.",yr:2014,jr:"J Clin Endocrinol Metab",ty:"Revisão sistemática + meta-análise (23 RCTs, n=1188)",fd:"Em pós-menopausadas com função adrenal normal, DHEA NÃO melhorou libido/função sexual nem marcadores metabólicos; baixa confiança na evidência.",doi:"10.1210/jc.2014-2261"}],
  blocos:[{d:"Insuficiência adrenal / envelhecimento",n:"C",t:"Reposição em deficientes; benefício clínico modesto."},{d:"Função sexual feminina",n:"C",t:"Sinal em alguns RCTs."}],
  dose:"25–50 mg/dia, com monitorização.",seg:"HORMÔNIO — acne, virilização, queda de HDL. Contraindicado em câncer sensível a hormônios (como alguns de mama ou próstata). Exige prescrição e acompanhamento.",mani:"DHEA 25 mg — 60 cápsulas.\nTomar 1 cápsula/dia, sob monitorização.",reg:"Hormônio — uso sob prescrição."},
 {id:"krill",nome:"Óleo de krill",sci:"Euphausia superba",classe:"Ácido graxo",tags:["dislipidemia","inflamação"],
  resumo:"Óleo extraído do krill antártico (um pequeno crustáceo). Fornece EPA/DHA na forma de fosfolipídios — teoricamente melhor absorvidos que os triglicérides do óleo de peixe — além de astaxantina natural. A dose de ômega-3 por cápsula costuma ser menor que a do óleo de peixe concentrado.",
  refs:[{au:"Huang H et al.",yr:2023,jr:"Diabetes Metab Syndr",ty:"Revisão sistemática + meta-análise (14 ensaios, n=1458)",fd:"Suplementação de óleo de krill teve efeito favorável sobre colesterol total, LDL e triglicérides; sem efeito sobre PA, glicemia ou inflamação.",doi:"10.1016/j.dsx.2023.102909"}],
  blocos:[{d:"Dislipidemia",n:"B",t:"Reduz triglicérides; fosfolipídios podem ter melhor absorção."}],
  dose:"1–3 g/dia.",seg:"Alergia a crustáceos. Cautela com remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel).",mani:"Óleo de krill 500 mg — 90 cápsulas.\nTomar 2 cápsulas 2x/dia.",reg:"Suplemento."},
 {id:"epo",nome:"Óleo de prímula",sci:"Oenothera biennis",classe:"Ácido graxo",tags:["TPM","menopausa","pele"],
  resumo:"Óleo da semente de prímula (Oenothera biennis), fonte do ácido graxo GLA (ômega-6), precursor de prostaglandinas anti-inflamatórias. Usado para mastalgia e sintomas da menopausa, com sinal modesto.",
  blocos:[{d:"Mastalgia cíclica",n:"C",t:"Sinal modesto, inconsistente."},{d:"Fogachos",n:"D",t:"Sem benefício comprovado."}],
  dose:"1–3 g/dia (fonte de GLA).",seg:"desconforto leve no estômago/intestino. Cautela com remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel).",mani:"Óleo de prímula 1 g — 60 cápsulas.\nTomar 1 cápsula 1–2x/dia.",reg:"Suplemento."},
 {id:"pqq",nome:"PQQ",sci:"Pirroloquinolina quinona",classe:"Nutracêutico",tags:["energia","fadiga","cognição"],
  resumo:"Pirroloquinolina quinona, composto redox encontrado em alimentos, estudado por estimular a biogênese mitocondrial (criação de novas mitocôndrias) em modelos. Os dados em humanos são preliminares.",
  blocos:[{d:"Função mitocondrial / fadiga",n:"C",t:"Sinais preliminares."},{d:"Cognição",n:"D",t:"Evidência insuficiente."}],
  dose:"10–20 mg/dia.",seg:"Bem tolerado nas doses usuais. Dados de longo prazo escassos.",mani:"PQQ 20 mg — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Nutracêutico."},
 {id:"nmn",nome:"NMN",sci:"Nicotinamida mononucleotídeo",classe:"Nutracêutico",tags:["longevidade","energia"],
  resumo:"Precursor do NAD+, coenzima central no metabolismo energético que declina com a idade. Suplementar eleva o NAD+, mas a tradução disso em desfechos clínicos (e longevidade) ainda não está estabelecida.",
  blocos:[{d:"NAD+ / metabolismo",n:"C",t:"Eleva NAD+; desfechos clínicos ainda preliminares."},{d:"Longevidade",n:"D",t:"Sem desfecho de longevidade comprovado em humanos."}],
  dose:"250–500 mg/dia.",seg:"Dados de longo prazo limitados. Status regulatório variável.",mani:"NMN 250 mg — 60 cápsulas.\nTomar 1 cápsula 1–2x/dia.",reg:"Nutracêutico (regulamentação variável)."},
 {id:"msm",nome:"MSM",sci:"Metilsulfonilmetano",classe:"Nutracêutico",tags:["osteoartrite","inflamação"],
  resumo:"Composto de enxofre orgânico (metilsulfonilmetano), doador de enxofre para tecidos conjuntivos. Tem ação anti-inflamatória leve e é muito usado em fórmulas articulares combinadas.",
  refs:[{au:"Toguchi A et al.",yr:2023,jr:"Nutrients",ty:"RCT duplo-cego (n=88)",fd:"2 g/dia de MSM por 12 semanas melhorou o escore de qualidade do joelho (JKOM) em pessoas com dor leve vs. placebo.",doi:"10.3390/nu15132995"}],
  blocos:[{d:"Osteoartrite",n:"C",t:"Sinal modesto em dor/função; frequentemente combinado à glucosamina."}],
  dose:"1,5–3 g/dia.",seg:"desconforto leve no estômago/intestino. Bem tolerado.",mani:"MSM 1500 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Nutracêutico."},
 {id:"ah",nome:"Ácido hialurônico",sci:"",classe:"Nutracêutico",tags:["pele","osteoartrite"],
  resumo:"Glicosaminoglicano que retém grande quantidade de água, abundante na pele e no líquido articular. Por via oral, o efeito é modesto (parte é degradada na digestão); a via intra-articular é outra história.",
  blocos:[{d:"Hidratação da pele",n:"C",t:"Oral 120 mg/dia com sinal modesto em hidratação/rugas."},{d:"Osteoartrite",n:"C",t:"Oral inconsistente; intra-articular é outra via."}],
  dose:"80–200 mg/dia (via oral).",seg:"Bem tolerado.",mani:"Ácido hialurônico 120 mg — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Nutracêutico."},
 {id:"tmg",nome:"Betaína (TMG)",sci:"Trimetilglicina",classe:"Nutracêutico",tags:["homocisteína","performance"],
  resumo:"Trimetilglicina, um doador de metila derivado da beterraba. Participa da remetilação da homocisteína em metionina — por isso reduz a homocisteína plasmática. Também atua como osmólito celular, o que embasa o uso (modesto) em performance.",
  refs:[{au:"McRae MP",yr:2013,jr:"J Chiropr Med",ty:"Meta-análise de RCTs (5 estudos)",fd:"≥4 g/dia de betaína por ≥6 semanas reduziu a homocisteína plasmática em ~1,23 µmol/L em adultos saudáveis.",doi:"10.1016/j.jcm.2012.11.001"}],
  blocos:[{d:"Homocisteína",n:"B",t:"Reduz homocisteína de forma consistente."},{d:"Performance",n:"C",t:"Sinal modesto em força/potência."}],
  dose:"2,5 g/dia (2 doses de 1,25 g).",seg:"Desconforto no estômago/intestino. Pode elevar levemente o LDL em doses altas.",mani:"Betaína anidra (TMG) 1,25 g — 60 doses.\nTomar 1,25 g 2x/dia.",reg:"Nutracêutico."},
 {id:"spir",nome:"Espirulina",sci:"Arthrospira platensis",classe:"Nutracêutico",tags:["dislipidemia","antioxidante"],
  resumo:"Cianobactéria (Arthrospira platensis) consumida como alimento rico em proteína e pigmentos antioxidantes (ficocianina). Atenção à procedência: pode conter microcistinas e metais se mal cultivada.",
  refs:[{au:"Hoang T, Kim J",yr:2021,jr:"Phytother Res",ty:"Umbrella review de meta-análises",fd:"Entre os fitonutrientes, a espirulina associou-se a efeitos benéficos sobre perfil lipídico e controle glicêmico; resultados heterogêneos.",doi:"10.1002/ptr.7079"}],
  blocos:[{d:"Lipídios / pressão",n:"C",t:"Sinal modesto sobre LDL e PA."},{d:"Antioxidante",n:"C",t:"Preliminar."}],
  dose:"1–5 g/dia.",seg:"Risco de contaminação (microcistinas (toxinas de algas), metais) — usar fonte certificada. Evitar em uma doença genética do metabolismo (fenilcetonúria) e doenças autoimunes (como lúpus, artrite reumatoide).",mani:"Espirulina 500 mg — 90 cápsulas.\nTomar 2 cápsulas 2x/dia.",reg:"Suplemento / alga."},
 {id:"asta",nome:"Astaxantina",sci:"",classe:"Nutracêutico",tags:["antioxidante","pele","performance"],
  resumo:"Carotenoide vermelho de microalga (fonte do tom de salmão e flamingo), antioxidante potente com afinidade por membranas. Estudado para pele (fotoproteção) e olhos.",
  refs:[{au:"Tominaga K et al.",yr:2012,jr:"Acta Biochim Pol",ty:"RCT duplo-cego + estudo aberto",fd:"6 mg/dia de astaxantina melhorou rugas, elasticidade e hidratação da pele em homens e mulheres.",doi:"10.18388/abp.2012_2168"}],
  blocos:[{d:"Antioxidante / pele",n:"C",t:"Sinal em fotoproteção e elasticidade cutânea."},{d:"Performance",n:"D",t:"Evidência insuficiente."}],
  dose:"4–12 mg/dia.",seg:"Bem tolerada. Pode dar leve pigmentação em doses altas.",mani:"Astaxantina 4 mg — 60 cápsulas.\nTomar 1 cápsula 1–2x/dia.",reg:"Nutracêutico."},
 {id:"lute",nome:"Luteína + zeaxantina",sci:"",classe:"Nutracêutico",tags:["saúde ocular","antioxidante"],
  resumo:"Carotenoides que se concentram na mácula (o pigmento macular), filtrando luz azul e protegendo a retina do estresse oxidativo. São a base da fórmula AREDS2. Nuance importante: no AREDS2, adicionar luteína+zeaxantina não reduziu por si só a progressão vs. placebo, mas substituiu com segurança o betacaroteno (que aumentava câncer de pulmão em ex-fumantes).",
  refs:[{au:"AREDS2 Research Group",yr:2013,jr:"JAMA",ty:"RCT multicêntrico fatorial (n=4203)",fd:"Adicionar luteína+zeaxantina à fórmula AREDS não reduziu significativamente a progressão para DMRI avançada, mas é substituto seguro do betacaroteno.",doi:"10.1001/jama.2013.4997"}],
  blocos:[{d:"Degeneração macular (DMRI)",n:"B",t:"Fórmula AREDS2 reduz progressão em DMresistência à insulina intermediária."},{d:"Fadiga visual",n:"C",t:"Sinal modesto."}],
  dose:"10 mg de luteína + 2 mg de zeaxantina/dia.",seg:"Muito bem tolerada.",mani:"Luteína 10 mg + zeaxantina 2 mg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Nutracêutico."},
 {id:"cla",nome:"CLA",sci:"Ácido linoleico conjugado",classe:"Ácido graxo",tags:["composição corporal"],
  resumo:"Ácido linoleico conjugado, gordura de origem láctea/carne promovida para composição corporal. O efeito sobre gordura é mínimo e pode piorar a resistência à insulina — entra marcado como tal.",
  blocos:[{d:"Perda de gordura",n:"D",t:"Efeito mínimo e clinicamente irrelevante; pode piorar a resistência à insulina."}],
  dose:"Não recomendado rotineiramente.",seg:"Desconforto no estômago/intestino. Possível piora de resistência à insulina e de marcadores hepáticos.",mani:"Uso não recomendado pela baixa relação benefício/risco.",reg:"Suplemento."},
 {id:"mct",nome:"TCM",sci:"Triglicerídeos de cadeia média",classe:"Ácido graxo",tags:["energia","saciedade"],
  resumo:"Triglicerídeos de cadeia média, gorduras (do coco) absorvidas e usadas como energia rapidamente, sem precisar de carnitina. Geram cetonas e saciedade; aumentar rápido demais causa desconforto intestinal.",
  blocos:[{d:"Saciedade / energia",n:"C",t:"Pode aumentar saciedade; impacto sobre peso pequeno."}],
  dose:"5–15 g/dia, aumentar gradualmente.",seg:"Diarreia/cólica se aumentar rápido.",mani:"Óleo triglicerídeos de cadeia média (TCM) 5 g (1 colher).\nTomar 5 g 1–2x/dia, aumentar gradual.",reg:"Alimento / suplemento."},
 {id:"ve",nome:"Vitamina E",sci:"Tocoferol",classe:"Vitamina",tags:["antioxidante","esteatose hepática"],
  resumo:"Vitamina lipossolúvel antioxidante (tocoferol) que protege as membranas da oxidação. Em megadose perde o benefício e fica perigosa (sangramento, mortalidade) — o oposto de 'quanto mais melhor'.",
  refs:[{au:"Sanyal AJ et al. (PIVENS)",yr:2010,jr:"N Engl J Med",ty:"RCT fase 3 (n=247)",fd:"Vitamina E 800 UI/dia melhorou a histologia da esteato-hepatite não diabética vs. placebo (43% vs. 19%); sem melhora da fibrose.",doi:"10.1056/NEJMoa0907929"}],
  blocos:[{d:"Gordura no fígado (gordura no fígado não diabética)",n:"C",t:"800 UI/dia com sinal histológico em doença hepática gordurosa (uso especializado)."},{d:"Prevenção cardiovascular",n:"D",t:"Sem benefício; megadoses elevam mortalidade."}],
  dose:"Conforme indicação específica (ex.: 400–800 UI em doença hepática gordurosa selecionada).",seg:"Megadose: risco de sangramento e aumento de mortalidade. Cautela com remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel).",mani:"Vitamina E 400 UI — 60 cápsulas.\nTomar conforme orientação.",reg:"Vitamina / suplemento."},
 {id:"va",nome:"Vitamina A",sci:"Retinol",classe:"Vitamina",tags:["visão","pele","imunidade"],
  resumo:"Vitamina lipossolúvel essencial à visão (formação dos pigmentos da retina), à imunidade e à integridade epitelial. A reposição salva vidas onde há deficiência (xeroftalmia, mortalidade infantil), mas em quem não é deficiente o excesso é perigoso — é teratogênica em megadose na gestação e hepatotóxica de forma crônica.",
  refs:[{au:"Imdad A et al.",yr:2022,jr:"Cochrane Database Syst Rev",ty:"Revisão sistemática Cochrane (47 estudos, ~1,2 milhão de crianças)",fd:"Suplementação de vitamina A reduziu mortalidade por todas as causas em ~12% em crianças de 6 meses a 5 anos (evidência de alta certeza).",doi:"10.1002/14651858.CD008524.pub4"}],
  blocos:[{d:"Deficiência (xeroftalmia)",n:"A",t:"Reposição previne cegueira por deficiência."},{d:"Pele / acne",n:"C",t:"Retinoides tópicos/orais são fármacos distintos."}],
  dose:"Repor apenas em deficiência. Manutenção conforme RDA.",seg:"Em dose muito alta na gravidez, CAUSA MALFORMAÇÃO NO BEBÊ. Em uso prolongado, causa lesão no fígado. Nunca tomar em megadose.",mani:"Vitamina A — reposição conforme dosagem e indicação.",reg:"Vitamina / medicamento."},
 {id:"biot",nome:"Biotina",sci:"Vitamina B7",classe:"Vitamina",tags:["cabelo","unhas"],
  resumo:"Vitamina B7, cofator de enzimas do metabolismo de gorduras e aminoácidos. Muito vendida para cabelo e unha, mas só ajuda quem é deficiente. Alerta clínico: interfere em exames laboratoriais (troponina, TSH).",
  blocos:[{d:"Queda capilar (sem deficiência)",n:"D",t:"Sem benefício em quem não é deficiente."},{d:"Unhas frágeis",n:"C",t:"Sinal modesto."}],
  dose:"2,5–5 mg/dia (quando indicada).",seg:"INTERFERE em imunoensaios (troponina, TSH, T4, cortisol) — suspender dias antes de exames laboratoriais.",mani:"Biotina 5 mg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Vitamina / suplemento."},
 {id:"fol",nome:"Ácido fólico",sci:"Vitamina B9",classe:"Vitamina",tags:["gestação","homocisteína"],
  resumo:"Vitamina B9, essencial à síntese de DNA e à divisão celular — daí a importância crítica na fase de formação do tubo neural do embrião. A suplementação periconcepcional é uma das intervenções preventivas mais bem estabelecidas da medicina. Atenção: pode mascarar deficiência de B12 em idosos.",
  refs:[{au:"Copp AJ et al.",yr:2015,jr:"Nat Rev Dis Primers",ty:"Revisão (ensaios clínicos de suplementação)",fd:"Suplementação periconcepcional de ácido fólico previne defeitos do tubo neural, base dos programas de fortificação de alimentos.",doi:"10.1038/nrdp.2015.7"}],
  blocos:[{d:"Defeitos do tubo neural",n:"A",t:"Periconcepcional reduz risco de defeitos do tubo neural (más-formações do cérebro/coluna do bebê)."},{d:"Homocisteína",n:"B",t:"Reduz homocisteína."}],
  dose:"400 mcg/dia (600 na gestação; 5 mg se alto risco).",seg:"Pode esconder uma falta de vitamina B12 nos exames em idosos.",mani:"Ácido fólico 400 mcg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Vitamina / medicamento."},
 {id:"iod",nome:"Iodo",sci:"",classe:"Mineral",tags:["tireoide"],
  resumo:"Mineral indispensável à síntese dos hormônios tireoidianos (T3/T4). A deficiência causa bócio e, na gestação, é a principal causa evitável de déficit cognitivo no mundo. O equilíbrio é estreito: tanto a falta quanto o excesso desencadeiam disfunção tireoidiana, exigindo cautela em quem já tem tireoidopatia.",
  refs:[{au:"Reis ÁEM et al.",yr:2024,jr:"Nutrition",ty:"Revisão narrativa (nutrição materna e neurodesenvolvimento)",fd:"Aporte adequado de iodo (com ferro e folato) na gestação é vital para o desenvolvimento cerebral; sua deficiência prejudica o neurodesenvolvimento.",doi:"10.1016/j.nut.2024.112483"}],
  blocos:[{d:"Deficiência de iodo",n:"A",t:"Reposição previne bócio e disfunção; relevante na gestação."}],
  dose:"150 mcg/dia (gestação 220–250 mcg).",seg:"Excesso pode desencadear disfunção tireoidiana — cautela em tireoidopatia.",mani:"Iodo 150 mcg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Suplemento mineral."},
 {id:"calc",nome:"Cálcio",sci:"",classe:"Mineral",tags:["saúde óssea"],
  resumo:"Principal mineral do osso e essencial à contração muscular e à coagulação. A prioridade é atingir a meta pela dieta; a suplementação isolada é mais controversa do que se imagina. Em idosos da comunidade, a evidência não sustenta suplementar rotineiramente para prevenir fratura — e há debate sobre risco cardiovascular e de litíase com suplementos.",
  refs:[{au:"Zhao JG et al.",yr:2017,jr:"JAMA",ty:"Revisão sistemática + meta-análise (33 RCTs, n=51.145)",fd:"Cálcio, vitamina D ou a combinação NÃO se associaram a menor risco de fratura (inclusive de quadril) em idosos da comunidade; não apoia uso rotineiro.",doi:"10.1001/jama.2017.19344"}],
  blocos:[{d:"Saúde óssea (idosos da comunidade)",n:"C",t:"Meta-análise (JAMA) não mostra redução de fraturas com suplementação rotineira."}],
  dose:"500–1000 mg de cálcio elementar/dia (preferir a dieta).",seg:"Constipação. Suplementação isolada e risco cardiovascular é controverso. Risco de pedra nos rins.",mani:"Cálcio (citrato) 500 mg elementar — 60 cápsulas.\nTomar 1 cápsula 1–2x/dia com refeição.",reg:"Suplemento mineral."}
,
 {id:"tongkat",nome:"Tongkat Ali",sci:"Eurycoma longifolia",classe:"Fitoterápico",tags:["testosterona","libido","estresse","fertilidade masculina"],
  resumo:"Raiz da Eurycoma longifolia (longjack), planta do sudeste asiático. As quassinoides (eurycomanona) modulam a SHBG, liberando testosterona livre, e atuam sobre o eixo do estresse. Padronização usual: extrato aquoso a 1-2% de eurycomanona.",
  blocos:[{d:"Testosterona / libido masculina",n:"B",t:"200-400 mg/dia de extrato padronizado; eleva testosterona livre em homens com nível baixo."},{d:"Estresse / cortisol",n:"C",t:"Pode reduzir cortisol e melhorar bem-estar."},{d:"Fertilidade masculina",n:"C",t:"Sinal em parâmetros seminais; estudos pequenos."}],
  dose:"200-400 mg/dia de extrato aquoso padronizado (1-2% eurycomanona, ex.: Physta/LJ100).",seg:"Cautela em câncer sensível a hormônios (como alguns de mama ou próstata). Insônia em doses altas à noite.",mani:"Tongkat Ali (ext. padr. 2% eurycomanona) 200 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia pela manhã.",reg:"Fitoterápico / nutracêutico."},
 {id:"shilajit",nome:"Shilajit",sci:"Asphaltum (ácido fúlvico)",classe:"Nutracêutico",tags:["energia","testosterona","fadiga","mitocondrial"],
  resumo:"Exsudato mineral de rochas do Himalaia, rico em ácido fúlvico e minerais. Atua como transportador mitocondrial e antioxidante; tradicional na medicina ayurvédica como rasayana (rejuvenescedor). Padronização: ≥50% ácido fúlvico, purificado (livre de metais pesados).",
  blocos:[{d:"Testosterona (homens)",n:"C",t:"250-500 mg/dia purificado; sinal de aumento de testosterona total."},{d:"Fadiga / energia",n:"C",t:"Suporte mitocondrial; evidência preliminar."}],
  dose:"250-500 mg/dia de shilajit purificado (≥50% ácido fúlvico).",seg:"RISCO de contaminação por metais pesados — exigir fonte purificada e certificada. Evitar em uma doença de excesso de ferro (hemocromatose).",mani:"Shilajit purificado (≥50% ácido fúlvico) 250 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Nutracêutico."},
 {id:"berberina2",nome:"Dihidroberberina",sci:"",classe:"Nutracêutico",tags:["controle glicêmico","resistência insulínica","biodisponibilidade"],
  resumo:"Metabólito reduzido da berberina, com biodisponibilidade muito superior (a berberina comum tem absorção <1%). Convertida de volta a berberina no organismo, ativa a AMPK com doses menores e menos desconforto no estômago/intestino.",
  blocos:[{d:"Controle do açúcar / resistência à insulina",n:"C",t:"100-200 mg 2x/dia; equivale a doses maiores de berberina com melhor tolerância."}],
  dose:"100-200 mg 2x/dia (equivalente a ~500 mg de berberina HCl).",seg:"Mesmas interações da berberina (interfere em uma enzima do fígado que processa medicamentos). Contraindicada na gestação.",mani:"Dihidroberberina 150 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia antes das refeições.",reg:"Nutracêutico."},
 {id:"sulforafano",nome:"Sulforafano",sci:"Brassica oleracea (brócolis)",classe:"Nutracêutico",tags:["antioxidante","detox","Nrf2","quimioprevenção"],
  resumo:"Isotiocianato derivado da glucorafanina do brócolis (sobretudo brotos). Ativador potente da via Nrf2, que liga genes antioxidantes e de detoxificação de fase II. A forma estabilizada com mirosinase ativa é a que gera sulforafano de fato.",
  blocos:[{d:"Antioxidante / Nrf2",n:"C",t:"Ativa defesas antioxidantes endógenas; biomarcadores melhoram."},{d:"Quimioprevenção",n:"D",t:"Pré-clínico forte; desfecho clínico não estabelecido."}],
  dose:"10-40 mg/dia de sulforafano (extrato de brotos de brócolis com mirosinase ativa).",seg:"desconforto leve no estômago/intestino. Bem tolerado.",mani:"Extrato de brotos de brócolis (padr. sulforafano + mirosinase) — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Nutracêutico."},
 {id:"pterostilbeno",nome:"Pterostilbeno",sci:"",classe:"Nutracêutico",tags:["antioxidante","longevidade","cardiometabólico"],
  resumo:"Análogo metilado do resveratrol, encontrado no mirtilo. A dupla metilação confere biodisponibilidade muito maior e meia-vida mais longa que o resveratrol. Ativa sirtuínas e tem ação antioxidante e lipídica.",
  blocos:[{d:"Lipídios / cardiometabólico",n:"C",t:"50-125 mg/dia; sinal sobre LDL (e possível elevação isolada)."},{d:"Longevidade",n:"D",t:"Extrapolação de modelos; sem desfecho humano."}],
  dose:"50-125 mg/dia.",seg:"Pode elevar LDL em doses altas isoladas. Dados de longo prazo limitados.",mani:"Pterostilbeno 50 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Nutracêutico."},
 {id:"apigenina",nome:"Apigenina",sci:"",classe:"Nutracêutico",tags:["sono","ansiedade","NAD"],
  resumo:"Flavonoide da camomila e da salsa, ligante de receptores de benzodiazepínicos (efeito calmante) e inibidor da CD38 (poupando NAD+). Usado para sono e como adjuvante de protocolos de longevidade.",
  blocos:[{d:"Sono / ansiedade",n:"C",t:"50 mg à noite; relaxamento leve via GABA."},{d:"NAD+ / longevidade",n:"D",t:"Mecanístico (inibe CD38); sem desfecho clínico."}],
  dose:"50 mg à noite.",seg:"Bem tolerada. Pode potencializar remédios calmantes/para dormir.",mani:"Apigenina 50 mg — 30 cápsulas.\nTomar 1 cápsula à noite.",reg:"Nutracêutico."},
 {id:"luteolina",nome:"Luteolina",sci:"",classe:"Nutracêutico",tags:["neuroinflamação","alergia","antioxidante"],
  resumo:"Flavonoide presente em aipo, tomilho e camomila. Inibe a ativação de mastócitos e da micróglia, daí o interesse em neuroinflamação e alergia. Frequentemente combinada à quercetina.",
  blocos:[{d:"Neuroinflamação / névoa mental",n:"D",t:"Pré-clínico; uso clínico extrapolado."},{d:"Alergia / mastócitos",n:"C",t:"Estabiliza mastócitos; evidência preliminar."}],
  dose:"100 mg 1-2x/dia.",seg:"desconforto leve no estômago/intestino. Dados de longo prazo escassos.",mani:"Luteolina 100 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Nutracêutico."},
 {id:"fisetina",nome:"Fisetina",sci:"",classe:"Nutracêutico",tags:["senolítico","longevidade","antioxidante"],
  resumo:"Flavonol do morango e caqui, estudado como senolítico (eliminador de células senescentes 'zumbis') em modelos animais. Protocolos usam doses altas intermitentes ('hit and run'). Biodisponibilidade baixa.",
  blocos:[{d:"Senólise / longevidade",n:"D",t:"Forte em camundongos; ensaios humanos em andamento, sem desfecho ainda."},{d:"Antioxidante",n:"C",t:"Ação antioxidante e anti-inflamatória in vitro/in vivo."}],
  dose:"Protocolo senolítico: 20 mg/kg/dia por 2-3 dias, intermitente (uso experimental).",seg:"Doses altas: dados de segurança humanos limitados. Cautela com remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel).",mani:"Fisetina 100 mg — 30 cápsulas.\nUso conforme protocolo, sob orientação.",reg:"Nutracêutico (uso experimental)."},
 {id:"espermidina",nome:"Espermidina",sci:"",classe:"Nutracêutico",tags:["autofagia","longevidade","cognição"],
  resumo:"Poliamina presente no gérmen de trigo e em alimentos fermentados, indutora de autofagia (reciclagem celular). É um dos poucos compostos de longevidade com dado epidemiológico (maior ingestão = menor mortalidade). Fonte usual: extrato de gérmen de trigo.",
  blocos:[{d:"Autofagia / longevidade",n:"C",t:"1-6 mg/dia; dado observacional e mecanístico, ensaios em cognição em curso."},{d:"Cognição (idosos)",n:"C",t:"Sinal em memória em estudos-piloto."}],
  dose:"1-6 mg/dia (extrato de gérmen de trigo padronizado).",seg:"Muito bem tolerada (composto alimentar).",mani:"Espermidina (ext. gérmen de trigo) 1 mg — 60 cápsulas.\nTomar 1-3 cápsulas/dia.",reg:"Nutracêutico / alimento."},
 {id:"urolitina",nome:"Urolitina A",sci:"",classe:"Nutracêutico",tags:["mitofagia","músculo","longevidade","mitocondrial"],
  resumo:"Metabólito dos elagitaninos (romã, nozes) produzido pela microbiota — só ~40% das pessoas o fabricam, daí o interesse na forma suplementada direta. Induz mitofagia (reciclagem de mitocôndrias velhas), com sinal em função muscular.",
  blocos:[{d:"Função muscular / mitocôndria",n:"B",t:"500 mg/dia; melhora marcadores mitocondriais e força em idosos em RCTs."},{d:"Longevidade",n:"D",t:"Extrapolação mecanística."}],
  dose:"500-1000 mg/dia.",seg:"Bem tolerada nos estudos. Dados de longo prazo emergindo.",mani:"Urolitina A 500 mg — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Nutracêutico."},
 {id:"calciodbeta",nome:"Cálcio-D-glucarato",sci:"",classe:"Nutracêutico",tags:["detox","estrogênio","fígado"],
  resumo:"Sal do ácido glucárico que inibe a beta-glicuronidase intestinal, favorecendo a excreção de estrogênios e toxinas conjugadas (glucuronidação de fase II). Usado em protocolos de equilíbrio estrogênico.",
  blocos:[{d:"Metabolismo de estrogênio / detox",n:"C",t:"500 mg 1-3x/dia; reduz reabsorção de estrogênios conjugados."}],
  dose:"500 mg 1-3x/dia.",seg:"Bem tolerado. Pode acelerar metabolismo de fármacos glucuronidados.",mani:"Cálcio-D-glucarato 500 mg — 90 cápsulas.\nTomar 1 cápsula 2-3x/dia.",reg:"Nutracêutico."},
 {id:"dim",nome:"DIM",sci:"Diindolilmetano",classe:"Nutracêutico",tags:["estrogênio","detox","próstata","acne hormonal"],
  resumo:"Composto formado a partir do indol-3-carbinol dos crucíferos no estômago. Modula o metabolismo do estrogênio favorecendo metabólitos 2-hidroxi (mais benignos) sobre os 16-hidroxi. Usado em dominância estrogênica e acne hormonal.",
  blocos:[{d:"Equilíbrio estrogênico",n:"C",t:"100-200 mg/dia; desloca metabolismo para 2-OH-estrona."},{d:"Acne hormonal / próstata",n:"D",t:"Uso clínico extrapolado do mecanismo."}],
  dose:"100-200 mg/dia (forma microencapsulada/biodisponível).",seg:"Pode mudar a cor da urina (inofensivo). Interfere em enzimas do fígado que processam medicamentos, podendo alterar o efeito de outros remédios. Evitar na gravidez.",mani:"DIM (microencapsulado) 100 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Nutracêutico."},
 {id:"i3c",nome:"Indol-3-carbinol",sci:"I3C",classe:"Nutracêutico",tags:["estrogênio","detox","crucíferos"],
  resumo:"Precursor do DIM, extraído de crucíferos (brócolis, couve). No estômago converte-se em DIM e outros oligômeros que modulam o metabolismo estrogênico e enzimas de detoxificação. O DIM é a forma mais previsível.",
  blocos:[{d:"Metabolismo de estrogênio",n:"C",t:"200-400 mg/dia; precursor do DIM."}],
  dose:"200-400 mg/dia.",seg:"Conversão variável; pode ter efeitos pró e antiestrogênicos. Cautela na gestação.",mani:"Indol-3-carbinol 200 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Nutracêutico."},
 {id:"agmatina",nome:"Sulfato de agmatina",sci:"",classe:"Aminoácido",tags:["dor neuropática","performance","humor"],
  resumo:"Metabólito da arginina (descarboxilação), neuromodulador que age sobre receptores NMDA, imidazolínicos e óxido nítrico. Usado em dor neuropática e como adjuvante em performance e humor.",
  blocos:[{d:"Dor neuropática",n:"C",t:"1-2 g/dia; modula NMDA, sinal preliminar."},{d:"Performance / pump",n:"D",t:"Popular no fisiculturismo; evidência fraca."}],
  dose:"1-2 g/dia, fracionado.",seg:"desconforto no estômago/intestino em doses altas. Dados de longo prazo limitados.",mani:"Sulfato de agmatina 500 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Nutracêutico."},
 {id:"acetilcarnitina",nome:"Acetil-L-carnitina",sci:"ALCAR",classe:"Aminoácido",tags:["cognição","neuropatia","energia","humor"],
  resumo:"Forma acetilada da carnitina que atravessa a barreira hematoencefálica, fornecendo grupos acetil para a acetilcolina e energia mitocondrial neuronal. Mais voltada à cognição e neuropatia que a L-carnitina comum.",
  blocos:[{d:"Neuropatia (diabética/quimio)",n:"B",t:"1-3 g/dia; melhora dor e regeneração nervosa em RCTs."},{d:"Cognição / humor (idosos)",n:"C",t:"Sinal modesto em declínio leve e depressão geriátrica."}],
  dose:"1-3 g/dia, fracionado, fora das refeições.",seg:"Desconforto no estômago/intestino, agitação. Pode interagir com remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel).",mani:"Acetil-L-carnitina 500 mg — 90 cápsulas.\nTomar 1-2 cápsulas 2x/dia.",reg:"Nutracêutico."},
 {id:"dlfenilalanina",nome:"DL-fenilalanina",sci:"DLPA",classe:"Aminoácido",tags:["humor","dor crônica","foco"],
  resumo:"Mistura das formas D e L do aminoácido fenilalanina. A forma L é precursora de dopamina/noradrenalina (humor, foco); a D inibe enzimas que degradam endorfinas (analgesia). Usada em humor e dor crônica.",
  blocos:[{d:"Humor / foco",n:"C",t:"Precursor de catecolaminas; evidência limitada."},{d:"Dor crônica",n:"D",t:"Hipótese endorfínica; dados fracos."}],
  dose:"500-1500 mg/dia, fora das refeições.",seg:"PROIBIDA para quem tem uma doença genética do metabolismo (fenilcetonúria) (uma doença genética do metabolismo). Usar com cuidado se você tem pressão alta ou toma antidepressivos antigos do tipo IMAO.",mani:"DL-fenilalanina 500 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia em jejum.",reg:"Aminoácido / suplemento."},
 {id:"tirosina",nome:"L-tirosina",sci:"",classe:"Aminoácido",tags:["foco","estresse agudo","cognição sob estresse"],
  resumo:"Aminoácido precursor direto da dopamina e noradrenalina. Sob estresse agudo (privação de sono, frio, carga cognitiva), repõe os neurotransmissores depletados — daí o uso pontual para foco em situações exigentes, não crônico.",
  blocos:[{d:"Cognição sob estresse agudo",n:"B",t:"500-2000 mg; preserva desempenho em estresse/privação de sono."},{d:"Foco basal (sem estresse)",n:"D",t:"Sem benefício em condições normais."}],
  dose:"500-2000 mg, 30-60 min antes do estressor.",seg:"Usar com cautela se você toma antidepressivos antigos do tipo IMAO, ou se tem tireoide acelerada (tireoide acelerada (hipertireoidismo)) ou histórico de melanoma (um tipo de câncer de pele). Pode atrapalhar o sono se tomada à tarde/noite.",mani:"L-tirosina 500 mg — 60 cápsulas.\nTomar 1-2 cápsulas antes de demanda cognitiva alta.",reg:"Aminoácido / suplemento."},
 {id:"gaba",nome:"GABA",sci:"Ácido gama-aminobutírico",classe:"Aminoácido",tags:["ansiedade","sono","relaxamento"],
  resumo:"Principal neurotransmissor inibitório do cérebro. Por via oral atravessa mal a barreira hematoencefálica — o efeito relatado pode ser via sistema nervoso entérico ou placebo. Mais defensável em formas que melhoram a passagem.",
  blocos:[{d:"Ansiedade / relaxamento",n:"C",t:"100-300 mg; efeito subjetivo, mecanismo central discutível."},{d:"Sono",n:"C",t:"Sinal modesto na latência."}],
  dose:"100-300 mg conforme necessário.",seg:"Formigamento/rubor em doses altas. Cautela com remédios calmantes/para dormir.",mani:"GABA 250 mg — 60 cápsulas.\nTomar 1 cápsula à noite ou em ansiedade aguda.",reg:"Aminoácido / suplemento."},
 {id:"taurina2",nome:"NAC etil éster",sci:"NACET",classe:"Nutracêutico",tags:["glutationa","biodisponibilidade","antioxidante"],
  resumo:"Éster etílico da N-acetilcisteína, com lipossolubilidade e biodisponibilidade superiores à NAC comum, atravessando melhor as membranas para elevar glutationa intracelular. Forma mais nova e cara.",
  blocos:[{d:"Glutationa / antioxidante",n:"D",t:"Mecanístico (melhor absorção); desfechos clínicos ainda escassos."}],
  dose:"300-600 mg/dia.",seg:"Dados clínicos de longo prazo limitados. Mesmas cautelas da NAC.",mani:"NAC etil éster 300 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Nutracêutico."},
 {id:"glutationa",nome:"Glutationa (lipossomal)",sci:"GSH",classe:"Nutracêutico",tags:["antioxidante","detox","fígado","pele"],
  resumo:"O principal antioxidante intracelular (tripeptídeo cisteína-glutamato-glicina). A glutationa oral comum é degradada na digestão; as formas lipossomal e sublingual melhoram a absorção. Central na detoxificação hepática.",
  blocos:[{d:"Antioxidante / detox",n:"C",t:"250-500 mg/dia lipossomal; eleva GSH e marcadores em alguns RCTs."},{d:"Clareamento de pele",n:"D",t:"Popular, mas evidência fraca por via oral."}],
  dose:"250-500 mg/dia (lipossomal ou sublingual).",seg:"Bem tolerada. Formas orais comuns têm absorção ruim.",mani:"Glutationa lipossomal 250 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Nutracêutico."},
 {id:"corosolico",nome:"Banaba",sci:"Lagerstroemia speciosa",classe:"Fitoterápico",tags:["controle glicêmico","resistência insulínica"],
  resumo:"Folha da Lagerstroemia speciosa, rica em ácido corosólico, que mimetiza a insulina facilitando a captação de glicose (translocação do GLUT4). Padronização usual: extrato a 1-2% de ácido corosólico.",
  blocos:[{d:"Controle glicêmico",n:"C",t:"Extrato 1% ácido corosólico, 32-48 mg/dia; reduz glicemia pós-prandial."}],
  dose:"Extrato padronizado a 1% de ácido corosólico, 32-48 mg/dia.",seg:"Hipoglicemia se combinado a remédios para diabetes. Bem tolerado.",mani:"Banaba (ext. 1% ácido corosólico) 16 mg — 60 cápsulas.\nTomar 1 cápsula 2-3x/dia antes das refeições.",reg:"Fitoterápico."},
 {id:"gymnema",nome:"Gymnema",sci:"Gymnema sylvestre",classe:"Fitoterápico",tags:["controle glicêmico","desejo por açúcar"],
  resumo:"Folha da Gymnema sylvestre ('destruidor de açúcar' em hindi). Os ácidos gimnêmicos bloqueiam temporariamente os receptores de doce na língua e reduzem a absorção intestinal de glicose. Padronização: 25% de ácidos gimnêmicos.",
  blocos:[{d:"Controle glicêmico",n:"C",t:"Extrato 25% ácidos gimnêmicos, 400-600 mg/dia; reduz glicemia e hemoglobina glicada (a média do açúcar de 3 meses) em estudos pequenos."},{d:"Desejo por doce",n:"C",t:"Bloqueia percepção de doce; útil como adjuvante comportamental."}],
  dose:"400-600 mg/dia de extrato padronizado (25% ácidos gimnêmicos).",seg:"Hipoglicemia com remédios para diabetes. Cautela na gestação.",mani:"Gymnema (ext. 25% ácidos gimnêmicos) 200 mg — 60 cápsulas.\nTomar 1 cápsula 2-3x/dia antes das refeições.",reg:"Fitoterápico."},
 {id:"feijaobranco",nome:"Feijão branco (faseolamina)",sci:"Phaseolus vulgaris",classe:"Fitoterápico",tags:["controle glicêmico","peso","bloqueador de carboidrato"],
  resumo:"Extrato do feijão branco contendo faseolamina, inibidor da alfa-amilase que reduz a digestão de amido — daí o apelido de 'bloqueador de carboidrato'. Efeito sobre peso é modesto na prática.",
  blocos:[{d:"Glicemia pós-prandial",n:"C",t:"Inibe alfa-amilase; atenua pico glicêmico do amido."},{d:"Perda de peso",n:"D",t:"Efeito pequeno e inconsistente."}],
  dose:"445-1500 mg de extrato antes de refeições ricas em amido.",seg:"Flatulência, Desconforto no estômago/intestino. Bem tolerado.",mani:"Feijão branco (ext. padr. faseolamina) 500 mg — 60 cápsulas.\nTomar 1 cápsula antes das refeições com amido.",reg:"Fitoterápico / suplemento."},
 {id:"canela",nome:"Canela",sci:"Cinnamomum",classe:"Fitoterápico",tags:["controle glicêmico","resistência insulínica","lipídios"],
  resumo:"Casca do Cinnamomum (preferir C. zeylanicum, com menos cumarina hepatotóxica que a cassia). Os polifenóis melhoram a sensibilidade à insulina. Padronização: extrato aquoso para minimizar cumarina.",
  blocos:[{d:"Controle do açúcar / resistência à insulina",n:"C",t:"1-6 g/dia ou extrato aquoso; reduz glicemia de jejum modestamente."},{d:"Dislipidemia",n:"C",t:"Pequena redução de LDL/triglicérides."}],
  dose:"Extrato aquoso de C. zeylanicum, equiv. 1-6 g/dia.",seg:"A cassia tem cumarina (hepato/tóxica para os rins em excesso) — preferir Ceylon ou extrato aquoso.",mani:"Canela do Ceilão (ext. aquoso) 500 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia às refeições.",reg:"Fitoterápico / alimento."},
 {id:"motecru",nome:"Momordica",sci:"Momordica charantia",classe:"Fitoterápico",tags:["controle glicêmico","resistência insulínica"],
  resumo:"Fruto do melão-de-são-caetano (bitter melon). Contém charantina e polipeptídeo-p, com ação insulino-mimética. Tradicional na medicina asiática para diabetes; evidência clínica é heterogênea.",
  blocos:[{d:"Controle glicêmico",n:"C",t:"Extrato padronizado; reduz glicemia em alguns RCTs, resultados mistos."}],
  dose:"Extrato padronizado, equiv. ~2 g/dia da fruta seca.",seg:"Desconforto no estômago/intestino. Hipoglicemia com remédios para diabetes. CONTRAINDICADO na gestação (pode provocar aborto).",mani:"Momordica (ext. padr.) 500 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico."},
 {id:"olivafolha",nome:"Folha de oliveira",sci:"Olea europaea (oleuropeína)",classe:"Fitoterápico",tags:["pressão arterial","antimicrobiano","antioxidante"],
  resumo:"Extrato da folha da oliveira, rico em oleuropeína. Tem ação anti-hipertensiva (vasodilatadora), antioxidante e antimicrobiana. Padronização: 16-20% de oleuropeína.",
  blocos:[{d:"Hipertensão",n:"B",t:"Extrato 16-20% oleuropeína, 500 mg 2x/dia; reduz a pressão em hipertensos leves."},{d:"Antimicrobiano / imune",n:"D",t:"Tradicional; evidência clínica fraca."}],
  dose:"500 mg 2x/dia de extrato padronizado (16-20% oleuropeína).",seg:"Hipotensão se combinado a remédios para pressão alta. Bem tolerado.",mani:"Folha de oliveira (ext. 18% oleuropeína) 500 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico."},
 {id:"hibisco",nome:"Hibisco",sci:"Hibiscus sabdariffa",classe:"Fitoterápico",tags:["pressão arterial","lipídios","antioxidante"],
  resumo:"Cálices da flor de Hibiscus sabdariffa (vinagreira), ricos em antocianinas. Têm ação anti-hipertensiva (inibição da ECA e diurética leve) comprovada em meta-análises. Usado como chá ou extrato.",
  blocos:[{d:"Hipertensão",n:"B",t:"Chá/extrato; reduz pressão (a máxima) de forma consistente em pré-hipertensos."},{d:"Dislipidemia",n:"C",t:"Pequeno efeito sobre lipídios."}],
  dose:"Chá: 1-2 xícaras/dia; ou extrato padronizado equivalente.",seg:"Hipotensão com remédios para pressão alta. Cautela na gestação.",mani:"Hibisco (ext. seco padr. antocianinas) 250 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico / alimento."},
 {id:"beterrabanitrato",nome:"Nitrato (beterraba)",sci:"Beta vulgaris",classe:"Nutracêutico",tags:["performance","pressão arterial","óxido nítrico"],
  resumo:"Suco/extrato de beterraba rico em nitrato inorgânico, convertido em nitrito e óxido nítrico (via nitrato-nitrito-NO). Melhora o fluxo sanguíneo e a economia de oxigênio no exercício, além de reduzir a pressão.",
  blocos:[{d:"Performance / endurance",n:"B",t:"~6-8 mmol de nitrato 2-3h pré-treino; melhora economia de O2 e tempo até exaustão."},{d:"Pressão arterial",n:"B",t:"Nitrato dietético reduz a pressão modestamente."}],
  dose:"Suco concentrado ou pó padronizado fornecendo 6-13 mmol (400-800 mg) de nitrato.",seg:"Urina/fezes avermelhadas (inofensivo). Cautela com sildenafil (hipotensão).",mani:"Beterraba (pó padr. em nitrato) — dose pré-treino.\nTomar fornecendo ~6 mmol de nitrato 2-3h antes do exercício.",reg:"Nutracêutico / alimento."},
 {id:"citrulinapura",nome:"L-citrulina pura",sci:"",classe:"Aminoácido",tags:["performance","óxido nítrico","disfunção erétil","pressão"],
  resumo:"Forma livre da citrulina (sem malato), precursora de arginina e óxido nítrico. Eleva a arginina plasmática de forma mais eficaz que a própria arginina. Dose efetiva para NO costuma ser maior que a do citrulina malato.",
  blocos:[{d:"Pressão / fluxo / DE leve",n:"B",t:"3-6 g/dia; eleva arginina e NO, melhora função endotelial."},{d:"Performance",n:"C",t:"Sinal sobre fadiga; menor que o citrulina malato em alguns desfechos."}],
  dose:"3-6 g/dia (forma livre).",seg:"Muito bem tolerada. Cautela com sildenafil/remédios para pressão alta.",mani:"L-citrulina (pura) 3 g — dose diária.\nTomar 3 g 1x/dia ou pré-treino.",reg:"Aminoácido / suplemento."},
 {id:"hmb",nome:"HMB",sci:"Beta-hidroxi-beta-metilbutirato",classe:"Aminoácido",tags:["massa magra","anticatabólico","sarcopenia"],
  resumo:"Metabólito da leucina com ação anticatabólica (reduz a quebra de proteína muscular). O maior benefício aparece em estados catabólicos: idosos sarcopênicos, repouso prolongado, destreinados — menos em atletas treinados.",
  blocos:[{d:"Sarcopenia / preservação muscular",n:"B",t:"3 g/dia; preserva massa magra em idosos e em repouso/imobilização."},{d:"Hipertrofia (treinados)",n:"C",t:"Benefício pequeno e discutido em quem já treina."}],
  dose:"3 g/dia, fracionado (1 g 3x).",seg:"Muito bem tolerado.",mani:"HMB (cálcio) 1 g — 90 cápsulas.\nTomar 1 g 3x/dia.",reg:"Nutracêutico."},
 {id:"leucina",nome:"Leucina",sci:"",classe:"Aminoácido",tags:["síntese proteica","massa magra","mTOR"],
  resumo:"Aminoácido essencial de cadeia ramificada, gatilho-chave da síntese proteica muscular via ativação do mTOR. É o 'interruptor' anabólico — adicioná-la a refeições com pouca proteína ajuda a atingir o limiar de leucina.",
  blocos:[{d:"Síntese proteica / massa magra",n:"B",t:"2-3 g por refeição; potencializa a síntese proteica, sobretudo em idosos."}],
  dose:"2-3 g junto a refeições proteicas (ou 3-5 g pós-treino).",seg:"Bem tolerada. Isolada não substitui proteína completa.",mani:"Leucina 1 g — dose por refeição.\nTomar 2-3 g com refeições de baixa proteína.",reg:"Aminoácido / suplemento."},
 {id:"eaa",nome:"Aminoácidos essenciais (EAA)",sci:"",classe:"Aminoácido",tags:["síntese proteica","massa magra","recuperação"],
  resumo:"Blend dos 9 aminoácidos essenciais que o corpo não sintetiza. Superior aos BCAAs isolados para síntese proteica, pois fornece todos os blocos necessários. Útil quando a ingestão proteica da dieta é insuficiente.",
  blocos:[{d:"Síntese proteica / recuperação",n:"B",t:"6-15 g; estimula síntese proteica, superior aos BCAAs isolados."}],
  dose:"6-15 g, peri-treino ou entre refeições.",seg:"Bem tolerados. Não substituem dieta proteica adequada.",mani:"EAA (blend 9 essenciais) — 10 g/dose.\nTomar 6-15 g peri-treino.",reg:"Aminoácido / suplemento."},
 {id:"bcaa",nome:"BCAA",sci:"Aminoácidos de cadeia ramificada",classe:"Aminoácido",tags:["recuperação","massa magra"],
  resumo:"Leucina, isoleucina e valina (proporção usual 2:1:1). Muito populares, mas isolados são inferiores a EAA/proteína completa para hipertrofia, pois faltam os outros essenciais. Maior utilidade marginal em dietas já ricas em proteína é baixa.",
  blocos:[{d:"Recuperação / anticatabolismo",n:"C",t:"Benefício pequeno; em dieta proteica adequada são pouco úteis."},{d:"Hipertrofia",n:"D",t:"Inferiores a EAA/proteína completa."}],
  dose:"5-10 g peri-treino (se a dieta for pobre em proteína).",seg:"Bem tolerados. Custo-benefício discutível vs. EAA.",mani:"BCAA 2:1:1 — 5 g/dose.\nTomar 5-10 g peri-treino.",reg:"Aminoácido / suplemento."},
 {id:"colina",nome:"Colina (bitartarato)",sci:"",classe:"Nutracêutico",tags:["cognição","fígado","gestação"],
  resumo:"Nutriente essencial, precursor da acetilcolina (memória) e da fosfatidilcolina (membranas e transporte hepático de gordura). Importante na gestação para o neurodesenvolvimento. Formas: bitartarato (barata), alfa-GPC e citicolina (mais biodisponíveis para o cérebro).",
  blocos:[{d:"Função hepática (esteatose)",n:"C",t:"Deficiência causa esteatose; reposição corrige."},{d:"Neurodesenvolvimento (gestação)",n:"B",t:"Ingestão adequada na gravidez beneficia o cérebro fetal."},{d:"Cognição (adulto)",n:"D",t:"Sem benefício claro em não-deficientes."}],
  dose:"425-550 mg/dia (RDA); gestação 450 mg.",seg:"Doses muito altas: odor corporal de peixe (trimetilaminúria), hipotensão.",mani:"Colina bitartarato 500 mg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Nutracêutico."},
 {id:"inositol2",nome:"D-chiro-inositol",sci:"",classe:"Nutracêutico",tags:["SOP","resistência insulínica"],
  resumo:"Estereoisômero do inositol que atua na sinalização da insulina de forma complementar ao mio-inositol. Na síndrome dos ovários policísticos (SOP), a relação fisiológica mio:D-chiro de 40:1 é a mais estudada — excesso isolado de D-chiro pode piorar a qualidade ovocitária.",
  blocos:[{d:"SOP / resistência insulínica",n:"B",t:"Usar na proporção 40:1 (mio:D-chiro); isolado em excesso é contraproducente."}],
  dose:"~50 mg/dia de D-chiro junto a 2 g de mio-inositol (proporção 40:1).",seg:"Excesso isolado pode prejudicar ovulação. Preferir a combinação.",mani:"Mio-inositol 2 g + D-chiro-inositol 50 mg — sachê.\nTomar 1 sachê 2x/dia.",reg:"Nutracêutico."},
 {id:"berberinafito",nome:"Coptis (berberina vegetal)",sci:"Coptis chinensis",classe:"Fitoterápico",tags:["controle glicêmico","digestivo","antimicrobiano"],
  resumo:"Rizoma do Coptis chinensis, uma das fontes vegetais mais ricas em berberina, usada há séculos na medicina chinesa (Huang Lian). Mesma farmacologia da berberina isolada (ativação de AMPK), com a matriz vegetal completa.",
  blocos:[{d:"Controle glicêmico",n:"B",t:"Via berberina; mesma evidência metabólica."},{d:"Digestivo / antimicrobiano",n:"C",t:"Uso tradicional em disbiose e diarreia."}],
  dose:"Extrato padronizado em berberina, equiv. 500 mg de berberina 2-3x/dia.",seg:"Mesmas da berberina: interfere em uma enzima do fígado que processa medicamentos, contraindicado na gestação.",mani:"Coptis (ext. padr. berberina) — equiv. 500 mg berberina, 90 cápsulas.\nTomar 1 cápsula antes das refeições.",reg:"Fitoterápico."},
 {id:"andrographis",nome:"Andrographis",sci:"Andrographis paniculata",classe:"Fitoterápico",tags:["imunidade","resfriado","ITRS"],
  resumo:"Erva amarga ('rei dos amargos') da medicina ayurvédica e chinesa. Os andrografolídeos têm ação imunomoduladora e anti-inflamatória. Mais estudada para encurtar infecções de vias aéreas superiores. Padronização: ≥10% andrografolídeos.",
  blocos:[{d:"Infecção respiratória alta",n:"B",t:"Extrato padronizado (ex.: KalmCold/Kan Jang); reduz sintomas e duração do resfriado."}],
  dose:"Extrato padronizado fornecendo 60-120 mg/dia de andrografolídeos.",seg:"Desconforto no estômago/intestino, dor de cabeça. Possível possível efeito de reduzir a fertilidade. Evitar na gestação e em doenças autoimunes (como lúpus, artrite reumatoide).",mani:"Andrographis (ext. ≥10% andrografolídeos) 200 mg — 30 cápsulas.\nTomar 1 cápsula 2-3x/dia nos primeiros dias do resfriado.",reg:"Fitoterápico."},
 {id:"equinacea",nome:"Equinácea",sci:"Echinacea purpurea",classe:"Fitoterápico",tags:["imunidade","resfriado"],
  resumo:"Raiz e parte aérea da Echinacea purpurea/angustifolia, imunoestimulante tradicional. As alcamidas e polissacarídeos ativam macrófagos. Evidência para resfriado é heterogênea — mais útil para reduzir levemente duração/incidência.",
  blocos:[{d:"Resfriado (prevenção/duração)",n:"C",t:"Extrato padronizado; redução pequena e inconsistente da incidência/duração."}],
  dose:"Extrato padronizado, equiv. 2-3 g/dia da raiz, no início dos sintomas.",seg:"Alergia (plantas da família da camomila/margarida (Asteraceae)). Cautela em doenças autoimunes (como lúpus, artrite reumatoide) e pessoas com imunidade baixa.",mani:"Equinácea (ext. padr.) 200 mg — 60 cápsulas.\nTomar 1 cápsula 2-3x/dia ao primeiro sinal de resfriado.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"sabugueiro",nome:"Sabugueiro",sci:"Sambucus nigra",classe:"Fitoterápico",tags:["imunidade","gripe","antiviral"],
  resumo:"Fruto do Sambucus nigra (elderberry), rico em antocianinas. Tem ação antiviral sobre influenza in vitro e sinal clínico de encurtar sintomas gripais. Usar só o fruto cozido/extrato — frutos crus e outras partes são tóxicos.",
  blocos:[{d:"Gripe / resfriado (sintomas)",n:"B",t:"Extrato padronizado; reduz duração e gravidade de sintomas gripais em RCTs pequenos."}],
  dose:"Xarope/extrato padronizado, conforme rótulo, ao início dos sintomas.",seg:"Frutos crus e folhas/caule são tóxicos (cianogênicos) — usar só extrato preparado.",mani:"Sabugueiro (ext. padr. antocianinas) — xarope/cápsula.\nTomar conforme rótulo ao início dos sintomas gripais.",reg:"Fitoterápico / alimento."},
 {id:"unhadegato",nome:"Unha-de-gato",sci:"Uncaria tomentosa",classe:"Fitoterápico",tags:["inflamação","articular","imunomodulador"],
  resumo:"Casca da liana amazônica Uncaria tomentosa. Os alcaloides oxindólicos têm ação imunomoduladora e anti-inflamatória. Usada tradicionalmente em artrite e como adjuvante imune.",
  blocos:[{d:"Osteoartrite / artrite",n:"C",t:"Extrato padronizado; sinal de redução de dor articular em estudos pequenos."},{d:"Imunomodulação",n:"D",t:"Tradicional; evidência clínica fraca."}],
  dose:"Extrato padronizado, 250-350 mg/dia.",seg:"Cautela com remédios que baixam a imunidade (usados em transplante e em doenças autoimunes), remédios para pressão alta e remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel). Evitar na gestação.",mani:"Unha-de-gato (ext. padr.) 300 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"garraDoDiabo",nome:"Garra-do-diabo",sci:"Harpagophytum procumbens",classe:"Fitoterápico",tags:["dor articular","osteoartrite","lombalgia","anti-inflamatório"],
  resumo:"Raiz secundária do Harpagophytum procumbens (do deserto do Kalahari). Os harpagosídeos têm ação anti-inflamatória e analgésica, com evidência razoável em dor lombar e osteoartrite. Padronização: ≥1,2-2% harpagosídeos.",
  blocos:[{d:"Lombalgia / dor articular",n:"B",t:"Extrato com ≥50 mg/dia de harpagosídeo; reduz dor lombar e osteoartrite."}],
  dose:"Extrato padronizado fornecendo 50-100 mg/dia de harpagosídeo.",seg:"Desconforto no estômago/intestino. Cautela em úlcera péptica, remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel) e na gestação.",mani:"Garra-do-diabo (ext. padr. ≥2% harpagosídeo) 400 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"salgueiro",nome:"Salgueiro branco",sci:"Salix alba",classe:"Fitoterápico",tags:["dor","anti-inflamatório","lombalgia"],
  resumo:"Casca do Salix alba, fonte natural da salicina (precursora vegetal da aspirina). Convertida em ácido salicílico no organismo, tem ação analgésica e anti-inflamatória. Padronização pela salicina.",
  blocos:[{d:"Dor lombar / osteoartrite",n:"B",t:"Extrato fornecendo 120-240 mg/dia de salicina; alivia dor lombar."}],
  dose:"Extrato fornecendo 120-240 mg/dia de salicina.",seg:"Mesmas cautelas da aspirina e parentes (os salicilatos): alergia à aspirina, úlcera, remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel), evitar em crianças (síndrome de Reye) e na gestação.",mani:"Salgueiro branco (ext. padr. salicina) 200 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"arnica",nome:"Arnica (tópica)",sci:"Arnica montana",classe:"Fitoterápico",tags:["trauma","hematoma","dor muscular","tópico"],
  resumo:"Flores da Arnica montana, de uso tópico para traumas, hematomas e dor muscular. As lactonas sesquiterpênicas (helenalina) têm ação anti-inflamatória local. Uso ORAL é tóxico (apenas homeopático ou tópico).",
  blocos:[{d:"Trauma / hematoma / mialgia (tópico)",n:"C",t:"Gel/pomada; sinal de redução de dor e hematoma pós-trauma/exercício."}],
  dose:"Gel/creme tópico a 5-20%, aplicar 2-3x/dia na área.",seg:"USO ORAL É TÓXICO (tóxico para o coração). Não aplicar em pele lesada. Alergia a plantas da família da camomila/margarida (Asteraceae).",mani:"Arnica gel 10% — uso tópico.\nAplicar fina camada 2-3x/dia sobre a área (pele íntegra).",reg:"Fitoterápico tópico."},
 {id:"capsaicina",nome:"Capsaicina (tópica)",sci:"Capsicum",classe:"Fitoterápico",tags:["dor neuropática","osteoartrite","tópico"],
  resumo:"Princípio ardente da pimenta (Capsicum), de uso tópico. Depleta a substância P nas terminações nervosas, dessensibilizando a dor após uso repetido. Útil em dor neuropática localizada e osteoartrite.",
  blocos:[{d:"Dor neuropática / osteoartrite (tópico)",n:"B",t:"Creme 0,025-0,075% 3-4x/dia; reduz dor localizada com uso continuado."}],
  dose:"Creme 0,025-0,075%, aplicar 3-4x/dia (efeito após dias-semanas).",seg:"Ardência inicial. Lavar as mãos, evitar mucosas e olhos. Não em pele lesada.",mani:"Capsaicina creme 0,075% — uso tópico.\nAplicar na área dolorosa 3-4x/dia.",reg:"Fitoterápico tópico / medicamento."},
 {id:"menta",nome:"Óleo de hortelã-pimenta",sci:"Mentha piperita",classe:"Fitoterápico",tags:["intestino irritável","dispepsia","cefaleia"],
  resumo:"Óleo essencial da Mentha piperita, rico em mentol, relaxante da musculatura lisa intestinal (antiespasmódico). As cápsulas com revestimento entérico são padrão-ouro fitoterápico para síndrome do intestino irritável.",
  blocos:[{d:"Síndrome do intestino irritável",n:"A",t:"Cápsulas entéricas 0,2-0,4 mL 3x/dia; reduz dor abdominal e sintomas globais."},{d:"Dispepsia funcional",n:"B",t:"Combinado ao óleo de cominho, melhora dispepsia."},{d:"Cefaleia tensional (tópico)",n:"C",t:"Mentol tópico na têmpora; alívio sintomático."}],
  dose:"Cápsulas com revestimento entérico, 0,2-0,4 mL, 3x/dia antes das refeições.",seg:"Azia/refluxo (preferir entérico). Cautela em refluxo (DRGE) e hérnia de hiato.",mani:"Óleo de hortelã-pimenta (cápsula entérica) 0,2 mL — 90 cápsulas.\nTomar 1 cápsula 3x/dia antes das refeições.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"alcachofra",nome:"Alcachofra",sci:"Cynara scolymus",classe:"Fitoterápico",tags:["digestivo","colerético","dislipidemia","esteatose hepática"],
  resumo:"Folha da Cynara scolymus, rica em cinarina e luteolina. Colerético (estimula a bile), melhora a digestão de gorduras e tem efeito modesto sobre lipídios e enzimas hepáticas. Padronização: cinarina/ácido clorogênico.",
  blocos:[{d:"Dispepsia / digestão de gorduras",n:"B",t:"Extrato padronizado; melhora sintomas dispépticos (colerético)."},{d:"Dislipidemia",n:"C",t:"Pequena redução de colesterol."},{d:"Gordura no fígado",n:"C",t:"Sinal de melhora de enzimas em estudos pequenos."}],
  dose:"Extrato padronizado, 300-640 mg 2-3x/dia.",seg:"Cólica biliar em obstrução. Alergia a plantas da família da camomila/margarida (Asteraceae). Cautela em pedra na vesícula.",mani:"Alcachofra (ext. padr. cinarina) 300 mg — 60 cápsulas.\nTomar 1 cápsula 2-3x/dia às refeições.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"boldo",nome:"Boldo",sci:"Peumus boldus",classe:"Fitoterápico",tags:["digestivo","colerético","fígado"],
  resumo:"Folha do Peumus boldus, tradicional brasileira para digestão e fígado. A boldina é colerética e antioxidante. Uso digestivo de curto prazo; conteúdo de ascaridol exige cautela com dose e duração.",
  blocos:[{d:"Dispepsia / digestivo",n:"C",t:"Uso tradicional como colerético; evidência clínica limitada."}],
  dose:"Infusão ou extrato padronizado, uso de curto prazo.",seg:"Ascaridol é hepatotóxico em excesso — evitar uso prolongado e na gestação. Contraindicado em obstrução biliar.",mani:"Boldo (ext. padr.) 100 mg — 30 cápsulas.\nTomar 1 cápsula após refeições pesadas (curto prazo).",reg:"Fitoterápico (lista ANVISA)."},
 {id:"espinheira",nome:"Espinheira-santa",sci:"Maytenus ilicifolia",classe:"Fitoterápico",tags:["gastrite","úlcera","dispepsia"],
  resumo:"Folha da Maytenus ilicifolia, fitoterápico brasileiro consagrado para gastrite e úlcera. Tem ação antiulcerogênica e protetora da mucosa gástrica, com perfil parecido ao de antiácidos em estudos nacionais.",
  blocos:[{d:"Gastrite / dispepsia / úlcera",n:"B",t:"Extrato padronizado; protege mucosa gástrica e alivia dispepsia."}],
  dose:"Extrato padronizado, equiv. ~860-1500 mg/dia da folha.",seg:"Pode reduzir produção de leite. Evitar na gestação/lactação.",mani:"Espinheira-santa (ext. padr.) 350 mg — 60 cápsulas.\nTomar 1 cápsula 2-3x/dia antes das refeições.",reg:"Fitoterápico (lista ANVISA)."}
,
 {id:"levedura",nome:"Levedura de arroz vermelho",sci:"Monascus purpureus",classe:"Nutracêutico",tags:["dislipidemia","colesterol"],
  resumo:"Arroz fermentado pelo fungo Monascus purpureus, que produz monacolina K — quimicamente idêntica à lovastatina. Por isso reduz o LDL como uma estatina natural, com as mesmas precauções. Padronização pela monacolina K.",
  blocos:[{d:"Dislipidemia (LDL)",n:"A",t:"Monacolina K 3-10 mg/dia; reduz LDL de forma robusta (efeito de estatina)."}],
  dose:"Extrato padronizado fornecendo 3-10 mg/dia de monacolina K.",seg:"Funciona como uma estatina natural, então tem os mesmos riscos dos remédios de colesterol: dor muscular, lesão no fígado e interação com vários medicamentos. Pode conter citrinina (uma toxina de fungo, tóxica para os rins) se mal produzido. Evitar na gravidez e NÃO combinar com remédios para colesterol do tipo estatina (como sinvastatina, atorvastatina).",mani:"Levedura de arroz vermelho (padr. monacolina K) — equiv. 10 mg, 30 cápsulas.\nTomar 1 cápsula à noite.",reg:"Nutracêutico (fronteira com medicamento)."},
 {id:"bergamota",nome:"Bergamota",sci:"Citrus bergamia",classe:"Nutracêutico",tags:["dislipidemia","controle glicêmico","esteatose hepática"],
  resumo:"Polifenóis do fruto Citrus bergamia (laranja-bergamota da Calábria). Inibem a HMG-CoA redutase de forma branda e melhoram o perfil lipídico e glicêmico. Padronização pelos flavonoides (BPF — bergamot polyphenolic fraction).",
  blocos:[{d:"Dislipidemia",n:"B",t:"500-1000 mg/dia de BPF; reduz LDL e triglicérides, eleva HDL."},{d:"Controle glicêmico / esteatose",n:"C",t:"Sinal sobre glicemia e gordura hepática."}],
  dose:"500-1000 mg/dia de fração polifenólica de bergamota (BPF).",seg:"Bem tolerada. Cautela com remédios para colesterol (estatinas, como sinvastatina/atorvastatina) (efeito aditivo).",mani:"Bergamota (BPF padr.) 500 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Nutracêutico."},
 {id:"policosanol",nome:"Policosanol",sci:"",classe:"Nutracêutico",tags:["dislipidemia"],
  resumo:"Mistura de álcoois graxos de cadeia longa da cana-de-açúcar ou cera de abelha. Estudos cubanos mostraram forte efeito sobre LDL, mas replicações independentes foram decepcionantes — a evidência depende muito da origem.",
  blocos:[{d:"Dislipidemia",n:"C",t:"5-20 mg/dia; efeito robusto em estudos cubanos, fraco em independentes."}],
  dose:"5-20 mg/dia.",seg:"Bem tolerado. Possível efeito antiplaquetário leve.",mani:"Policosanol 10 mg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Nutracêutico."},
 {id:"fitosterois",nome:"Fitosteróis",sci:"Esteróis/estanóis vegetais",classe:"Nutracêutico",tags:["dislipidemia","colesterol"],
  resumo:"Esteróis e estanóis vegetais que competem com o colesterol pela absorção intestinal, reduzindo o LDL. Recomendados por diretrizes como adjuvante dietético. Efeito dose-dependente até ~2-3 g/dia.",
  blocos:[{d:"Dislipidemia (LDL)",n:"A",t:"2-3 g/dia; reduz LDL ~8-10%, recomendado por diretrizes."}],
  dose:"2-3 g/dia, junto às refeições.",seg:"Bem tolerados. Podem reduzir absorção de carotenoides. Contraindicados na sitosterolemia.",mani:"Fitosteróis 1 g — tomar 2-3 g/dia com refeições.\n(Também em alimentos fortificados.)",reg:"Nutracêutico / alimento funcional."},
 {id:"tocotrienois",nome:"Tocotrienóis",sci:"",classe:"Vitamina",tags:["dislipidemia","antioxidante","fígado"],
  resumo:"Fração da vitamina E distinta dos tocoferóis, com anel insaturado. Têm ação antioxidante mais potente em membranas e sinal lipídico e hepático. Fonte: óleo de annatto (sem tocoferol) ou palma.",
  blocos:[{d:"Dislipidemia / esteatose",n:"C",t:"100-300 mg/dia; sinal sobre lipídios e gordura hepática."},{d:"Antioxidante",n:"C",t:"Antioxidante de membrana potente."}],
  dose:"100-300 mg/dia (de annatto, livre de tocoferol).",seg:"Tocoferol concomitante reduz absorção dos tocotrienóis. Cautela com remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel).",mani:"Tocotrienóis (annatto) 125 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Vitamina / nutracêutico."},
 {id:"nattokinase",nome:"Nattoquinase",sci:"",classe:"Nutracêutico",tags:["saúde vascular","fibrinólise","pressão"],
  resumo:"Enzima fibrinolítica extraída do natto (soja fermentada). Degrada a fibrina, com potencial efeito antitrombótico e leve redução de pressão. Atenção à interação com anticoagulantes.",
  blocos:[{d:"Saúde vascular / fibrinólise",n:"C",t:"2000 FU/dia; atividade fibrinolítica, desfechos clínicos preliminares."},{d:"Pressão arterial",n:"C",t:"Pequena redução de pressão arterial."}],
  dose:"2000 FU/dia.",seg:"RISCO de sangramento — contraindicado com remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel) e antes de cirurgia.",mani:"Nattoquinase 2000 FU — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Nutracêutico."},
 {id:"hawthorn",nome:"Espinheiro-branco",sci:"Crataegus",classe:"Fitoterápico",tags:["insuficiência cardíaca","pressão","cardiovascular"],
  resumo:"Folhas e flores de Crataegus, fitoterápico cardiovascular tradicional europeu. As proantocianidinas e flavonoides têm ação inotrópica leve e vasodilatadora. Estudado como adjuvante na insuficiência cardíaca leve.",
  blocos:[{d:"Insuficiência cardíaca (adjuvante)",n:"B",t:"Extrato WS 1442, 900 mg/dia; melhora sintomas e tolerância ao exercício na insuficiência cardíaca leve."}],
  dose:"Extrato padronizado (ex.: WS 1442) 600-1200 mg/dia.",seg:"Pode potencializar digitálicos e remédios para pressão alta. Não substitui tratamento da IC.",mani:"Espinheiro-branco (ext. WS 1442) 450 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"coq10ubiq",nome:"Ubiquinol",sci:"CoQ10 reduzida",classe:"Nutracêutico",tags:["insuficiência cardíaca","fadiga","mitocondrial"],
  resumo:"Forma reduzida (ativa) da coenzima Q10, mais bem absorvida em idosos e em quem tem absorção comprometida. Mesmas indicações da CoQ10, com vantagem de biodisponibilidade. Foco cardiovascular e mitocondrial.",
  blocos:[{d:"Insuficiência cardíaca (adjuvante)",n:"B",t:"100-300 mg/dia; melhora sintomas e possivelmente mortalidade (estudo Q-SYMBIO)."},{d:"Fadiga / mitocondrial",n:"C",t:"Suporte energético; sinal modesto."}],
  dose:"100-300 mg/dia com refeição gordurosa.",seg:"Bem tolerado. Pode reduzir efeito do remédio que afina o sangue varfarina (Marevan).",mani:"Ubiquinol 100 mg — 60 cápsulas.\nTomar 1 cápsula 1-3x/dia com refeição.",reg:"Nutracêutico."},
 {id:"larginina",nome:"L-arginina",sci:"",classe:"Aminoácido",tags:["óxido nítrico","pressão","disfunção erétil","performance"],
  resumo:"Aminoácido precursor direto do óxido nítrico (vasodilatador). A absorção é limitada pela arginase intestinal — por isso a citrulina frequentemente eleva arginina de forma mais eficaz. Usada em DE, pressão e fluxo.",
  blocos:[{d:"Disfunção erétil / fluxo",n:"B",t:"3-6 g/dia (ou com pignogenol/tadalafila); melhora função erétil leve-moderada."},{d:"Pressão arterial",n:"C",t:"Pequena redução; resultados mistos."}],
  dose:"3-6 g/dia, fracionado.",seg:"desconforto no estômago/intestino em doses altas. Cautela após infarto, com herpes (arginina o favorece) e sildenafil.",mani:"L-arginina 1,5 g — tomar 3-6 g/dia fracionado.",reg:"Aminoácido / suplemento."},
 {id:"pycnogenol",nome:"Picnogenol",sci:"Pinus pinaster",classe:"Fitoterápico",tags:["circulação","antioxidante","pele","disfunção erétil"],
  resumo:"Extrato padronizado da casca do pinheiro marítimo francês, rico em proantocianidinas. Antioxidante e melhorador da função endotelial (óxido nítrico). Usado em insuficiência venosa, pele e, com arginina, em DE.",
  blocos:[{d:"Insuficiência venosa / edema",n:"B",t:"100-150 mg/dia; reduz sintomas de insuficiência venosa crônica."},{d:"Disfunção erétil (com arginina)",n:"B",t:"Combinação melhora função erétil."},{d:"Pele (fotoproteção)",n:"C",t:"Sinal antioxidante cutâneo."}],
  dose:"100-200 mg/dia de extrato padronizado.",seg:"Bem tolerado. Cautela com remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel) e em doenças autoimunes (como lúpus, artrite reumatoide).",mani:"Picnogenol 50 mg — 60 cápsulas.\nTomar 1 cápsula 2-3x/dia.",reg:"Fitoterápico / nutracêutico."},
 {id:"castanha",nome:"Castanha-da-índia",sci:"Aesculus hippocastanum",classe:"Fitoterápico",tags:["insuficiência venosa","varizes","edema"],
  resumo:"Semente da Aesculus hippocastanum, fitoterápico consagrado para insuficiência venosa. A escina reduz a permeabilidade capilar e o edema. Padronização pela escina.",
  blocos:[{d:"Insuficiência venosa crônica",n:"A",t:"Extrato com 50 mg de escina 2x/dia; reduz edema, dor e peso nas pernas."}],
  dose:"Extrato padronizado fornecendo 100-150 mg/dia de escina.",seg:"Desconforto no estômago/intestino. Sementes cruas são tóxicas — usar só extrato padronizado. Cautela com remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel).",mani:"Castanha-da-índia (ext. padr. escina) 300 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"centella",nome:"Centella asiática",sci:"Centella asiatica",classe:"Fitoterápico",tags:["cicatrização","insuficiência venosa","pele","colágeno"],
  resumo:"Erva da medicina ayurvédica (gotu kola), rica em triterpenos (asiaticosídeo) que estimulam a síntese de colágeno e a cicatrização. Usada em insuficiência venosa, cicatrizes e firmeza cutânea. Padronização TECA/TTFCA.",
  blocos:[{d:"Insuficiência venosa",n:"B",t:"Extrato titulado (TTFCA) 60-120 mg/dia; melhora microcirculação e edema."},{d:"Cicatrização / pele",n:"C",t:"Estimula colágeno; sinal em cicatrizes e firmeza."}],
  dose:"Extrato titulado em triterpenos, 60-120 mg/dia.",seg:"Casos raros de lesão no fígado em uso prolongado. Cautela na gestação.",mani:"Centella asiática (ext. titulado TTFCA) 30 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"diosmina",nome:"Diosmina + hesperidina",sci:"",classe:"Nutracêutico",tags:["insuficiência venosa","hemorroidas","varizes"],
  resumo:"Flavonoides cítricos (fração flavonoica micronizada purificada) que aumentam o tônus venoso e reduzem a permeabilidade capilar. Padrão de tratamento fitoterápico para doença venosa e crises hemorroidárias.",
  blocos:[{d:"Insuficiência venosa crônica",n:"A",t:"500 mg (450 diosmina + 50 hesperidina) 2x/dia; melhora sintomas venosos."},{d:"Crise hemorroidária",n:"A",t:"Doses altas reduzem sintomas agudos."}],
  dose:"500 mg 2x/dia (1000-3000 mg/dia na crise hemorroidária).",seg:"desconforto leve no estômago/intestino. Bem tolerada.",mani:"Diosmina 450 mg + hesperidina 50 mg — 60 comprimidos.\nTomar 1 comprimido 2x/dia.",reg:"Nutracêutico / medicamento conforme apresentação."},
 {id:"lisina",nome:"L-lisina",sci:"",classe:"Aminoácido",tags:["herpes","imunidade","colágeno"],
  resumo:"Aminoácido essencial que compete com a arginina (necessária à replicação do vírus herpes), daí o uso na profilaxia de herpes labial recorrente. Também cofator da síntese de colágeno.",
  blocos:[{d:"Herpes labial (recorrência)",n:"C",t:"1 g/dia profilático; pode reduzir frequência/duração de surtos."}],
  dose:"1 g/dia (profilaxia) ou 1 g 3x/dia na crise.",seg:"desconforto no estômago/intestino em doses altas. Cautela em quem tem problema nos rins.",mani:"L-lisina 1 g — 60 cápsulas.\nTomar 1 cápsula/dia (profilaxia).",reg:"Aminoácido / suplemento."},
 {id:"lactoferrina",nome:"Lactoferrina",sci:"",classe:"Nutracêutico",tags:["imunidade","ferro","intestino"],
  resumo:"Glicoproteína do leite que sequestra ferro (privando bactérias) e modula a imunidade da mucosa. Usada em deficiência de ferro (melhora aproveitamento) e suporte imune intestinal.",
  blocos:[{d:"Anemia ferropriva (adjuvante)",n:"C",t:"100-200 mg/dia; melhora parâmetros de ferro com menos desconforto no estômago/intestino que o ferro comum."},{d:"Imunidade de mucosa",n:"D",t:"Mecanístico; desfecho clínico preliminar."}],
  dose:"100-300 mg/dia.",seg:"Bem tolerada. Derivada de leite (cautela em alergia).",mani:"Lactoferrina 200 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Nutracêutico."},
 {id:"colostro",nome:"Colostro bovino",sci:"",classe:"Nutracêutico",tags:["imunidade","intestino","permeabilidade"],
  resumo:"Primeiro leite materno bovino, rico em imunoglobulinas, lactoferrina e fatores de crescimento. Usado para suporte imune e da barreira intestinal (permeabilidade aumentada). Padronização por IgG.",
  blocos:[{d:"Barreira intestinal / permeabilidade",n:"C",t:"Reduz permeabilidade intestinal em atletas e em alguns problemas do estômago/intestino."},{d:"Imunidade",n:"C",t:"Imunoglobulinas; sinal em infecções respiratórias de atletas."}],
  dose:"10-20 g/dia (padronizado em IgG).",seg:"Derivado de leite. Bem tolerado.",mani:"Colostro bovino (padr. IgG) — 10 g/dose.\nTomar 10-20 g/dia.",reg:"Nutracêutico / alimento."},
 {id:"butirato",nome:"Butirato",sci:"Ácido butírico",classe:"Nutracêutico",tags:["intestino","barreira intestinal","disbiose"],
  resumo:"Ácido graxo de cadeia curta produzido pela microbiota na fermentação de fibras. É o principal combustível dos colonócitos e regula a barreira e a inflamação intestinal. Suplementado como butirato de sódio/cálcio quando a produção endógena é baixa.",
  blocos:[{d:"Saúde da mucosa intestinal",n:"C",t:"300-600 mg 2x/dia; suporte à barreira e à inflamação intestinal."}],
  dose:"300-600 mg 2x/dia (butirato de sódio/cálcio, microencapsulado).",seg:"Desconforto no estômago/intestino, odor. Bem tolerado.",mani:"Butirato (Na/Ca microencapsulado) 300 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Nutracêutico."},
 {id:"glutamina",nome:"L-glutamina",sci:"",classe:"Aminoácido",tags:["intestino","permeabilidade","recuperação","imunidade"],
  resumo:"Aminoácido mais abundante do corpo e combustível primário dos enterócitos e células imunes. Em estresse catabólico (cirurgia, trauma, treino intenso) torna-se condicionalmente essencial. Usada em permeabilidade intestinal e recuperação.",
  blocos:[{d:"Barreira intestinal / permeabilidade",n:"C",t:"5-15 g/dia; suporte ao enterócito, sinal em permeabilidade."},{d:"Recuperação (estresse catabólico)",n:"C",t:"Útil em trauma/cirurgia; menos em atletas saudáveis."}],
  dose:"5-15 g/dia, fracionado.",seg:"Bem tolerada. Cautela em doença do fígado grave (amônia).",mani:"L-glutamina 5 g — tomar 5-15 g/dia fracionado.",reg:"Aminoácido / suplemento."},
 {id:"slipperyelm",nome:"Olmo escorregadio",sci:"Ulmus rubra",classe:"Fitoterápico",tags:["intestino","gastrite","refluxo","mucilagem"],
  resumo:"Casca interna do Ulmus rubra, rica em mucilagem que forma um gel protetor sobre as mucosas digestivas. Demulcente tradicional para gastrite, refluxo e irritação intestinal.",
  blocos:[{d:"Irritação do estômago/intestino / refluxo",n:"D",t:"Mucilagem demulcente; uso tradicional, evidência clínica fraca."}],
  dose:"Pó/cápsula, conforme rótulo, com bastante água, longe de outros fármacos.",seg:"Distanciar de outros medicamentos (reduz absorção). Bem tolerado.",mani:"Olmo escorregadio (pó) — 1-2 colheres em água, 2-3x/dia.",reg:"Fitoterápico / alimento."},
 {id:"dgl",nome:"Alcaçuz deglicirrizinado (DGL)",sci:"Glycyrrhiza glabra",classe:"Fitoterápico",tags:["gastrite","úlcera","refluxo"],
  resumo:"Alcaçuz com a glicirrizina removida (que causa hipertensão e perda de potássio). Mantém o efeito protetor/cicatrizante da mucosa gástrica sem o risco mineralocorticoide. Usado em dispepsia e úlcera.",
  blocos:[{d:"Dispepsia / úlcera gástrica",n:"C",t:"380-760 mg antes das refeições; protege a mucosa, sem o risco do alcaçuz comum."}],
  dose:"380-760 mg (mastigável) 20 min antes das refeições.",seg:"Por ser deglicirrizinado, evita a hipertensão do alcaçuz comum. Bem tolerado.",mani:"DGL (alcaçuz deglicirrizinado) 380 mg — 90 comprimidos mastigáveis.\nMastigar 1-2 antes das refeições.",reg:"Fitoterápico / nutracêutico."},
 {id:"saccharomyces",nome:"Saccharomyces boulardii",sci:"",classe:"Probiótico",tags:["diarreia","antibiótico","intestino"],
  resumo:"Levedura probiótica (não bacteriana, portanto resistente a antibióticos) com forte evidência na prevenção da diarreia associada a antibiótico e na diarreia do viajante. Não coloniza permanentemente.",
  blocos:[{d:"Diarreia associada a antibiótico",n:"A",t:"250-500 mg 2x/dia; reduz incidência de forma consistente."},{d:"Diarreia aguda / do viajante",n:"B",t:"Reduz duração."}],
  dose:"250-500 mg 1-2x/dia (5-10 bilhões UFC).",seg:"CONTRAINDICADO em pessoas com imunidade muito baixa (transplantados, quimioterapia, HIV avançado) e cateter venoso central (risco de infecção do fungo no sangue).",mani:"Saccharomyces boulardii 250 mg — 30 cápsulas.\nTomar 1 cápsula 1-2x/dia (distante do antifúngico).",reg:"Probiótico / medicamento."},
 {id:"alho2",nome:"Alho envelhecido (AGE)",sci:"Allium sativum (Kyolic)",classe:"Fitoterápico",tags:["pressão","imunidade","lipídios","saúde vascular"],
  resumo:"Extrato de alho envelhecido (aged garlic extract, Kyolic), processado por meses, rico em S-alil-cisteína estável e sem o odor/irritação do alho fresco. A forma com melhor evidência cardiovascular e mais bem tolerada.",
  blocos:[{d:"Hipertensão",n:"B",t:"600-1200 mg/dia de AGE; reduz a pressão em hipertensos."},{d:"Rigidez arterial / placa",n:"C",t:"Sinal de redução de progressão de placa coronária."}],
  dose:"600-1200 mg/dia de extrato de alho envelhecido.",seg:"Mais bem tolerado que o alho fresco. Cautela com remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel).",mani:"Alho envelhecido (AGE/Kyolic) 600 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico / nutracêutico."},
 {id:"chlorella",nome:"Chlorella",sci:"Chlorella vulgaris",classe:"Nutracêutico",tags:["detox","antioxidante","imunidade"],
  resumo:"Microalga verde de parede celular rígida (quebrada para absorção), rica em clorofila, proteína e nucleotídeos. Promovida para 'detox' de metais (liga-se a eles no intestino) e suporte imune. Exigir fonte sem contaminantes.",
