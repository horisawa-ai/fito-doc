  dose:"Extrato padronizado, 40-80 mg/dia.",seg:"Hepatotoxicidade rara relatada — monitorar. Evitar em hepatopatia e câncer de mama (controverso).",mani:"Cimicífuga (ext. padr.) 40 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"redclover",nome:"Trevo-vermelho",sci:"Trifolium pratense",classe:"Fitoterápico",tags:["menopausa","fogachos","isoflavonas"],
  resumo:"Flores do Trifolium pratense, ricas em isoflavonas (biochanina A, formononetina) com ação fitoestrogênica. Usado para fogachos da menopausa, com evidência modesta e mista. Padronização por isoflavonas.",
  blocos:[{d:"Fogachos",n:"C",t:"40-80 mg/dia de isoflavonas; redução modesta e inconsistente de fogachos."}],
  dose:"40-80 mg/dia de isoflavonas de trevo-vermelho.",seg:"Cautela em câncer hormônio-dependente (fitoestrógeno) e com anticoagulantes.",mani:"Trevo-vermelho (ext. padr. isoflavonas) 40 mg — 60 cápsulas.\nTomar 1-2 cápsulas/dia.",reg:"Fitoterápico."},
 {id:"isoflavonasoja",nome:"Isoflavonas de soja",sci:"Glycine max",classe:"Nutracêutico",tags:["menopausa","fogachos","saúde óssea"],
  resumo:"Genisteína e daidzeína da soja, fitoestrógenos que se ligam a receptores de estrogênio (preferencialmente beta). Reduzem fogachos e têm sinal ósseo. O efeito depende de a pessoa produzir equol (microbiota).",
  blocos:[{d:"Fogachos",n:"B",t:"50-100 mg/dia de isoflavonas; reduz fogachos, melhor em produtoras de equol."},{d:"Saúde óssea (pós-menopausa)",n:"C",t:"Pequeno efeito sobre densidade óssea."}],
  dose:"50-100 mg/dia de isoflavonas de soja.",seg:"Cautela em câncer de mama hormônio-dependente (controverso). Pode afetar tireoide em deficiência de iodo.",mani:"Isoflavonas de soja 50 mg — 60 cápsulas.\nTomar 1-2 cápsulas/dia.",reg:"Nutracêutico."},
 {id:"dongquai",nome:"Dong quai",sci:"Angelica sinensis",classe:"Fitoterápico",tags:["menopausa","ciclo menstrual"],
  resumo:"Raiz da Angelica sinensis, 'ginseng feminino' da medicina chinesa, tradicional para queixas menstruais e da menopausa. Frequentemente em fórmulas combinadas. Evidência isolada fraca.",
  blocos:[{d:"Sintomas da menopausa / menstruais",n:"D",t:"Tradicional; isolada não superou placebo em fogachos."}],
  dose:"Extrato conforme rótulo, geralmente em fórmula combinada.",seg:"Fotossensibilidade. Cautela com anticoagulantes (cumarinas). Evitar na gestação.",mani:"Dong quai (ext. padr.) 500 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico."},
 {id:"maracujapassi",nome:"Erva-cidreira",sci:"Melissa officinalis",classe:"Fitoterápico",tags:["ansiedade","sono","digestivo","cognição"],
  resumo:"Folha da Melissa officinalis, calmante tradicional. Os ácidos rosmarínico e fenólicos têm ação ansiolítica leve (modulação GABA) e melhoram humor e cognição sob estresse. Também digestiva (carminativa).",
  blocos:[{d:"Ansiedade / estresse",n:"B",t:"Extrato padronizado 300-600 mg; reduz ansiedade aguda e melhora humor."},{d:"Sono",n:"C",t:"Combinada à valeriana, melhora sono subjetivo."}],
  dose:"300-600 mg/dia de extrato padronizado (ácido rosmarínico).",seg:"Sonolência. Cautela com sedativos e em hipotireoidismo (dados conflitantes).",mani:"Erva-cidreira (ext. padr.) 300 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"kava",nome:"Kava",sci:"Piper methysticum",classe:"Fitoterápico",tags:["ansiedade"],
  resumo:"Raiz do Piper methysticum do Pacífico, ansiolítico potente via kavalactonas (modulação GABA). Tem boa evidência para ansiedade, mas o risco de hepatotoxicidade limita o uso. Padronização por kavalactonas.",
  blocos:[{d:"Ansiedade (TAG)",n:"B",t:"Kavalactonas 120-280 mg/dia; reduz ansiedade comparável a benzodiazepínico em curto prazo."}],
  dose:"Extrato padronizado fornecendo 120-280 mg/dia de kavalactonas, curto prazo.",seg:"RISCO de hepatotoxicidade grave — monitorar enzimas, evitar álcool e uso prolongado, contraindicado em hepatopatia. Restrito/banido em alguns países.",mani:"Kava (ext. padr. kavalactonas) 100 mg — 30 cápsulas.\nUso de curto prazo, sob monitorização hepática.",reg:"Fitoterápico (uso restrito)."},
 {id:"mucuna",nome:"Mucuna pruriens",sci:"",classe:"Fitoterápico",tags:["dopamina","Parkinson","libido","humor"],
  resumo:"Semente da Mucuna pruriens, fonte natural de L-dopa (precursor direto da dopamina). Estudada como adjuvante no Parkinson e para libido/humor. Padronização pelo teor de L-dopa.",
  blocos:[{d:"Parkinson (adjuvante)",n:"B",t:"Padronizada em L-dopa; eficácia comparável à levodopa em estudos pequenos."},{d:"Libido / humor / fertilidade",n:"C",t:"Via dopaminérgica; sinal preliminar."}],
  dose:"Extrato padronizado em L-dopa (ex.: 15%), conforme objetivo e orientação.",seg:"Interage com levodopa, IMAO e antipsicóticos. Náusea, discinesia. Uso sob supervisão.",mani:"Mucuna pruriens (ext. 15% L-dopa) 300 mg — 60 cápsulas.\nTomar conforme orientação médica.",reg:"Fitoterápico."},
 {id:"sceletium",nome:"Sceletium (kanna)",sci:"Sceletium tortuosum",classe:"Fitoterápico",tags:["humor","ansiedade","estresse"],
  resumo:"Planta sul-africana (kanna), cujos alcaloides (mesembrina) inibem a recaptação de serotonina e a PDE4. Usada para humor, ansiedade e estresse. Padronização Zembrin. Evidência inicial promissora.",
  blocos:[{d:"Ansiedade / humor / estresse",n:"C",t:"Extrato Zembrin 25 mg/dia; melhora resposta ao estresse em estudos iniciais."}],
  dose:"25 mg/dia de extrato padronizado (Zembrin).",seg:"NÃO combinar com ISRS/IMAO (serotoninérgico). Dados de longo prazo limitados.",mani:"Sceletium (ext. Zembrin) 25 mg — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Fitoterápico."},
 {id:"noni",nome:"Noni",sci:"Morinda citrifolia",classe:"Fitoterápico",tags:["antioxidante","imunidade","energia"],
  resumo:"Fruto da Morinda citrifolia do Pacífico, popular como 'superfruta'. Rico em antioxidantes, mas as alegações de saúde superam muito a evidência. Há relatos de hepatotoxicidade com sucos concentrados.",
  blocos:[{d:"Antioxidante / energia / imunidade",n:"D",t:"Alegações amplas sem suporte clínico robusto."}],
  dose:"Suco ou extrato conforme rótulo.",seg:"Hepatotoxicidade relatada. Rico em potássio (cautela em nefropatas e poupadores de K).",mani:"Noni (ext. padr.) 500 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico / alimento."},
 {id:"graviola",nome:"Graviola",sci:"Annona muricata",classe:"Fitoterápico",tags:["antioxidante"],
  resumo:"Fruto e folha da Annona muricata, popular com alegações anticâncer baseadas em estudos in vitro (acetogeninas). Importante: as acetogeninas são neurotóxicas e associadas a parkinsonismo atípico no uso crônico das folhas.",
  blocos:[{d:"Alegação anticâncer",n:"D",t:"In vitro apenas; SEM evidência clínica e com sinal de neurotoxicidade."}],
  dose:"Uso não recomendado como suplemento crônico.",seg:"ALERTA: acetogeninas neurotóxicas — associação a parkinsonismo atípico. Evitar uso crônico das folhas/extrato.",mani:"Uso não recomendado pela relação risco/benefício desfavorável.",reg:"Fitoterápico (cautela)."},
 {id:"cardomariano2",nome:"Berberis vulgaris",sci:"",classe:"Fitoterápico",tags:["controle glicêmico","digestivo","fígado"],
  resumo:"Casca da raiz da Berberis vulgaris (espinheiro-comum), fonte de berberina, usada na fitoterapia europeia para fígado e digestão. Mesma farmacologia metabólica da berberina, com a matriz vegetal.",
  blocos:[{d:"Controle glicêmico / lipídios",n:"B",t:"Via berberina; melhora metabólica."},{d:"Digestivo / hepatobiliar",n:"D",t:"Uso tradicional colerético."}],
  dose:"Extrato padronizado em berberina, conforme objetivo.",seg:"Mesmas da berberina (inibe CYP3A4); contraindicada na gestação.",mani:"Berberis vulgaris (ext. padr. berberina) 400 mg — 60 cápsulas.\nTomar 1 cápsula antes das refeições.",reg:"Fitoterápico."},
 {id:"taraxacum",nome:"Dente-de-leão",sci:"Taraxacum officinale",classe:"Fitoterápico",tags:["diurético","digestivo","fígado"],
  resumo:"Raiz e folha do Taraxacum officinale. A folha é diurético tradicional (rica em potássio, compensando a perda); a raiz é colerética/digestiva. Evidência humana limitada, mas perfil de segurança bom.",
  blocos:[{d:"Diurético / digestivo",n:"D",t:"Uso tradicional; diurese e suporte digestivo, pouca evidência clínica."}],
  dose:"Folha (diurético) ou raiz (digestivo), extrato conforme rótulo.",seg:"Alergia a Asteraceae. Cautela com diuréticos, lítio e em obstrução biliar.",mani:"Dente-de-leão (ext. padr.) 250 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"uvaursi",nome:"Uva-ursina",sci:"Arctostaphylos uva-ursi",classe:"Fitoterápico",tags:["ITU","antisséptico urinário"],
  resumo:"Folha da Arctostaphylos uva-ursi, contendo arbutina, convertida em hidroquinona (antisséptica) na urina alcalina. Usada em ITU não complicada de curto prazo. Uso limitado pela toxicidade da hidroquinona.",
  blocos:[{d:"ITU não complicada (curto prazo)",n:"C",t:"Arbutina padronizada; efeito antisséptico urinário em uso breve."}],
  dose:"Extrato fornecendo 400-840 mg/dia de arbutina, máximo ~1 semana, urina alcalina.",seg:"Hidroquinona é hepato/carcinogênica — máximo ~1 semana, não repetir mais de 5x/ano. Evitar na gestação e em nefropatia.",mani:"Uva-ursina (ext. padr. arbutina) 200 mg — 30 cápsulas.\nTomar conforme orientação, uso breve.",reg:"Fitoterápico (uso restrito)."},
 {id:"dimateste",nome:"Pygeum",sci:"Prunus africana",classe:"Fitoterápico",tags:["HPB","próstata","sintomas urinários"],
  resumo:"Casca da Prunus africana (cerejeira-africana), fitoterápico para sintomas urinários da HPB, com ação anti-inflamatória e sobre fatores de crescimento prostáticos. Frequentemente combinado ao saw palmetto. Padronização por fitosteróis.",
  blocos:[{d:"HPB — sintomas urinários",n:"B",t:"100-200 mg/dia de extrato padronizado; melhora fluxo e noctúria."}],
  dose:"100-200 mg/dia de extrato padronizado (13% fitosteróis).",seg:"GI leve. Bem tolerado. Pode mascarar avaliação de PSA.",mani:"Pygeum (ext. padr. 13% fitosteróis) 100 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico."},
 {id:"urtiga",nome:"Urtiga (raiz)",sci:"Urtica dioica",classe:"Fitoterápico",tags:["HPB","próstata","SHBG"],
  resumo:"Raiz da Urtica dioica, usada na HPB por modular a SHBG e a aromatase, reduzindo o estímulo prostático. A folha tem outros usos (alergia, articular). Frequentemente em fórmula com saw palmetto/pygeum.",
  blocos:[{d:"HPB — sintomas urinários",n:"B",t:"Extrato de raiz 300-600 mg/dia; melhora sintomas, sobretudo combinado."},{d:"Rinite alérgica (folha)",n:"C",t:"Folha liofilizada; alívio sintomático modesto."}],
  dose:"Raiz: extrato 300-600 mg/dia.",seg:"GI leve. Cautela com anti-hipertensivos, diuréticos e antidiabéticos.",mani:"Urtiga raiz (ext. padr.) 300 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"licopeno",nome:"Licopeno",sci:"",classe:"Nutracêutico",tags:["próstata","antioxidante","cardiovascular"],
  resumo:"Carotenoide vermelho do tomate (mais biodisponível cozido/com gordura), antioxidante com tropismo prostático. Dado epidemiológico associa maior ingestão a menor risco de câncer de próstata; suplementação tem evidência mista.",
  blocos:[{d:"Saúde prostática",n:"C",t:"10-30 mg/dia; dado observacional favorável, suplementação inconsistente."},{d:"Cardiovascular / antioxidante",n:"C",t:"Pequeno efeito sobre PA e LDL."}],
  dose:"10-30 mg/dia, com refeição gordurosa.",seg:"Bem tolerado. Doses muito altas: licopenodermia (inofensiva).",mani:"Licopeno 15 mg — 60 cápsulas.\nTomar 1 cápsula/dia com refeição.",reg:"Nutracêutico."}
,
 {id:"creatinahcl",nome:"Creatina HCl",sci:"",classe:"Nutracêutico",tags:["performance","massa magra","solubilidade"],
  resumo:"Forma de creatina ligada a cloridrato, mais solúvel que a monoidratada — vendida com a promessa de menor dose e menos retenção. Na prática, a monoidratada continua sendo o padrão-ouro custo-efetivo; a HCl não demonstrou superioridade clínica.",
  blocos:[{d:"Performance / massa magra",n:"C",t:"Mesmo efeito da monoidratada por grama de creatina; sem superioridade comprovada."}],
  dose:"~2-3 g/dia (equivalente em creatina à monoidratada).",seg:"Muito segura. Marketing supera a evidência vs. monoidratada.",mani:"Creatina HCl 2 g — dose diária.\nTomar 2-3 g/dia.",reg:"Nutracêutico."},
 {id:"betaina2",nome:"Betaína anidra (performance)",sci:"Trimetilglicina",classe:"Nutracêutico",tags:["performance","força","potência"],
  resumo:"A mesma TMG da homocisteína, aqui pelo ângulo ergogênico: como osmólito, hidrata a célula muscular e pode favorecer força e potência. Evidência modesta e heterogênea em performance.",
  blocos:[{d:"Força / potência",n:"C",t:"2,5 g/dia; sinal pequeno e inconsistente sobre potência."}],
  dose:"2,5 g/dia (2 doses de 1,25 g).",seg:"GI. Pode elevar levemente o LDL em doses altas.",mani:"Betaína anidra 1,25 g — tomar 2x/dia.",reg:"Nutracêutico."},
 {id:"bicarbonato",nome:"Bicarbonato de sódio",sci:"",classe:"Nutracêutico",tags:["performance","tampão","alta intensidade"],
  resumo:"Tampão extracelular que neutraliza a acidose induzida pelo exercício de alta intensidade (60s-10min), retardando a fadiga. Ergogênico bem estabelecido, limitado pelo desconforto GI — formas com revestimento ajudam.",
  blocos:[{d:"Performance de alta intensidade",n:"B",t:"0,2-0,3 g/kg 60-90 min pré-treino; melhora desempenho em esforços de 1-10 min."}],
  dose:"0,2-0,3 g/kg, 60-150 min antes (fracionar para reduzir GI).",seg:"Diarreia/distensão (frequente). Carga de sódio — cautela em hipertensão e nefropatia.",mani:"Bicarbonato de sódio — 0,2-0,3 g/kg pré-treino, fracionado.",reg:"Nutracêutico / alimento."},
 {id:"cafeinatablet",nome:"Cafeína + L-teanina (nootrópico)",sci:"",classe:"Estimulante",tags:["foco","atenção","cognição"],
  resumo:"A dupla cafeína:L-teanina (proporção ~1:2) é o nootrópico mais validado: a cafeína dá o alerta, a teanina suaviza o nervosismo, resultando em foco limpo sem tremor nem queda. Sinergia clássica.",
  blocos:[{d:"Foco / atenção sustentada",n:"A",t:"100 mg cafeína + 200 mg teanina; melhora atenção e reduz jitter."}],
  dose:"100 mg cafeína + 200 mg L-teanina, conforme necessário.",seg:"Evitar após 15h. Cautela em arritmia, ansiedade e hipertensão.",mani:"Cafeína 100 mg + L-teanina 200 mg — 30 cápsulas.\nTomar 1 cápsula pela manhã ou pré-tarefa.",reg:"Estimulante / suplemento."},
 {id:"noopept",nome:"Noopept",sci:"",classe:"Nutracêutico",tags:["cognição","memória","nootrópico"],
  resumo:"Dipeptídeo nootrópico sintético de origem russa, estruturalmente relacionado ao piracetam, porém ~1000x mais potente por mg. Modula BDNF e NGF. Evidência majoritariamente russa/pré-clínica; status regulatório variável.",
  blocos:[{d:"Cognição / memória",n:"D",t:"10-30 mg/dia; estudos majoritariamente russos, qualidade limitada."}],
  dose:"10-30 mg/dia.",seg:"Dados de segurança de longo prazo escassos. Status regulatório incerto.",mani:"Noopept 10 mg — 30 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Nutracêutico (regulamentação variável)."},
 {id:"piracetam",nome:"Piracetam",sci:"",classe:"Nutracêutico",tags:["cognição","nootrópico"],
  resumo:"O primeiro nootrópico (anos 60), derivado do GABA, modula membranas neuronais e neurotransmissão colinérgica/glutamatérgica. Usado em declínio cognitivo e mioclonia; nos EUA não é suplemento aprovado. Frequentemente com colina.",
  blocos:[{d:"Declínio cognitivo (idosos)",n:"C",t:"1,2-4,8 g/dia; sinal modesto em demência/declínio vascular."},{d:"Cognição (jovem saudável)",n:"D",t:"Sem benefício claro."}],
  dose:"1,2-4,8 g/dia, fracionado (com fonte de colina).",seg:"Bem tolerado. Cautela em insuficiência renal. Status regulatório variável.",mani:"Piracetam 800 mg — uso conforme orientação, com colina.",reg:"Nutracêutico / medicamento conforme país."},
 {id:"vinpocetina",nome:"Vinpocetina",sci:"Vinca minor",classe:"Fitoterápico",tags:["cognição","circulação cerebral"],
  resumo:"Derivado semissintético da vincamina (pervinca). Vasodilatador cerebral e neuroprotetor, usado em declínio cognitivo vascular. Evitar na gestação (risco fetal relatado).",
  blocos:[{d:"Cognição vascular / circulação cerebral",n:"C",t:"5-10 mg 3x/dia; sinal em declínio cognitivo vascular."}],
  dose:"5-10 mg 3x/dia com refeições.",seg:"CONTRAINDICADA na gestação. Cautela com anticoagulantes. Status de suplemento revogado em alguns países.",mani:"Vinpocetina 10 mg — 60 cápsulas.\nTomar 1 cápsula 2-3x/dia.",reg:"Fitoterápico / medicamento conforme país."},
 {id:"huperzina",nome:"Huperzina A",sci:"Huperzia serrata",classe:"Fitoterápico",tags:["memória","cognição","acetilcolinesterase"],
  resumo:"Alcaloide do musgo Huperzia serrata, inibidor potente e seletivo da acetilcolinesterase (eleva acetilcolina) — mecanismo igual ao de fármacos para Alzheimer. Usado em memória; potente, exige cautela com dose.",
  blocos:[{d:"Memória / declínio cognitivo",n:"C",t:"50-200 mcg/dia; melhora cognição em demência em estudos chineses."}],
  dose:"50-200 mcg/dia (microgramas — muito potente).",seg:"Efeitos colinérgicos (náusea, bradicardia). Não combinar com anticolinesterásicos. Cautela em asma/epilepsia.",mani:"Huperzina A 100 mcg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Fitoterápico."},
 {id:"galantamina",nome:"Galantamina",sci:"Galanthus",classe:"Fitoterápico",tags:["memória","cognição","sonho lúcido"],
  resumo:"Alcaloide do narciso (Galanthus), inibidor da acetilcolinesterase e modulador nicotínico — é fármaco aprovado para Alzheimer leve-moderado. Também popular para sonhos lúcidos. Uso exige supervisão.",
  blocos:[{d:"Alzheimer leve-moderado",n:"A",t:"16-24 mg/dia; melhora cognição (uso como medicamento)."}],
  dose:"Como medicamento: 16-24 mg/dia, titulado.",seg:"Efeitos colinérgicos. Cautela cardíaca, asma e GI. Uso sob prescrição para Alzheimer.",mani:"Galantamina — uso como medicamento, sob prescrição.",reg:"Medicamento / fitoterápico isolado."},
 {id:"theacrine",nome:"Teacrina",sci:"",classe:"Estimulante",tags:["energia","foco","sem tolerância"],
  resumo:"Alcaloide semelhante à cafeína (do chá kucha), que age sobre adenosina e dopamina com início mais lento, duração maior e menos tolerância/taquifilaxia que a cafeína. Usado em pré-treinos e foco.",
  blocos:[{d:"Energia / foco",n:"C",t:"100-200 mg; energia sustentada, menos tolerância que cafeína."}],
  dose:"100-200 mg/dia.",seg:"Menos efeito cardiovascular que cafeína, mas cautela similar. Dados de longo prazo limitados.",mani:"Teacrina 100 mg — 30 cápsulas.\nTomar 1 cápsula pela manhã.",reg:"Nutracêutico."},
 {id:"dynamine",nome:"Metilliberina",sci:"Dynamine",classe:"Estimulante",tags:["energia","foco"],
  resumo:"Alcaloide purínico (do kucha) parecido com a teacrina, de ação ainda mais rápida sobre dopamina e adenosina. Usado em fórmulas energéticas, geralmente combinado à cafeína/teacrina. Evidência inicial.",
  blocos:[{d:"Energia / foco agudo",n:"D",t:"100-200 mg; efeito agudo, evidência preliminar."}],
  dose:"100-200 mg conforme necessário.",seg:"Estimulante — cautela cardiovascular. Dados limitados.",mani:"Metilliberina (Dynamine) 100 mg — 30 cápsulas.\nTomar 1 cápsula pré-tarefa.",reg:"Nutracêutico."},
 {id:"sabiarosa",nome:"Rhodiola + cordyceps (energia)",sci:"",classe:"Adaptógeno",tags:["fadiga","performance","energia"],
  resumo:"Combinação adaptogênica popular para fadiga e performance aeróbica: a rhodiola atua no estresse e a fadiga mental, o cordyceps na utilização de oxigênio. A evidência de cada um é preliminar; a combinação não foi testada como unidade.",
  blocos:[{d:"Fadiga / performance aeróbica",n:"C",t:"Rhodiola 200 mg + cordyceps 1 g; efeito antifadiga combinado."}],
  dose:"Rhodiola 200-400 mg + cordyceps 1-3 g/dia.",seg:"Cautela em bipolar (rhodiola) e com anticoagulantes/imunossupressores (cordyceps).",mani:"Rhodiola 200 mg + Cordyceps 500 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico."},
 {id:"d3k2",nome:"Vitamina D3 + K2",sci:"",classe:"Vitamina",tags:["saúde óssea","saúde vascular","sinergia"],
  resumo:"Combinação racional: a D3 aumenta a absorção de cálcio, e a K2 (MK-7) direciona esse cálcio para o osso e o afasta das artérias (ativando osteocalcina e MGP). A dupla busca o benefício ósseo sem o risco vascular do cálcio mal direcionado.",
  blocos:[{d:"Saúde óssea / direcionamento de cálcio",n:"B",t:"D3 2000 UI + K2 100 mcg/dia; sinergia óssea e vascular."}],
  dose:"D3 1000-2000 UI + K2 (MK-7) 90-180 mcg/dia.",seg:"K2 ANTAGONIZA a varfarina — contraindicado nesse caso.",mani:"Vitamina D3 2000 UI + K2 (MK-7) 100 mcg — 60 cápsulas.\nTomar 1 cápsula/dia com refeição.",reg:"Vitamina / suplemento."},
 {id:"magtreonato",nome:"Magnésio L-treonato",sci:"Magtein",classe:"Mineral",tags:["cognição","memória","sono"],
  resumo:"Forma de magnésio que atravessa melhor a barreira hematoencefálica, elevando o magnésio cerebral — daí o foco em cognição e memória (não em câimbra/intestino). Forma cara e específica para o cérebro.",
  blocos:[{d:"Cognição / memória",n:"C",t:"~2 g/dia (≈144 mg Mg elementar); sinal em memória em estudos-piloto."},{d:"Sono",n:"C",t:"Pode melhorar sono via magnésio cerebral."}],
  dose:"~2 g/dia de L-treonato (≈144 mg de Mg elementar).",seg:"Bem tolerado. Custo elevado vs. outras formas.",mani:"Magnésio L-treonato (Magtein) 2 g — dose diária.\nTomar à noite.",reg:"Mineral / nutracêutico."},
 {id:"magmalato",nome:"Magnésio malato",sci:"",classe:"Mineral",tags:["fadiga","fibromialgia","energia"],
  resumo:"Magnésio ligado ao ácido málico (intermediário do ciclo de Krebs). Bem absorvido e com componente energético do malato — preferido em fadiga e fibromialgia. Menos laxativo que óxido/citrato.",
  blocos:[{d:"Fadiga / fibromialgia",n:"C",t:"Malato fornece magnésio + suporte energético; sinal em fadiga."}],
  dose:"Equiv. 200-400 mg de Mg elementar/dia.",seg:"Melhor tolerado que formas laxativas. Cautela na insuficiência renal.",mani:"Magnésio malato (equiv. 200 mg Mg) — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Mineral / suplemento."},
 {id:"zincopicolinato",nome:"Zinco picolinato",sci:"",classe:"Mineral",tags:["imunidade","absorção","acne"],
  resumo:"Zinco quelado ao ácido picolínico, uma das formas mais bem absorvidas. Mesmas indicações do zinco (imunidade, pele, testosterona em deficientes), com vantagem de biodisponibilidade.",
  blocos:[{d:"Imunidade / pele (deficiência)",n:"C",t:"Forma bem absorvida; corrige deficiência com eficiência."}],
  dose:"15-30 mg de zinco elementar/dia.",seg:"Náusea em jejum. Megadose crônica causa deficiência de cobre.",mani:"Zinco picolinato (15 mg elementar) — 60 cápsulas.\nTomar 1 cápsula/dia com refeição.",reg:"Mineral / suplemento."},
 {id:"molibdenio",nome:"Molibdênio",sci:"",classe:"Mineral",tags:["detox","sulfito","enzimas"],
  resumo:"Oligoelemento essencial, cofator da sulfito oxidase e da xantina oxidase (metabolismo de aminoácidos sulfurados e purinas). Deficiência é rara; reposição interessa em erros do metabolismo e sensibilidade a sulfitos.",
  blocos:[{d:"Cofator enzimático (deficiência)",n:"C",t:"Reposição em deficiência rara; cofator da sulfito oxidase."}],
  dose:"45-150 mcg/dia (RDA 45 mcg).",seg:"Excesso pode interferir no cobre e elevar ácido úrico.",mani:"Molibdênio 150 mcg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Mineral / suplemento."},
 {id:"boro",nome:"Boro",sci:"",classe:"Mineral",tags:["testosterona","saúde óssea","SHBG"],
  resumo:"Oligoelemento que influencia o metabolismo de hormônios esteroides (eleva testosterona livre reduzindo SHBG) e a saúde óssea (metabolismo de cálcio e vitamina D). Doses suplementares pequenas.",
  blocos:[{d:"Testosterona livre / hormônios",n:"C",t:"6-10 mg/dia; reduz SHBG e eleva testosterona livre em estudos pequenos."},{d:"Saúde óssea",n:"D",t:"Mecanístico; desfecho ósseo não estabelecido."}],
  dose:"3-10 mg/dia.",seg:"Doses altas (>20 mg) são tóxicas. Margem segura nas doses usuais.",mani:"Boro (quelato) 6 mg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Mineral / suplemento."},
 {id:"vanadio",nome:"Vanádio",sci:"Sulfato de vanadil",classe:"Mineral",tags:["controle glicêmico"],
  resumo:"Oligoelemento com ação insulino-mimética em modelos. Foi promovido para glicemia e ganho muscular, mas as doses eficazes ficam perto das tóxicas e a evidência humana é fraca — uso desencorajado.",
  blocos:[{d:"Controle glicêmico",n:"D",t:"Insulino-mimético em modelos; janela tóxica estreita, evidência humana fraca."}],
  dose:"Uso não recomendado rotineiramente (janela tóxica estreita).",seg:"Toxicidade GI e renal em doses 'eficazes'. Margem de segurança ruim.",mani:"Uso não recomendado pela relação risco/benefício.",reg:"Mineral (cautela)."},
 {id:"potassiocit",nome:"Citrato de potássio",sci:"",classe:"Mineral",tags:["litíase","pressão","alcalinizante"],
  resumo:"Sal de potássio alcalinizante, usado na prevenção de cálculos renais (cálcio/ácido úrico) por elevar o citrato urinário, e como fonte de potássio. Diferente do cloreto de potássio (reposição pura).",
  blocos:[{d:"Prevenção de litíase renal",n:"A",t:"Eleva citrato urinário; reduz recorrência de cálculos de cálcio (uso médico)."},{d:"Pressão arterial",n:"B",t:"Aporte de potássio reduz PA."}],
  dose:"Conforme indicação médica (ex.: 20-60 mEq/dia em litíase).",seg:"RISCO de hipercalemia — contraindicado em nefropatia avançada e com poupadores de K/IECA. GI.",mani:"Citrato de potássio — uso conforme prescrição (litíase/pressão).",reg:"Mineral / medicamento."},
 {id:"epaalto",nome:"Ômega-3 alta concentração EPA",sci:"",classe:"Ácido graxo",tags:["humor","depressão","inflamação"],
  resumo:"Formulação de ômega-3 com predomínio de EPA sobre DHA (proporção ≥2:1 ou EPA puro). O EPA é a fração com melhor sinal em humor/depressão e inflamação — diferente do DHA, mais estrutural/cognitivo.",
  blocos:[{d:"Depressão (adjuvante)",n:"B",t:"≥1 g/dia de EPA (formulações ricas em EPA); adjuvante antidepressivo."},{d:"Inflamação",n:"B",t:"Reduz marcadores inflamatórios."}],
  dose:"1-2 g/dia de EPA (formulação rica em EPA).",seg:"Eructação, GI. Cautela com anticoagulantes em doses altas.",mani:"Ômega-3 EPA alto (≥2:1 EPA:DHA) 1 g — 60 cápsulas.\nTomar 1-2 cápsulas 1-2x/dia.",reg:"Suplemento."},
 {id:"dhaalto",nome:"Ômega-3 alta concentração DHA",sci:"",classe:"Ácido graxo",tags:["cognição","gestação","visão","neurodesenvolvimento"],
  resumo:"Formulação rica em DHA, a fração estrutural das membranas neuronais e da retina. Prioritária na gestação/lactação (neurodesenvolvimento fetal) e em cognição/visão, onde supera as fórmulas ricas em EPA.",
  blocos:[{d:"Neurodesenvolvimento (gestação)",n:"B",t:"200-300 mg DHA/dia na gestação; suporte ao cérebro e retina fetais."},{d:"Cognição / visão",n:"C",t:"Suporte estrutural; benefício em déficit."}],
  dose:"Gestação: ≥200 mg DHA/dia; geral 500-1000 mg.",seg:"Bem tolerado. Cautela com anticoagulantes em doses altas.",mani:"Ômega-3 DHA alto 500 mg — 60 cápsulas.\nTomar 1-2 cápsulas/dia.",reg:"Suplemento."},
 {id:"gla",nome:"GLA (borragem)",sci:"Borago officinalis",classe:"Ácido graxo",tags:["pele","dermatite atópica","artrite","TPM"],
  resumo:"Ácido gama-linolênico (ômega-6) do óleo de borragem (mais concentrado que a prímula). Precursor de prostaglandinas anti-inflamatórias da série 1. Usado em dermatite atópica, artrite reumatoide e TPM.",
  blocos:[{d:"Artrite reumatoide (adjuvante)",n:"B",t:"1,4-2,8 g GLA/dia; reduz dor e rigidez articular."},{d:"Dermatite atópica / pele",n:"C",t:"Sinal inconsistente."}],
  dose:"GLA 1-3 g/dia (óleo de borragem padronizado).",seg:"Cautela com anticoagulantes e em epilepsia. GI leve.",mani:"Óleo de borragem (≥20% GLA) 1 g — 60 cápsulas.\nTomar 1-2 cápsulas 2x/dia.",reg:"Suplemento."},
 {id:"oleococo",nome:"Óleo de coco",sci:"Cocos nucifera",classe:"Ácido graxo",tags:["energia","TCM","saciedade"],
  resumo:"Gordura saturada rica em TCM (sobretudo láurico/C12). Promovido para energia, peso e cognição, mas o efeito é modesto e ele eleva o LDL como gordura saturada — não é o 'super-alimento' do marketing.",
  blocos:[{d:"Energia / saciedade",n:"C",t:"Parte como TCM; efeito modesto sobre saciedade."},{d:"Perda de peso / cognição",n:"D",t:"Alegações superam a evidência; eleva LDL."}],
  dose:"1-2 colheres/dia (uso culinário).",seg:"Eleva LDL (gordura saturada) — moderação em dislipidemia.",mani:"Óleo de coco — uso culinário, 1-2 colheres/dia.",reg:"Alimento."},
 {id:"oleoprimulaepo",nome:"Ácido linoleico conjugado (CLA t10c12)",sci:"",classe:"Ácido graxo",tags:["composição corporal"],
  resumo:"Isômero específico do CLA promovido para gordura corporal. Reforça o que já consta: o efeito é mínimo, clinicamente irrelevante, e pode piorar a resistência insulínica e marcadores hepáticos. Entra marcado como tal.",
  blocos:[{d:"Composição corporal",n:"D",t:"Efeito mínimo; pode piorar RI e fígado."}],
  dose:"Não recomendado rotineiramente.",seg:"Possível piora de RI e de marcadores hepáticos.",mani:"Uso não recomendado pela baixa relação benefício/risco.",reg:"Suplemento."},
 {id:"berberinacanela",nome:"Cromo + canela (metabólico)",sci:"",classe:"Nutracêutico",tags:["controle glicêmico","resistência insulínica"],
  resumo:"Combinação metabólica popular: cromo (sinalização da insulina) + canela (polifenóis sensibilizadores). Cada um tem efeito pequeno e inconsistente; a combinação é racional mas pouco testada como unidade.",
  blocos:[{d:"Controle glicêmico (adjuvante)",n:"C",t:"Efeitos modestos somados; não substitui medidas de base."}],
  dose:"Cromo 200-400 mcg + canela (extrato aquoso) conforme rótulo.",seg:"Hipoglicemia com antidiabéticos. Preferir canela Ceylon/aquosa.",mani:"Cromo 200 mcg + Canela (ext. aquoso) 250 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Nutracêutico."},
 {id:"acaco",nome:"Açaí",sci:"Euterpe oleracea",classe:"Nutracêutico",tags:["antioxidante","energia"],
  resumo:"Fruto amazônico (Euterpe oleracea), rico em antocianinas e gorduras, com alta capacidade antioxidante in vitro. Popular como 'superfruta', mas os desfechos clínicos de saúde são limitados — é sobretudo um alimento antioxidante.",
  blocos:[{d:"Antioxidante",n:"C",t:"Alta capacidade antioxidante; desfechos clínicos limitados."}],
  dose:"Polpa/extrato conforme uso alimentar.",seg:"Alimento bem tolerado. Calórico na forma de polpa.",mani:"Açaí (extrato/polpa) — uso alimentar.",reg:"Alimento / nutracêutico."},
 {id:"camucamu",nome:"Camu-camu",sci:"Myrciaria dubia",classe:"Nutracêutico",tags:["vitamina C","antioxidante","imunidade"],
  resumo:"Fruto amazônico (Myrciaria dubia) com um dos maiores teores naturais de vitamina C do mundo, além de polifenóis. Fonte natural de vitamina C com matriz antioxidante completa.",
  blocos:[{d:"Vitamina C / antioxidante",n:"C",t:"Fonte rica de vitamina C natural; mesma lógica da vit C para resfriado."}],
  dose:"Pó/extrato fornecendo vitamina C conforme objetivo.",seg:"Bem tolerado. Acidez GI em doses altas.",mani:"Camu-camu (pó padr. vit C) — conforme rótulo.\nTomar 1x/dia.",reg:"Alimento / nutracêutico."},
 {id:"acerola",nome:"Acerola",sci:"Malpighia emarginata",classe:"Nutracêutico",tags:["vitamina C","antioxidante","imunidade"],
  resumo:"Fruta tropical (Malpighia emarginata) riquíssima em vitamina C natural com bioflavonoides. Fonte vegetal preferida de vitamina C por muitos, por trazer a matriz completa em vez do ácido ascórbico isolado.",
  blocos:[{d:"Vitamina C / imunidade",n:"C",t:"Vitamina C natural; mesma evidência da vit C para resfriado."}],
  dose:"Pó/extrato fornecendo 100-500 mg de vit C/dia.",seg:"Acidez GI. Bem tolerada.",mani:"Acerola (pó padr. vit C) 500 mg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Alimento / nutracêutico."},
 {id:"rutina",nome:"Rutina",sci:"",classe:"Nutracêutico",tags:["fragilidade capilar","insuficiência venosa","antioxidante"],
  resumo:"Bioflavonoide (quercetina-rutinosídeo) que fortalece capilares e reduz sua permeabilidade. Tradicional em fragilidade capilar e insuficiência venosa, frequentemente com vitamina C e diosmina.",
  blocos:[{d:"Fragilidade capilar / venosa",n:"C",t:"Reduz permeabilidade capilar; adjuvante venoso."}],
  dose:"500 mg 1-2x/dia.",seg:"Bem tolerada. Cautela com anticoagulantes.",mani:"Rutina 500 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Nutracêutico."},
 {id:"hesperidina2",nome:"Hesperidina",sci:"",classe:"Nutracêutico",tags:["venoso","antioxidante","metabólico"],
  resumo:"Flavonoide cítrico (da casca da laranja), venotônico e antioxidante. Componente clássico das fórmulas venosas (com diosmina) e estudado isoladamente em função endotelial e metabolismo.",
  blocos:[{d:"Insuficiência venosa (com diosmina)",n:"A",t:"Parte da fração flavonoica venotônica."},{d:"Função endotelial / metabólica",n:"C",t:"Sinal isolado preliminar."}],
  dose:"500 mg/dia (ou em fórmula com diosmina).",seg:"Bem tolerada.",mani:"Hesperidina 500 mg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Nutracêutico."},
 {id:"antocianinas",nome:"Mirtilo (antocianinas)",sci:"Vaccinium myrtillus",classe:"Fitoterápico",tags:["visão","circulação","antioxidante"],
  resumo:"Fruto do mirtilo europeu (bilberry), riquíssimo em antocianinas que melhoram a microcirculação e a função retiniana. Tradicional para fadiga visual e visão noturna; também venotônico. Padronização por antocianosídeos.",
  blocos:[{d:"Fadiga visual / microcirculação",n:"C",t:"Extrato 25% antocianosídeos, 160-320 mg/dia; sinal em fadiga visual e venoso."},{d:"Visão noturna",n:"D",t:"Mito da 2ª guerra; evidência fraca."}],
  dose:"160-320 mg/dia de extrato padronizado (25% antocianosídeos).",seg:"Bem tolerado. Cautela com anticoagulantes.",mani:"Mirtilo (ext. 25% antocianosídeos) 160 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico."},
 {id:"grapeseed",nome:"Semente de uva (OPC)",sci:"Vitis vinifera",classe:"Fitoterápico",tags:["antioxidante","venoso","circulação","pele"],
  resumo:"Extrato da semente de uva, rico em proantocianidinas oligoméricas (OPC). Antioxidante potente, melhora a função endotelial e venosa e a microcirculação. Padronização por OPC/polifenóis.",
  blocos:[{d:"Insuficiência venosa / circulação",n:"B",t:"150-300 mg/dia de OPC; melhora sintomas venosos e função endotelial."},{d:"Antioxidante / pele",n:"C",t:"Antioxidante potente; sinal cutâneo."}],
  dose:"150-300 mg/dia de extrato padronizado em OPC.",seg:"Bem tolerado. Cautela com anticoagulantes.",mani:"Semente de uva (ext. padr. OPC) 150 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico / nutracêutico."},
 {id:"resveratrolbio",nome:"Trans-resveratrol",sci:"",classe:"Nutracêutico",tags:["antioxidante","cardiometabólico","longevidade"],
  resumo:"O isômero ativo (trans) do resveratrol, padronizado a alta pureza (do Polygonum cuspidatum) e às vezes microencapsulado para melhorar a notória baixa biodisponibilidade. Mesma promessa de sirtuínas/longevidade do resveratrol.",
  blocos:[{d:"Cardiometabólico",n:"C",t:"150-500 mg/dia; sinal glicêmico/lipídico, limitado pela biodisponibilidade."},{d:"Longevidade",n:"D",t:"Sem desfecho clínico em humanos."}],
  dose:"150-500 mg/dia de trans-resveratrol (com gordura).",seg:"GI em doses altas. Inibe CYP — cautela com fármacos.",mani:"Trans-resveratrol 250 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia com refeição.",reg:"Nutracêutico."},
 {id:"niacinamida",nome:"Niacinamida (B3)",sci:"Nicotinamida",classe:"Vitamina",tags:["pele","NAD","fotoproteção"],
  resumo:"Forma da vitamina B3 sem o rubor da niacina. Precursora de NAD+ e, em dermatologia, reduz a incidência de câncer de pele não melanoma em pacientes de risco e melhora a barreira cutânea.",
  blocos:[{d:"Prevenção de câncer de pele (não melanoma)",n:"B",t:"500 mg 2x/dia; reduz CBC/CEC em pacientes de alto risco (ONTRAC)."},{d:"NAD+ / pele (barreira)",n:"C",t:"Precursor de NAD+; melhora barreira cutânea."}],
  dose:"500 mg 1-2x/dia.",seg:"Bem tolerada (sem rubor). Doses muito altas: hepatotoxicidade.",mani:"Niacinamida 500 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Vitamina / suplemento."},
 {id:"nr",nome:"Nicotinamida ribosídeo (NR)",sci:"Niagen",classe:"Nutracêutico",tags:["NAD","longevidade","energia","mitocondrial"],
  resumo:"Precursor de NAD+ (forma ribosídeo), alternativa ao NMN com mais dados de segurança humana. Eleva NAD+ de forma comprovada; a tradução em desfechos clínicos de longevidade ainda não está estabelecida.",
  blocos:[{d:"NAD+ / metabolismo",n:"B",t:"250-500 mg/dia; eleva NAD+ de forma robusta e segura."},{d:"Longevidade / performance",n:"D",t:"Eleva NAD+, mas sem desfecho clínico de longevidade."}],
  dose:"250-500 mg/dia.",seg:"Bem tolerado em estudos. Dados de longo prazo emergindo.",mani:"Nicotinamida ribosídeo (Niagen) 300 mg — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Nutracêutico."},
 {id:"benfotiamina",nome:"Benfotiamina",sci:"",classe:"Vitamina",tags:["neuropatia diabética","glicação"],
  resumo:"Derivado lipossolúvel da vitamina B1 (tiamina), com biodisponibilidade muito superior. Ativa a transcetolase, reduzindo subprodutos tóxicos da glicose (AGEs) — daí o uso na neuropatia diabética.",
  blocos:[{d:"Neuropatia diabética",n:"B",t:"150-300 mg 2x/dia; melhora sintomas neuropáticos em diabéticos."}],
  dose:"150-300 mg 1-2x/dia.",seg:"Bem tolerada.",mani:"Benfotiamina 150 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Vitamina / nutracêutico."},
 {id:"metilfolato",nome:"Metilfolato (5-MTHF)",sci:"L-metilfolato",classe:"Vitamina",tags:["homocisteína","humor","MTHFR","gestação"],
  resumo:"Forma ativa do folato, que dispensa a conversão pela enzima MTHFR — útil em quem tem polimorfismo MTHFR (conversão reduzida). Preferida ao ácido fólico em depressão (adjuvante) e em gestantes com MTHFR.",
  blocos:[{d:"Defeitos do tubo neural / gestação (MTHFR)",n:"B",t:"Forma ativa; preferível em polimorfismo MTHFR."},{d:"Depressão (adjuvante)",n:"B",t:"L-metilfolato 7,5-15 mg/dia potencializa antidepressivos."}],
  dose:"400 mcg-1 mg (geral); até 15 mg em depressão adjuvante.",seg:"Pode mascarar deficiência de B12. Repor B12 junto.",mani:"L-metilfolato 1 mg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Vitamina / suplemento."},
 {id:"metilb12",nome:"Metilcobalamina (B12)",sci:"",classe:"Vitamina",tags:["neuropatia","fadiga","metilação"],
  resumo:"Forma ativa/coenzimática da B12 (vs. a cianocobalamina sintética), preferida por alguns para suporte neurológico e metilação. Na prática, ambas corrigem a deficiência; a metil pode ter leve vantagem em neuropatia.",
  blocos:[{d:"Deficiência de B12 / neuropatia",n:"B",t:"Corrige deficiência; forma ativa preferida em suporte neurológico."}],
  dose:"500-1000 mcg/dia (sublingual ou oral).",seg:"Muito segura. Investigar a causa da deficiência.",mani:"Metilcobalamina 1000 mcg — 60 cápsulas sublinguais.\nTomar 1/dia.",reg:"Vitamina / suplemento."},
 {id:"p5p",nome:"Piridoxal-5-fosfato (B6 ativa)",sci:"P5P",classe:"Vitamina",tags:["TPM","neuropatia","homocisteína","náusea"],
  resumo:"Forma coenzimática ativa da vitamina B6, que dispensa conversão hepática. Cofator de centenas de reações (neurotransmissores, homocisteína). Preferida em quem tem conversão prejudicada. Atenção ao teto da B6.",
  blocos:[{d:"TPM / náusea gestacional",n:"B",t:"B6 reduz sintomas de TPM e náusea da gestação."},{d:"Homocisteína (com B12/folato)",n:"B",t:"Cofator da remetilação."}],
  dose:"P5P 20-50 mg/dia (não exceder ~100 mg de B6 total cronicamente).",seg:"Excesso crônico de B6 causa NEUROPATIA sensitiva — respeitar o teto.",mani:"Piridoxal-5-fosfato 25 mg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Vitamina / suplemento."},
 {id:"vitb1",nome:"Tiamina (B1)",sci:"",classe:"Vitamina",tags:["energia","neuropatia","alcoolismo","cardíaco"],
  resumo:"Vitamina B1, cofator do metabolismo de carboidratos e da função neuronal. Deficiência (alcoolismo, bariátrica, desnutrição) causa beribéri e Wernicke. Reposição é crítica nesses contextos.",
  blocos:[{d:"Deficiência (beribéri / Wernicke)",n:"A",t:"Reposição (oral/IV) reverte/previne; emergência neurológica em Wernicke."}],
  dose:"Manutenção 1-2 mg/dia; reposição 100 mg+/dia conforme contexto.",seg:"Muito segura. Em suspeita de Wernicke, repor ANTES de glicose.",mani:"Tiamina 100 mg — 60 cápsulas.\nTomar 1 cápsula/dia (ou conforme contexto clínico).",reg:"Vitamina / medicamento."},
 {id:"riboflavina",nome:"Riboflavina (B2)",sci:"",classe:"Vitamina",tags:["enxaqueca","energia","mitocondrial"],
  resumo:"Vitamina B2, precursora de FAD/FMN (cadeia respiratória mitocondrial). Em dose alta tem evidência de profilaxia de enxaqueca, provavelmente por melhorar o metabolismo energético neuronal.",
  blocos:[{d:"Profilaxia de enxaqueca",n:"B",t:"400 mg/dia; reduz frequência de crises (efeito após ~3 meses)."}],
  dose:"Profilaxia de enxaqueca: 400 mg/dia.",seg:"Muito segura. Urina amarelo-fluorescente (inofensivo).",mani:"Riboflavina 200 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia (profilaxia de enxaqueca).",reg:"Vitamina / suplemento."},
 {id:"vitb5",nome:"Ácido pantotênico (B5)",sci:"",classe:"Vitamina",tags:["energia","acne","pele","adrenal"],
  resumo:"Vitamina B5, componente da coenzima A (metabolismo de gorduras e energia). Deficiência é rara. Doses altas foram estudadas para acne, com sinal modesto, e há mito de 'suporte adrenal'.",
  blocos:[{d:"Acne (doses altas)",n:"C",t:"Doses altas; sinal modesto em acne em estudos pequenos."}],
  dose:"5-10 mg/dia (RDA); doses altas em acne sob orientação.",seg:"Muito segura. Doses muito altas: GI.",mani:"Ácido pantotênico 500 mg — 60 cápsulas.\nTomar conforme objetivo.",reg:"Vitamina / suplemento."},
 {id:"vitb7",nome:"Inositol + colina (lipotrópico)",sci:"",classe:"Nutracêutico",tags:["fígado","metabolismo de gordura"],
  resumo:"Combinação 'lipotrópica' tradicional (inositol + colina, às vezes com metionina) promovida para metabolismo de gordura hepática. A colina tem base real na esteatose por deficiência; o conjunto é mais empírico.",
  blocos:[{d:"Metabolismo de gordura hepática",n:"D",t:"Lipotrópicos; base na colina, conjunto pouco testado."}],

var APP=document.getElementById('app');
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function best(s){var o={A:0,B:1,C:2,D:3},m="D";s.blocos.forEach(function(b){if(o[b.n]<o[m])m=b.n;});return m;}
function get(id){for(var i=0;i<DATA.length;i++)if(DATA[i].id===id)return DATA[i];}
function getC(id){for(var i=0;i<COMBOS.length;i++)if(COMBOS[i].id===id)return COMBOS[i];}
function clsOf(s){return CLASSES[s.classe]||CLASSES["Fitoterápico"];}
function svg(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}

function cardHTML(s,mt,i){
  var lv=best(s),cl=clsOf(s);
  return '<div class="card rise" style="animation-delay:'+(i*45)+'ms" onclick="openDetail(\''+s.id+'\')">'+
    '<span class="bar" style="background:'+cl.c+'"></span>'+
    '<div class="ico" style="background:'+cl.c+'22;color:'+cl.c+'">'+svg(cl.ic)+'</div>'+
    '<div class="mid"><div class="nm">'+esc(s.nome)+'</div>'+
    '<div class="cl">'+esc(s.classe.replace(' (alcaloide)',''))+(s.sci?' · '+esc(s.sci):'')+'</div>'+
    (mt?'<div class="mt">↳ '+esc(mt)+'</div>':'')+'</div>'+
    '<span class="lvl '+lv+'">'+lv+'</span></div>';
}
function comboCardHTML(co,i){
  var pills='';co.comps.slice(0,3).forEach(function(c){pills+='<span class="cpill">'+esc(c.nome)+'</span>';});
  if(co.comps.length>3)pills+='<span class="cpill more">+'+(co.comps.length-3)+'</span>';
  return '<div class="combo rise" style="animation-delay:'+(i*55)+'ms" onclick="openCombo(\''+co.id+'\')">'+
    '<div class="glow" style="background:'+co.c+'"></div>'+
    '<div class="top"><div class="cico" style="background:'+co.c+'22;color:'+co.c+'">'+svg(co.ic)+'</div>'+
    '<div><div class="cn">'+esc(co.nome)+'</div><div class="cf">'+esc(co.fim)+'</div></div></div>'+
    '<div class="pills">'+pills+'</div></div>';
}

var WHEEL_PICKS=["berb","curc","ome","ashwa","cre","mela","sere","rho"];
function wheelHTML(){
  // monta satélites em círculo; conteúdo contra-rotaciona p/ ficar legível
  var n=WHEEL_PICKS.length,R=124,sats='';
  for(var i=0;i<n;i++){
    var s=get(WHEEL_PICKS[i]); if(!s) continue;
    var ang=(i/n)*2*Math.PI - Math.PI/2;
    var x=Math.cos(ang)*R, y=Math.sin(ang)*R;
    var cl=clsOf(s), lv=best(s);
    var nm=s.nome.length>11?s.nome.slice(0,10)+'…':s.nome;
    sats+='<div class="sat" style="transform:translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px)" onclick="openDetail(\''+s.id+'\')">'+
      '<div class="sat-spin">'+
        '<span class="sb '+lv+'">'+lv+'</span>'+
        '<div class="si" style="color:'+cl.c+'">'+svg(cl.ic)+'</div>'+
        '<div class="sn">'+esc(nm)+'</div>'+
      '</div></div>';
  }
  return '<div class="wheel-sect">'+
    '<div class="wheel-cap"><div class="t">Em destaque</div><div class="a" onclick="goTab(\'az\')">ver todos</div></div>'+
    '<div class="wheel-stage" id="wheelStage">'+
      '<div class="wheel-orbit"></div>'+
      '<div class="wheel-rot" id="wheelRot">'+sats+'</div>'+
      '<div class="wheel-core"><div class="ce">'+DATA.length+'</div><div class="cd"></div><div class="cl">ativos</div></div>'+
    '</div>'+
    '<div class="wheel-hint">toque em um ativo · toque no centro para pausar</div></div>';
}

  // stat strip
  h+='<div class="strip">'+
    '<div class="scard rise" style="animation-delay:180ms">'+svg('<path d="M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5l-8-3Z"/>')+'<div class="sn">'+DATA.length+'</div><div class="sl">ativos catalogados</div></div>'+
    '<div class="scard rise" style="animation-delay:210ms">'+svg('<path d="M12 2 3 7l9 5 9-5-9-5Z"/><path d="m3 12 9 5 9-5"/>')+'<div class="sn">'+COMBOS.length+'</div><div class="sl">combos manipulados</div></div>'+
    '<div class="scard rise" style="animation-delay:240ms">'+svg('<path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/>')+'<div class="sn">'+nRef+'</div><div class="sl">com refs. PubMed</div></div>'+
    '</div>';
  // evidence ruler — signature element
  h+='<div class="ruler rise" style="animation-delay:270ms">'+
    '<div class="rl-h"><div class="rl-t">A régua da credibilidade</div><div class="rl-s">cada desfecho recebe um nível</div></div>'+
    '<div class="grades">'+
      '<div class="grade A"><div class="g">A</div><div class="gl">meta-análise / revisão sistemática</div></div>'+
      '<div class="grade B"><div class="g">B</div><div class="gl">RCTs pequenos ou heterogêneos</div></div>'+
      '<div class="grade C"><div class="g">C</div><div class="gl">observacional / mecanístico</div></div>'+
      '<div class="grade D"><div class="g">D</div><div class="gl">tradicional / marketing</div></div>'+
    '</div>'+
    '<div class="rl-f">A mesma planta pode ser <b>nível A</b> para um desfecho e <b>D</b> para outro. O que é tradicional ou sem base entra marcado como tal — nunca disfarçado de ciência.</div>'+
    '</div>';
  // systems quick access (first 6 categories) with SVG icons
  h+='<div class="sect-h" style="padding:0 22px;margin:28px 0 14px"><div class="t">Navegar por sistema</div><div class="a" onclick="goTab(\'fn\')">ver tudo</div></div>';
  h+='<div class="sysgrid">';
  [0,1,2,4,5,8].forEach(function(idx,i){var c=CATS[idx];if(!c)return;
    h+='<div class="syscard rise" style="animation-delay:'+(300+i*35)+'ms" onclick="catSearch('+idx+')">'+
      '<div class="sg" style="background:'+c.c+'"></div>'+
      '<div class="si" style="background:'+c.c+'22;color:'+c.c+'">'+svg(c.ic)+'</div>'+
      '<div class="st">'+c.n+'</div></div>';
  });
  h+='</div>';
  // combos em destaque
  h+='<div class="sect"><div class="sect-h"><div class="t">Combos em destaque</div><div class="a" onclick="goTab(\'combos\')">ver todos</div></div></div><div class="sect">';
  ["c-sono","c-sop","c-foco"].forEach(function(id,i){h+=comboCardHTML(getC(id),i);});
  h+='</div>';
  // ativos em destaque (com evidência forte e referência)
  h+='<div class="sect"><div class="sect-h"><div class="t">Ativos com evidência robusta</div><div class="a" onclick="goTab(\'az\')">ver A–Z</div></div></div><div class="sect">';
  ["berb","cre","curc","ome"].forEach(function(id,i){h+=cardHTML(get(id),null,i);});
  h+='</div>';
  document.getElementById('s-home').innerHTML=h;
  var core=document.querySelector('.wheel-core'),rot=document.getElementById('wheelRot');
  if(core&&rot){core.style.cursor='pointer';core.onclick=function(){rot.classList.toggle('paused');};}
}
function renderAZ(){
  var sorted=DATA.slice().sort(function(a,b){return a.nome.localeCompare(b.nome,'pt');});
  var h='<div class="hero"><div class="brand">A–Z</div><div class="tagline">Todos os ativos, em ordem alfabética.</div></div>';
  var cur='';
  sorted.forEach(function(s){
    var L=s.nome[0].toUpperCase();
    if(L!==cur){if(cur!=='')h+='</div>';cur=L;h+='<div class="az-letter">'+L+'</div><div class="sect">';}
    h+=cardHTML(s,null,0);
  });
  h+='</div>';
  document.getElementById('s-az').innerHTML=h;
}
function renderFn(){
  var h='<div class="hero"><div class="brand">Funções</div><div class="tagline">Escolha o sistema ou desfecho que você quer tratar.</div></div><div class="grid">';
  CATS.forEach(function(c,i){
    h+='<div class="cat rise" style="animation-delay:'+(i*50)+'ms" onclick="catSearch('+i+')">'+
      '<div class="glow" style="background:'+c.c+'"></div>'+
      '<div class="cico" style="background:'+c.c+'22;color:'+c.c+'">'+svg(c.ic)+'</div>'+
      '<div class="cn">'+c.n+'</div><div class="cd">'+c.d+'</div></div>';
  });
  h+='</div>';
  document.getElementById('s-fn').innerHTML=h;
}
function renderCombos(){
  var h='<div class="hero"><div class="brand">Combos</div><div class="tagline">Fórmulas manipuladas que reúnem vários ativos por objetivo.</div></div><div class="sect">';
  COMBOS.forEach(function(co,i){h+=comboCardHTML(co,i);});
  h+='</div>';
  document.getElementById('s-combos').innerHTML=h;
}
function renderSearch(){
  document.getElementById('s-search').innerHTML='<div class="searchwrap"><div class="searchbox">'+
    svg('<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>')+
    '<input id="q" placeholder="Ativo ou sintoma…" autocomplete="off" autocapitalize="off"></div></div><div id="sres"></div>';
  var q=document.getElementById('q');q.addEventListener('input',function(){doSearch(q.value);});
  setTimeout(function(){q.focus();},250);
}
function doSearch(query){
  var t=(query||'').toLowerCase().trim(),res=[];
  if(t.length>=2){DATA.forEach(function(s){
    if(s.nome.toLowerCase().indexOf(t)>=0||(s.sci||'').toLowerCase().indexOf(t)>=0){res.push([s,null]);return;}
    var mt=null;s.tags.forEach(function(tg){if(tg.toLowerCase().indexOf(t)>=0&&!mt)mt=tg;});if(mt)res.push([s,mt]);});}
  var box=document.getElementById('sres');
  if(t.length<2){box.innerHTML='';return;}
  if(!res.length){box.innerHTML='<div class="empty">Nada encontrado para “'+esc(query)+'”.</div>';return;}
  var h='<div class="count">'+res.length+' resultado(s)</div><div class="sect">';
  res.forEach(function(r,i){h+=cardHTML(r[0],r[1],i);});box.innerHTML=h+'</div>';
}
function runSearch(q){goTab('search');setTimeout(function(){var el=document.getElementById('q');if(el)el.value=q;doSearch(q);},120);}
function catSearch(i){
  var c=CATS[i];goTab('search');
  setTimeout(function(){
    var el=document.getElementById('q');if(el)el.value=c.n;var res=[];
    DATA.forEach(function(s){var mt=null;s.tags.forEach(function(tg){c.terms.forEach(function(tm){if(tg.toLowerCase().indexOf(tm.toLowerCase())>=0&&!mt)mt=tg;});});if(mt)res.push([s,mt]);});
    var h='<div class="count">'+c.n+' · '+res.length+' resultado(s)</div><div class="sect">';
    res.forEach(function(r,k){h+=cardHTML(r[0],r[1],k);});
    document.getElementById('sres').innerHTML=h+'</div>';
  },120);
}
var prevTab='home';
function openDetail(id){
  var s=get(id),cl=clsOf(s);
  var h='<div class="dhero"><button class="back" onclick="goTab(prevTab)">'+svg('<path d="m15 18-6-6 6-6"/>')+'voltar</button>'+
    '<div class="dclass" style="background:'+cl.c+'22;color:'+cl.c+'">'+esc(s.classe.replace(' (alcaloide)',''))+'</div>'+
    '<div class="dname">'+esc(s.nome)+'</div>'+(s.sci?'<div class="dsci">'+esc(s.sci)+'</div>':'')+'</div>';
  var audit=s.refs?'Resumo e referências verificados no PubMed. Doses e níveis em auditoria final por evidência.':'Estrutura ilustrativa — conteúdo e referências em auditoria.';
  h+='<div class="dbody"><div class="note">'+svg('<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/>')+audit+'</div>';
  if(s.resumo){h+='<div class="field" style="margin-top:0"><div class="lbl">O que é</div><div class="fb">'+esc(s.resumo)+'</div></div>';}
  h+='<div class="lbl" style="margin-top:22px">Evidência por desfecho</div>';
  s.blocos.forEach(function(b){h+='<div class="bloco"><div class="blvl '+b.n+'">'+b.n+'</div><div><div class="bt">'+esc(b.d)+'</div><div class="bd">'+esc(b.t)+'</div></div></div>';});
  h+='<div class="field"><div class="lbl">Dose</div><div class="fb">'+esc(s.dose)+'</div></div>';
  h+='<div class="field"><div class="lbl">Segurança</div><div class="fb">'+esc(s.seg)+'</div></div>';
  h+='<div class="field"><div class="lbl">Regulatório</div><div class="fb">'+esc(s.reg)+'</div></div>';
  h+='<div class="rx"><div class="rh">'+svg('<path d="M4 4h7a3 3 0 0 1 0 6H4zM4 10l8 10M4 10v10"/>')+'Sugestão de manipulado</div><div class="rb">'+esc(s.mani)+'</div></div>';
  h+='<div class="acts"><button onclick="alert(\'No app final: abre as referências completas.\')">Referências</button><button class="gold" onclick="alert(\'No app final: gera a receita para copiar/enviar.\')">Prescrever</button></div>';
  if(s.refs){
    h+='<div class="field"><div class="lbl">Referências · fonte: PubMed</div>';
    s.refs.forEach(function(r){
      h+='<div style="background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:10px">'+
        '<div style="font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--gold);text-transform:uppercase;margin-bottom:5px">'+esc(r.ty)+'</div>'+
        '<div style="font-size:13.5px;color:var(--tx);line-height:1.5">'+esc(r.fd)+'</div>'+
        '<div style="font-size:12.5px;color:var(--tx2);margin-top:6px">'+esc(r.au)+' · <span style="font-style:italic">'+esc(r.jr)+'</span> · '+r.yr+'</div>'+
        '<a href="https://doi.org/'+esc(r.doi)+'" style="display:inline-block;font-size:12.5px;color:var(--bTx);margin-top:6px;text-decoration:none">doi.org/'+esc(r.doi)+' ↗</a>'+
        '</div>';
    });
    h+='</div>';
  } else {
    h+='<div class="field"><div class="lbl">Referências</div><div class="fb" style="color:var(--tx3)">Pendente de auditoria por evidência.</div></div>';
  }
  h+='<div class="dtags"><div class="h">tags de busca — não exibidas ao paciente</div>';
  s.tags.forEach(function(t){h+='<span class="tagb">'+esc(t)+'</span>';});
  h+='</div></div>';
  document.getElementById('s-detail').innerHTML=h;show('detail');window.scrollTo(0,0);
}
function openCombo(id){
  var co=getC(id);
  var h='<div class="dhero"><button class="back" onclick="goTab(prevTab)">'+svg('<path d="m15 18-6-6 6-6"/>')+'voltar</button>'+
    '<div class="dclass" style="background:'+co.c+'22;color:'+co.c+'">combo manipulado</div>'+
    '<div class="dname">'+esc(co.nome)+'</div><div class="dsci" style="font-style:normal">'+esc(co.fim)+'</div></div>';
  h+='<div class="dbody"><div class="note">'+svg('<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/>')+
    'O combo raramente foi testado como unidade — os níveis A–D abaixo são de cada componente para este objetivo. A combinação é racional, não um RCT da fórmula.</div>';
  h+='<div class="field" style="margin-top:0"><div class="lbl">Objetivo</div><div class="fb">'+esc(co.obj)+'</div></div>';
  h+='<div class="field"><div class="lbl">Composição</div>';
  co.comps.forEach(function(c){
    var click=c.ref?' style="cursor:pointer" onclick="openDetail(\''+c.ref+'\')"':'';
    h+='<div class="comp"'+click+'><span class="dot" style="background:'+co.c+'"></span>'+
      '<div class="ci"><div class="cnm">'+esc(c.nome)+' <span class="cdose">'+esc(c.dose)+'</span></div>'+
      '<div class="cwhy">'+esc(c.why)+'</div></div>'+
      '<span class="lvl '+c.n+'">'+c.n+'</span></div>';
  });
  h+='</div>';
  h+='<div class="rx"><div class="rh">'+svg('<path d="M4 4h7a3 3 0 0 1 0 6H4zM4 10l8 10M4 10v10"/>')+'Fórmula consolidada</div><div class="rb">'+esc(co.formula)+'</div></div>';
  h+='<div class="field"><div class="lbl">Montagem & segurança</div><div class="fb">'+esc(co.obs)+'</div></div>';
  h+='<div class="acts"><button onclick="alert(\'No app final: ajusta doses por peso/objetivo.\')">Ajustar</button><button class="gold" onclick="alert(\'No app final: gera a fórmula para a farmácia de manipulação.\')">Prescrever combo</button></div>';
  h+='</div>';
  document.getElementById('s-detail').innerHTML=h;show('detail');window.scrollTo(0,0);
}
function show(name){['home','az','fn','combos','search','detail'].forEach(function(n){document.getElementById('s-'+n).classList.toggle('on',n===name);});}
function goTab(name){
  prevTab=name;
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){t.classList.toggle('act',t.getAttribute('data-go')===name);});
  if(name==='home')renderHome();if(name==='az')renderAZ();if(name==='fn')renderFn();if(name==='combos')renderCombos();if(name==='search')renderSearch();
  show(name);window.scrollTo(0,0);
}
Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){t.onclick=function(){goTab(t.getAttribute('data-go'));};});
function routeHash(){
  var hs=(location.hash||'').replace(/^#/,'');
  if(!hs){goTab('home');return;}
  var eq=hs.indexOf('='),key=eq>=0?hs.slice(0,eq):hs,val=eq>=0?decodeURIComponent(hs.slice(eq+1)):'';
  if(key==='detail'&&get(val)){prevTab='az';openDetail(val);return;}
  if(key==='combo'&&getC(val)){prevTab='combos';openCombo(val);return;}
  if(key==='search'&&val){runSearch(val);return;}
  if(['home','az','fn','combos','search'].indexOf(key)>=0){goTab(key);return;}
  goTab('home');
}
window.addEventListener('hashchange',routeHash);
routeHash();
</script>
</body>
</html>
