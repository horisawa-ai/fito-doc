 {id:"funcho",nome:"Funcho",sci:"Foeniculum vulgare",classe:"Fitoterápico",tags:["gases","cólica","digestão","amamentação"],
  resumo:"Sementes de funcho (erva-doce), carminativas — ou seja, ajudam a soltar os gases e aliviam cólicas e inchaço. Tradicional também como chá para cólica de bebê e para estimular a produção de leite. Ação suave e perfil seguro.",
  blocos:[{d:"Gases / cólica / inchaço",n:"C",t:"Chá ou extrato; alívio de gases e cólicas digestivas."}],
  dose:"Chá das sementes ou extrato, após as refeições.",seg:"Bem tolerado. Cautela em câncer sensível a hormônios (efeito fitoestrogênico leve).",mani:"Funcho (extrato) 200 mg — 60 cápsulas.\nTomar 1 cápsula após as refeições.",reg:"Fitoterápico / alimento."},
 {id:"hortela2",nome:"Hortelã + cominho (dispepsia)",sci:"",classe:"Fitoterápico",tags:["dispepsia","má digestão","inchaço"],
  resumo:"Combinação de óleos de hortelã-pimenta e cominho, com boa evidência para a má digestão funcional (aquela dor/queimação no estômago sem causa estrutural). A hortelã relaxa o estômago e o cominho ajuda nos gases. Cápsula com revestimento que protege os óleos.",
  blocos:[{d:"Má digestão (dispepsia funcional)",n:"B",t:"Óleos combinados; melhora dor e peso no estômago."}],
  dose:"Cápsula com revestimento entérico, antes das refeições.",seg:"Pode causar azia/refluxo. Cautela em refluxo.",mani:"Óleo de hortelã-pimenta + óleo de cominho (entérica) — 60 cápsulas.\nTomar 1 cápsula antes das refeições.",reg:"Fitoterápico."},
 {id:"sene",nome:"Sene",sci:"Senna",classe:"Fitoterápico",tags:["constipação","laxante"],
  resumo:"Folhas/frutos do sene, laxante estimulante potente que faz o intestino se contrair. Eficaz para prisão de ventre, mas só para uso curto: o uso contínuo vicia o intestino (que para de funcionar sozinho) e causa perda de potássio. É o ativo de muitos 'chás laxantes'.",
  blocos:[{d:"Constipação (uso curto)",n:"A",t:"Laxante estimulante eficaz para alívio pontual da prisão de ventre."}],
  dose:"Conforme rótulo, à noite, por no máximo alguns dias.",seg:"NÃO usar de forma contínua — vicia o intestino e causa perda de potássio. Não usar em dor abdominal de causa desconhecida ou suspeita de obstrução.",mani:"Sene (extrato padronizado) — comprimido, à noite.\nUso pontual, não contínuo.",reg:"Fitoterápico / medicamento."},
 {id:"caralluma",nome:"Caralluma",sci:"Caralluma fimbriata",classe:"Fitoterápico",tags:["saciedade","controle de apetite","peso"],
  resumo:"Cacto indiano comestível, usado tradicionalmente para suportar a fome em longas caminhadas. Atua reduzindo o apetite. Tem alguns estudos com sinal modesto sobre circunferência abdominal e saciedade, mas o efeito sobre o peso é pequeno.",
  blocos:[{d:"Controle de apetite / saciedade",n:"C",t:"500 mg 2x/dia; sinal modesto sobre fome e medidas, evidência limitada."}],
  dose:"500 mg 2x/dia antes das refeições.",seg:"Desconforto no estômago/intestino leve. Dados de longo prazo limitados.",mani:"Caralluma fimbriata (extrato) 500 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia antes das refeições.",reg:"Fitoterápico."},
 {id:"glucomanano",nome:"Glucomanano",sci:"Amorphophallus konjac",classe:"Nutracêutico",tags:["saciedade","peso","colesterol","constipação"],
  resumo:"Fibra solúvel da raiz de konjac que absorve muita água e forma um gel no estômago, dando saciedade. Tem a evidência mais sólida entre as fibras 'emagrecedoras' (reconhecida por agências de saúde) e também ajuda no colesterol e no intestino.",
  blocos:[{d:"Saciedade / controle de peso",n:"B",t:"1 g antes das refeições com água; aumenta a saciedade, auxilia perda de peso modesta."},{d:"Colesterol / constipação",n:"B",t:"Fibra solúvel reduz o colesterol e melhora o trânsito."}],
  dose:"1 g, 3x/dia, 30 min antes das refeições, com bastante água.",seg:"PERIGO de engasgo/obstrução se tomado com pouca água — sempre com muito líquido. Distanciar de outros remédios.",mani:"Glucomanano 1 g — 90 cápsulas.\nTomar 1 g com 2 copos de água antes das refeições.",reg:"Fibra / suplemento."},
 {id:"cafverdeclor",nome:"Café verde",sci:"",classe:"Fitoterápico",tags:["peso","controle glicêmico","pressão"],
  resumo:"Grão de café não torrado, rico em ácido clorogênico (que se perde na torra). Promovido para emagrecimento e açúcar, com sinal modesto sobre peso e glicemia. Contém cafeína, então tem o efeito estimulante junto.",
  blocos:[{d:"Controle de peso",n:"C",t:"Padronizado em ácido clorogênico; efeito pequeno sobre o peso."},{d:"Açúcar / pressão",n:"C",t:"Sinal leve sobre glicemia e pressão."}],
  dose:"Padronizado em ácido clorogênico, 200-400 mg/dia.",seg:"Contém cafeína (insônia, taquicardia). Cautela em ansiedade, arritmia e hipertensão.",mani:"Café verde (ext. padr. ácido clorogênico) 200 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia pela manhã.",reg:"Fitoterápico."},
 {id:"laranjamoura",nome:"Laranja-amarga (sinefrina)",sci:"Citrus aurantium",classe:"Estimulante",tags:["termogênico","peso","energia"],
  resumo:"Casca da laranja-amarga, fonte de sinefrina, um estimulante 'primo' da efedrina usado em termogênicos para emagrecimento. Acelera o metabolismo, mas levanta preocupações cardiovasculares, sobretudo combinada à cafeína. Usar com cautela.",
  blocos:[{d:"Termogênico / peso",n:"C",t:"Acelera o metabolismo; efeito pequeno e com preocupação cardiovascular."}],
  dose:"Padronizado em sinefrina, conforme rótulo (cautela).",seg:"RISCO cardiovascular — aumenta pressão e frequência cardíaca, sobretudo com cafeína. Evitar em hipertensão, arritmia e cardiopatia.",mani:"Laranja-amarga (ext. padr. sinefrina) — conforme rótulo, com cautela.",reg:"Estimulante / fitoterápico (cautela)."},
 {id:"forskolina",nome:"Forskolina",sci:"Coleus forskohlii",classe:"Fitoterápico",tags:["peso","testosterona","pressão"],
  resumo:"Extrato da raiz do Coleus forskohlii, que ativa uma via celular (AMP cíclico) ligada à queima de gordura e à liberação de hormônios. Promovido para emagrecimento e testosterona, mas a evidência clínica é fraca e mista.",
  blocos:[{d:"Composição corporal",n:"C",t:"Padronizado a 10% forskolina; sinal sobre composição corporal em homens, fraco."}],
  dose:"250 mg 2x/dia de extrato a 10% de forskolina.",seg:"Pode baixar a pressão e aumentar o ácido do estômago. Cautela com remédios de pressão, anticoagulantes e em úlcera.",mani:"Forskolina (Coleus forskohlii 10%) 250 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico."},
 {id:"chacomb",tipo:"combo",nome:"Combo termogênico (manipulado)",sci:"",classe:"Estimulante",tags:["energia","metabolismo","foco"],
  resumo:"Fórmula manipulada para dar energia e acelerar levemente o metabolismo, juntando cafeína (estimulante), chá-verde (EGCG, queima de gordura) e L-teanina (para suavizar o nervosismo da cafeína). Adjuvante — não substitui dieta e exercício.",
  blocos:[{d:"Energia / metabolismo",n:"C",t:"Combinação estimulante; efeito modesto sobre o gasto calórico."}],
  dose:"Conforme a fórmula abaixo, pela manhã.",seg:"Contém cafeína — evitar à tarde/noite e em hipertensão, ansiedade e arritmia.",mani:"Cafeína 100 mg + Chá-verde (EGCG) 250 mg + L-teanina 100 mg — 30 cápsulas.\nTomar 1 cápsula pela manhã.",reg:"Estimulante / nutracêutico manipulado."},
 {id:"5htpcombo",tipo:"combo",nome:"Combo saciedade (manipulado)",sci:"",classe:"Nutracêutico",tags:["compulsão","saciedade","humor"],
  resumo:"Fórmula manipulada para ajudar no controle da compulsão alimentar e da fome emocional, combinando o 5-HTP (matéria-prima da serotonina, que regula apetite e humor) com cromo. Adjuvante comportamental — exige acompanhamento.",
  blocos:[{d:"Compulsão / fome emocional",n:"C",t:"5-HTP atua na serotonina ligada à saciedade; evidência preliminar."}],
  dose:"Conforme a fórmula abaixo.",seg:"O 5-HTP NÃO pode ser usado com antidepressivos que mexem na serotonina (tipo ISRS ou IMAO) — risco de excesso de serotonina. Uso com acompanhamento.",mani:"5-HTP 100 mg + Cromo 200 mcg — 30 cápsulas.\nTomar 1 cápsula no fim da tarde.",reg:"Nutracêutico manipulado."},
 {id:"colina2",tipo:"combo",nome:"CDP-colina + cafeína (foco)",sci:"",classe:"Nutracêutico",tags:["foco","cognição","energia"],
  resumo:"Combinação para foco que junta a citicolina (matéria-prima para a acetilcolina, neurotransmissor da memória e atenção) com cafeína. A citicolina dá o suporte ao cérebro e a cafeína o alerta imediato.",
  blocos:[{d:"Foco / atenção",n:"C",t:"Citicolina (suporte cognitivo) + cafeína (alerta); combinação racional."}],
  dose:"Conforme a fórmula abaixo, pela manhã.",seg:"Contém cafeína — cautela à tarde, em ansiedade e arritmia.",mani:"Citicolina 250 mg + Cafeína 100 mg — 30 cápsulas.\nTomar 1 cápsula pela manhã.",reg:"Nutracêutico manipulado."}
,
 {id:"wheyprot",nome:"Whey protein",sci:"",classe:"Aminoácido",tags:["massa magra","recuperação","saciedade"],
  resumo:"Proteína do soro do leite, de absorção rápida e rica em leucina (o gatilho do ganho muscular). É o suplemento de proteína mais estudado para hipertrofia, recuperação e saciedade. Útil sobretudo para fechar a meta diária de proteína de quem treina.",
  blocos:[{d:"Massa magra / recuperação",n:"A",t:"20-40 g pós-treino ou para bater a meta de proteína; favorece ganho muscular."},{d:"Saciedade / controle de peso",n:"B",t:"Aumenta a saciedade e ajuda a preservar músculo na dieta."}],
  dose:"20-40 g por porção, conforme a meta diária de proteína.",seg:"Alergia ao leite. A versão isolada tem menos lactose. Bem tolerado em geral.",mani:"Whey protein (concentrado ou isolado) — 30 g por dose.\nTomar pós-treino ou entre refeições.",reg:"Alimento / suplemento."},
 {id:"caseina",nome:"Caseína",sci:"",classe:"Aminoácido",tags:["massa magra","recuperação noturna","saciedade"],
  resumo:"A outra proteína do leite, de absorção lenta (forma um gel no estômago). Libera aminoácidos por horas, daí o uso à noite, para nutrir o músculo durante o sono. Complementa o whey (rápido) numa estratégia de proteína ao longo do dia.",
  blocos:[{d:"Recuperação noturna / massa magra",n:"B",t:"30-40 g antes de dormir; fornece aminoácidos lentamente durante a noite."}],
  dose:"30-40 g, geralmente à noite.",seg:"Alergia ao leite. Contém lactose.",mani:"Caseína micelar — 30-40 g por dose.\nTomar antes de dormir.",reg:"Alimento / suplemento."},
 {id:"proteinaveg",nome:"Proteína vegetal (ervilha+arroz)",sci:"",classe:"Aminoácido",tags:["massa magra","vegano","recuperação"],
  resumo:"Mistura de proteínas de ervilha e arroz que, juntas, fornecem todos os aminoácidos essenciais (uma completa a outra). Alternativa vegana ao whey, com eficácia parecida para ganho muscular quando a dose total de proteína é equivalente.",
  blocos:[{d:"Massa magra (vegano)",n:"B",t:"30-40 g; eficácia semelhante ao whey com dose de proteína equivalente."}],
  dose:"30-40 g por porção (ervilha + arroz combinados).",seg:"Bem tolerada. Boa opção para alérgicos ao leite.",mani:"Proteína vegetal (ervilha + arroz) — 30-40 g por dose.\nTomar pós-treino ou entre refeições.",reg:"Alimento / suplemento."},
 {id:"creatinacombo",tipo:"combo",nome:"Combo performance (manipulado)",sci:"",classe:"Nutracêutico",tags:["força","massa magra","performance"],
  resumo:"Fórmula pré ou pós-treino que junta os ergogênicos com melhor evidência: creatina (força e massa), beta-alanina (resistência em séries longas) e cafeína (energia e foco). Os três têm respaldo científico sólido e mecanismos diferentes.",
  blocos:[{d:"Força / performance",n:"A",t:"Combinação de creatina, beta-alanina e cafeína — todos validados."}],
  dose:"Conforme a fórmula abaixo.",seg:"Cafeína: evitar à noite e em arritmia/hipertensão. Beta-alanina causa formigamento (inofensivo).",mani:"Creatina 5 g + Beta-alanina 3 g + Cafeína 100 mg.\nCreatina diária; cafeína e beta-alanina pré-treino.",reg:"Nutracêutico manipulado."},
 {id:"glicerol",nome:"Glicerol",sci:"",classe:"Nutracêutico",tags:["hidratação","performance","endurance"],
  resumo:"Substância que 'segura' água no corpo (hiper-hidratação), usada por atletas de endurance em calor para retardar a desidratação. Aumenta o volume de líquido disponível para suar e regular a temperatura. Uso de nicho, esportivo.",
  blocos:[{d:"Hiper-hidratação / endurance no calor",n:"C",t:"Com bastante água antes do esforço; melhora a hidratação em provas longas no calor."}],
  dose:"1-1,5 g/kg com água, antes do esforço prolongado.",seg:"Pode causar inchaço, náusea e dor de cabeça. Já foi substância controlada no esporte — checar regras.",mani:"Glicerol — 1 g/kg com líquido, pré-prova.\nUso esportivo específico.",reg:"Nutracêutico / esportivo."},
 {id:"peptidecol",nome:"Peptídeos de colágeno + vitamina C",sci:"",classe:"Aminoácido",tags:["pele","tendões","articulações"],
  resumo:"Colágeno hidrolisado combinado à vitamina C, que é necessária para o corpo montar o próprio colágeno. A dupla é usada para pele (firmeza, hidratação) e também para tendões e ligamentos, tomada antes do exercício em protocolos de recuperação de lesão.",
  blocos:[{d:"Pele (firmeza/hidratação)",n:"B",t:"10 g/dia; melhora elasticidade e hidratação da pele."},{d:"Tendões / ligamentos",n:"C",t:"15 g + vitamina C antes do exercício; pode ajudar na recuperação do tecido."}],
  dose:"10-15 g/dia de peptídeos de colágeno + vitamina C.",seg:"Bem tolerado. Resultados na pele em 8-12 semanas.",mani:"Peptídeos de colágeno 10 g + Vitamina C 200 mg — dose diária.\nTomar 1x/dia.",reg:"Nutracêutico."},
 {id:"acidohialpele",nome:"Ácido hialurônico (pele oral)",sci:"",classe:"Nutracêutico",tags:["pele","hidratação","rugas"],
  resumo:"O ácido hialurônico é o que dá viço e hidratação à pele (segura água). Por via oral, parte é quebrada, mas alguns estudos mostram melhora na hidratação e em rugas finas. Frequentemente combinado ao colágeno em fórmulas de beleza.",
  blocos:[{d:"Hidratação da pele / rugas",n:"C",t:"120-240 mg/dia; sinal modesto em hidratação e rugas finas."}],
  dose:"120-240 mg/dia.",seg:"Bem tolerado.",mani:"Ácido hialurônico 120 mg — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Nutracêutico."},
 {id:"combobeleza",tipo:"combo",nome:"Combo beleza (manipulado)",sci:"",classe:"Nutracêutico",tags:["pele","cabelo","unhas"],
  resumo:"Fórmula manipulada de 'beleza de dentro pra fora' que junta os blocos de construção da pele, cabelo e unha: peptídeos de colágeno, ácido hialurônico, biotina, zinco e vitamina C. Resultados aparecem em semanas a meses, com uso contínuo.",
  blocos:[{d:"Pele / cabelo / unhas",n:"C",t:"Combinação de cofatores do colágeno e da queratina; efeito gradual."}],
  dose:"Conforme a fórmula abaixo.",seg:"A biotina pode atrapalhar exames de sangue (tireoide, troponina) — avisar o laboratório. Suspender dias antes de exames.",mani:"Peptídeos de colágeno 10 g + Ácido hialurônico 120 mg + Biotina 5 mg + Zinco 15 mg + Vitamina C 200 mg — dose diária.\nTomar 1x/dia.",reg:"Nutracêutico manipulado."},
 {id:"biotinahair",nome:"Biotina (cabelo/unhas)",sci:"Vitamina B7",classe:"Vitamina",tags:["cabelo","unhas"],
  resumo:"Vitamina do complexo B muito vendida para cabelo e unha. A verdade honesta: só ajuda quem tem deficiência real (rara). Em quem não é deficiente, não faz diferença. O alerta importante é que ela bagunça vários exames de sangue.",
  blocos:[{d:"Queda de cabelo sem deficiência",n:"D",t:"Sem benefício em quem não tem falta de biotina."},{d:"Unhas frágeis",n:"C",t:"Sinal modesto em fortalecer unhas."}],
  dose:"2,5-5 mg/dia (quando indicada).",seg:"ATRAPALHA EXAMES de sangue (tireoide, troponina do coração, hormônios) — suspender alguns dias antes de coletar e avisar o laboratório.",mani:"Biotina 5 mg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Vitamina / suplemento."},
 {id:"saw_palmetto_combo",tipo:"combo",nome:"Combo capilar (manipulado)",sci:"",classe:"Nutracêutico",tags:["queda de cabelo","alopecia"],
  resumo:"Fórmula manipulada para a queda de cabelo de padrão hormonal (calvície), juntando ativos que reduzem o hormônio que miniaturiza o fio (a di-hidrotestosterona) e nutrem o folículo. Alternativa mais branda à finasterida; resultados modestos e lentos.",
  blocos:[{d:"Queda de cabelo hormonal (calvície)",n:"C",t:"Saw palmetto reduz o hormônio da calvície; nutrientes dão suporte ao folículo."}],
  dose:"Conforme a fórmula abaixo.",seg:"Menos potente que a finasterida. O saw palmetto pode atrapalhar o exame de próstata (PSA).",mani:"Saw palmetto 320 mg + Zinco 15 mg + Biotina 5 mg + MSM 1 g — dose diária.\nTomar 1x/dia.",reg:"Nutracêutico manipulado."},
 {id:"melatoninacabelo",nome:"Aminoácidos para cabelo (cistina/metionina)",sci:"",classe:"Aminoácido",tags:["cabelo","unhas","queratina"],
  resumo:"A queratina (proteína do fio de cabelo e da unha) é rica em aminoácidos com enxofre — a cistina e a metionina. Fornecê-los é a base de muitas fórmulas capilares. Funciona mais como matéria-prima do que como remédio; efeito de suporte.",
  blocos:[{d:"Cabelo / unhas",n:"C",t:"Fornece os aminoácidos da queratina; efeito de suporte, evidência modesta."}],
  dose:"Conforme fórmula (L-cistina 500 mg + metionina).",seg:"Bem tolerados.",mani:"L-cistina 500 mg + L-metionina 250 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Aminoácido / suplemento."},
 {id:"zincoacne",tipo:"combo",nome:"Combo pele (acne/oleosidade)",sci:"",classe:"Nutracêutico",tags:["acne","oleosidade","pele"],
  resumo:"Fórmula manipulada de suporte para a pele com tendência à acne, juntando zinco (anti-inflamatório e regulador da oleosidade), niacinamida (melhora a barreira) e ômega-3. Adjuvante do tratamento dermatológico, não substituto.",
  blocos:[{d:"Acne / oleosidade (adjuvante)",n:"C",t:"Zinco tem o melhor sinal; combinação de suporte à pele."}],
  dose:"Conforme a fórmula abaixo.",seg:"Não substitui o tratamento dermatológico da acne. Zinco em jejum dá náusea.",mani:"Zinco 30 mg + Niacinamida 500 mg + Ômega-3 1 g — dose diária.\nTomar com refeição.",reg:"Nutracêutico manipulado."},
 {id:"pqq2",nome:"PQQ + CoQ10 (mitocondrial)",sci:"",classe:"Nutracêutico",tags:["energia","mitocondrial","fadiga"],
  resumo:"Combinação voltada para a energia das células (mitocôndrias): o PQQ estimularia a criação de novas mitocôndrias e a CoQ10 faz parte da produção de energia dentro delas. Usado em fadiga e protocolos de longevidade; evidência ainda preliminar.",
  blocos:[{d:"Energia / função mitocondrial",n:"C",t:"PQQ (novas mitocôndrias) + CoQ10 (produção de energia); sinal preliminar."}],
  dose:"PQQ 20 mg + CoQ10 100-200 mg/dia, com refeição.",seg:"Bem tolerado. CoQ10 pode reduzir o efeito do remédio que afina o sangue varfarina.",mani:"PQQ 20 mg + Coenzima Q10 100 mg — 30 cápsulas.\nTomar 1 cápsula/dia com refeição gordurosa.",reg:"Nutracêutico."},
 {id:"dribose",nome:"D-ribose",sci:"",classe:"Nutracêutico",tags:["energia","fadiga","fibromialgia","cardíaco"],
  resumo:"Açúcar simples que é matéria-prima para o ATP (a 'moeda de energia' das células). Estudado em fadiga, fibromialgia e insuficiência cardíaca, onde a produção de energia está comprometida. Em pessoas saudáveis, o benefício é incerto.",
  blocos:[{d:"Fadiga / fibromialgia",n:"C",t:"5 g 2-3x/dia; sinal em fadiga em fibromialgia e fadiga crônica."},{d:"Insuficiência cardíaca",n:"C",t:"Pode apoiar a energia do coração; evidência limitada."}],
  dose:"5 g, 2-3x/dia.",seg:"Pode baixar o açúcar do sangue. Cautela em diabéticos.",mani:"D-ribose 5 g — pó.\nTomar 5 g 2-3x/dia.",reg:"Nutracêutico."},
 {id:"acetilcisteinapulm",nome:"NAC (respiratório)",sci:"N-acetilcisteína",classe:"Nutracêutico",tags:["muco","bronquite","DPOC"],
  resumo:"A N-acetilcisteína, aqui no uso respiratório: ela afina o muco (mucolítico) e é antioxidante no pulmão. Usada em bronquite crônica e DPOC para reduzir a frequência de crises e facilitar a expectoração. É também precursora da glutationa.",
  blocos:[{d:"Bronquite crônica / DPOC",n:"B",t:"600 mg 1-2x/dia; afina o muco e reduz crises de bronquite crônica."}],
  dose:"600 mg 1-2x/dia.",seg:"Náusea. Cautela em asma (broncoespasmo em sensíveis).",mani:"N-acetilcisteína 600 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Nutracêutico / medicamento."},
 {id:"quercetinapulm",tipo:"combo",nome:"Combo respiratório/alergia (manipulado)",sci:"",classe:"Nutracêutico",tags:["rinite","alergia","sinusite"],
  resumo:"Fórmula manipulada para alergias respiratórias (rinite) que junta a quercetina (estabiliza as células que liberam histamina), a bromelina (reduz o inchaço e melhora a absorção da quercetina) e a vitamina C. Adjuvante natural anti-histamínico.",
  blocos:[{d:"Rinite alérgica (adjuvante)",n:"C",t:"Quercetina + bromelina + vitamina C; suporte anti-histamínico."}],
  dose:"Conforme a fórmula abaixo.",seg:"Cautela com remédios que afinam o sangue (bromelina). Alergia a abacaxi.",mani:"Quercetina 500 mg + Bromelina 250 mg + Vitamina C 500 mg — dose 2x/dia.\nTomar nas crises de rinite.",reg:"Nutracêutico manipulado."},
 {id:"nacetilglucosamina",nome:"N-acetilglucosamina",sci:"NAG",classe:"Nutracêutico",tags:["articulações","intestino","pele"],
  resumo:"Forma de glucosamina diferente da usada em articulações, estudada também para a mucosa do intestino (doença inflamatória intestinal) e para a pele (hidratação, manchas). Versátil, mas com evidência ainda limitada em cada uso.",
  blocos:[{d:"Mucosa intestinal (doença inflamatória)",n:"C",t:"Suporte à camada de muco do intestino; evidência preliminar."},{d:"Articulações / pele",n:"D",t:"Usos extrapolados; dados fracos."}],
  dose:"500-1000 mg/dia.",seg:"Bem tolerada. Cautela em alergia a frutos do mar.",mani:"N-acetilglucosamina 500 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Nutracêutico."},
 {id:"sambucusimun",tipo:"combo",nome:"Combo antigripal (manipulado)",sci:"",classe:"Fitoterápico",tags:["gripe","resfriado","imunidade"],
  resumo:"Fórmula manipulada para os primeiros sinais de gripe/resfriado, juntando sabugueiro (encurta sintomas gripais), zinco (encurta o resfriado) e vitamina C. Mais eficaz se começada logo no início dos sintomas.",
  blocos:[{d:"Gripe / resfriado (início dos sintomas)",n:"B",t:"Sabugueiro + zinco têm evidência de encurtar sintomas; começar cedo."}],
  dose:"Conforme a fórmula abaixo, ao primeiro sinal.",seg:"Usar só extrato preparado de sabugueiro (o fruto cru é tóxico). Zinco em jejum dá náusea.",mani:"Sabugueiro (extrato) + Zinco 15 mg + Vitamina C 500 mg — 2x/dia.\nIniciar ao primeiro sintoma, por poucos dias.",reg:"Fitoterápico / nutracêutico manipulado."},
 {id:"vitclipo",nome:"Vitamina C lipossomal",sci:"",classe:"Vitamina",tags:["imunidade","antioxidante","absorção"],
  resumo:"Vitamina C envolvida em micro-bolhas de gordura (lipossomas), que melhoram a absorção e permitem doses mais altas com menos desconforto intestinal que a vitamina C comum. Usada quando se quer dose alta (imunidade, antioxidante).",
  blocos:[{d:"Imunidade / antioxidante (dose alta)",n:"C",t:"Forma melhor absorvida; permite doses maiores sem soltar o intestino."}],
  dose:"500-1000 mg/dia (lipossomal).",seg:"Bem tolerada. Custo maior que a vitamina C comum.",mani:"Vitamina C lipossomal 500 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Vitamina / suplemento."},
 {id:"zinco_carnosina",nome:"Zinco-carnosina",sci:"",classe:"Nutracêutico",tags:["gastrite","úlcera","H. pylori"],
  resumo:"Composto que une zinco e o aminoácido carnosina, que gruda na mucosa do estômago e a protege/cicatriza. Tem boa evidência em gastrite e úlcera, inclusive como adjuvante no tratamento da bactéria H. pylori. Muito usado no Japão.",
  blocos:[{d:"Gastrite / úlcera",n:"B",t:"75 mg 2x/dia; protege e cicatriza a mucosa do estômago."},{d:"Adjuvante no H. pylori",n:"B",t:"Melhora a erradicação quando somado ao tratamento padrão."}],
  dose:"75 mg 2x/dia (37,5 mg de zinco-carnosina por dose).",seg:"Bem tolerado. Não substitui o tratamento médico da úlcera/H. pylori.",mani:"Zinco-carnosina 75 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia antes das refeições.",reg:"Nutracêutico."},
 {id:"mastic",nome:"Mástique (Chios)",sci:"Pistacia lentiscus",classe:"Fitoterápico",tags:["gastrite","úlcera","H. pylori","digestão"],
  resumo:"Resina da árvore de mástique da ilha grega de Chios, usada há séculos para problemas digestivos. Tem ação contra a bactéria H. pylori e protetora da mucosa do estômago. Evidência crescente para dispepsia e úlcera.",
  blocos:[{d:"Dispepsia / úlcera / H. pylori",n:"C",t:"350 mg-1 g/dia; alívio de dispepsia e ação contra H. pylori, evidência preliminar."}],
  dose:"350 mg a 1 g/dia.",seg:"Bem tolerado. Não substitui o tratamento do H. pylori.",mani:"Mástique de Chios 350 mg — 60 cápsulas.\nTomar 1 cápsula 1-3x/dia.",reg:"Fitoterápico."},
 {id:"berberisuva",tipo:"combo",nome:"Cardo-mariano + alcachofra (fígado)",sci:"",classe:"Fitoterápico",tags:["fígado","detox","digestão"],
  resumo:"Fórmula manipulada de suporte ao fígado juntando cardo-mariano (silimarina, que protege as células do fígado) e alcachofra (estimula a bile e ajuda na digestão de gorduras). Usada em fígado gorduroso e má digestão de gorduras.",
  blocos:[{d:"Suporte ao fígado / gordura no fígado",n:"C",t:"Silimarina protege o fígado; alcachofra melhora o fluxo de bile."}],
  dose:"Conforme a fórmula abaixo.",seg:"Cautela em pedra na vesícula (a alcachofra estimula a bile). Alergia a plantas da família da camomila.",mani:"Cardo-mariano (silimarina) 300 mg + Alcachofra 300 mg — 2x/dia.\nTomar às refeições.",reg:"Fitoterápico manipulado."},
 {id:"taurinacv",nome:"Taurina (cardiovascular)",sci:"",classe:"Aminoácido",tags:["pressão","insuficiência cardíaca","coração"],
  resumo:"A taurina, aqui no ângulo do coração: ela regula o cálcio nas células cardíacas e tem efeito sobre a pressão e a função do coração. Estudada em insuficiência cardíaca e pressão alta, com sinal positivo em doses mais altas.",
  blocos:[{d:"Insuficiência cardíaca (adjuvante)",n:"C",t:"1,5-3 g/dia; pode melhorar a capacidade de exercício na insuficiência cardíaca."},{d:"Pressão arterial",n:"C",t:"Doses altas reduzem modestamente a pressão."}],
  dose:"1,5-3 g/dia.",seg:"Bem tolerada. Adjuvante, não substitui o tratamento cardíaco.",mani:"Taurina 1 g — tomar 1,5-3 g/dia.",reg:"Aminoácido / suplemento."},
 {id:"magtaurato",nome:"Magnésio taurato",sci:"",classe:"Mineral",tags:["coração","pressão","arritmia","ansiedade"],
  resumo:"Magnésio ligado à taurina, combinação pensada para o coração — tanto o magnésio quanto a taurina têm ação cardiovascular e calmante. Usado para pressão, palpitações/arritmias leves e ansiedade, com boa tolerância intestinal.",
  blocos:[{d:"Pressão / palpitações / ansiedade",n:"C",t:"Magnésio + taurina com afinidade cardiovascular; bem tolerado."}],
  dose:"Equivalente a 100-300 mg de magnésio por dia.",seg:"Bem tolerado. Cautela em problema nos rins.",mani:"Magnésio taurato (equiv. 100 mg de magnésio) — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Mineral / suplemento."},
 {id:"coq10estatina",tipo:"combo",nome:"Combo estatina (manipulado)",sci:"",classe:"Nutracêutico",tags:["dor muscular","estatina","coração"],
  resumo:"Fórmula de suporte para quem toma remédio de colesterol (estatina) e sente dor muscular. As estatinas reduzem a CoQ10 do corpo; repor a CoQ10 (com ômega-3 anti-inflamatório) pode aliviar a mialgia em parte das pessoas.",
  blocos:[{d:"Dor muscular por estatina",n:"B",t:"CoQ10 pode reduzir a dor muscular ligada à estatina em parte dos pacientes."}],
  dose:"Conforme a fórmula abaixo.",seg:"A CoQ10 pode reduzir o efeito do remédio que afina o sangue varfarina. Não suspender a estatina por conta própria.",mani:"Coenzima Q10 (ubiquinol) 200 mg + Ômega-3 1 g — dose diária.\nTomar com refeição gordurosa.",reg:"Nutracêutico manipulado."},
 {id:"l_carnitinacv",nome:"L-carnitina (cardiovascular)",sci:"",classe:"Aminoácido",tags:["coração","angina","insuficiência cardíaca","claudicação"],
  resumo:"A carnitina, no uso cardiovascular: ela transporta gordura para ser queimada como energia, importante para o músculo do coração. Estudada em angina, insuficiência cardíaca e na dor nas pernas ao caminhar (claudicação por má circulação).",
  blocos:[{d:"Angina / insuficiência cardíaca (adjuvante)",n:"C",t:"1-3 g/dia; pode melhorar a tolerância ao exercício no coração doente."},{d:"Claudicação (dor ao caminhar)",n:"C",t:"Pode aumentar a distância caminhada sem dor."}],
  dose:"1-3 g/dia, fracionado.",seg:"Náusea. Doses altas podem ter efeito sobre a flora intestinal (TMAO) — discutido. Cautela em cardiopatas, sob orientação.",mani:"L-carnitina 1 g — tomar 1-3 g/dia fracionado.",reg:"Aminoácido / nutracêutico."},
 {id:"vitc_lisina",tipo:"combo",nome:"Combo vascular (vitamina C + lisina)",sci:"",classe:"Nutracêutico",tags:["saúde vascular","colágeno","circulação"],
  resumo:"Combinação popularizada por teorias de saúde vascular, juntando vitamina C e lisina (ambas necessárias para construir o colágeno das paredes dos vasos). A ideia é fortalecer as artérias. A evidência clínica para os desfechos prometidos é fraca.",
  blocos:[{d:"Saúde vascular / colágeno",n:"D",t:"Base teórica (colágeno dos vasos); desfechos clínicos não comprovados."}],
  dose:"Conforme a fórmula abaixo.",seg:"Bem tolerado. Não substitui o tratamento cardiovascular.",mani:"Vitamina C 1 g + L-lisina 1 g — 2x/dia.",reg:"Nutracêutico manipulado."},
 {id:"ginkgocircu",tipo:"combo",nome:"Combo circulação/memória (manipulado)",sci:"",classe:"Fitoterápico",tags:["circulação cerebral","memória","cognição"],
  resumo:"Fórmula manipulada de suporte à circulação cerebral e à memória, juntando ginkgo (melhora o fluxo de sangue no cérebro) e ômega-3 (estrutura dos neurônios). Voltada a adultos com queixa de memória; benefício maior em quem já tem algum declínio.",
  blocos:[{d:"Memória / circulação cerebral",n:"B",t:"Ginkgo melhora circulação; ômega-3 dá suporte estrutural."}],
  dose:"Conforme a fórmula abaixo.",seg:"O ginkgo aumenta o risco de sangramento — suspender antes de cirurgia e cautela com remédios que afinam o sangue.",mani:"Ginkgo (EGb 761) 120 mg 2x/dia + Ômega-3 1 g 2x/dia.",reg:"Fitoterápico manipulado."},
 {id:"acetilcarncog",tipo:"combo",nome:"Combo cognitivo (manipulado)",sci:"",classe:"Nutracêutico",tags:["memória","foco","cognição"],
  resumo:"Fórmula manipulada de suporte cognitivo combinando a acetil-L-carnitina (energia e acetilcolina para o neurônio) e a citicolina (matéria-prima da acetilcolina). Voltada a foco e memória; evidência de suporte, mais robusta em idosos.",
  blocos:[{d:"Memória / foco",n:"C",t:"Acetil-L-carnitina + citicolina; suporte colinérgico, melhor em idosos."}],
  dose:"Conforme a fórmula abaixo.",seg:"Bem tolerado. Acetil-L-carnitina pode causar agitação se tomada tarde.",mani:"Acetil-L-carnitina 500 mg + Citicolina 250 mg — 2x/dia.\nTomar pela manhã e à tarde.",reg:"Nutracêutico manipulado."},
 {id:"pinealxan",tipo:"combo",nome:"Combo foco (manipulado)",sci:"",classe:"Nutracêutico",tags:["foco","produtividade","energia mental"],
  resumo:"Fórmula manipulada para foco e produtividade no trabalho/estudo, combinando cafeína e L-teanina (a dupla nootrópica mais validada), alfa-GPC (colina para a atenção) e rhodiola (antifadiga). Energia mental limpa e sustentada.",
  blocos:[{d:"Foco / produtividade",n:"B",t:"Cafeína+teanina (validado) + colina + adaptógeno; energia mental sustentada."}],
  dose:"Conforme a fórmula abaixo, pela manhã.",seg:"Contém cafeína — evitar à tarde, em ansiedade e arritmia.",mani:"Cafeína 100 mg + L-teanina 200 mg + Alfa-GPC 300 mg + Rhodiola 200 mg — 30 cápsulas.\nTomar 1 cápsula pela manhã.",reg:"Nutracêutico manipulado."},
 {id:"ostrogenfem",nome:"Mio-inositol + ácido fólico (SOP/fertilidade)",sci:"",classe:"Nutracêutico",tags:["SOP","fertilidade","ovulação"],
  resumo:"Combinação clássica para a síndrome dos ovários policísticos e fertilidade feminina: o mio-inositol melhora a sensibilidade à insulina, os ciclos e a ovulação, e o ácido fólico é essencial no preparo para a gravidez. Bem tolerada.",
  blocos:[{d:"Síndrome dos ovários policísticos / fertilidade",n:"B",t:"Mio-inositol 2 g 2x/dia + folato; melhora ciclos e ovulação, prepara para a gestação."}],
  dose:"Mio-inositol 2 g 2x/dia + ácido fólico 400 mcg/dia.",seg:"Bem tolerado. Seguro na preparação para a gravidez sob orientação.",mani:"Mio-inositol 2 g + Ácido fólico 200 mcg — sachê.\nTomar 1 sachê 2x/dia.",reg:"Nutracêutico."},
 {id:"comboresistinsulin",tipo:"combo",nome:"Combo SOP completo (manipulado)",sci:"",classe:"Nutracêutico",tags:["SOP","resistência à insulina","ovulação"],
  resumo:"Fórmula manipulada mais completa para a síndrome dos ovários policísticos, juntando mio-inositol (núcleo do protocolo), N-acetilcisteína (ajuda na ovulação) e vitamina D (frequentemente baixa nessas pacientes). Adjuvante das medidas e da medicação.",
  blocos:[{d:"Síndrome dos ovários policísticos",n:"B",t:"Inositol + NAC têm sinal em resistência à insulina e ovulação."}],
  dose:"Conforme a fórmula abaixo.",seg:"Bem tolerado. Discutir com o ginecologista se há uso de metformina ou anticoncepcional.",mani:"Mio-inositol 2 g 2x/dia + N-acetilcisteína 600 mg 2x/dia + Vitamina D3 2000 UI/dia.",reg:"Nutracêutico manipulado."},
 {id:"vitexfem",tipo:"combo",nome:"Combo TPM (manipulado)",sci:"",classe:"Fitoterápico",tags:["TPM","ciclo menstrual","mastalgia"],
  resumo:"Fórmula manipulada para a tensão pré-menstrual (TPM), combinando o vitex/agnocasto (que regula a prolactina e é o fitoterápico de referência para TPM), o magnésio e a vitamina B6 (ambos com evidência em sintomas de TPM).",
  blocos:[{d:"Tensão pré-menstrual (TPM)",n:"B",t:"Vitex + magnésio + vitamina B6, todos com evidência em sintomas de TPM."}],
  dose:"Conforme a fórmula abaixo.",seg:"O vitex não deve ser usado com anticoncepcional ou remédios que mexem na dopamina. Evitar na gravidez.",mani:"Vitex (agnocasto) 20 mg + Magnésio 200 mg + Vitamina B6 (P5P) 25 mg — dose diária.\nTomar pela manhã.",reg:"Fitoterápico manipulado."},
 {id:"maca_fem",tipo:"combo",nome:"Combo libido feminino (manipulado)",sci:"",classe:"Fitoterápico",tags:["libido","menopausa","disposição"],
  resumo:"Fórmula manipulada de suporte à libido e disposição feminina, juntando maca peruana (energia e libido), açafrão (humor) e magnésio. Pensada para queda de libido associada a estresse ou perimenopausa, após excluir causas tratáveis.",
  blocos:[{d:"Libido / disposição feminina",n:"C",t:"Maca tem sinal em libido; combinação de suporte ao humor e energia."}],
  dose:"Conforme a fórmula abaixo.",seg:"Investigar causas hormonais e de humor antes. Bem tolerado.",mani:"Maca peruana 1,5 g + Açafrão 28 mg + Magnésio 200 mg — dose diária.\nTomar pela manhã.",reg:"Fitoterápico manipulado."},
 {id:"tongkat_combo",tipo:"combo",nome:"Combo vitalidade masculina (manipulado)",sci:"",classe:"Fitoterápico",tags:["testosterona","libido","energia","masculino"],
  resumo:"Fórmula manipulada de suporte à testosterona e vitalidade masculina, combinando tongkat ali (libera testosterona livre), ashwagandha (reduz o estresse que derruba a testosterona) e zinco (cofator hormonal). Investigar causas tratáveis antes.",
  blocos:[{d:"Testosterona / libido / energia (homens)",n:"C",t:"Tongkat e ashwagandha têm sinal em testosterona; zinco corrige deficiência."}],
  dose:"Conforme a fórmula abaixo.",seg:"Investigar testosterona, sono e apneia antes. Cautela em câncer sensível a hormônios. Não usar zinco em megadose por muito tempo.",mani:"Tongkat ali 200 mg + Ashwagandha KSM-66 300 mg + Zinco 15 mg — dose diária.\nTomar pela manhã.",reg:"Fitoterápico manipulado."},
 {id:"fadrozole",tipo:"combo",nome:"Combo próstata (manipulado)",sci:"",classe:"Fitoterápico",tags:["HPB","próstata","sintomas urinários"],
  resumo:"Fórmula manipulada para o aumento benigno da próstata e os sintomas urinários que ele causa, juntando os três fitoterápicos mais estudados: saw palmetto, pygeum e urtiga (raiz). Não substitui a avaliação do urologista nem o alfabloqueador quando indicado.",
  blocos:[{d:"Próstata aumentada / sintomas urinários",n:"B",t:"Saw palmetto + pygeum + urtiga; melhora os sintomas urinários, sobretudo combinados."}],
  dose:"Conforme a fórmula abaixo.",seg:"Não substitui a avaliação urológica. Pode atrapalhar o exame de próstata (PSA).",mani:"Saw palmetto 320 mg + Pygeum 100 mg + Urtiga (raiz) 300 mg — dose diária.\nTomar 1x/dia.",reg:"Fitoterápico manipulado."},
 {id:"omega3olho",tipo:"combo",nome:"Combo ocular AREDS2 (manipulado)",sci:"",classe:"Nutracêutico",tags:["visão","DMRI","saúde ocular"],
  resumo:"Fórmula manipulada inspirada no estudo AREDS2 para a saúde da mácula (a parte central da visão), juntando luteína, zeaxantina, zinco, vitaminas C e E. Reduz a progressão da degeneração macular intermediária. Acompanhamento oftalmológico é essencial.",
  blocos:[{d:"Degeneração macular (DMRI intermediária)",n:"B",t:"Fórmula AREDS2 reduz a progressão para formas avançadas."}],
  dose:"Conforme a fórmula AREDS2 abaixo.",seg:"Maior benefício na degeneração intermediária. Não substitui o oftalmologista. Zinco em dose alta — cautela com cobre.",mani:"Luteína 10 mg + Zeaxantina 2 mg + Zinco 25 mg + Vitamina C 500 mg + Vitamina E 200 UI — dose diária.\nTomar 1x/dia.",reg:"Nutracêutico manipulado."},
 {id:"astax_olho",tipo:"combo",nome:"Combo fadiga visual (manipulado)",sci:"",classe:"Nutracêutico",tags:["fadiga visual","tela","olhos"],
  resumo:"Fórmula manipulada para o cansaço visual de quem passa o dia em telas, combinando astaxantina (antioxidante com tropismo ocular), luteína/zeaxantina (pigmento da mácula que filtra a luz azul) e mirtilo (microcirculação ocular).",
  blocos:[{d:"Fadiga visual / uso de telas",n:"C",t:"Antioxidantes oculares + pigmento macular; alívio do cansaço visual."}],
  dose:"Conforme a fórmula abaixo.",seg:"Bem tolerado. Não substitui pausas e ajuste da tela.",mani:"Astaxantina 4 mg + Luteína 10 mg + Zeaxantina 2 mg + Mirtilo 160 mg — dose diária.\nTomar 1x/dia.",reg:"Nutracêutico manipulado."},
 {id:"vitb_complex",nome:"Complexo B",sci:"",classe:"Vitamina",tags:["energia","estresse","metilação"],
  resumo:"Combinação de todas as vitaminas do complexo B, que trabalham juntas no metabolismo da energia, no sistema nervoso e na formação do sangue. Útil em deficiências (comuns em veganos, idosos, álcool, estresse). As formas ativas (metilfolato, P5P, metil-B12) são preferidas por alguns.",
  blocos:[{d:"Suporte de energia / sistema nervoso (deficiência)",n:"B",t:"Repõe o conjunto das vitaminas B; benefício maior quando há deficiência."}],
  dose:"1 dose/dia, preferir formas ativas.",seg:"A B6 em excesso crônico causa formigamento/neuropatia — respeitar o teto. Urina amarela (inofensiva).",mani:"Complexo B (com metilfolato, P5P e metilcobalamina) — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Vitamina / suplemento."},
 {id:"eletrol",nome:"Eletrólitos (reidratação)",sci:"",classe:"Mineral",tags:["hidratação","câimbra","performance","ressaca"],
  resumo:"Combinação de sódio, potássio, magnésio e cloreto — os sais que perdemos no suor. Repõem o que a água sozinha não repõe, prevenindo câimbra, tontura e queda de desempenho em treinos longos, calor, jejum ou após diarreia/vômito.",
  blocos:[{d:"Reidratação / câimbra / performance",n:"B",t:"Repõe os sais perdidos no suor; previne câimbra e melhora a hidratação."}],
  dose:"Conforme a perda (1 dose em água durante/após o esforço ou no calor).",seg:"Cautela com o sódio em hipertensão e o potássio em problema nos rins.",mani:"Eletrólitos (sódio, potássio, magnésio, cloreto) — sachê.\nDissolver em água durante o esforço ou no calor.",reg:"Suplemento / alimento."},
 {id:"creatinacog",nome:"Creatina (cognição)",sci:"",classe:"Nutracêutico",tags:["cognição","privação de sono","vegano","energia mental"],
  resumo:"A mesma creatina do músculo, aqui pelo ângulo do cérebro: ela também é reserva de energia para os neurônios. O benefício cognitivo aparece mais quando o cérebro está sob estresse — privação de sono, idosos e veganos (que têm menos creatina da dieta).",
  blocos:[{d:"Cognição sob estresse (sono, idosos, veganos)",n:"C",t:"5 g/dia; melhora memória e raciocínio sob privação de sono e em quem tem menos reserva."}],
  dose:"5 g/dia, contínuo.",seg:"Muito segura. Retenção de água inicial. Beber bastante água.",mani:"Creatina monoidratada 5 g — dose diária.\nTomar 5 g/dia, qualquer horário.",reg:"Suplemento."}
,
 {id:"guarana",nome:"Guaraná",sci:"Paullinia cupana",classe:"Estimulante",tags:["energia","foco","fadiga"],
  resumo:"Semente amazônica rica em cafeína de liberação mais lenta (ligada a taninos), o que dá energia mais prolongada e suave que o café. Tradicional brasileiro para disposição e foco. Também tem antioxidantes próprios.",
  blocos:[{d:"Energia / fadiga / foco",n:"B",t:"Padronizado em cafeína; energia e atenção, com liberação mais gradual."}],
  dose:"Extrato padronizado fornecendo 100-200 mg de cafeína/dia.",seg:"Contém cafeína — insônia, taquicardia. Cautela em ansiedade, arritmia e hipertensão.",mani:"Guaraná (extrato padronizado em cafeína) 250 mg — 60 cápsulas.\nTomar 1 cápsula pela manhã.",reg:"Fitoterápico / alimento."},
 {id:"catuaba",nome:"Catuaba",sci:"Trichilia catigua",classe:"Fitoterápico",tags:["libido","disposição","estímulo"],
  resumo:"Casca de árvore brasileira, tradicional como tônico sexual e de disposição. Os alcaloides teriam ação leve sobre a dopamina e a circulação. Uso popular consagrado, mas com pouca pesquisa clínica formal.",
  blocos:[{d:"Libido / disposição",n:"D",t:"Uso tradicional como afrodisíaco; evidência clínica escassa."}],
  dose:"Extrato conforme rótulo.",seg:"Bem tolerada em uso tradicional. Dados de segurança formais limitados.",mani:"Catuaba (extrato) 500 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico / alimento."},
 {id:"marapuama",nome:"Marapuama",sci:"Ptychopetalum olacoides",classe:"Fitoterápico",tags:["libido","disposição","fadiga"],
  resumo:"Raiz e caule de planta amazônica conhecida como 'madeira da potência', tradicional para libido, disposição e fadiga. Frequentemente combinada à catuaba. Evidência limitada a estudos pequenos e uso popular.",
  blocos:[{d:"Libido / fadiga",n:"D",t:"Tradicional; sinal em estudos pequenos, evidência fraca."}],
  dose:"Extrato conforme rótulo.",seg:"Bem tolerada em uso tradicional. Dados formais escassos.",mani:"Marapuama (extrato) 500 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico."},
 {id:"copaiba",nome:"Copaíba",sci:"Copaifera",classe:"Fitoterápico",tags:["anti-inflamatório","cicatrização","pele"],
  resumo:"Óleo-resina extraído do tronco da árvore de copaíba, da Amazônia, rico em beta-cariofileno (um anti-inflamatório que age em receptores canabinoides). Usado por dentro (anti-inflamatório, garganta) e por fora (cicatrização, pele, dor).",
  blocos:[{d:"Anti-inflamatório / cicatrização",n:"C",t:"Uso oral e tópico; sinal anti-inflamatório, evidência preliminar."}],
  dose:"Oral: gotas conforme rótulo. Tópico: aplicar na área.",seg:"Doses orais altas irritam o estômago. Cautela com remédios que afinam o sangue.",mani:"Copaíba (óleo) — gotas conforme rótulo (oral) ou uso tópico.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"barbatimao",nome:"Barbatimão",sci:"Stryphnodendron",classe:"Fitoterápico",tags:["cicatrização","feridas","tópico","anti-inflamatório"],
  resumo:"Casca de árvore do cerrado brasileiro, riquíssima em taninos adstringentes. Uso principalmente tópico (tem registro para cicatrização de feridas e lesões). Os taninos 'fecham' o tecido e têm ação antimicrobiana e anti-inflamatória local.",
  blocos:[{d:"Cicatrização de feridas (tópico)",n:"B",t:"Uso tópico padronizado; favorece a cicatrização de feridas e lesões."}],
  dose:"Tópico: pomada/extrato na lesão, conforme orientação.",seg:"Uso oral prolongado não recomendado (taninos). Uso principalmente tópico.",mani:"Barbatimão (extrato/pomada) — uso tópico na ferida.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"guaco",nome:"Guaco",sci:"Mikania glomerata",classe:"Fitoterápico",tags:["tosse","broncodilatador","expectorante"],
  resumo:"Folha de trepadeira brasileira, fitoterápico de referência para tosse. A cumarina tem ação broncodilatadora (abre as vias respiratórias) e expectorante. É a base de muitos xaropes nacionais para tosse e bronquite.",
  blocos:[{d:"Tosse / bronquite (broncodilatador)",n:"B",t:"Xarope padronizado; alivia tosse e ajuda a abrir as vias respiratórias."}],
  dose:"Xarope padronizado, conforme rótulo.",seg:"A cumarina pode interagir com remédios que afinam o sangue em doses altas. Evitar na gravidez.",mani:"Guaco (xarope padronizado) — conforme rótulo.\nTomar nas crises de tosse.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"sucupira",nome:"Sucupira",sci:"Pterodon",classe:"Fitoterápico",tags:["anti-inflamatório","articular","dor"],
  resumo:"Sementes de árvore do cerrado, tradicionais para dores articulares e inflamação (artrite, ácido úrico). Os óleos e isoflavonas teriam ação anti-inflamatória. Uso popular amplo no Brasil, com pesquisa clínica ainda incipiente.",
  blocos:[{d:"Dor articular / inflamação",n:"D",t:"Uso tradicional anti-inflamatório; evidência clínica limitada."}],
  dose:"Extrato/óleo das sementes conforme rótulo.",seg:"Cautela com remédios que afinam o sangue e antidiabéticos. Evitar na gravidez.",mani:"Sucupira (extrato) 500 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico."},
 {id:"jucabrasil",nome:"Jucá / pau-ferro",sci:"Libidibia ferrea",classe:"Fitoterápico",tags:["anti-inflamatório","cicatrização","tosse"],
  resumo:"Vagem de árvore brasileira, tradicional para inflamação, cicatrização e problemas respiratórios. Rica em taninos e flavonoides com ação adstringente e anti-inflamatória. Uso popular consagrado, evidência formal limitada.",
  blocos:[{d:"Anti-inflamatório / cicatrização",n:"D",t:"Uso tradicional; evidência clínica escassa."}],
  dose:"Extrato conforme rótulo.",seg:"Uso prolongado de taninos não recomendado. Dados formais escassos.",mani:"Jucá (extrato) 500 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico."},
 {id:"camomilabras",nome:"Carqueja",sci:"Baccharis trimera",classe:"Fitoterápico",tags:["digestivo","fígado","controle glicêmico"],
  resumo:"Planta amarga brasileira, tradicional para fígado e digestão (colerética, estimula a bile) e para o açúcar do sangue. Os flavonoides têm ação antioxidante e digestiva. Muito usada em chás no Brasil.",
  blocos:[{d:"Digestivo / fígado",n:"D",t:"Uso tradicional como amargo digestivo e hepático; evidência limitada."},{d:"Controle do açúcar",n:"D",t:"Sinal pré-clínico; sem confirmação clínica robusta."}],
  dose:"Chá ou extrato conforme rótulo.",seg:"Evitar na gravidez (pode estimular o útero). Cautela com antidiabéticos e remédios de pressão.",mani:"Carqueja (extrato) 300 mg — 60 cápsulas.\nTomar 1 cápsula após as refeições.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"chapeucouro",nome:"Chapéu-de-couro",sci:"Echinodorus",classe:"Fitoterápico",tags:["diurético","articular","anti-inflamatório"],
  resumo:"Folha de planta aquática brasileira, tradicional como diurético e anti-inflamatório para problemas articulares e renais. Uso popular amplo (depurativo do sangue), com pesquisa clínica ainda muito limitada.",
  blocos:[{d:"Diurético / articular",n:"D",t:"Uso tradicional depurativo e diurético; evidência clínica escassa."}],
  dose:"Chá ou extrato conforme rótulo.",seg:"Cautela com diuréticos e em problema nos rins. Dados formais escassos.",mani:"Chapéu-de-couro (extrato) 300 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico."},
 {id:"quebrapedra",nome:"Quebra-pedra",sci:"Phyllanthus niruri",classe:"Fitoterápico",tags:["cálculo renal","fígado","diurético"],
  resumo:"Erva brasileira cujo nome já diz o uso tradicional: cálculos renais ('pedra'). Relaxa a via urinária e pode reduzir a formação de cristais. Também estudada para o fígado (hepatite B) e como diurético. Evidência promissora, mas ainda preliminar.",
  blocos:[{d:"Cálculo renal (prevenção/eliminação)",n:"C",t:"Pode relaxar o ureter e reduzir cristais; ajuda na eliminação de cálculos pequenos."},{d:"Suporte hepático",n:"D",t:"Estudado em hepatite viral; evidência inconsistente."}],
  dose:"Chá ou extrato padronizado conforme rótulo.",seg:"Pode baixar a pressão e o açúcar. Cautela com remédios de pressão, antidiabéticos e em problema nos rins.",mani:"Quebra-pedra (extrato) 400 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"unhadegato2",nome:"Cat's claw (articular)",sci:"Uncaria tomentosa",classe:"Fitoterápico",tags:["artrite reumatoide","osteoartrite","inflamação"],
  resumo:"A unha-de-gato amazônica no uso articular específico: os alcaloides têm ação anti-inflamatória e imunomoduladora estudada em artrite reumatoide e osteoartrite, com sinal de redução da dor. Padronização por alcaloides oxindólicos.",
  blocos:[{d:"Artrite reumatoide / osteoartrite",n:"C",t:"Extrato padronizado; reduz dor articular em estudos pequenos."}],
  dose:"250-350 mg/dia de extrato padronizado.",seg:"Cautela com remédios que baixam a imunidade, de pressão e que afinam o sangue. Evitar na gravidez.",mani:"Unha-de-gato (extrato padronizado) 300 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"resverafig",nome:"Cardo-mariano fitossoma",sci:"Silybum marianum",classe:"Fitoterápico",tags:["fígado","gordura no fígado","absorção"],
  resumo:"Silimarina (do cardo-mariano) ligada a gordura (fitossoma, ex.: Siliphos) para melhorar a absorção, que é baixa na forma comum. Protege as células do fígado e tem ação antioxidante. Voltada para fígado gorduroso e suporte hepático.",
  blocos:[{d:"Suporte ao fígado / gordura no fígado",n:"C",t:"Forma melhor absorvida; reduz enzimas do fígado em estudos pequenos."}],
  dose:"Forma fitossoma, conforme rótulo (melhor absorvida).",seg:"Bem tolerado. Cautela em alergia a plantas da família da camomila.",mani:"Cardo-mariano fitossoma (Siliphos) 300 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico."},
 {id:"colina_inositol",nome:"Fosfatidilcolina",sci:"",classe:"Nutracêutico",tags:["fígado","cognição","membranas"],
  resumo:"O principal fosfolipídio das membranas das células (e da bile e das lipoproteínas). Fornece colina e ajuda o fígado a transportar gordura. Usada em fígado gorduroso e como suporte às membranas neuronais. É o componente ativo da lecitina.",
  blocos:[{d:"Suporte ao fígado",n:"C",t:"Ajuda o fígado a mobilizar gordura; sinal em fígado gorduroso."},{d:"Cognição / membranas",n:"D",t:"Fonte de colina; benefício cognitivo incerto."}],
  dose:"1-3 g/dia (fosfatidilcolina, de lecitina).",seg:"Bem tolerada. Doses muito altas: desconforto no estômago/intestino.",mani:"Fosfatidilcolina 1 g — 60 cápsulas.\nTomar 1 cápsula 1-3x/dia.",reg:"Nutracêutico."},
 {id:"tudca",nome:"TUDCA",sci:"Ácido tauroursodesoxicólico",classe:"Nutracêutico",tags:["fígado","bile","colestase"],
  resumo:"Sal biliar 'do bem' que protege as células do fígado e melhora o fluxo de bile. Versão da substância usada como medicamento (UDCA) para doenças do fígado e da vesícula. Popular em protocolos de proteção hepática (inclusive no fisiculturismo).",
  blocos:[{d:"Proteção do fígado / fluxo de bile",n:"C",t:"250-500 mg/dia; protege o fígado e melhora marcadores em colestase."}],
  dose:"250-500 mg/dia.",seg:"Geralmente bem tolerado. Em doença hepática, usar com acompanhamento médico.",mani:"TUDCA 250 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Nutracêutico / medicamento conforme apresentação."},
 {id:"dandelionroot",tipo:"combo",nome:"Combo detox/fígado (manipulado)",sci:"",classe:"Fitoterápico",tags:["fígado","digestão","bile"],
  resumo:"Fórmula manipulada de suporte ao fígado e à digestão de gorduras, juntando cardo-mariano (protege o fígado), alcachofra (estimula a bile) e dente-de-leão (diurético e digestivo). 'Detox' aqui significa apoiar as funções naturais do fígado, não dietas milagrosas.",
  blocos:[{d:"Suporte ao fígado / digestão",n:"C",t:"Combinação de protetores e estimulantes de bile; suporte digestivo."}],
  dose:"Conforme a fórmula abaixo.",seg:"Cautela em pedra na vesícula (alcachofra e dente-de-leão estimulam a bile).",mani:"Cardo-mariano 300 mg + Alcachofra 300 mg + Dente-de-leão 200 mg — 2x/dia.\nTomar às refeições.",reg:"Fitoterápico manipulado."},
 {id:"ginsengamerican",nome:"Ginseng americano",sci:"Panax quinquefolius",classe:"Adaptógeno",tags:["imunidade","controle glicêmico","energia","resfriado"],
  resumo:"Primo norte-americano do ginseng coreano, considerado mais 'calmante' (menos estimulante). Tem boa evidência para prevenir resfriados (extrato CVT-E002/COLD-fX) e sinal sobre o açúcar do sangue. Padronização por ginsenosídeos.",
  blocos:[{d:"Prevenção de resfriado/gripe",n:"B",t:"Extrato padronizado (ex.: COLD-fX) 200 mg 2x/dia; reduz a frequência de resfriados."},{d:"Controle do açúcar",n:"C",t:"Sinal sobre a glicemia pós-refeição."}],
  dose:"Extrato padronizado, 200-400 mg/dia.",seg:"Cautela com remédios que afinam o sangue e antidiabéticos.",mani:"Ginseng americano (ext. padr.) 200 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico."},
 {id:"holybasil",nome:"Manjericão-santo (tulsi)",sci:"Ocimum sanctum",classe:"Adaptógeno",tags:["estresse","controle glicêmico","imunidade"],
  resumo:"Erva sagrada da Índia (tulsi), adaptógena, usada para estresse, açúcar do sangue e imunidade. Os compostos têm ação sobre o cortisol e a glicemia. Evidência crescente para ansiedade leve e controle metabólico.",
  blocos:[{d:"Estresse / ansiedade",n:"B",t:"Extrato padronizado; reduz estresse e ansiedade percebidos."},{d:"Controle do açúcar",n:"C",t:"Pode reduzir a glicemia de jejum."}],
  dose:"300-600 mg/dia de extrato padronizado.",seg:"Pode baixar o açúcar (cautela com antidiabéticos) e ter efeito anticoagulante leve. Cautela na gravidez.",mani:"Tulsi (ext. padr.) 300 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico."},
 {id:"amla",nome:"Amla (groselha indiana)",sci:"Phyllanthus emblica",classe:"Fitoterápico",tags:["antioxidante","colesterol","vitamina C","cabelo"],
  resumo:"Fruta da medicina ayurvédica, uma das fontes mais ricas em vitamina C natural e taninos antioxidantes. Estudada para colesterol, açúcar e como antioxidante. Também tradicional para cabelo. Padronização por taninos.",
  blocos:[{d:"Colesterol / antioxidante",n:"C",t:"500 mg 2x/dia; sinal de melhora no colesterol e antioxidante."},{d:"Controle do açúcar",n:"C",t:"Pode reduzir a glicemia."}],
  dose:"500 mg 1-2x/dia de extrato padronizado.",seg:"Cautela com remédios que afinam o sangue e antidiabéticos.",mani:"Amla (ext. padr.) 500 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico."},
 {id:"triphala",nome:"Triphala",sci:"",classe:"Fitoterápico",tags:["constipação","digestão","detox"],
  resumo:"Fórmula ayurvédica clássica de três frutas (amla, haritaki, bibhitaki), usada há milênios para o intestino e a digestão. Laxante suave e tônico digestivo, mais brando que laxantes estimulantes — regula sem viciar o intestino.",
  blocos:[{d:"Constipação / regularidade intestinal",n:"B",t:"500 mg-1 g à noite; melhora o trânsito intestinal de forma suave."},{d:"Digestão / antioxidante",n:"C",t:"Tônico digestivo tradicional."}],
  dose:"500 mg a 1 g à noite.",seg:"Pode soltar o intestino em doses altas. Evitar na gravidez.",mani:"Triphala 500 mg — 60 cápsulas.\nTomar 1-2 cápsulas à noite.",reg:"Fitoterápico."},
 {id:"guggul",nome:"Guggul",sci:"Commiphora mukul",classe:"Fitoterápico",tags:["colesterol","tireoide","acne","articular"],
  resumo:"Resina de árvore indiana, tradicional para colesterol e metabolismo. Os guggulsteronas atuam sobre o metabolismo de gordura e a tireoide. A evidência para colesterol é mista (estudos indianos positivos, ocidentais nem tanto).",
  blocos:[{d:"Colesterol",n:"C",t:"Padronizado em guggulsteronas; efeito sobre colesterol inconsistente entre estudos."}],
  dose:"Extrato padronizado fornecendo 25-75 mg/dia de guggulsteronas.",seg:"Desconforto no estômago/intestino, alergia. Interage com hormônio de tireoide e remédios que afinam o sangue. Evitar na gravidez.",mani:"Guggul (ext. padr. guggulsteronas) 500 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico."},
 {id:"arjuna",nome:"Arjuna",sci:"Terminalia arjuna",classe:"Fitoterápico",tags:["coração","insuficiência cardíaca","angina","pressão"],
  resumo:"Casca de árvore indiana, tônico cardíaco da medicina ayurvédica. Tem ação sobre a força de contração do coração e antioxidante. Estudada em angina e insuficiência cardíaca leve, com sinal positivo. Padronização por arjunolídeos.",
  blocos:[{d:"Angina / insuficiência cardíaca (adjuvante)",n:"C",t:"500 mg 2-3x/dia; sinal de melhora em angina e função cardíaca."}],
  dose:"500 mg 2-3x/dia de extrato padronizado.",seg:"Pode potencializar remédios de pressão e de coração. Adjuvante, não substitui o tratamento. Acompanhamento médico.",mani:"Arjuna (ext. padr.) 500 mg — 90 cápsulas.\nTomar 1 cápsula 2-3x/dia.",reg:"Fitoterápico."},
 {id:"gotukola",nome:"Gotu kola (cognição)",sci:"Centella asiatica",classe:"Fitoterápico",tags:["cognição","ansiedade","circulação"],
  resumo:"A centella asiática no uso cognitivo e de humor: os triterpenos têm ação sobre a circulação cerebral, a ansiedade e a memória. Tradicional na Índia como 'erva da longevidade e da mente'. Diferente do uso para pele/veias.",
  blocos:[{d:"Cognição / ansiedade",n:"C",t:"Extrato padronizado; sinal modesto em memória e ansiedade."}],
  dose:"Extrato titulado em triterpenos, conforme rótulo.",seg:"Lesão no fígado rara em uso prolongado. Sonolência em doses altas. Cautela na gravidez.",mani:"Gotu kola (ext. titulado) 300 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"brahmi2",tipo:"combo",nome:"Combo memória ayurvédico (manipulado)",sci:"",classe:"Fitoterápico",tags:["memória","cognição","estudo"],
  resumo:"Fórmula manipulada de suporte à memória inspirada na medicina ayurvédica, juntando bacopa (memória, com a melhor evidência do grupo) e gotu kola (cognição e circulação). Efeito gradual, com uso contínuo de semanas.",
  blocos:[{d:"Memória / cognição",n:"B",t:"Bacopa tem boa evidência em memória; gotu kola complementa."}],
  dose:"Conforme a fórmula abaixo.",seg:"Bacopa pode causar desconforto no estômago/intestino. Efeito aparece após semanas.",mani:"Bacopa 300 mg + Gotu kola 300 mg — 2x/dia.\nTomar às refeições.",reg:"Fitoterápico manipulado."},
 {id:"saffronmood2",tipo:"combo",nome:"Combo humor (manipulado)",sci:"",classe:"Fitoterápico",tags:["humor","depressão leve","ansiedade"],
  resumo:"Fórmula manipulada de suporte ao humor para casos leves, combinando açafrão (boa evidência em humor) e ômega-3 rico em EPA (adjuvante de antidepressivos). Pensada como suporte natural — não substitui tratamento de depressão moderada/grave.",
  blocos:[{d:"Humor leve / bem-estar",n:"B",t:"Açafrão + ômega-3 EPA, ambos com evidência adjuvante em humor."}],
  dose:"Conforme a fórmula abaixo.",seg:"Não substitui tratamento psiquiátrico. Cautela com remédios que afinam o sangue (ômega-3) e na gravidez (açafrão).",mani:"Açafrão (affron) 28 mg + Ômega-3 EPA alto 1 g — dose diária.\nTomar 1x/dia.",reg:"Fitoterápico / nutracêutico manipulado."},
 {id:"ashwasleep",tipo:"combo",nome:"Combo estresse/sono (manipulado)",sci:"",classe:"Adaptógeno",tags:["estresse","ansiedade","sono","cortisol"],
  resumo:"Fórmula manipulada para quem tem estresse de dia e dificuldade de relaxar à noite, juntando ashwagandha (baixa o cortisol e a ansiedade) e L-teanina (relaxa sem sedar), com magnésio. Voltada para o estresse crônico moderno.",
  blocos:[{d:"Estresse crônico / relaxamento",n:"B",t:"Ashwagandha reduz cortisol; L-teanina e magnésio relaxam."}],
  dose:"Conforme a fórmula abaixo.",seg:"Ashwagandha: evitar na gravidez e cautela com tireoide. Não combinar com sedativos sem orientação.",mani:"Ashwagandha KSM-66 300 mg + L-teanina 200 mg + Magnésio 200 mg — dose diária.\nTomar à tarde/noite.",reg:"Adaptógeno / nutracêutico manipulado."},
 {id:"selemeio",nome:"Selênio + iodo (tireoide)",sci:"",classe:"Mineral",tags:["tireoide","Hashimoto","metabolismo"],
  resumo:"Combinação de suporte à tireoide: o iodo é matéria-prima dos hormônios da tireoide e o selênio protege a glândula e ajuda a converter o hormônio na forma ativa. Atenção: o excesso de qualquer um pode piorar a tireoide — exige equilíbrio e dosagem.",
  blocos:[{d:"Suporte à tireoide",n:"C",t:"Cofatores da função tireoidiana; benefício maior quando há deficiência."}],
  dose:"Selênio 100 mcg + iodo conforme avaliação (cautela).",seg:"Tanto a falta quanto o excesso de iodo/selênio prejudicam a tireoide. Dosar e individualizar. Cautela em tireoidite.",mani:"Selênio 100 mcg + Iodo 150 mcg — 60 cápsulas.\nTomar 1 cápsula/dia (conforme avaliação).",reg:"Mineral / suplemento."},
 {id:"cobre",nome:"Cobre",sci:"",classe:"Mineral",tags:["anemia","imunidade","tecido conjuntivo"],
  resumo:"Oligoelemento essencial, cofator de enzimas do ferro (formação do sangue), do tecido conjuntivo e antioxidantes. A deficiência (rara, mas possível com excesso de zinco) causa anemia e problemas neurológicos. Equilíbrio cobre-zinco é importante.",
  blocos:[{d:"Deficiência de cobre",n:"B",t:"Reposição corrige anemia e neuropatia por deficiência (ex.: por excesso de zinco)."}],
  dose:"0,9-2 mg/dia (quando indicado).",seg:"Excesso é tóxico. Não suplementar sem necessidade. Importante em quem usa muito zinco.",mani:"Cobre (quelato) 2 mg — 60 cápsulas.\nTomar conforme orientação.",reg:"Mineral / suplemento."},
 {id:"manganes",nome:"Manganês",sci:"",classe:"Mineral",tags:["ossos","antioxidante","metabolismo"],
  resumo:"Oligoelemento cofator de enzimas dos ossos, do metabolismo e de uma enzima antioxidante importante (a SOD mitocondrial). Deficiência é rara; o excesso (sobretudo inalado) é neurotóxico. Suplementar só quando necessário.",
  blocos:[{d:"Cofator ósseo/antioxidante (deficiência)",n:"C",t:"Reposição em deficiência rara; cofator de enzimas ósseas e antioxidantes."}],
  dose:"1,8-2,3 mg/dia (RDA).",seg:"Excesso é neurotóxico (sobretudo inalado). Cautela em doença hepática. Não megadosar.",mani:"Manganês (quelato) 2 mg — 60 cápsulas.\nTomar conforme orientação.",reg:"Mineral / suplemento."},
 {id:"silicioorg",nome:"Silício orgânico (ácido ortossilícico)",sci:"",classe:"Mineral",tags:["ossos","cabelo","pele","colágeno"],
  resumo:"Forma mais bem absorvida e biodisponível do silício (estabilizada com colina), cofator da síntese de colágeno do osso, da pele, do cabelo e das unhas. Mais eficaz que a sílica comum de bambu/cavalinha. Suporte de tegumento e ossos.",
  blocos:[{d:"Cabelo / unhas / pele / ossos",n:"C",t:"Forma bem absorvida; cofator do colágeno, sinal em cabelo/unhas/densidade óssea."}],
  dose:"Fornecendo ~10 mg/dia de silício (ácido ortossilícico estabilizado).",seg:"Bem tolerado.",mani:"Silício orgânico (ácido ortossilícico) — gotas/cápsula conforme rótulo.\nTomar 1x/dia.",reg:"Mineral / nutracêutico."},
 {id:"cavalinha",nome:"Cavalinha",sci:"Equisetum arvense",classe:"Fitoterápico",tags:["diurético","cabelo","unhas","sílica"],
  resumo:"Planta rica em sílica, tradicional como diurético e para fortalecer cabelo, unha e tecido conjuntivo (a sílica é cofator do colágeno). Também usada para retenção de líquido. Uso prolongado exige cautela (perde tiamina).",
  blocos:[{d:"Diurético leve",n:"C",t:"Efeito diurético tradicional; evidência modesta."},{d:"Cabelo / unhas (sílica)",n:"D",t:"Fonte de sílica; benefício extrapolado."}],
  dose:"Chá ou extrato conforme rótulo.",seg:"Uso prolongado pode reduzir tiamina (B1). Cautela com diuréticos e em problema nos rins/coração.",mani:"Cavalinha (extrato) 300 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"vitb1bariatr",tipo:"combo",nome:"Combo pós-bariátrica (manipulado)",sci:"",classe:"Vitamina",tags:["bariátrica","deficiências","absorção"],
  resumo:"Fórmula de reposição para quem fez cirurgia bariátrica, que reduz a absorção de vários nutrientes. Junta os que mais faltam: vitamina B12, ferro, vitamina D, cálcio e complexo B (com B1, crítica). A reposição é obrigatória e vitalícia nesses pacientes.",
  blocos:[{d:"Prevenção de deficiências pós-bariátrica",n:"A",t:"Reposição dos nutrientes que a cirurgia compromete; obrigatória e vitalícia."}],
  dose:"Conforme protocolo da bariátrica e exames de sangue.",seg:"Reposição é essencial após bariátrica. A B1 (tiamina) é crítica em caso de vômitos. Seguir o protocolo da equipe.",mani:"B12 1000 mcg + Ferro 30 mg + Vitamina D3 2000 UI + Cálcio 500 mg + Complexo B — conforme protocolo.",reg:"Vitamina / suplemento manipulado."},
 {id:"vitd_gravidez",tipo:"combo",nome:"Combo pré-natal (manipulado)",sci:"",classe:"Vitamina",tags:["gestação","gravidez","pré-natal"],
  resumo:"Fórmula de suporte à gestação com os nutrientes essenciais: ácido fólico/metilfolato (previne má-formação do tubo neural), ferro, DHA (cérebro do bebê), iodo (neurodesenvolvimento) e vitamina D. Complementa a dieta no pré-natal, sob orientação obstétrica.",
  blocos:[{d:"Suporte nutricional na gestação",n:"A",t:"Folato previne má-formação; ferro, DHA, iodo e vitamina D dão suporte ao bebê."}],
  dose:"Conforme orientação obstétrica.",seg:"NÃO incluir vitamina A em megadose (causa má-formação). Seguir o pré-natal. Doses individualizadas.",mani:"Metilfolato 400 mcg + Ferro 27 mg + DHA 200 mg + Iodo 150 mcg + Vitamina D3 2000 UI — dose diária.\nTomar conforme o obstetra.",reg:"Vitamina / suplemento manipulado."},
 {id:"colostro2",tipo:"combo",nome:"Combo imunidade infantil (manipulado)",sci:"",classe:"Nutracêutico",tags:["imunidade","crianças","resfriados recorrentes"],
  resumo:"Fórmula de suporte imune pensada para crianças com resfriados de repetição, juntando vitamina D (a deficiência é o principal fator imune corrigível), zinco e probiótico. Sempre sob orientação pediátrica e nas doses certas para a idade.",
  blocos:[{d:"Suporte imune (crianças)",n:"C",t:"Corrigir vitamina D e zinco; probiótico pode reduzir infecções."}],
  dose:"Doses pediátricas conforme idade e peso, sob orientação.",seg:"Doses devem ser ajustadas para crianças pelo pediatra. Não usar doses de adulto.",mani:"Vitamina D3 (dose pediátrica) + Zinco (dose pediátrica) + Probiótico infantil — conforme o pediatra.",reg:"Nutracêutico manipulado (uso pediátrico)."},
 {id:"omega369",nome:"Ômega 3-6-9",sci:"",classe:"Ácido graxo",tags:["geral","pele"],
  resumo:"Mistura de ômega-3 (peixe/linhaça), ômega-6 e ômega-9 (azeite). Soa completo, mas é meio sem sentido na prática: já consumimos ômega-6 e 9 de sobra na dieta — o que falta é o ômega-3. Geralmente é melhor (e mais barato) tomar só ômega-3 de qualidade.",
  blocos:[{d:"Saúde geral",n:"D",t:"Ômega-6 e 9 já abundam na dieta; o ômega-3 isolado costuma ser melhor escolha."}],
  dose:"Conforme rótulo (mas prefira ômega-3 isolado).",seg:"Diluir o ômega-3 com 6 e 9 reduz a dose útil. Cautela com remédios que afinam o sangue.",mani:"Geralmente preferível usar ômega-3 isolado de alta concentração.",reg:"Suplemento."},
 {id:"oleolinhaca",nome:"Óleo de linhaça",sci:"Linum usitatissimum",classe:"Ácido graxo",tags:["ômega-3 vegetal","intestino","colesterol"],
  resumo:"Fonte vegetal de ômega-3 (na forma ALA), além de fibras e lignanas. Importante saber: o corpo converte muito pouco do ALA da linhaça no ômega-3 ativo (EPA/DHA) — por isso, para o efeito cardiovascular/cerebral, o óleo de peixe ou de algas é superior.",
  blocos:[{d:"Ômega-3 vegetal / intestino",n:"C",t:"Fonte de ALA; conversão para a forma ativa é baixa — para coração/cérebro, prefira peixe/algas."},{d:"Colesterol / saciedade",n:"C",t:"Fibras e lignanas com efeito modesto."}],
  dose:"1-2 colheres/dia (refrigerado, não aquecer).",seg:"Oxida fácil (manter refrigerado). Cautela com remédios que afinam o sangue.",mani:"Óleo de linhaça — 1-2 colheres/dia (frio).\nManter na geladeira.",reg:"Alimento / suplemento."},
 {id:"oleopeixefig",nome:"Óleo de fígado de bacalhau",sci:"",classe:"Ácido graxo",tags:["ômega-3","vitamina A","vitamina D"],
  resumo:"Óleo tradicional que combina ômega-3 (EPA/DHA) com vitaminas A e D naturais. Vantagem histórica em regiões de pouco sol. Cuidado: como traz vitamina A, doses altas podem levar a excesso dela — não megadosar.",
  blocos:[{d:"Ômega-3 + vitaminas A e D",n:"B",t:"Fonte combinada; útil onde há pouca exposição solar."}],
  dose:"Conforme rótulo, atento à dose de vitamina A.",seg:"Doses altas acumulam vitamina A (tóxica em excesso, perigosa na gravidez). Cautela com remédios que afinam o sangue.",mani:"Óleo de fígado de bacalhau — conforme rótulo.\nNão exceder pela vitamina A.",reg:"Suplemento / alimento."},
 {id:"mctc8",nome:"TCM C8 (caprílico)",sci:"",classe:"Ácido graxo",tags:["cetose","energia","foco","jejum"],
  resumo:"Fração purificada do TCM (só o ácido caprílico, C8), a que mais rápido vira cetonas — a fonte de energia 'limpa' do cérebro em jejum e dietas cetogênicas. Popular para foco e energia no jejum intermitente. Mais potente e caro que o TCM comum.",
  blocos:[{d:"Energia / foco (cetose/jejum)",n:"C",t:"Gera cetonas rapidamente; usado para energia mental em jejum e dieta cetogênica."}],
  dose:"5-15 g/dia, aumentando aos poucos.",seg:"Cólica e diarreia se aumentar rápido. Cautela em doença hepática.",mani:"Óleo TCM C8 (caprílico) — 1 colher, aumentando gradual.\nTomar em jejum ou no café.",reg:"Alimento / suplemento."},
 {id:"oleoabacate",tipo:"combo",nome:"Combo anti-inflamatório natural (manipulado)",sci:"",classe:"Nutracêutico",tags:["inflamação","dor","articular"],
  resumo:"Fórmula manipulada de suporte anti-inflamatório geral, juntando curcumina (bem absorvida), ômega-3 (EPA) e boswellia — três anti-inflamatórios naturais que atacam vias diferentes. Adjuvante para dor crônica e inflamação de baixo grau.",
  blocos:[{d:"Inflamação / dor crônica (adjuvante)",n:"B",t:"Curcumina + ômega-3 + boswellia, com mecanismos complementares."}],
  dose:"Conforme a fórmula abaixo.",seg:"Cautela com remédios que afinam o sangue (curcumina e ômega-3 somados). Não usar com pedra na vesícula sintomática.",mani:"Curcumina fitossoma 500 mg + Ômega-3 EPA 1 g + Boswellia 100 mg — 2x/dia.",reg:"Nutracêutico manipulado."},
 {id:"betaglucana",nome:"Beta-glucana (de aveia/fungo)",sci:"",classe:"Nutracêutico",tags:["colesterol","imunidade","controle glicêmico"],
  resumo:"Fibra solúvel da aveia e da cevada (e de leveduras/fungos). A de aveia tem evidência reconhecida para baixar o colesterol e atenuar o açúcar; a de leveduras/fungos é mais voltada para a imunidade. Forma gel no intestino.",
  blocos:[{d:"Colesterol",n:"A",t:"3 g/dia da beta-glucana de aveia; reduz o colesterol LDL (reconhecido por agências)."},{d:"Açúcar / imunidade",n:"C",t:"Atenua picos de açúcar; a forma de fungo modula a imunidade."}],
  dose:"3 g/dia (aveia, para colesterol).",seg:"Gases e inchaço no começo. Distanciar de outros remédios.",mani:"Beta-glucana de aveia 3 g — dose diária.\nTomar com água, longe de outros remédios.",reg:"Fibra / nutracêutico."}
,
 {id:"saffvision",nome:"Açafrão (visão)",sci:"Crocus sativus",classe:"Fitoterápico",tags:["visão","DMRI","retina"],
  resumo:"O açafrão tem um uso menos conhecido: a saúde da retina. A crocina protege as células da visão do estresse oxidativo. Estudos italianos mostram melhora da função retiniana na degeneração macular inicial. Diferente do uso para humor.",
  blocos:[{d:"Degeneração macular (inicial)",n:"C",t:"20 mg/dia; sinal de melhora na função da retina em estudos pequenos."}],
  dose:"20 mg/dia de extrato padronizado.",seg:"Doses altas (acima de 1,5 g) são tóxicas. Evitar na gravidez.",mani:"Açafrão (ext. padr.) 20 mg — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Fitoterápico."},
 {id:"zeacombo",nome:"Mesozeaxantina",sci:"",classe:"Nutracêutico",tags:["visão","mácula","luz azul"],
  resumo:"O terceiro pigmento da mácula (além da luteína e zeaxantina), que o corpo forma a partir da luteína. Concentra-se no centro exato da visão e filtra a luz azul. Adicioná-la às fórmulas oculares pode aumentar a densidade do pigmento protetor.",
  blocos:[{d:"Saúde da mácula / pigmento macular",n:"C",t:"Com luteína e zeaxantina; aumenta a densidade do pigmento protetor da visão."}],
  dose:"~10 mg/dia, junto a luteína e zeaxantina.",seg:"Bem tolerada.",mani:"Mesozeaxantina 10 mg (+ luteína + zeaxantina) — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Nutracêutico."},
 {id:"bilberryeye",tipo:"combo",nome:"Combo olho seco (manipulado)",sci:"",classe:"Nutracêutico",tags:["olho seco","lubrificação ocular"],
  resumo:"Fórmula manipulada de suporte para o olho seco, juntando ômega-3 (melhora a qualidade do filme lacrimal e da glândula da pálpebra) e vitamina A. Adjuvante do colírio lubrificante, atuando na causa pela parte inflamatória.",
  blocos:[{d:"Olho seco (adjuvante)",n:"B",t:"Ômega-3 melhora o filme lacrimal e a inflamação da pálpebra no olho seco."}],
  dose:"Conforme a fórmula abaixo.",seg:"Cautela com remédios que afinam o sangue (ômega-3). Não exceder a vitamina A.",mani:"Ômega-3 (EPA/DHA) 1 g 2x/dia + Vitamina A (dose segura).\nTomar com refeição.",reg:"Nutracêutico manipulado."},
 {id:"melatoninapele",tipo:"combo",nome:"Combo antienvelhecimento da pele (manipulado)",sci:"",classe:"Nutracêutico",tags:["pele","antioxidante","fotoenvelhecimento"],
  resumo:"Fórmula manipulada de proteção da pele 'de dentro', juntando antioxidantes com tropismo cutâneo: astaxantina e licopeno (fotoproteção), vitamina C (colágeno) e polipodium (uma samambaia que protege do sol). Complementa — não substitui — o protetor solar.",
  blocos:[{d:"Fotoproteção / antienvelhecimento da pele",n:"C",t:"Antioxidantes cutâneos reduzem o dano do sol por dentro; o filtro solar continua sendo a base."}],
  dose:"Conforme a fórmula abaixo.",seg:"NÃO substitui o protetor solar. Bem tolerado.",mani:"Astaxantina 4 mg + Licopeno 10 mg + Vitamina C 500 mg + Polypodium 240 mg — dose diária.\nTomar 1x/dia.",reg:"Nutracêutico manipulado."},
 {id:"polypodium",nome:"Polypodium leucotomos",sci:"",classe:"Fitoterápico",tags:["fotoproteção","pele","melasma","vitiligo"],
  resumo:"Extrato de uma samambaia tropical (Fernblock) que protege a pele do dano solar por dentro — funciona como um 'reforço' antioxidante ao filtro solar. Usado em melasma (manchas), prevenção de queimadura e como adjuvante em algumas doenças de pele sensíveis ao sol.",
  blocos:[{d:"Fotoproteção / melasma (adjuvante)",n:"B",t:"240 mg 1-2x/dia; reduz o dano solar e melhora o melasma como adjuvante do filtro."}],
  dose:"240 mg, 1-2x/dia (mais nos dias de sol).",seg:"NÃO substitui o protetor solar. Bem tolerado.",mani:"Polypodium leucotomos (Fernblock) 240 mg — 60 cápsulas.\nTomar 1 cápsula nos dias de exposição solar.",reg:"Fitoterápico."},
 {id:"pabacomb",tipo:"combo",nome:"Combo cabelo feminino (manipulado)",sci:"",classe:"Nutracêutico",tags:["queda capilar feminina","cabelo","eflúvio"],
  resumo:"Fórmula manipulada para a queda de cabelo feminina (que muitas vezes é por falta de nutrientes), juntando ferro/ferritina (causa comum em mulheres), zinco, vitamina D, biotina e aminoácidos da queratina. Antes, investigar ferritina e tireoide.",
  blocos:[{d:"Queda de cabelo feminina (nutricional)",n:"C",t:"Corrigir ferro/ferritina e nutrientes é a base; suporte com aminoácidos."}],
  dose:"Conforme a fórmula e os exames.",seg:"Investigar ferritina e tireoide antes. A biotina atrapalha exames de sangue — suspender antes de coletar.",mani:"Ferro (se ferritina baixa) + Zinco 15 mg + Vitamina D + Biotina 5 mg + L-cistina — conforme exames.",reg:"Nutracêutico manipulado."},
 {id:"msmpele",nome:"MSM (pele/cabelo)",sci:"Metilsulfonilmetano",classe:"Nutracêutico",tags:["pele","cabelo","colágeno","enxofre"],
  resumo:"O MSM fornece enxofre, necessário para a queratina (cabelo, unha) e para as pontes do colágeno (pele). Além do uso articular, é popular em fórmulas de beleza. Evidência cutânea ainda modesta, mas o perfil é seguro.",
  blocos:[{d:"Pele / cabelo (enxofre/colágeno)",n:"C",t:"1-3 g/dia; fornece enxofre para queratina e colágeno, sinal modesto."}],
  dose:"1-3 g/dia.",seg:"Bem tolerado. Desconforto no estômago/intestino leve.",mani:"MSM 1 g — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Nutracêutico."},
 {id:"phosphsleep",nome:"Fosfatidilserina (estresse/sono)",sci:"",classe:"Nutracêutico",tags:["cortisol","estresse","sono","TDAH"],
  resumo:"Fosfolipídio das membranas dos neurônios que, em dose à noite, ajuda a baixar o cortisol (hormônio do estresse) elevado, melhorando o sono de quem tem 'mente acelerada'. Também estudada em atenção e no TDAH infantil.",
  blocos:[{d:"Cortisol alto / sono / estresse",n:"C",t:"100-300 mg à noite; atenua o cortisol noturno e a mente acelerada."},{d:"Atenção / TDAH",n:"C",t:"Sinal modesto em atenção, inclusive em crianças."}],
  dose:"100-300 mg/dia (à noite para o estresse).",seg:"Bem tolerada. A forma derivada de soja é a mais comum.",mani:"Fosfatidilserina 100 mg — 60 cápsulas.\nTomar 1-3 cápsulas à noite.",reg:"Nutracêutico."},
 {id:"inositolmood",nome:"Inositol (humor/ansiedade)",sci:"Mio-inositol",classe:"Nutracêutico",tags:["ansiedade","pânico","TOC","humor"],
  resumo:"O mio-inositol, aqui no uso psiquiátrico (em dose alta): participa da sinalização da serotonina no cérebro. Estudado em transtorno de pânico, ansiedade e transtorno obsessivo-compulsivo, com sinal positivo em doses bem maiores que as usadas na SOP.",
  blocos:[{d:"Pânico / ansiedade",n:"C",t:"12-18 g/dia; sinal em transtorno de pânico, doses altas."},{d:"Transtorno obsessivo-compulsivo (TOC)",n:"C",t:"Doses altas; evidência preliminar."}],
  dose:"12-18 g/dia (dose psiquiátrica, fracionada).",seg:"Desconforto no estômago/intestino em doses altas. Discutir com o psiquiatra; não substitui o tratamento.",mani:"Mio-inositol em pó — 6 g 2-3x/dia (dose alta).\nTomar diluído.",reg:"Nutracêutico."},
 {id:"nacmental",nome:"NAC (saúde mental)",sci:"N-acetilcisteína",classe:"Nutracêutico",tags:["TOC","tricotilomania","compulsão","bipolar"],
  resumo:"A N-acetilcisteína tem um uso psiquiátrico crescente: ela regula o glutamato (um neurotransmissor) e o estresse oxidativo no cérebro. Estudada em comportamentos compulsivos (arrancar cabelo, roer unha), transtorno obsessivo-compulsivo e como adjuvante no humor.",
  blocos:[{d:"Comportamentos compulsivos (arrancar cabelo, etc.)",n:"B",t:"1,2-2,4 g/dia; reduz comportamentos repetitivos como tricotilomania."},{d:"Transtorno obsessivo / bipolar (adjuvante)",n:"C",t:"Sinal como adjuvante; evidência em construção."}],
  dose:"1,2-2,4 g/dia, fracionado.",seg:"Náusea. Adjuvante — discutir com o psiquiatra.",mani:"N-acetilcisteína 600 mg — 60 cápsulas.\nTomar 1 cápsula 2-4x/dia.",reg:"Nutracêutico / medicamento."},
 {id:"zincohumor",tipo:"combo",nome:"Combo humor/cérebro (manipulado)",sci:"",classe:"Nutracêutico",tags:["depressão adjuvante","humor","cérebro"],
  resumo:"Fórmula manipulada de suporte ao humor como adjuvante (complemento) do tratamento, juntando ômega-3 rico em EPA, vitamina D (deficiência liga-se a depressão), magnésio e metilfolato (potencializa antidepressivos). Não substitui a medicação nem a terapia.",
  blocos:[{d:"Depressão (adjuvante nutricional)",n:"B",t:"EPA, vitamina D, magnésio e metilfolato têm evidência adjuvante em depressão."}],
  dose:"Conforme a fórmula abaixo.",seg:"NÃO substitui antidepressivo nem psicoterapia. Discutir com o médico.",mani:"Ômega-3 EPA 1 g + Vitamina D3 2000 UI + Magnésio 200 mg + Metilfolato 1 mg — dose diária.",reg:"Nutracêutico manipulado."},
 {id:"litiumorot",nome:"Orotato de lítio (microdose)",sci:"",classe:"Mineral",tags:["humor","neuroproteção"],
  resumo:"Lítio em dose mínima (microdose nutricional), muito abaixo da dose-remédio do transtorno bipolar. Há interesse pela neuroproteção e por sinais epidemiológicos (regiões com mais lítio na água têm menos suicídio), mas a evidência clínica em suplemento é fraca.",
  blocos:[{d:"Humor / neuroproteção (microdose)",n:"D",t:"Dose nutricional baixa; sinal epidemiológico/mecanístico, evidência clínica fraca."}],
