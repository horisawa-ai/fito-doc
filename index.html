  dose:"1-5 mg de lítio elementar/dia (microdose).",seg:"Muito abaixo da dose-remédio, mas em doença bipolar o lítio é assunto médico. Não confundir com o medicamento.",mani:"Orotato de lítio (5 mg de lítio elementar) — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Mineral / nutracêutico."},
 {id:"saffronadhd",nome:"Açafrão (atenção/TDAH)",sci:"Crocus sativus",classe:"Fitoterápico",tags:["TDAH","atenção","crianças"],
  resumo:"O açafrão também foi estudado no TDAH: em um ensaio, o extrato teve efeito comparável ao metilfenidato (Ritalina) em crianças, com boa tolerância. Promissor como alternativa ou adjuvante natural, mas ainda com poucos estudos.",
  blocos:[{d:"TDAH (atenção)",n:"C",t:"20-30 mg/dia; efeito comparável ao metilfenidato em um estudo pequeno."}],
  dose:"20-30 mg/dia de extrato padronizado.",seg:"Não substitui o tratamento do TDAH sem avaliação. Doses altas de açafrão são tóxicas.",mani:"Açafrão (ext. padr.) 30 mg — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Fitoterápico."},
 {id:"omegaadhd",tipo:"combo",nome:"Combo TDAH (manipulado)",sci:"",classe:"Nutracêutico",tags:["TDAH","atenção","foco"],
  resumo:"Fórmula manipulada de suporte para a atenção, juntando ômega-3 (rico em EPA, com a melhor evidência em TDAH), magnésio e zinco (deficiências comuns que pioram a atenção). Adjuvante — não substitui a avaliação e o tratamento do TDAH.",
  blocos:[{d:"TDAH / atenção (adjuvante)",n:"B",t:"Ômega-3 EPA tem evidência adjuvante; corrigir magnésio e zinco ajuda."}],
  dose:"Conforme a fórmula abaixo.",seg:"Adjuvante, não substitui o tratamento. Cautela com remédios que afinam o sangue.",mani:"Ômega-3 EPA 1 g + Magnésio 200 mg + Zinco 15 mg — dose diária.\nTomar com refeição.",reg:"Nutracêutico manipulado."},
 {id:"ginkgozumbido",nome:"Ginkgo (zumbido/tontura)",sci:"EGb 761",classe:"Fitoterápico",tags:["zumbido","tontura","labirintite"],
  resumo:"O ginkgo, aqui no uso para zumbido no ouvido e tontura: melhora a circulação no ouvido interno. A evidência para zumbido é conflitante, mas para tontura/vertigem (incluindo labirintite) o sinal é melhor. Padronização EGb 761.",
  blocos:[{d:"Tontura / vertigem (labirintite)",n:"B",t:"120-240 mg/dia; melhora a tontura de origem circulatória/vestibular."},{d:"Zumbido",n:"C",t:"Resultados conflitantes."}],
  dose:"120-240 mg/dia do extrato EGb 761.",seg:"Aumenta o risco de sangramento — suspender antes de cirurgia, cautela com remédios que afinam o sangue.",mani:"Ginkgo (EGb 761) 120 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"betahistina",tipo:"combo",nome:"Combo labirinto (manipulado)",sci:"",classe:"Nutracêutico",tags:["tontura","labirintite","equilíbrio"],
  resumo:"Fórmula de suporte para tonturas de origem no labirinto (ouvido interno), juntando ginkgo (circulação) e vitamina B6/B12 (função do nervo). Adjuvante — labirintite e vertigem precisam de diagnóstico médico (há várias causas).",
  blocos:[{d:"Tontura / labirinto (adjuvante)",n:"C",t:"Ginkgo melhora circulação; vitaminas B dão suporte ao nervo."}],
  dose:"Conforme a fórmula abaixo.",seg:"A tontura precisa de diagnóstico — há causas que exigem tratamento específico. Ginkgo aumenta sangramento.",mani:"Ginkgo 120 mg + Vitamina B6 25 mg + Vitamina B12 1000 mcg — dose diária.",reg:"Nutracêutico manipulado."},
 {id:"magenxaqueca",tipo:"combo",nome:"Combo enxaqueca (manipulado)",sci:"",classe:"Nutracêutico",tags:["enxaqueca","profilaxia","dor de cabeça"],
  resumo:"Fórmula manipulada para prevenir crises de enxaqueca (não para a dor aguda), juntando os três com melhor evidência: magnésio, riboflavina (vitamina B2) em dose alta e CoQ10. Os três atuam na energia das células do cérebro. Efeito aparece após ~3 meses.",
  blocos:[{d:"Prevenção de enxaqueca",n:"B",t:"Magnésio + riboflavina 400 mg + CoQ10, todos com evidência de reduzir a frequência das crises."}],
  dose:"Conforme a fórmula abaixo, uso contínuo.",seg:"É para prevenção, não para a crise. Efeito após cerca de 3 meses.",mani:"Magnésio 400 mg + Riboflavina 400 mg + Coenzima Q10 100 mg — dose diária.\nUso contínuo.",reg:"Nutracêutico manipulado."},
 {id:"feverfew",nome:"Tanaceto",sci:"Tanacetum parthenium",classe:"Fitoterápico",tags:["enxaqueca","profilaxia"],
  resumo:"Erva (feverfew) tradicional para prevenir enxaqueca. O partenolídeo reduz a inflamação e a constrição dos vasos ligadas à crise. Evidência mista, mas é uma das plantas mais estudadas para profilaxia de enxaqueca. Padronização por partenolídeo.",
  blocos:[{d:"Prevenção de enxaqueca",n:"C",t:"Padronizado em partenolídeo; pode reduzir a frequência das crises (evidência mista)."}],
  dose:"Extrato padronizado em partenolídeo, conforme rótulo.",seg:"Pode causar aftas. Suspensão brusca dá 'efeito rebote'. Cautela com remédios que afinam o sangue. Evitar na gravidez.",mani:"Tanaceto (ext. padr. partenolídeo) 100 mg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Fitoterápico."},
 {id:"butterbur",nome:"Petasites (butterbur)",sci:"Petasites hybridus",classe:"Fitoterápico",tags:["enxaqueca","rinite alérgica"],
  resumo:"Raiz europeia com boa evidência para prevenção de enxaqueca e para rinite alérgica. Importante: só usar extrato SEM alcaloides PA (que são tóxicos para o fígado) — produtos não purificados são perigosos.",
  blocos:[{d:"Prevenção de enxaqueca",n:"B",t:"75 mg 2x/dia (Petadolex, sem alcaloides tóxicos); reduz a frequência das crises."},{d:"Rinite alérgica",n:"B",t:"Alivia sintomas de rinite, comparável a anti-histamínico."}],
  dose:"50-75 mg 2x/dia, SÓ extrato sem alcaloides PA.",seg:"USAR APENAS produto purificado (sem alcaloides PA, que são tóxicos para o fígado). Evitar na gravidez.",mani:"Petasites (Petadolex, sem PA) 75 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico."},
 {id:"strontium",nome:"Estrôncio",sci:"",classe:"Mineral",tags:["osteoporose","densidade óssea"],
  resumo:"Mineral que se incorpora ao osso e estimula sua formação, usado em osteoporose. Atenção: a forma-remédio (ranelato) teve problemas cardiovasculares; a forma-suplemento (citrato) é menos estudada. Interfere na medição da densidade óssea no exame.",
  blocos:[{d:"Osteoporose / densidade óssea",n:"C",t:"Estimula a formação de osso; a forma-remédio teve alerta cardiovascular."}],
  dose:"Citrato de estrôncio 680 mg/dia (longe do cálcio).",seg:"Alerta cardiovascular com a forma ranelato. Tomar longe do cálcio. Distorce o exame de densidade óssea.",mani:"Estrôncio (citrato) 680 mg — 60 cápsulas.\nTomar à noite, longe do cálcio.",reg:"Mineral / nutracêutico."},
 {id:"boroósseo",tipo:"combo",nome:"Combo ósseo completo (manipulado)",sci:"",classe:"Mineral",tags:["osteoporose","densidade óssea","ossos"],
  resumo:"Fórmula manipulada mais completa para os ossos, somando ao trio básico (vitamina D, K2, magnésio) o cálcio (de preferência pela dieta), o boro e a vitamina C. A ideia é fornecer todos os cofatores da mineralização. Adjuvante do tratamento da osteoporose.",
  blocos:[{d:"Osteoporose / saúde óssea (adjuvante)",n:"B",t:"Conjunto de cofatores da formação óssea; complementa o tratamento."}],
  dose:"Conforme a fórmula abaixo.",seg:"A vitamina K2 ANULA O EFEITO do remédio que afina o sangue varfarina (Marevan). Priorizar cálcio da dieta.",mani:"Vitamina D3 2000 UI + K2 (MK-7) 100 mcg + Magnésio 200 mg + Boro 3 mg + Vitamina C 200 mg — dose diária.",reg:"Mineral / nutracêutico manipulado."},
 {id:"glucosaminacond2",tipo:"combo",nome:"Combo cartilagem (manipulado)",sci:"",classe:"Nutracêutico",tags:["osteoartrite","cartilagem","articulações"],
  resumo:"Fórmula manipulada para a osteoartrite focada na cartilagem, juntando glucosamina e condroitina (matéria-prima da cartilagem), MSM (enxofre, anti-inflamatório) e colágeno tipo II. Adjuvante de longo prazo; não substitui controle de peso e fisioterapia.",
  blocos:[{d:"Osteoartrite / cartilagem",n:"B",t:"Glucosamina sulfato tem evidência; MSM e colágeno II complementam."}],
  dose:"Conforme a fórmula abaixo, uso contínuo.",seg:"Cautela em alergia a frutos do mar (glucosamina) e no açúcar. Efeito aparece em semanas-meses.",mani:"Glucosamina sulfato 1500 mg + Condroitina 1200 mg + MSM 1 g + Colágeno II 40 mg — dose diária.",reg:"Nutracêutico manipulado."},
 {id:"caffeinegum",nome:"Cafeína (goma/rápida)",sci:"",classe:"Estimulante",tags:["energia","foco","performance"],
  resumo:"Cafeína em formas de absorção rápida (goma de mascar, comprimido sublingual), que agem em minutos — útil em performance esportiva ou quando se precisa de alerta imediato. Mesma cafeína, só que com início mais veloz que a cápsula.",
  blocos:[{d:"Alerta / performance (efeito rápido)",n:"A",t:"100-200 mg; absorção rápida, ideal pré-prova ou alerta imediato."}],
  dose:"100-200 mg conforme necessário (teto ~400 mg/dia).",seg:"Insônia, taquicardia, ansiedade. Cautela em arritmia, hipertensão e gravidez.",mani:"Cafeína (goma ou sublingual) 100 mg — usar conforme necessidade.",reg:"Estimulante / suplemento."},
 {id:"tyrosinestress",tipo:"combo",nome:"Combo desempenho cognitivo sob estresse (manipulado)",sci:"",classe:"Nutracêutico",tags:["foco","privação de sono","estresse","plantão"],
  resumo:"Fórmula manipulada para manter o desempenho mental em situações de estresse extremo — plantão, privação de sono, provas longas — juntando L-tirosina (repõe os neurotransmissores depletados pelo estresse) com cafeína. Uso pontual, não diário.",
  blocos:[{d:"Cognição sob estresse/privação de sono",n:"B",t:"L-tirosina preserva o desempenho sob estresse; cafeína dá o alerta."}],
  dose:"Conforme a fórmula abaixo, em situações de demanda extrema.",seg:"Uso pontual. Tirosina: cautela com remédios da tireoide e antidepressivos antigos (IMAO). Cafeína à noite atrapalha o sono.",mani:"L-tirosina 1 g + Cafeína 100 mg — usar antes de plantão/prova longa.",reg:"Nutracêutico manipulado."},
 {id:"notoginseng",nome:"Notoginseng",sci:"Panax notoginseng",classe:"Fitoterápico",tags:["circulação","sangramento","cardiovascular"],
  resumo:"Ginseng chinês usado tradicionalmente para a circulação e, curiosamente, em dois sentidos: estanca sangramentos e ao mesmo tempo melhora o fluxo. É componente de fórmulas cardiovasculares chinesas (como o Yunnan Baiyao). Evidência sobretudo asiática.",
  blocos:[{d:"Circulação / cardiovascular",n:"C",t:"Usado em fórmulas chinesas; sinal em circulação e micro-sangramentos."}],
  dose:"Extrato padronizado conforme rótulo.",seg:"Pode interagir com remédios que afinam o sangue (efeitos complexos). Evitar na gravidez. Usar com orientação.",mani:"Notoginseng (ext. padr.) 500 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico."},
 {id:"danshen",nome:"Danshen (salvia chinesa)",sci:"Salvia miltiorrhiza",classe:"Fitoterápico",tags:["circulação","cardiovascular","angina"],
  resumo:"Raiz vermelha da medicina chinesa, muito usada para a circulação e o coração (angina, após infarto). Melhora o fluxo e tem ação antioxidante. Frequentemente combinada ao notoginseng. Atenção forte às interações com anticoagulantes.",
  blocos:[{d:"Circulação / angina (adjuvante)",n:"C",t:"Melhora o fluxo coronário; usado em fórmulas cardíacas chinesas."}],
  dose:"Extrato padronizado conforme rótulo.",seg:"INTERAGE FORTE com o remédio que afina o sangue varfarina (aumenta o sangramento). Usar com orientação. Evitar antes de cirurgia.",mani:"Danshen (ext. padr.) 500 mg — 60 cápsulas.\nTomar conforme orientação.",reg:"Fitoterápico."},
 {id:"astragalo",nome:"Astrágalo",sci:"Astragalus membranaceus",classe:"Adaptógeno",tags:["imunidade","energia","longevidade","rim"],
  resumo:"Raiz da medicina chinesa, tônico imune e de energia ('qi'). Os polissacarídeos estimulam a imunidade e há interesse no efeito sobre os telômeros (longevidade). Usado como adjuvante imune, inclusive em oncologia. Evidência crescente, sobretudo asiática.",
  blocos:[{d:"Imunidade / energia",n:"C",t:"Polissacarídeos imunomoduladores; sinal em qualidade de vida como adjuvante."},{d:"Longevidade (telômeros)",n:"D",t:"Interesse mecanístico; sem desfecho clínico."}],
  dose:"Extrato padronizado, conforme rótulo.",seg:"Cautela com remédios que baixam a imunidade. Evitar em doença autoimune ativa.",mani:"Astrágalo (ext. padr.) 500 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico / adaptógeno."},
 {id:"jiaogulan",nome:"Jiaogulan",sci:"Gynostemma pentaphyllum",classe:"Adaptógeno",tags:["metabolismo","colesterol","estresse","AMPK"],
  resumo:"Erva chinesa chamada de 'ginseng do sul', adaptógena, que ativa a mesma via metabólica da berberina (a AMPK) — daí o interesse em colesterol, açúcar e gordura no fígado. Também tem ação antioxidante e antiestresse.",
  blocos:[{d:"Metabólico (colesterol/açúcar)",n:"C",t:"Ativa a AMPK; sinal sobre colesterol, açúcar e gordura no fígado."},{d:"Estresse / energia",n:"D",t:"Uso adaptógeno tradicional."}],
  dose:"Extrato padronizado, conforme rótulo.",seg:"Pode baixar o açúcar (cautela com antidiabéticos). Desconforto no estômago/intestino leve.",mani:"Jiaogulan (ext. padr.) 300 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico / adaptógeno."},
 {id:"berberineampk",tipo:"combo",nome:"Combo longevidade metabólica (manipulado)",sci:"",classe:"Nutracêutico",tags:["longevidade","metabolismo","AMPK"],
  resumo:"Fórmula manipulada inspirada em protocolos de longevidade metabólica, juntando ativadores da AMPK (a via da restrição calórica/exercício): berberina e jiaogulan, com ácido alfa-lipoico antioxidante. Foco em saúde metabólica no envelhecimento. Evidência de longevidade ainda extrapolada.",
  blocos:[{d:"Saúde metabólica / envelhecimento",n:"C",t:"Ativadores da AMPK; bom sinal metabólico, longevidade ainda teórica."}],
  dose:"Conforme a fórmula abaixo.",seg:"Berberina contraindicada na gravidez e interage com vários remédios. Pode baixar muito o açúcar com antidiabéticos.",mani:"Berberina 500 mg + Jiaogulan 300 mg + Ácido alfa-lipoico 300 mg — 2x/dia.",reg:"Nutracêutico manipulado."},
 {id:"calorirestrmim",tipo:"combo",nome:"Combo NAD/longevidade (manipulado)",sci:"",classe:"Nutracêutico",tags:["NAD","longevidade","energia"],
  resumo:"Fórmula manipulada de protocolo de longevidade focada em repor o NAD+ (coenzima de energia que cai com a idade), juntando um precursor de NAD (nicotinamida ribosídeo) com resveratrol/pterostilbeno (que ativam sirtuínas). Eleva NAD+; desfecho de longevidade ainda não comprovado em humanos.",
  blocos:[{d:"NAD+ / energia celular",n:"C",t:"Precursor de NAD + ativador de sirtuínas; eleva NAD+, longevidade não comprovada."}],
  dose:"Conforme a fórmula abaixo.",seg:"Dados de longo prazo emergindo. Resveratrol interage com enzimas do fígado.",mani:"Nicotinamida ribosídeo 300 mg + Pterostilbeno 50 mg — dose diária pela manhã.",reg:"Nutracêutico manipulado."},
 {id:"caloriealoe",nome:"Babosa (aloe vera oral)",sci:"Aloe vera",classe:"Fitoterápico",tags:["intestino","constipação","açúcar","gastrite"],
  resumo:"O gel interno da babosa, por via oral, tem ação sobre a mucosa do intestino e sinal sobre o açúcar do sangue. Importante: só o gel (filé) purificado — o látex amarelo da casca é um laxante agressivo e potencialmente cancerígeno, proibido para uso contínuo.",
  blocos:[{d:"Açúcar / mucosa intestinal",n:"C",t:"Gel purificado; sinal sobre glicemia e conforto digestivo."}],
  dose:"Gel/suco purificado conforme rótulo.",seg:"USAR SÓ o gel purificado — o látex (casca) é laxante agressivo e possivelmente cancerígeno. Pode baixar o açúcar. Evitar na gravidez.",mani:"Aloe vera (gel purificado, sem látex) — conforme rótulo.\nTomar 1x/dia.",reg:"Fitoterápico / alimento."},
 {id:"slipperycombo",tipo:"combo",nome:"Combo refluxo/azia (manipulado)",sci:"",classe:"Fitoterápico",tags:["refluxo","azia","gastrite","dispepsia"],
  resumo:"Fórmula manipulada de suporte para azia e refluxo, juntando plantas que formam uma camada protetora e calmam a mucosa: alcaçuz deglicirrizinado (DGL), olmo escorregadio e babosa. Adjuvante sintomático — refluxo persistente precisa de investigação.",
  blocos:[{d:"Azia / refluxo / gastrite (adjuvante)",n:"C",t:"Plantas demulcentes que protegem a mucosa; alívio sintomático."}],
  dose:"Conforme a fórmula abaixo, antes das refeições.",seg:"Refluxo persistente precisa de investigação médica. Distanciar de outros remédios.",mani:"DGL (alcaçuz) 380 mg + Olmo escorregadio + Aloe (gel) — antes das refeições.",reg:"Fitoterápico manipulado."},
 {id:"colaginbone",nome:"Colágeno tipo I + III (pele/osso)",sci:"",classe:"Aminoácido",tags:["pele","ossos","tendões"],
  resumo:"Tipos de colágeno predominantes na pele, ossos e tendões (diferente do tipo II, que é da cartilagem). Os peptídeos fornecem a matéria-prima e sinalizam o corpo a produzir mais colágeno nesses tecidos. Base das fórmulas de pele e de suporte ósseo.",
  blocos:[{d:"Pele / ossos / tendões",n:"B",t:"10 g/dia; melhora a pele e dá suporte a osso e tendão."}],
  dose:"10 g/dia de peptídeos de colágeno tipo I e III.",seg:"Bem tolerado. Tomar com vitamina C potencializa.",mani:"Colágeno tipo I e III (peptídeos) 10 g — dose diária.\nTomar 1x/dia com vitamina C.",reg:"Nutracêutico."},
 {id:"vitck2arterial",tipo:"combo",nome:"Combo saúde arterial (manipulado)",sci:"",classe:"Nutracêutico",tags:["calcificação arterial","coração","vasos"],
  resumo:"Fórmula manipulada focada em manter o cálcio fora das artérias e dentro do osso, juntando vitamina K2 (ativa a proteína que limpa o cálcio dos vasos), vitamina D e magnésio. Voltada a quem tem calcificação arterial ou faz suplementação de cálcio.",
  blocos:[{d:"Calcificação arterial (prevenção)",n:"C",t:"A vitamina K2 direciona o cálcio para o osso e o afasta das artérias."}],
  dose:"Conforme a fórmula abaixo.",seg:"A vitamina K2 ANULA O EFEITO do remédio que afina o sangue varfarina (Marevan) — não usar nesse caso.",mani:"Vitamina K2 (MK-7) 180 mcg + Vitamina D3 2000 UI + Magnésio 200 mg — dose diária.",reg:"Nutracêutico manipulado."},
 {id:"citrullinemalate2",nome:"Citrulina malato (pump/treino)",sci:"",classe:"Aminoácido",tags:["pump","performance","resistência"],
  resumo:"Citrulina ligada ao malato, a forma clássica de pré-treino. Aumenta o óxido nítrico (vasodilatação, o 'pump' muscular) e o malato ajuda na energia, retardando a fadiga em séries longas. Diferente da citrulina pura, que é mais voltada à pressão/circulação.",
  blocos:[{d:"Resistência muscular / pump",n:"B",t:"6-8 g 40-60 min pré-treino; retarda a fadiga e aumenta o número de repetições."}],
  dose:"6-8 g, 40-60 min antes do treino.",seg:"Desconforto no estômago/intestino em doses altas. Cautela com remédios de pressão.",mani:"Citrulina malato 8 g — dose pré-treino.\nTomar 40-60 min antes do treino.",reg:"Aminoácido / suplemento."},
 {id:"ashwastrength",tipo:"combo",nome:"Combo ganho de massa (manipulado)",sci:"",classe:"Nutracêutico",tags:["massa magra","força","hipertrofia"],
  resumo:"Fórmula de apoio ao ganho de massa muscular, juntando creatina (o ergogênico mais forte para força/massa), proteína whey (matéria-prima) e ashwagandha (que mostrou aumentar força e massa, talvez via redução do estresse). Junto a treino e dieta adequados.",
  blocos:[{d:"Massa magra / força",n:"A",t:"Creatina + proteína têm evidência forte; ashwagandha complementa."}],
  dose:"Conforme a fórmula abaixo + treino resistido.",seg:"Ashwagandha: evitar na gravidez. Creatina: hidratar bem.",mani:"Creatina 5 g/dia + Whey 30 g pós-treino + Ashwagandha KSM-66 600 mg/dia.",reg:"Nutracêutico manipulado."},
 {id:"tartcherry",nome:"Cereja ácida (tart cherry)",sci:"Prunus cerasus",classe:"Fitoterápico",tags:["recuperação","sono","ácido úrico","inflamação"],
  resumo:"Concentrado de cereja ácida (Montmorency), rico em antocianinas anti-inflamatórias e em melatonina natural. Tem dupla utilidade interessante: acelera a recuperação muscular pós-treino e melhora o sono. Também estudada para ácido úrico/gota.",
  blocos:[{d:"Recuperação muscular pós-exercício",n:"B",t:"Concentrado pré/pós-treino; reduz dor muscular e acelera a recuperação."},{d:"Sono",n:"C",t:"Contém melatonina natural; melhora o sono."},{d:"Ácido úrico / gota",n:"C",t:"Pode reduzir o ácido úrico e crises de gota."}],
  dose:"Concentrado equivalente a ~480 mg de antocianinas/dia, ou suco.",seg:"Bem tolerada. Calórica na forma de suco.",mani:"Cereja ácida (concentrado) — conforme rótulo.\nTomar pós-treino e/ou à noite.",reg:"Alimento / nutracêutico."},
 {id:"watermelon",tipo:"combo",nome:"Combo recuperação (manipulado)",sci:"",classe:"Nutracêutico",tags:["recuperação","dor muscular","antioxidante"],
  resumo:"Fórmula de recuperação pós-treino que junta cereja ácida (anti-inflamatória), curcumina (reduz a dor muscular tardia) e ômega-3. Voltada a quem treina pesado e quer reduzir a dor e o tempo de recuperação entre sessões.",
  blocos:[{d:"Recuperação / dor muscular tardia",n:"B",t:"Cereja ácida e curcumina reduzem a dor muscular pós-treino."}],
  dose:"Conforme a fórmula abaixo, pós-treino.",seg:"Doses altas de antioxidantes podem atenuar parte da adaptação ao treino — uso estratégico. Cautela com remédios que afinam o sangue.",mani:"Cereja ácida (concentrado) + Curcumina fitossoma 500 mg + Ômega-3 1 g — pós-treino.",reg:"Nutracêutico manipulado."},
 {id:"ashwagandhasono2",tipo:"combo",nome:"Combo jet lag (manipulado)",sci:"",classe:"Nutracêutico",tags:["jet lag","viagem","sono","fuso"],
  resumo:"Fórmula de suporte para viagens com troca de fuso (jet lag), juntando melatonina (o melhor recurso para reajustar o relógio biológico) com magnésio. Tomada no novo horário de dormir do destino para acelerar a adaptação ao novo fuso.",
  blocos:[{d:"Jet lag / troca de fuso",n:"B",t:"Melatonina no horário de dormir do destino ajuda a reajustar o relógio biológico."}],
  dose:"Melatonina 0,5-3 mg no horário de dormir do destino, por alguns dias.",seg:"Pode dar sonolência. Não dirigir após tomar.",mani:"Melatonina 1 mg + Magnésio 150 mg — tomar no novo horário de dormir.",reg:"Nutracêutico manipulado."}
,
 {id:"lactorhamnosus",nome:"Lactobacillus rhamnosus GG",sci:"",classe:"Probiótico",tags:["diarreia","intestino","imunidade infantil"],
  resumo:"Uma das cepas de probiótico mais estudadas no mundo. Tem boa evidência para prevenir e tratar diarreias (inclusive a do antibiótico e a infecciosa em crianças) e para a saúde intestinal. Cada cepa é diferente — esta é específica e bem documentada.",
  blocos:[{d:"Diarreia (infecciosa e por antibiótico)",n:"A",t:"10 bilhões/dia; reduz a duração e a incidência de diarreia, sobretudo em crianças."}],
  dose:"10-20 bilhões/dia.",seg:"Cautela em pessoas com imunidade muito baixa.",mani:"Lactobacillus rhamnosus GG 10 bilhões — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Probiótico."},
 {id:"bifidolongum",nome:"Bifidobacterium longum",sci:"",classe:"Probiótico",tags:["intestino","ansiedade","eixo intestino-cérebro"],
  resumo:"Cepa de probiótico estudada não só para o intestino, mas para o humor — faz parte dos chamados 'psicobióticos', pela conexão intestino-cérebro. Há sinal de redução de ansiedade e estresse, além do benefício digestivo. Área de pesquisa em expansão.",
  blocos:[{d:"Intestino / digestão",n:"B",t:"Melhora sintomas intestinais e equilíbrio da flora."},{d:"Ansiedade / estresse (psicobiótico)",n:"C",t:"Sinal de redução de ansiedade pelo eixo intestino-cérebro."}],
  dose:"1-10 bilhões/dia.",seg:"Cautela em imunidade muito baixa.",mani:"Bifidobacterium longum 5 bilhões — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Probiótico."},
 {id:"lreuteri",nome:"Lactobacillus reuteri",sci:"",classe:"Probiótico",tags:["cólica do bebê","saúde oral","intestino"],
  resumo:"Cepa com usos curiosos e bem estudados: reduz a cólica do bebê (gotas), melhora a saúde da boca/gengiva (pastilhas) e o intestino. Algumas linhagens têm sinal sobre testosterona e pele em estudos iniciais. Versátil e bem tolerada.",
  blocos:[{d:"Cólica do lactente",n:"B",t:"Gotas; reduz o tempo de choro por cólica em bebês amamentados."},{d:"Saúde oral (gengiva)",n:"C",t:"Pastilhas reduzem inflamação da gengiva."}],
  dose:"Gotas (bebês) ou pastilhas, conforme o uso.",seg:"Bem tolerado. Cautela em imunidade muito baixa.",mani:"Lactobacillus reuteri — gotas (bebê) ou pastilha (oral), conforme rótulo.",reg:"Probiótico."},
 {id:"saccharomycesbiolib",nome:"Probiótico de levedura (S. boulardii)",sci:"",classe:"Probiótico",tags:["diarreia","antibiótico","viajante"],
  resumo:"Levedura probiótica (não é bactéria), por isso resiste aos antibióticos e pode ser tomada junto. Tem evidência forte para prevenir a diarreia do antibiótico e a diarreia do viajante. Não coloniza de forma permanente — age enquanto é tomada.",
  blocos:[{d:"Diarreia por antibiótico",n:"A",t:"250-500 mg 2x/dia; reduz a diarreia associada a antibiótico."},{d:"Diarreia do viajante / aguda",n:"B",t:"Reduz a duração."}],
  dose:"250-500 mg, 1-2x/dia.",seg:"NÃO usar em pessoas com imunidade muito baixa ou com cateter central (risco de infecção do fungo no sangue).",mani:"Saccharomyces boulardii 250 mg — 30 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Probiótico / medicamento."},
 {id:"postbiotico",nome:"Postbiótico",sci:"",classe:"Nutracêutico",tags:["intestino","imunidade"],
  resumo:"Os 'subprodutos benéficos' das bactérias boas (em vez das bactérias vivas em si) — como fragmentos celulares e substâncias que elas produzem. A vantagem é a estabilidade (não precisa de geladeira nem de bactéria viva) e a segurança em quem não pode usar probiótico vivo.",
  blocos:[{d:"Saúde intestinal / imune",n:"C",t:"Subprodutos de bactérias com efeito modulador; alternativa estável ao probiótico vivo."}],
  dose:"Conforme rótulo.",seg:"Pode ser usado por quem não tolera probiótico vivo. Bem tolerado.",mani:"Postbiótico (ex.: tindalizado) — conforme rótulo.\nTomar 1x/dia.",reg:"Nutracêutico."},
 {id:"vitd_imunped",nome:"Vitamina D3 + K2 infantil",sci:"",classe:"Vitamina",tags:["ossos","imunidade","crianças"],
  resumo:"Versão para crianças da dupla vitamina D + K2, em gotas e dose pediátrica. A vitamina D é importante para ossos e imunidade desde a infância (muitas crianças têm deficiência). A dose é bem menor que a do adulto e ajustada pela idade/peso.",
  blocos:[{d:"Ossos / imunidade (crianças)",n:"A",t:"Dose pediátrica; previne deficiência de vitamina D, comum em crianças."}],
  dose:"Dose pediátrica conforme idade/peso e orientação.",seg:"Usar dose pediátrica (não a de adulto). Ajustar com o pediatra.",mani:"Vitamina D3 + K2 infantil (gotas) — conforme o pediatra.",reg:"Vitamina / suplemento (uso pediátrico)."},
 {id:"ferrobisglicinato",nome:"Ferro bisglicinato",sci:"",classe:"Mineral",tags:["anemia","ferro","gestação"],
  resumo:"Ferro ligado ao aminoácido glicina (quelato), uma forma muito mais bem tolerada que o sulfato ferroso comum — causa muito menos prisão de ventre, enjoo e dor de estômago. Boa escolha para quem não tolera o ferro tradicional, inclusive na gravidez.",
  blocos:[{d:"Anemia por falta de ferro",n:"A",t:"Corrige a anemia com muito menos desconforto digestivo que o sulfato ferroso."}],
  dose:"Conforme o déficit; 25-50 mg de ferro elementar/dia (dias alternados melhora a absorção).",seg:"NÃO tomar sem dosar a ferritina antes. Perigoso na hemocromatose (excesso de ferro). Manter longe de crianças.",mani:"Ferro bisglicinato (30 mg elementar) — 60 cápsulas.\nTomar em dias alternados, com vitamina C.",reg:"Mineral / medicamento."},
 {id:"ferritina_combo",tipo:"combo",nome:"Combo anemia (manipulado)",sci:"",classe:"Mineral",tags:["anemia","ferro","fadiga"],
  resumo:"Fórmula manipulada para tratar a anemia por falta de ferro com melhor absorção e menos efeitos colaterais, juntando ferro bisglicinato (bem tolerado), vitamina C (aumenta a absorção do ferro) e ácido fólico/B12 (também necessários para formar o sangue).",
  blocos:[{d:"Anemia / fadiga por falta de ferro",n:"A",t:"Ferro bem absorvido + vitamina C + B12/folato; corrige a anemia."}],
  dose:"Conforme exames (ferritina, hemograma).",seg:"Dosar ferritina antes. Não usar na hemocromatose. Tomar longe de café, chá e cálcio.",mani:"Ferro bisglicinato 30 mg + Vitamina C 200 mg + Ácido fólico 400 mcg + B12 500 mcg — dia sim, dia não.",reg:"Mineral / suplemento manipulado."},
 {id:"oxidonitrico_combo",tipo:"combo",nome:"Combo óxido nítrico (manipulado)",sci:"",classe:"Aminoácido",tags:["circulação","performance","pressão","ereção"],
  resumo:"Fórmula que aumenta o óxido nítrico (o gás que dilata os vasos e melhora o fluxo de sangue), juntando citrulina (a forma mais eficaz de elevar a matéria-prima) com nitrato de beterraba. Usada para performance, circulação e função erétil leve.",
  blocos:[{d:"Circulação / performance / ereção",n:"B",t:"Citrulina + nitrato elevam o óxido nítrico e o fluxo sanguíneo."}],
  dose:"Conforme a fórmula abaixo, pré-treino ou diariamente.",seg:"Pode baixar a pressão — cautela com remédios de pressão e sildenafil (Viagra).",mani:"L-citrulina 6 g + Beterraba (nitrato) — pré-treino.",reg:"Aminoácido / nutracêutico manipulado."},
 {id:"taurinaenergia",tipo:"combo",nome:"Combo energia natural (manipulado)",sci:"",classe:"Nutracêutico",tags:["energia","fadiga","sem crash"],
  resumo:"Fórmula para energia sustentada sem o 'pico e queda' dos energéticos, juntando CoQ10 e PQQ (energia das mitocôndrias), vitaminas do complexo B (metabolismo) e uma dose menor de cafeína. Voltada à fadiga do dia a dia, não ao pré-treino.",
  blocos:[{d:"Energia / fadiga sem crash",n:"C",t:"Suporte mitocondrial + complexo B + cafeína leve; energia mais estável."}],
  dose:"Conforme a fórmula abaixo, pela manhã.",seg:"Contém cafeína em dose leve — cautela à noite e em arritmia.",mani:"CoQ10 100 mg + PQQ 20 mg + Complexo B + Cafeína 50 mg — dose matinal.",reg:"Nutracêutico manipulado."},
 {id:"adaptogeno_combo",tipo:"combo",nome:"Combo adaptógeno (manipulado)",sci:"",classe:"Adaptógeno",tags:["estresse","fadiga","resiliência","burnout"],
  resumo:"Fórmula que junta adaptógenos com perfis complementares: ashwagandha (acalma e baixa cortisol), rhodiola (antifadiga e foco) e panax ginseng (energia). Pensada para o estresse crônico e o esgotamento (burnout), equilibrando 'acalmar' e 'energizar'.",
  blocos:[{d:"Estresse crônico / esgotamento",n:"B",t:"Adaptógenos combinados; ashwagandha e rhodiola têm a melhor evidência."}],
  dose:"Conforme a fórmula abaixo, pela manhã.",seg:"Ashwagandha: evitar na gravidez. Rhodiola: cautela em transtorno bipolar. Ginseng: cautela com remédios que afinam o sangue.",mani:"Ashwagandha KSM-66 300 mg + Rhodiola 200 mg + Panax ginseng 200 mg — dose matinal.",reg:"Adaptógeno / nutracêutico manipulado."},
 {id:"colina_alfagpc2",nome:"Alfa-GPC (foco/força)",sci:"Alfa-glicerofosfocolina",classe:"Nutracêutico",tags:["foco","cognição","força","potência"],
  resumo:"Forma de colina muito bem absorvida que chega ao cérebro, fornecendo matéria-prima para a acetilcolina (memória, foco). Tem também um uso esportivo curioso: em dose pré-treino, pode aumentar a potência e a força. Versátil entre cognição e performance.",
  blocos:[{d:"Foco / cognição",n:"C",t:"300-600 mg/dia; suporte à atenção e memória, fonte de colina."},{d:"Força / potência (pré-treino)",n:"C",t:"600 mg pré-treino; pode aumentar a potência em estudos pequenos."}],
  dose:"300-600 mg/dia (ou pré-treino).",seg:"Dor de cabeça em alguns. Dados de longo prazo limitados.",mani:"Alfa-GPC 300 mg — 60 cápsulas.\nTomar 1-2 cápsulas/dia.",reg:"Nutracêutico."},
 {id:"lionsmanecombo",tipo:"combo",nome:"Combo neuroproteção (manipulado)",sci:"",classe:"Nutracêutico",tags:["cognição","neuroproteção","memória","longevidade cerebral"],
  resumo:"Fórmula manipulada de suporte à saúde do cérebro a longo prazo, juntando leão-da-juba (estimula o fator de crescimento dos nervos), ômega-3 DHA (estrutura dos neurônios) e vitaminas do complexo B (protegem contra a homocisteína, ligada ao declínio). Foco em envelhecimento cognitivo saudável.",
  blocos:[{d:"Saúde cognitiva no envelhecimento",n:"C",t:"Leão-da-juba + DHA + complexo B; suporte estrutural e de fatores de crescimento."}],
  dose:"Conforme a fórmula abaixo.",seg:"Bem tolerado. Cautela com remédios que afinam o sangue (DHA em dose alta).",mani:"Leão-da-juba 1 g + Ômega-3 DHA 500 mg + Complexo B — dose diária.",reg:"Nutracêutico manipulado."},
 {id:"magsignal_b6",nome:"Magnésio + B6 (TPM/sono)",sci:"",classe:"Mineral",tags:["TPM","sono","ansiedade","câimbra"],
  resumo:"Combinação clássica de magnésio com vitamina B6, que melhora a entrada do magnésio nas células e tem evidência própria em sintomas de tensão pré-menstrual. Usada para TPM, sono, ansiedade e câimbras. Dupla bem tolerada e barata.",
  blocos:[{d:"Tensão pré-menstrual (TPM)",n:"B",t:"Magnésio + vitamina B6; reduz sintomas de TPM."},{d:"Sono / câimbra / ansiedade",n:"C",t:"Suporte ao relaxamento."}],
  dose:"Magnésio 200-300 mg + B6 25-50 mg/dia.",seg:"A B6 em excesso crônico causa formigamento — respeitar o teto. Cautela em problema nos rins.",mani:"Magnésio 250 mg + Vitamina B6 (P5P) 25 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Mineral / vitamina."},
 {id:"omega3_d_combo",tipo:"combo",nome:"Combo cardiovascular (manipulado)",sci:"",classe:"Nutracêutico",tags:["coração","colesterol","pressão"],
  resumo:"Fórmula manipulada de suporte cardiovascular, juntando ômega-3 (triglicérides), CoQ10 (energia do coração, sobretudo em quem usa estatina) e bergamota (colesterol). Adjuvante das medidas de base e da medicação. Não substitui o cardiologista.",
  blocos:[{d:"Suporte cardiovascular (adjuvante)",n:"B",t:"Ômega-3 e bergamota têm evidência em lipídios; CoQ10 apoia o coração."}],
  dose:"Conforme a fórmula abaixo.",seg:"A CoQ10 pode reduzir o efeito do remédio que afina o sangue varfarina. Cautela com remédios que afinam o sangue (ômega-3).",mani:"Ômega-3 1 g 2x/dia + CoQ10 100 mg + Bergamota 500 mg — dose diária.",reg:"Nutracêutico manipulado."},
 {id:"psyllium_combo",tipo:"combo",nome:"Combo colesterol natural (manipulado)",sci:"",classe:"Nutracêutico",tags:["colesterol","fibra","LDL"],
  resumo:"Fórmula manipulada para baixar o colesterol naturalmente, juntando fibras com evidência reconhecida: psyllium e beta-glucana de aveia (que prendem a gordura no intestino) e fitosteróis (que competem com o colesterol pela absorção). Adjuvante da dieta e, quando indicado, da medicação.",
  blocos:[{d:"Colesterol alto (adjuvante)",n:"A",t:"Psyllium, beta-glucana e fitosteróis têm evidência de reduzir o colesterol LDL."}],
  dose:"Conforme a fórmula abaixo, às refeições.",seg:"Tomar com bastante água. Distanciar de outros remédios (as fibras reduzem a absorção).",mani:"Psyllium 5 g + Beta-glucana de aveia 3 g + Fitosteróis 2 g — às refeições.",reg:"Fibra / nutracêutico manipulado."},
 {id:"bergamota_combo",tipo:"combo",nome:"Combo síndrome metabólica (manipulado)",sci:"",classe:"Nutracêutico",tags:["colesterol","açúcar","gordura no fígado","síndrome metabólica"],
  resumo:"Fórmula manipulada para a síndrome metabólica (a combinação de barriga, pressão, açúcar e colesterol alterados), juntando bergamota (colesterol e açúcar), berberina (sensibiliza a insulina) e ômega-3. Ataca várias frentes do problema metabólico ao mesmo tempo.",
  blocos:[{d:"Síndrome metabólica (adjuvante)",n:"B",t:"Bergamota e berberina atuam em colesterol, açúcar e fígado."}],
  dose:"Conforme a fórmula abaixo.",seg:"A berberina é contraindicada na gravidez e interage com vários remédios; pode baixar muito o açúcar com antidiabéticos.",mani:"Bergamota 500 mg + Berberina 500 mg + Ômega-3 1 g — 2x/dia.",reg:"Nutracêutico manipulado."},
 {id:"vitc_zinco_pele",tipo:"combo",nome:"Combo cicatrização (manipulado)",sci:"",classe:"Nutracêutico",tags:["cicatrização","pós-operatório","pele"],
  resumo:"Fórmula manipulada para apoiar a cicatrização (pós-cirurgia, feridas), juntando os nutrientes essenciais para reconstruir o tecido: vitamina C e zinco (síntese de colágeno), proteína/aminoácidos e vitamina A. A boa nutrição é parte fundamental da cicatrização.",
  blocos:[{d:"Cicatrização / pós-operatório",n:"B",t:"Vitamina C, zinco e proteína são essenciais para formar o novo tecido."}],
  dose:"Conforme a fórmula abaixo, no período de cicatrização.",seg:"Não exceder a vitamina A (perigosa na gravidez). Zinco em jejum dá enjoo.",mani:"Vitamina C 500 mg + Zinco 30 mg + Arginina 3 g + Vitamina A (dose segura) — dose diária.",reg:"Nutracêutico manipulado."},
 {id:"arginina_cicatriz",nome:"L-arginina (cicatrização/imune)",sci:"",classe:"Aminoácido",tags:["cicatrização","imunidade","pós-operatório"],
  resumo:"A arginina, aqui no uso de cicatrização e recuperação: ela é matéria-prima para formar novo tecido e para a função das células de defesa. Por isso entra em fórmulas de nutrição para feridas e pós-operatório (a chamada imunonutrição).",
  blocos:[{d:"Cicatrização / recuperação pós-operatória",n:"B",t:"Matéria-prima para o novo tecido e para a imunidade; usada na imunonutrição."}],
  dose:"3-6 g/dia (mais em contexto de cicatrização, sob orientação).",seg:"Cautela após infarto recente e em quem tem herpes (a arginina favorece o vírus).",mani:"L-arginina 1,5 g — tomar 3-6 g/dia.",reg:"Aminoácido / suplemento."},
 {id:"glutamina_imuno",nome:"Glutamina (recuperação clínica)",sci:"",classe:"Aminoácido",tags:["recuperação","queimadura","trauma","imunidade"],
  resumo:"A glutamina vira essencial em situações de grande estresse no corpo (cirurgia grande, queimadura, trauma, infecção grave) — é combustível das células de defesa e do intestino. Nessas situações clínicas, a reposição tem evidência; no dia a dia do atleta saudável, menos.",
  blocos:[{d:"Recuperação em trauma/queimadura grave",n:"B",t:"Vira essencial no estresse catabólico intenso; reduz infecções em pacientes graves."}],
  dose:"Em contexto clínico, dose médica; geral 5-15 g/dia.",seg:"Cautela em doença grave do fígado (acúmulo de amônia). Uso clínico é supervisionado.",mani:"L-glutamina 5 g — tomar conforme o contexto.",reg:"Aminoácido / suplemento."},
 {id:"vitamina_e_tocofcompleto",nome:"Vitamina E (tocoferóis mistos)",sci:"",classe:"Vitamina",tags:["antioxidante","gordura no fígado"],
  resumo:"Forma completa da vitamina E, com os quatro tipos de tocoferol (não só o alfa isolado, que em excesso desequilibra os outros). É a forma mais próxima da que existe nos alimentos. Antioxidante de membranas; uso específico em fígado gorduroso sob orientação.",
  blocos:[{d:"Gordura no fígado (não diabético)",n:"C",t:"Em casos selecionados, melhora a inflamação do fígado (uso especializado)."},{d:"Antioxidante",n:"C",t:"Antioxidante de membrana; preferir tocoferóis mistos."}],
  dose:"Conforme indicação (a megadose isolada de alfa não é recomendada).",seg:"Megadose aumenta o risco de sangramento. Cautela com remédios que afinam o sangue.",mani:"Vitamina E (tocoferóis mistos) 400 UI — 60 cápsulas.\nTomar conforme orientação.",reg:"Vitamina / suplemento."},
 {id:"vitamina_e_tocotrienol2",tipo:"combo",nome:"Combo antioxidante (manipulado)",sci:"",classe:"Nutracêutico",tags:["antioxidante","longevidade","oxidativo"],
  resumo:"Fórmula manipulada de defesa antioxidante ampla, juntando antioxidantes que agem em compartimentos diferentes da célula: vitamina C (água), vitamina E/tocotrienóis (gordura), ácido alfa-lipoico (ambos) e selênio (enzimas). A ideia é cobrir várias frentes do estresse oxidativo.",
  blocos:[{d:"Defesa antioxidante geral",n:"D",t:"Cobertura ampla de antioxidantes; desfechos clínicos de longo prazo incertos."}],
  dose:"Conforme a fórmula abaixo.",seg:"Antioxidantes em megadose nem sempre são benéficos (às vezes atrapalham adaptações). Moderação.",mani:"Vitamina C 500 mg + Tocotrienóis 125 mg + Ácido alfa-lipoico 300 mg + Selênio 100 mcg — dose diária.",reg:"Nutracêutico manipulado."},
 {id:"quercetina_zinco_imuno",tipo:"combo",nome:"Combo imune avançado (manipulado)",sci:"",classe:"Nutracêutico",tags:["imunidade","resfriado","viral"],
  resumo:"Fórmula manipulada de suporte imune mais completa, juntando zinco (encurta o resfriado), quercetina (que ajuda o zinco a entrar nas células, além da ação antialérgica), vitamina D e vitamina C. Pensada para reforço imune e início de quadros virais.",
  blocos:[{d:"Suporte imune / início de resfriado",n:"B",t:"Zinco + quercetina (que melhora a entrada do zinco) + vitaminas D e C."}],
  dose:"Conforme a fórmula abaixo, ao primeiro sinal.",seg:"Não usar zinco em megadose por muito tempo. Vitamina D conforme exame.",mani:"Zinco 15 mg + Quercetina 250 mg + Vitamina D3 2000 UI + Vitamina C 500 mg — dose diária.",reg:"Nutracêutico manipulado."},
 {id:"vit_d_alta",nome:"Vitamina D3 alta dosagem",sci:"Colecalciferol",classe:"Vitamina",tags:["deficiência grave","reposição"],
  resumo:"Vitamina D em dose alta (ex.: 7.000, 10.000, 50.000 UI), para repor deficiências importantes de forma mais rápida, sempre guiada pelo exame de sangue. Não é para uso contínuo sem controle — a vitamina D acumula e o excesso é perigoso (eleva o cálcio).",
  blocos:[{d:"Reposição de deficiência (guiada por exame)",n:"A",t:"Dose alta por tempo definido corrige a deficiência mais rápido; depois reduz para manutenção."}],
  dose:"Conforme o nível no sangue e orientação (ex.: 7.000-50.000 UI por período definido).",seg:"NÃO usar dose alta de forma contínua sem dosar — risco de excesso de cálcio. Acompanhamento médico.",mani:"Vitamina D3 10.000 UI — 30 cápsulas.\nTomar conforme orientação e exame.",reg:"Vitamina / medicamento."},
 {id:"vitamina_c_combo_colageno",tipo:"combo",nome:"Combo articulação esportiva (manipulado)",sci:"",classe:"Nutracêutico",tags:["tendão","ligamento","prevenção de lesão","esporte"],
  resumo:"Fórmula manipulada para a saúde de tendões e ligamentos de quem treina, juntando peptídeos de colágeno com vitamina C, tomados antes do exercício — uma estratégia estudada para fortalecer e ajudar a recuperar esses tecidos, que têm pouca circulação.",
  blocos:[{d:"Tendão / ligamento (prevenção/recuperação)",n:"C",t:"15 g de colágeno + vitamina C 30-60 min antes do exercício; suporte ao tecido conjuntivo."}],
  dose:"15 g de colágeno + 50 mg de vitamina C, 30-60 min antes do treino.",seg:"Bem tolerado.",mani:"Peptídeos de colágeno 15 g + Vitamina C 50 mg — antes do treino.",reg:"Nutracêutico manipulado."},
 {id:"melatonina_baixa",nome:"Melatonina microdose",sci:"",classe:"Hormônio",tags:["sono","idosos","baixa dose"],
  resumo:"Melatonina em dose muito baixa (0,3-0,5 mg), que para muita gente funciona tão bem quanto as doses altas para iniciar o sono, com menos sonolência no dia seguinte. A dose mínima eficaz costuma ser a melhor — mais melatonina não significa melhor sono.",
  blocos:[{d:"Latência do sono (dose mínima)",n:"B",t:"0,3-0,5 mg, 30-60 min antes; ajuda a pegar no sono com menos efeito residual."}],
  dose:"0,3-0,5 mg, 30-60 min antes de dormir.",seg:"Dose baixa reduz a sonolência matinal. Cautela com remédios que afinam o sangue.",mani:"Melatonina 0,5 mg — 60 cápsulas.\nTomar 1 cápsula 40 min antes de dormir.",reg:"Liberada em apresentações específicas."},
 {id:"l_teanina_combo_calma",tipo:"combo",nome:"Combo calma diurna (manipulado)",sci:"",classe:"Nutracêutico",tags:["ansiedade","estresse","calma sem sono"],
  resumo:"Fórmula manipulada para acalmar durante o dia sem dar sono nem 'desligar' a pessoa, juntando L-teanina (relaxa sem sedar), ashwagandha (baixa o cortisol) e magnésio. Pensada para a ansiedade do trabalho/rotina, mantendo a pessoa funcional.",
  blocos:[{d:"Ansiedade / estresse diurno",n:"B",t:"L-teanina e ashwagandha acalmam sem sedar; magnésio relaxa."}],
  dose:"Conforme a fórmula abaixo, pela manhã/tarde.",seg:"Ashwagandha: evitar na gravidez e cautela com tireoide.",mani:"L-teanina 200 mg + Ashwagandha KSM-66 300 mg + Magnésio 200 mg — manhã/início da tarde.",reg:"Nutracêutico manipulado."},
 {id:"passiflora_combo_sono",tipo:"combo",nome:"Combo sono fitoterápico (manipulado)",sci:"",classe:"Fitoterápico",tags:["insônia","sono","ansiedade noturna"],
  resumo:"Fórmula manipulada de plantas calmantes para o sono, juntando valeriana, passiflora (maracujá) e melissa (erva-cidreira) — três fitoterápicos com tradição e sinal para insônia leve e ansiedade noturna. Alternativa sem melatonina nem hormônio.",
  blocos:[{d:"Insônia leve / ansiedade noturna",n:"B",t:"Valeriana + passiflora + melissa; calmantes naturais para o sono."}],
  dose:"Conforme a fórmula abaixo, 40 min antes de dormir.",seg:"Sonolência. Cautela com álcool e remédios calmantes. Não dirigir após.",mani:"Valeriana 300 mg + Passiflora 200 mg + Melissa 200 mg — 30 cápsulas.\nTomar 40 min antes de dormir.",reg:"Fitoterápico manipulado (lista ANVISA)."},
 {id:"vitamina_a_pele",nome:"Vitamina A (pele/derma)",sci:"Retinol",classe:"Vitamina",tags:["pele","acne","mucosas"],
  resumo:"A vitamina A é essencial para a renovação da pele e das mucosas — daí o uso dermatológico. Importante separar: os retinoides de prescrição (isotretinoína, tretinoína) são derivados potentes e são remédios; o suplemento de vitamina A só ajuda na deficiência e é perigoso em megadose.",
  blocos:[{d:"Pele / mucosas (deficiência)",n:"B",t:"Repor em deficiência ajuda pele e mucosas; megadose não é tratamento de acne."}],
  dose:"Repor só na deficiência; manutenção conforme recomendação.",seg:"TERATOGÊNICA (causa malformação no bebê) em megadose — perigo na gravidez. Acúmulo é tóxico para o fígado. Não megadosar.",mani:"Vitamina A — reposição conforme orientação e dosagem.",reg:"Vitamina / medicamento."},
 {id:"colageno_verisol",nome:"Colágeno Verisol (rugas)",sci:"",classe:"Aminoácido",tags:["pele","rugas","elasticidade"],
  resumo:"Peptídeos de colágeno de uma marca específica (Verisol), com tamanho otimizado para estimular a pele a produzir colágeno próprio. É a versão com mais estudos voltados especificamente para rugas e elasticidade facial. Resultados em 8-12 semanas.",
  blocos:[{d:"Rugas / elasticidade da pele",n:"B",t:"2,5 g/dia; reduz rugas ao redor dos olhos e melhora a elasticidade."}],
  dose:"2,5 g/dia (Verisol).",seg:"Bem tolerado. Resultados aparecem em 8-12 semanas.",mani:"Colágeno Verisol 2,5 g — dose diária.\nTomar 1x/dia.",reg:"Nutracêutico."},
 {id:"resveratrol_pele",tipo:"combo",nome:"Combo beleza antioxidante (manipulado)",sci:"",classe:"Nutracêutico",tags:["pele","antienvelhecimento","antioxidante"],
  resumo:"Fórmula manipulada de beleza com foco antioxidante e antienvelhecimento da pele, juntando colágeno (matéria-prima), resveratrol e astaxantina (antioxidantes que protegem o colágeno do dano) e vitamina C (cofator). Trabalha construção e proteção ao mesmo tempo.",
  blocos:[{d:"Pele / antienvelhecimento",n:"C",t:"Colágeno + antioxidantes que protegem a pele; efeito gradual."}],
  dose:"Conforme a fórmula abaixo.",seg:"Bem tolerado. Não substitui o protetor solar.",mani:"Colágeno Verisol 2,5 g + Resveratrol 100 mg + Astaxantina 4 mg + Vitamina C 200 mg — dose diária.",reg:"Nutracêutico manipulado."},
 {id:"zinco_acne_combo2",tipo:"combo",nome:"Combo acne hormonal (manipulado)",sci:"",classe:"Nutracêutico",tags:["acne hormonal","oleosidade","SOP"],
  resumo:"Fórmula manipulada de suporte para a acne de fundo hormonal (comum na síndrome dos ovários policísticos), juntando DIM (equilibra o metabolismo do estrogênio), zinco (anti-inflamatório, regula a oleosidade) e ômega-3. Adjuvante do tratamento dermatológico/ginecológico.",
  blocos:[{d:"Acne hormonal (adjuvante)",n:"C",t:"DIM modula hormônios; zinco regula a oleosidade e a inflamação."}],
  dose:"Conforme a fórmula abaixo.",seg:"Não substitui o tratamento médico. O DIM interage com hormônios — evitar na gravidez.",mani:"DIM 100 mg + Zinco 30 mg + Ômega-3 1 g — dose diária.",reg:"Nutracêutico manipulado."},
 {id:"creatina_mulher",nome:"Creatina (saúde feminina)",sci:"",classe:"Nutracêutico",tags:["mulher","massa magra","menopausa","cognição"],
  resumo:"A creatina não é 'só para homens': nas mulheres, há interesse crescente para força e massa magra (sobretudo na menopausa, quando há perda muscular), para o humor e a cognição. As mulheres tendem a ter menos reserva de creatina, então podem se beneficiar bastante.",
  blocos:[{d:"Massa magra / força (mulheres, menopausa)",n:"B",t:"3-5 g/dia com treino; preserva músculo e força, importante na menopausa."},{d:"Humor / cognição",n:"C",t:"Sinal emergente em humor e função mental."}],
  dose:"3-5 g/dia, contínuo.",seg:"Muito segura. Retenção de água inicial mínima nas doses usuais.",mani:"Creatina monoidratada 3-5 g — dose diária.\nTomar 1x/dia, qualquer horário.",reg:"Suplemento."},
 {id:"vitamina_d_k2_d3combo",tipo:"combo",nome:"Combo gestante completo (manipulado)",sci:"",classe:"Vitamina",tags:["gravidez","amamentação","pré-natal completo"],
  resumo:"Fórmula manipulada de pré-natal mais completa, cobrindo o que a gestação exige: metilfolato (forma ativa do folato, melhor em quem tem o gene MTHFR), ferro, DHA, iodo, vitamina D, cálcio e colina (importante para o cérebro do bebê). Sempre sob orientação obstétrica.",
  blocos:[{d:"Suporte nutricional completo na gestação",n:"A",t:"Cobre os nutrientes essenciais da gravidez; folato e iodo são críticos."}],
  dose:"Conforme orientação obstétrica e exames.",seg:"NÃO incluir vitamina A em megadose (malformação). Doses individualizadas. Seguir o pré-natal.",mani:"Metilfolato 400 mcg + Ferro 27 mg + DHA 300 mg + Iodo 200 mcg + Vitamina D 2000 UI + Colina 450 mg — dose diária.",reg:"Vitamina / suplemento manipulado."},
 {id:"coenzimaq10_fertil",tipo:"combo",nome:"Combo fertilidade feminina (manipulado)",sci:"",classe:"Nutracêutico",tags:["fertilidade","óvulo","qualidade ovocitária"],
  resumo:"Fórmula manipulada de suporte à qualidade do óvulo e à fertilidade feminina, juntando CoQ10 (energia das células do óvulo, importante após os 35 anos), mio-inositol (ovulação) e ácido fólico. Usada no preparo para gravidez/reprodução assistida, sob orientação.",
  blocos:[{d:"Qualidade ovocitária / fertilidade",n:"C",t:"CoQ10 e inositol têm sinal na qualidade do óvulo e na ovulação."}],
  dose:"Conforme a fórmula abaixo, no preparo para a gestação.",seg:"Discutir com o ginecologista/reprodução. A CoQ10 reduz o efeito do remédio que afina o sangue varfarina.",mani:"Coenzima Q10 200 mg + Mio-inositol 2 g + Ácido fólico 400 mcg — dose diária.",reg:"Nutracêutico manipulado."},
 {id:"coenzimaq10_fertil_masc",tipo:"combo",nome:"Combo fertilidade masculina (manipulado)",sci:"",classe:"Nutracêutico",tags:["fertilidade masculina","espermatozoide","qualidade do sêmen"],
  resumo:"Fórmula manipulada de suporte à fertilidade do homem, juntando os nutrientes com evidência em melhorar a qualidade do sêmen: CoQ10, L-carnitina, zinco, selênio e ômega-3. Vários estudos mostram melhora na quantidade, movimento e formato dos espermatozoides.",
  blocos:[{d:"Qualidade do sêmen / fertilidade masculina",n:"B",t:"CoQ10, carnitina, zinco e selênio melhoram parâmetros do espermatozoide."}],
  dose:"Conforme a fórmula abaixo, por pelo menos 3 meses.",seg:"O ciclo do espermatozoide leva ~3 meses — usar por esse tempo. Não usar zinco em megadose crônica.",mani:"Coenzima Q10 200 mg + L-carnitina 2 g + Zinco 15 mg + Selênio 100 mcg + Ômega-3 1 g — dose diária.",reg:"Nutracêutico manipulado."},
 {id:"vitaminab12_vegano",tipo:"combo",nome:"Combo vegano essencial (manipulado)",sci:"",classe:"Vitamina",tags:["vegano","vegetariano","deficiências"],
  resumo:"Fórmula manipulada para cobrir os nutrientes que faltam ou são mais difíceis numa dieta vegana: vitamina B12 (a mais crítica — não existe em vegetais), vitamina D, ômega-3 de algas, ferro, zinco e iodo. Essencial para veganos manterem a saúde a longo prazo.",
  blocos:[{d:"Prevenção de deficiências no veganismo",n:"A",t:"B12 é obrigatória para veganos; D, ômega-3, ferro, zinco e iodo são pontos de atenção."}],
  dose:"Conforme a fórmula e exames de sangue.",seg:"A B12 é inegociável para veganos. Dosar os níveis periodicamente.",mani:"B12 1000 mcg + Vitamina D3 2000 UI + Ômega-3 de algas 500 mg + Ferro (se baixo) + Zinco 15 mg + Iodo 150 mcg.",reg:"Vitamina / suplemento manipulado."},
 {id:"electrolyte_keto",tipo:"combo",nome:"Combo low carb/jejum (manipulado)",sci:"",classe:"Mineral",tags:["jejum","low carb","cetogênica","eletrólitos"],
  resumo:"Na dieta low carb, cetogênica e no jejum, o corpo elimina mais água e sais — o que causa a 'gripe da dieta' (dor de cabeça, fraqueza, câimbra). Esta fórmula repõe os eletrólitos perdidos (sódio, potássio, magnésio), prevenindo esses sintomas.",
  blocos:[{d:"Eletrólitos na dieta low carb/jejum",n:"B",t:"Repõe sódio, potássio e magnésio perdidos; previne a 'gripe da dieta'."}],
  dose:"1 dose em água por dia (ou conforme sintomas).",seg:"Cautela com o sódio em pressão alta e o potássio em problema nos rins.",mani:"Sódio 1000 mg + Potássio 300 mg + Magnésio 200 mg — em água.\nTomar 1x/dia na dieta/jejum.",reg:"Mineral / suplemento manipulado."},
 {id:"berberina_metformina_like",tipo:"combo",nome:"Combo pré-diabetes (manipulado)",sci:"",classe:"Nutracêutico",tags:["pré-diabetes","resistência à insulina","prevenção"],
  resumo:"Fórmula manipulada para o pré-diabetes (açúcar começando a subir), juntando berberina (a mais potente para sensibilizar a insulina), cromo e canela. O objetivo é ajudar a evitar a progressão para o diabetes, sempre junto à mudança de estilo de vida.",
  blocos:[{d:"Pré-diabetes / prevenção (adjuvante)",n:"B",t:"Berberina tem evidência forte em glicemia; cromo e canela complementam."}],
  dose:"Conforme a fórmula abaixo, antes das refeições.",seg:"A berberina é contraindicada na gravidez e interage com vários remédios. Pode baixar muito o açúcar com antidiabéticos — ajustar com o médico.",mani:"Berberina 500 mg + Cromo 200 mcg + Canela do Ceilão 250 mg — antes das refeições.",reg:"Nutracêutico manipulado."},
 {id:"omega3_artrite",tipo:"combo",nome:"Combo artrite reumatoide (manipulado)",sci:"",classe:"Nutracêutico",tags:["artrite reumatoide","inflamação","autoimune"],
  resumo:"Fórmula manipulada de suporte para a artrite reumatoide (uma doença inflamatória autoimune), juntando ômega-3 em dose alta (reduz a inflamação articular), GLA (óleo de borragem) e curcumina. Adjuvante do tratamento reumatológico — nunca substituto.",
  blocos:[{d:"Artrite reumatoide (adjuvante)",n:"B",t:"Ômega-3 em dose alta e GLA reduzem a inflamação articular como adjuvantes."}],
  dose:"Conforme a fórmula abaixo.",seg:"Adjuvante — NÃO substitui o tratamento reumatológico. Cautela com remédios que afinam o sangue.",mani:"Ômega-3 (EPA alto) 2-3 g + GLA (borragem) 1,5 g + Curcumina fitossoma 500 mg — dose diária.",reg:"Nutracêutico manipulado."}
,
 {id:"glicinato_combo_nao",nome:"Glicina + magnésio (forma)",sci:"",classe:"Aminoácido",tags:["sono","relaxamento"],
  resumo:"A glicina é o aminoácido mais simples e também um neurotransmissor que acalma. À noite, ajuda a baixar levemente a temperatura do corpo (gatilho natural do sono) e melhora a qualidade do sono relatada. Componente de muitas formas de magnésio bem toleradas.",
  blocos:[{d:"Qualidade do sono",n:"C",t:"3 g antes de dormir; melhora o sono relatado e a sensação ao acordar."}],
  dose:"3 g antes de dormir.",seg:"Muito bem tolerada.",mani:"Glicina 3 g — pó.\nTomar 3 g diluído antes de dormir.",reg:"Aminoácido / suplemento."},
 {id:"sarcosina",nome:"Sarcosina",sci:"",classe:"Aminoácido",tags:["esquizofrenia adjuvante","humor","glutamato"],
  resumo:"Derivado da glicina que age sobre o sistema do glutamato no cérebro (um neurotransmissor). Estudada como adjuvante nos sintomas negativos da esquizofrenia (apatia, isolamento) e no humor. Uso psiquiátrico específico, sob acompanhamento.",
  blocos:[{d:"Esquizofrenia (sintomas negativos, adjuvante)",n:"C",t:"1-2 g/dia; adjuvante dos sintomas negativos em estudos."}],
  dose:"1-2 g/dia.",seg:"Uso psiquiátrico adjuvante — discutir com o médico. Não combinar com clozapina sem orientação.",mani:"Sarcosina 500 mg — 60 cápsulas.\nTomar conforme orientação.",reg:"Aminoácido / nutracêutico."},
 {id:"nag_nacetil",nome:"N-acetil-tirosina",sci:"NALT",classe:"Aminoácido",tags:["foco","estresse","biodisponibilidade"],
  resumo:"Forma acetilada da tirosina, vendida como mais solúvel. Na prática, a conversão de volta a tirosina é limitada, então muitos preferem a tirosina comum em dose maior. Usada para foco sob estresse, como a tirosina.",
  blocos:[{d:"Cognição sob estresse",n:"C",t:"Precursor de dopamina; a conversão da forma acetilada é limitada."}],
  dose:"300-500 mg (ou preferir tirosina comum em dose maior).",seg:"Cautela com remédios da tireoide e antidepressivos antigos (IMAO).",mani:"N-acetil-tirosina 350 mg — 60 cápsulas.\nTomar antes de demanda cognitiva.",reg:"Aminoácido / suplemento."},
 {id:"ornitina",nome:"L-ornitina",sci:"",classe:"Aminoácido",tags:["fadiga","sono","amônia","fígado"],
  resumo:"Aminoácido do ciclo que elimina a amônia (um resíduo tóxico) do corpo. Estudada para reduzir a fadiga (ajudando a limpar a amônia gerada no esforço) e melhorar o sono e o estresse. Também usada em problemas do fígado.",
  blocos:[{d:"Fadiga / estresse",n:"C",t:"400 mg-2 g; reduz a fadiga ajudando a eliminar amônia."},{d:"Sono",n:"D",t:"Sinal preliminar."}],
  dose:"400 mg a 2 g/dia.",seg:"Desconforto no estômago/intestino em doses altas.",mani:"L-ornitina 500 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Aminoácido / suplemento."},
 {id:"citrulina_ornitina",nome:"L-prolina",sci:"",classe:"Aminoácido",tags:["colágeno","cicatrização","articulações"],
  resumo:"Aminoácido que, junto com a glicina, forma a maior parte do colágeno. Fornecê-lo dá matéria-prima para pele, vasos, articulações e cicatrização. Costuma vir em fórmulas de colágeno e de saúde vascular.",
  blocos:[{d:"Colágeno / cicatrização",n:"D",t:"Bloco do colágeno; benefício isolado pouco estudado."}],
  dose:"Conforme fórmula (geralmente com glicina e vitamina C).",seg:"Bem tolerada.",mani:"L-prolina 500 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Aminoácido / suplemento."},
 {id:"histidina",nome:"L-histidina",sci:"",classe:"Aminoácido",tags:["pele","dermatite atópica","antioxidante"],
  resumo:"Aminoácido essencial, matéria-prima da histamina e de proteínas da pele (filagrina) e do antioxidante carnosina. Estudada na dermatite atópica (eczema), onde a barreira da pele está comprometida, com sinal de melhora.",
  blocos:[{d:"Dermatite atópica (eczema)",n:"C",t:"Suporte à barreira da pele; sinal de melhora do eczema em estudos pequenos."}],
  dose:"Conforme rótulo (ex.: 4 g/dia em estudos de eczema).",seg:"Bem tolerada.",mani:"L-histidina 500 mg — 60 cápsulas.\nTomar conforme orientação.",reg:"Aminoácido / suplemento."},
 {id:"serina",nome:"L-serina",sci:"",classe:"Aminoácido",tags:["neuroproteção","ELA","cognição"],
  resumo:"Aminoácido importante para a membrana dos neurônios e para a fosfatidilserina. Há pesquisa em doenças neurológicas (como a ELA) pela hipótese de proteger contra um aminoácido tóxico (BMAA). Área de estudo, ainda sem confirmação clínica robusta.",
  blocos:[{d:"Neuroproteção (ELA, pesquisa)",n:"D",t:"Hipótese neuroprotetora em estudo; sem confirmação clínica."}],
  dose:"Em estudo (doses altas usadas em pesquisa de ELA).",seg:"Dados de segurança em doses altas ainda em avaliação.",mani:"L-serina — uso conforme protocolo de pesquisa/orientação.",reg:"Aminoácido / nutracêutico."},
 {id:"treonina",nome:"L-treonina",sci:"",classe:"Aminoácido",tags:["espasticidade","sistema nervoso","intestino"],
  resumo:"Aminoácido essencial, importante para o muco do intestino e para o sistema nervoso (precursor de glicina). Estudada na espasticidade (rigidez muscular) de doenças neurológicas, com sinal modesto. Também na saúde da mucosa intestinal.",
  blocos:[{d:"Espasticidade (rigidez muscular)",n:"C",t:"Sinal modesto em rigidez de doenças neurológicas."}],
  dose:"Conforme orientação.",seg:"Bem tolerada.",mani:"L-treonina 500 mg — 60 cápsulas.\nTomar conforme orientação.",reg:"Aminoácido / suplemento."},
 {id:"metionina",nome:"L-metionina",sci:"",classe:"Aminoácido",tags:["fígado","detox","metilação","intoxicação por paracetamol"],
  resumo:"Aminoácido essencial com enxofre, doador de grupos metila e precursor da glutationa e da SAMe. Usado em proteção do fígado e como antídoto na intoxicação por paracetamol (alternativa à NAC). Também acidifica a urina.",
  blocos:[{d:"Proteção do fígado / paracetamol",n:"B",t:"Antídoto alternativo na intoxicação por paracetamol; doador de metila."}],
  dose:"Conforme indicação.",seg:"Excesso eleva a homocisteína. Cautela em doença hepática grave.",mani:"L-metionina 500 mg — 60 cápsulas.\nTomar conforme orientação.",reg:"Aminoácido / medicamento."},
 {id:"same",nome:"SAMe (S-adenosilmetionina)",sci:"",classe:"Nutracêutico",tags:["depressão","articulações","fígado"],
  resumo:"Molécula que o corpo faz a partir da metionina, central na metilação (humor) e na produção de cartilagem e na função do fígado. Tem boa evidência em depressão (adjuvante) e em osteoartrite (comparável a anti-inflamatórios). Cara e instável.",
  blocos:[{d:"Depressão (adjuvante)",n:"B",t:"800-1600 mg/dia; melhora o humor, inclusive como adjuvante de antidepressivos."},{d:"Osteoartrite",n:"B",t:"Reduz dor articular, comparável a anti-inflamatórios."}],
  dose:"800-1600 mg/dia (com revestimento entérico, em jejum).",seg:"NÃO usar com antidepressivos que mexem na serotonina sem orientação (risco de excesso de serotonina). Pode desencadear mania em bipolar.",mani:"SAMe 400 mg (entérica) — 60 cápsulas.\nTomar 1-2 cápsulas 2x/dia em jejum.",reg:"Nutracêutico / medicamento conforme país."},
 {id:"tmg2",nome:"Betaína anidra (homocisteína)",sci:"TMG",classe:"Nutracêutico",tags:["homocisteína","fígado","metilação"],
  resumo:"A trimetilglicina (TMG), aqui no uso de baixar a homocisteína (um aminoácido que, alto, é fator de risco cardiovascular e cognitivo). Doa grupos metila para converter a homocisteína em metionina. Também apoia o fígado.",
  blocos:[{d:"Homocisteína alta",n:"B",t:"≥4 g/dia; reduz a homocisteína de forma consistente."}],
  dose:"2,5-6 g/dia, fracionado.",seg:"Pode elevar levemente o colesterol em doses altas. Desconforto no estômago/intestino.",mani:"Betaína anidra (TMG) 1 g — tomar 2,5-6 g/dia fracionado.",reg:"Nutracêutico."},
 {id:"creatinabuff",nome:"Creatina (kre-alkalyn)",sci:"",classe:"Nutracêutico",tags:["performance","massa magra"],
  resumo:"Versão 'tamponada' da creatina, vendida como sem necessidade de saturação e com menos retenção de água. Na prática, não demonstrou superioridade real sobre a creatina monoidratada comum, que continua sendo o padrão-ouro custo-efetivo.",
  blocos:[{d:"Performance / massa magra",n:"C",t:"Sem superioridade comprovada sobre a creatina monoidratada comum."}],
  dose:"Conforme rótulo (a monoidratada comum é preferível pelo custo).",seg:"Segura. Marketing supera a evidência.",mani:"Prefira creatina monoidratada comum, 3-5 g/dia.",reg:"Nutracêutico."},
 {id:"creatinanano",nome:"Fosfato de creatina",sci:"",classe:"Nutracêutico",tags:["performance","cardíaco"],
  resumo:"A forma já 'energizada' da creatina (creatina + fosfato), que é como ela é estocada no músculo. Como suplemento oral, não traz vantagem sobre a monoidratada (que o corpo fosforila sozinho). Tem uso médico injetável em cardiologia.",
  blocos:[{d:"Performance",n:"D",t:"Sem vantagem oral sobre a monoidratada."}],
  dose:"Sem vantagem prática vs. monoidratada por via oral.",seg:"Seguro.",mani:"Prefira creatina monoidratada.",reg:"Nutracêutico."},
 {id:"ribose2",nome:"Inosina",sci:"",classe:"Nutracêutico",tags:["performance","neuroproteção"],
  resumo:"Composto ligado à produção de energia (precursor do ácido úrico). Foi promovido para performance (sem evidência) e há pesquisa em neuroproteção (esclerose múltipla, Parkinson) pela elevação do ácido úrico, que é antioxidante. Risco: eleva o ácido úrico.",
  blocos:[{d:"Performance",n:"D",t:"Promovido no esporte; sem evidência de benefício."},{d:"Neuroproteção (pesquisa)",n:"D",t:"Em estudo via elevação do ácido úrico."}],
  dose:"Em pesquisa; uso esportivo não recomendado.",seg:"ELEVA O ÁCIDO ÚRICO — risco de gota e pedra nos rins. Evitar em quem tem gota.",mani:"Inosina — uso não recomendado fora de pesquisa.",reg:"Nutracêutico (cautela)."},
 {id:"oleo_emu",nome:"Coenzima Q10 (idebenona)",sci:"",classe:"Nutracêutico",tags:["mitocondrial","cognição","pele"],
  resumo:"Versão sintética e melhorada da CoQ10, que funciona mesmo quando a cadeia de energia da célula está danificada. Estudada em doenças mitocondriais e na ataxia de Friedreich. Também usada em cosméticos antienvelhecimento (uso tópico).",
  blocos:[{d:"Doenças mitocondriais (uso especializado)",n:"C",t:"Funciona em situações onde a CoQ10 comum falha; uso médico específico."},{d:"Pele (tópico)",n:"D",t:"Antioxidante em cosméticos."}],
  dose:"Uso especializado, conforme orientação.",seg:"Uso em doença mitocondrial é médico. Tópico bem tolerado.",mani:"Idebenona — uso conforme orientação especializada.",reg:"Nutracêutico / medicamento."},
 {id:"mitoq",nome:"MitoQ (CoQ10 mitocondrial)",sci:"",classe:"Nutracêutico",tags:["mitocondrial","antioxidante","longevidade"],
  resumo:"CoQ10 modificada para entrar diretamente dentro da mitocôndria (onde a energia é feita e o dano oxidativo acontece), concentrando o efeito antioxidante no lugar certo. Promissora em pesquisa de envelhecimento e função vascular; cara e ainda em estudo.",
  blocos:[{d:"Função vascular / mitocondrial",n:"C",t:"Antioxidante direcionado à mitocôndria; sinal em função do vaso em idosos."},{d:"Longevidade",n:"D",t:"Em pesquisa; sem desfecho clínico."}],
  dose:"10-20 mg/dia.",seg:"Bem tolerado em estudos. Dados de longo prazo emergindo.",mani:"MitoQ 10 mg — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Nutracêutico."},
 {id:"plasmalogenos",nome:"Plasmalógenos",sci:"",classe:"Nutracêutico",tags:["cognição","neuroproteção","membranas"],
  resumo:"Tipo especial de gordura das membranas dos neurônios que diminui com a idade e em doenças como o Alzheimer. Repor (de fonte marinha) é uma aposta nova para a saúde do cérebro. Evidência inicial promissora, mas ainda preliminar.",
  blocos:[{d:"Cognição / neuroproteção",n:"D",t:"Repõe gordura das membranas neuronais; evidência inicial em cognição."}],
  dose:"Conforme rótulo.",seg:"Dados de longo prazo limitados.",mani:"Plasmalógenos (fonte marinha) — conforme rótulo.\nTomar 1x/dia.",reg:"Nutracêutico."},
 {id:"acidobutirico2",nome:"Tributirina",sci:"",classe:"Nutracêutico",tags:["intestino","butirato","barreira intestinal"],
  resumo:"Forma 'pré-pronta' de butirato (três butiratos ligados a glicerol), que libera o butirato mais lentamente e mais abaixo no intestino que o butirato comum. O butirato é o alimento das células do cólon e regula a inflamação intestinal.",
  blocos:[{d:"Saúde da mucosa do cólon",n:"C",t:"Libera butirato no intestino; suporte à barreira e à inflamação intestinal."}],
  dose:"Conforme rótulo.",seg:"Bem tolerada; menos odor que o butirato comum.",mani:"Tributirina — conforme rótulo.\nTomar às refeições.",reg:"Nutracêutico."},
 {id:"lactulose",nome:"Lactulose",sci:"",classe:"Nutracêutico",tags:["constipação","prebiótico","encefalopatia hepática"],
  resumo:"Açúcar que não é absorvido e age como laxante osmótico suave (puxa água para o intestino) e como prebiótico (alimenta a flora boa). É remédio em duas situações: constipação e encefalopatia hepática (confusão por doença do fígado), onde reduz a amônia.",
  blocos:[{d:"Constipação",n:"A",t:"Laxante osmótico suave; eficaz e seguro inclusive em crianças e gestantes."},{d:"Encefalopatia hepática",n:"A",t:"Reduz a amônia e a confusão na doença do fígado (uso médico)."}],
  dose:"Constipação: conforme rótulo. Encefalopatia: dose médica.",seg:"Gases e inchaço no começo. Bem tolerada na gravidez.",mani:"Lactulose (xarope) — conforme rótulo/orientação.",reg:"Medicamento / nutracêutico."},
 {id:"pickle_extr",nome:"Goma guar parcialmente hidrolisada",sci:"PHGG",classe:"Nutracêutico",tags:["intestino","constipação","diarreia","FODMAP"],
  resumo:"Fibra solúvel suave (de uma leguminosa) que regula o intestino nos dois sentidos — ajuda tanto na constipação quanto na diarreia — e alimenta a flora boa. Tolerada por quem tem intestino irritável e segue dieta com pouco FODMAP, ao contrário de fibras mais fermentáveis.",
  blocos:[{d:"Intestino irritável / regularidade",n:"B",t:"5-6 g/dia; regula o trânsito (constipação e diarreia), bem tolerada no intestino irritável."}],
  dose:"5-6 g/dia.",seg:"Muito bem tolerada, com poucos gases.",mani:"Goma guar hidrolisada (PHGG) 5 g — pó.\nTomar 5-6 g/dia em água ou comida.",reg:"Fibra / nutracêutico."},
 {id:"berberina_curc",nome:"Curcumina + quercetina (forma)",sci:"",classe:"Nutracêutico",tags:["antioxidante","inflamação"],
  resumo:"Dois polifenóis antioxidantes que costumam aparecer juntos por agirem em vias inflamatórias complementares. Atenção à absorção: ambos são mal aproveitados sozinhos, por isso vêm em formas melhoradas (fitossoma, com piperina). Suporte anti-inflamatório geral.",
  blocos:[{d:"Inflamação / antioxidante",n:"C",t:"Polifenóis complementares; preferir formas de boa absorção."}],
  dose:"Conforme as formas (fitossoma/com piperina).",seg:"Cautela com remédios que afinam o sangue.",mani:"Curcumina fitossoma 500 mg + Quercetina fitossoma 250 mg — 1-2x/dia.",reg:"Nutracêutico."},
 {id:"oleo_blackseed",nome:"Óleo de cominho-preto",sci:"Nigella sativa",classe:"Fitoterápico",tags:["imunidade","alergia","pressão","açúcar"],
  resumo:"Semente preta (nigella) muito usada na medicina tradicional do Oriente Médio. A timoquinona tem ação anti-inflamatória, antialérgica e sinal sobre pressão, açúcar e colesterol. Um dos fitoterápicos com mais usos e evidência crescente.",
  blocos:[{d:"Pressão / açúcar / colesterol",n:"B",t:"Sinal de melhora modesta em pressão, glicemia e colesterol."},{d:"Alergia / imunidade",n:"C",t:"Ação antialérgica e imunomoduladora."}],
  dose:"Óleo 1-2,5 g/dia, ou semente moída.",seg:"Pode baixar a pressão e o açúcar (cautela com remédios). Evitar em excesso na gravidez.",mani:"Óleo de cominho-preto (Nigella sativa) 500 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico / alimento."},
 {id:"berberineerva",nome:"Cnidium (osthole)",sci:"Cnidium monnieri",classe:"Fitoterápico",tags:["libido","pele","ereção"],
  resumo:"Erva da medicina chinesa, cujo osthole é estudado para função erétil (parecido com remédios de ereção, mecanismo de óxido nítrico) e para a pele (uso tópico em coceira e dermatite). Evidência majoritariamente pré-clínica e tradicional.",
  blocos:[{d:"Função erétil / libido",n:"D",t:"Mecanismo plausível (óxido nítrico); evidência pré-clínica."},{d:"Pele (tópico)",n:"D",t:"Uso tópico tradicional em coceira/dermatite."}],
  dose:"Conforme rótulo.",seg:"Fotossensibilidade. Dados de segurança formais limitados.",mani:"Cnidium (ext. padr. osthole) — conforme rótulo.",reg:"Fitoterápico."},
 {id:"horny_goat",nome:"Epimédio (horny goat weed)",sci:"Epimedium",classe:"Fitoterápico",tags:["libido","ereção","ossos"],
  resumo:"Erva chinesa cujo icariin age de forma parecida com remédios de ereção (inibe a mesma enzima, a PDE5). Tradicional para libido e disfunção erétil. Também estudada para ossos na menopausa. Evidência sobretudo pré-clínica e tradicional.",
  blocos:[{d:"Função erétil / libido",n:"C",t:"Icariin atua como os remédios de ereção (mais fraco); tradicional para libido."}],
  dose:"Extrato padronizado em icariin, conforme rótulo.",seg:"Pode interagir com remédios de ereção e de pressão. Evitar em cardiopatas sem orientação.",mani:"Epimédio (ext. padr. icariin) 500 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico."},
 {id:"yohimbe",nome:"Ioimbina",sci:"Pausinystalia johimbe",classe:"Estimulante",tags:["ereção","gordura localizada","libido"],
  resumo:"Alcaloide da casca de uma árvore africana, estimulante que bloqueia certos receptores (alfa-2), aumentando a noradrenalina. Usado para disfunção erétil e queima de gordura 'teimosa'. Potente e com efeitos colaterais cardiovasculares e de ansiedade — exige cautela.",
  blocos:[{d:"Disfunção erétil",n:"C",t:"A forma-remédio (ioimbina) tem evidência; o suplemento de casca é menos confiável."},{d:"Gordura localizada",n:"D",t:"Mobiliza gordura teimosa; efeito prático pequeno."}],
  dose:"Baixa, titulada (potente) — conforme orientação.",seg:"RISCO: ansiedade, pânico, taquicardia, picos de pressão. Evitar em hipertensão, arritmia, ansiedade e com IMAO.",mani:"Ioimbina — uso com cautela e orientação (potente).",reg:"Estimulante / medicamento (cautela)."},
 {id:"saffron_eye2",nome:"Espinheira do mar (espinheiro-marítimo)",sci:"Hippophae rhamnoides",classe:"Fitoterápico",tags:["pele","olho seco","mucosas","ômega-7"],
  resumo:"Fruto alaranjado (sea buckthorn) riquíssimo em ômega-7 (ácido palmitoleico), vitaminas e antioxidantes. Usado para a saúde das mucosas (olho seco, secura vaginal) e da pele. O ômega-7 também é estudado para o metabolismo.",
  blocos:[{d:"Olho seco / mucosas secas",n:"C",t:"Óleo rico em ômega-7; melhora a hidratação das mucosas."},{d:"Pele",n:"C",t:"Antioxidante e nutritivo para a pele."}],
  dose:"Óleo conforme rótulo (rico em ômega-7).",seg:"Bem tolerado.",mani:"Espinheiro-marítimo (óleo) — conforme rótulo.\nTomar 1x/dia.",reg:"Fitoterápico / alimento."},
 {id:"omega7",nome:"Ômega-7 (ácido palmitoleico)",sci:"",classe:"Ácido graxo",tags:["metabolismo","colesterol","mucosas"],
  resumo:"Gordura monoinsaturada (do espinheiro-marítimo ou de peixe) estudada como um 'sinalizador' do metabolismo (lipoquina), com sinal sobre colesterol, inflamação e sensibilidade à insulina. Também usada para secura de mucosas. Evidência ainda preliminar.",
  blocos:[{d:"Metabólico (colesterol/inflamação)",n:"C",t:"210-420 mg/dia; sinal sobre lipídios e inflamação."},{d:"Mucosas secas",n:"C",t:"Hidratação de olho/mucosas."}],
  dose:"210-420 mg/dia (purificado, sem ácido palmítico).",seg:"Bem tolerado. Preferir formas sem ácido palmítico junto.",mani:"Ômega-7 (palmitoleico purificado) 210 mg — 30 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Suplemento."},
 {id:"gla_evening2",nome:"Óleo de prímula (forma)",sci:"Oenothera biennis",classe:"Ácido graxo",tags:["TPM","pele","menopausa"],
  resumo:"Fonte do ácido graxo GLA (ômega-6 'do bem'), mais suave que o óleo de borragem. Tradicional para tensão pré-menstrual, mastalgia (dor nas mamas) e pele. A evidência é modesta e inconsistente, mas o perfil é seguro.",
  blocos:[{d:"Mastalgia (dor nas mamas) cíclica",n:"C",t:"Sinal modesto e inconsistente."},{d:"Pele / TPM",n:"C",t:"Uso tradicional; evidência fraca."}],
  dose:"GLA 1-3 g/dia (óleo de prímula).",seg:"Cautela com remédios que afinam o sangue. Desconforto no estômago/intestino leve.",mani:"Óleo de prímula 1 g — 60 cápsulas.\nTomar 1-2 cápsulas 1-2x/dia.",reg:"Suplemento."},
 {id:"fish_collagen",nome:"Colágeno marinho",sci:"",classe:"Aminoácido",tags:["pele","absorção","beleza"],
  resumo:"Colágeno extraído de peixe (tipo I), com peptídeos pequenos e boa absorção. Alternativa ao colágeno bovino, preferida por quem não consome carne bovina ou suína. Usado para pele, com a mesma lógica dos outros colágenos hidrolisados.",
  blocos:[{d:"Pele (firmeza/hidratação)",n:"B",t:"5-10 g/dia; melhora a pele, bem absorvido."}],
  dose:"5-10 g/dia.",seg:"Alergia a peixe. Resultados em 8-12 semanas.",mani:"Colágeno marinho 10 g — dose diária.\nTomar 1x/dia com vitamina C.",reg:"Nutracêutico."},
 {id:"eggshell",nome:"Membrana da casca do ovo",sci:"",classe:"Nutracêutico",tags:["articulações","osteoartrite","colágeno"],
  resumo:"A fina película interna da casca do ovo, rica em colágeno, ácido hialurônico e outros componentes da cartilagem. Estudada na osteoartrite, com sinal de redução de dor e rigidez em dose baixa. Alternativa às fórmulas de glucosamina.",
  blocos:[{d:"Osteoartrite / dor articular",n:"B",t:"500 mg/dia; reduz dor e rigidez articular em estudos."}],
  dose:"500 mg/dia.",seg:"Alergia a ovo. Bem tolerada.",mani:"Membrana da casca do ovo 500 mg — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Nutracêutico."},
 {id:"perna_canaliculus",nome:"Mexilhão verde-da-nova-zelândia",sci:"Perna canaliculus",classe:"Ácido graxo",tags:["osteoartrite","articulações","anti-inflamatório"],
  resumo:"Extrato de um mexilhão da Nova Zelândia, rico em ômega-3 raros e glicosaminoglicanos. Anti-inflamatório articular estudado na osteoartrite e na artrite reumatoide, com sinal de redução de dor. Alternativa marinha às fórmulas articulares.",
  blocos:[{d:"Osteoartrite / artrite",n:"B",t:"Extrato padronizado; reduz dor e rigidez articular."}],
  dose:"Extrato padronizado, conforme rótulo.",seg:"Alergia a frutos do mar. Bem tolerado.",mani:"Mexilhão verde (ext. padr.) — conforme rótulo.\nTomar 1-2x/dia.",reg:"Nutracêutico."},
 {id:"sam_e_joint",nome:"Cúrcuma + gengibre (forma)",sci:"",classe:"Fitoterápico",tags:["inflamação","articular","digestão"],
  resumo:"Dupla anti-inflamatória da cozinha indiana: cúrcuma (curcumina, dor articular) e gengibre (também anti-inflamatório, além de digestivo e antináusea). Combinação tradicional, segura e versátil para inflamação e desconforto digestivo.",
  blocos:[{d:"Inflamação / dor articular",n:"B",t:"Curcumina + gengibre, com ações anti-inflamatórias complementares."},{d:"Digestão / enjoo",n:"B",t:"O gengibre ajuda na digestão e no enjoo."}],
  dose:"Conforme as formas (curcumina de boa absorção + gengibre).",seg:"Cautela com remédios que afinam o sangue.",mani:"Curcumina fitossoma 500 mg + Gengibre 250 mg — 1-2x/dia.",reg:"Fitoterápico."},
 {id:"willowbark2",nome:"Salgueiro + curcumina (forma)",sci:"",classe:"Fitoterápico",tags:["dor","anti-inflamatório","lombalgia"],
  resumo:"Combinação para dor e inflamação juntando o salgueiro branco (a 'aspirina natural', com salicina) e a curcumina. Atacam a dor por vias diferentes. Cautela com as mesmas restrições da aspirina (alergia, úlcera, anticoagulantes).",
  blocos:[{d:"Dor lombar / articular",n:"B",t:"Salgueiro (salicina) + curcumina; alívio de dor lombar e articular."}],
  dose:"Conforme as formas padronizadas.",seg:"Mesmas cautelas da aspirina (alergia, úlcera, remédios que afinam o sangue). Não em crianças.",mani:"Salgueiro (salicina) 200 mg + Curcumina 500 mg — 1-2x/dia.",reg:"Fitoterápico."},
 {id:"cbd",nome:"Canabidiol (CBD)",sci:"Cannabis sativa",classe:"Fitoterápico",tags:["ansiedade","dor","epilepsia","sono"],
  resumo:"Componente da Cannabis que NÃO causa 'barato' (não é o THC). Tem evidência forte e registro como medicamento para certas epilepsias graves, e uso crescente (com evidência mais preliminar) para ansiedade, dor crônica e sono. No Brasil, exige prescrição e autorização.",
  blocos:[{d:"Epilepsias graves (Dravet, Lennox-Gastaut)",n:"A",t:"Medicamento aprovado; reduz crises nessas epilepsias."},{d:"Ansiedade / dor / sono",n:"C",t:"Uso crescente; evidência mais preliminar nesses usos."}],
  dose:"Individualizada e titulada, sob prescrição.",seg:"Interage com vários remédios (mesmas enzimas do fígado). Pode elevar enzimas hepáticas. Uso sob prescrição e regulamentação.",mani:"Canabidiol (CBD) — uso sob prescrição médica e autorização.",reg:"Medicamento / fitoterápico controlado."},
 {id:"cbg",nome:"Canabigerol (CBG)",sci:"Cannabis sativa",classe:"Fitoterápico",tags:["inflamação","intestino","foco"],
  resumo:"Outro componente não psicoativo da Cannabis (a 'mãe' dos outros canabinoides). Pesquisa inicial para inflamação intestinal, dor e foco/ansiedade. Bem menos estudado que o CBD. No Brasil, segue a mesma regulamentação dos derivados de Cannabis.",
  blocos:[{d:"Inflamação / intestino (pesquisa)",n:"D",t:"Evidência inicial pré-clínica; uso clínico em construção."}],
  dose:"Em estudo; sob prescrição/regulamentação.",seg:"Mesma regulamentação dos derivados de Cannabis. Dados clínicos limitados.",mani:"Canabigerol (CBG) — uso sob prescrição e autorização.",reg:"Fitoterápico controlado."},
 {id:"palmitoiletanolamida",nome:"Palmitoiletanolamida (PEA)",sci:"",classe:"Nutracêutico",tags:["dor crônica","dor neuropática","inflamação"],
