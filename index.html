  blocos:[{d:"Quelação de metais (intestinal)",n:"D",t:"Liga metais no lúmen; evidência clínica fraca."},{d:"Imunidade / antioxidante",n:"C",t:"Sinal em marcadores; estudos pequenos."}],
  dose:"3-5 g/dia (parede celular quebrada).",seg:"Risco de contaminação — exigir fonte certificada. desconforto no estômago/intestino no começo. Contém vitamina K (varfarina).",mani:"Chlorella (parede quebrada) 500 mg — 90 comprimidos.\nTomar 6-10 comprimidos/dia.",reg:"Nutracêutico / alga."},
 {id:"agaricus",nome:"Cogumelo-do-sol",sci:"Agaricus blazei",classe:"Fitoterápico",tags:["imunidade","beta-glucanos","adjuvante oncológico"],
  resumo:"Cogumelo brasileiro (Agaricus blazei murill), rico em beta-glucanos imunomoduladores. Estudado como adjuvante imune em oncologia. Padronização pelos beta-glucanos.",
  blocos:[{d:"Imunomodulação / adjuvante oncológico",n:"C",t:"Beta-glucanos; sinal em qualidade de vida e imunidade, baixa qualidade."}],
  dose:"Extrato padronizado em beta-glucanos, conforme rótulo.",seg:"Há relatos raros de lesão no fígado. Cautela com remédios que baixam a imunidade (usados em transplante e em doenças autoimunes).",mani:"Cogumelo-do-sol (ext. padr. beta-glucanos) 500 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico / cogumelo funcional."},
 {id:"shiitake",nome:"Shiitake (lentinana/AHCC)",sci:"Lentinula edodes",classe:"Fitoterápico",tags:["imunidade","HPV","adjuvante oncológico"],
  resumo:"Cogumelo Lentinula edodes; o AHCC (composto correlacionado de hexose ativa) e a lentinana são frações imunomoduladoras estudadas como adjuvantes em oncologia e na depuração do HPV.",
  blocos:[{d:"Imunidade / HPV (AHCC)",n:"C",t:"AHCC 3 g/dia; sinal em depuração de HPV persistente em estudos-piloto."},{d:"Adjuvante oncológico",n:"C",t:"Lentinana IV em protocolos; oral menos estabelecido."}],
  dose:"AHCC 1-3 g/dia.",seg:"Bem tolerado. Cautela com remédios que baixam a imunidade (usados em transplante e em doenças autoimunes).",mani:"Shiitake/AHCC 500 mg — 60 cápsulas.\nTomar 1-2 cápsulas 1-3x/dia.",reg:"Fitoterápico / cogumelo funcional."},
 {id:"chaga",nome:"Chaga",sci:"Inonotus obliquus",classe:"Fitoterápico",tags:["antioxidante","imunidade"],
  resumo:"Fungo parasita da bétula (Inonotus obliquus), com altíssima capacidade antioxidante (melanina, betulina) e beta-glucanos. Tradicional na Sibéria. Evidência humana ainda escassa.",
  blocos:[{d:"Antioxidante / imune",n:"D",t:"Antioxidante in vitro potente; desfecho clínico humano insuficiente."}],
  dose:"Extrato padronizado, 1-2 g/dia.",seg:"Contém oxalatos (associados a pedra nos rins) (cautela em pedra nos rins/problema nos rins). Cautela com remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel) e remédios para diabetes.",mani:"Chaga (ext. padr.) 500 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico / cogumelo funcional."},
 {id:"turkeytail",nome:"Cauda-de-peru",sci:"Trametes versicolor",classe:"Fitoterápico",tags:["imunidade","adjuvante oncológico","beta-glucanos"],
  resumo:"Cogumelo Trametes versicolor, fonte dos polissacarídeos PSK e PSP — entre as frações fúngicas com melhor evidência em oncologia (aprovados como adjuvantes no Japão/China). Imunomoduladores.",
  blocos:[{d:"Adjuvante oncológico (PSK/PSP)",n:"B",t:"PSK 3 g/dia; melhora sobrevida adjuvante em alguns cânceres em estudos asiáticos."},{d:"Imunidade",n:"C",t:"Modula resposta imune."}],
  dose:"PSK/PSP 2-3 g/dia.",seg:"Bem tolerado. Cautela com remédios que baixam a imunidade (usados em transplante e em doenças autoimunes).",mani:"Cauda-de-peru (ext. padr. PSK/PSP) 500 mg — 90 cápsulas.\nTomar 2 cápsulas 2-3x/dia.",reg:"Fitoterápico / cogumelo funcional."},
 {id:"biotina2",nome:"Sílica (bambu)",sci:"Bambusa (sílica orgânica)",classe:"Mineral",tags:["cabelo","unhas","pele","colágeno"],
  resumo:"Fonte vegetal de sílica orgânica (extrato de bambu Tabashir, ~70% sílica). A sílica é cofator da síntese de colágeno e da matriz de cabelo, unha e pele. Alternativa de origem vegetal aos minerais para tegumento.",
  blocos:[{d:"Cabelo / unhas / pele",n:"C",t:"Sílica como cofator de colágeno; sinal modesto em firmeza/força."}],
  dose:"Extrato de bambu padronizado fornecendo ~10-20 mg de sílica/dia.",seg:"Bem tolerada.",mani:"Sílica de bambu (≥70% sílica) 300 mg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Mineral / nutracêutico."},
 {id:"queratina",nome:"Queratina hidrolisada",sci:"",classe:"Aminoácido",tags:["cabelo","unhas"],
  resumo:"Proteína estrutural do cabelo e unha, hidrolisada em peptídeos para absorção oral. A hipótese é fornecer os aminoácidos sulfurados (cistina) específicos da fibra capilar. Evidência clínica limitada.",
  blocos:[{d:"Cabelo / unhas",n:"D",t:"Fornece aminoácidos da fibra; evidência clínica fraca por via oral."}],
  dose:"500 mg/dia (Cynatine HNS ou similar).",seg:"Bem tolerada.",mani:"Queratina hidrolisada solúvel 500 mg — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Nutracêutico."},
 {id:"sawpalmettofem",nome:"Saw palmetto (alopecia)",sci:"Serenoa repens",classe:"Fitoterápico",tags:["alopecia androgenética","DHT"],
  resumo:"Mesmo extrato lipídico da Serenoa repens da próstata, aqui pela inibição da 5-alfa-redutase (reduz di-hidrotestosterona (DHT, a forma potente da testosterona)) aplicada à alopecia androgenética. Alternativa fitoterápica mais branda à finasterida; evidência menor.",
  blocos:[{d:"Alopecia androgenética",n:"C",t:"320 mg/dia oral; inibe a enzima que ativa a testosterona (5-alfa-redutase), sinal modesto vs. finasterida."}],
  dose:"320 mg/dia de extrato lipídico (ou tópico).",seg:"desconforto leve no estômago/intestino. Menos potente que finasterida. Pode atrapalhar o exame de próstata (PSA), escondendo alterações.",mani:"Saw palmetto (ext. lipídico) 320 mg — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Fitoterápico."},
 {id:"vitexagnus",nome:"Vitex (agnocasto)",sci:"Vitex agnus-castus",classe:"Fitoterápico",tags:["TPM","ciclo menstrual","mastalgia","prolactina"],
  resumo:"Fruto do Vitex agnus-castus, fitoterápico de referência para tensão pré-menstrual (TPM). Atua sobre receptores dopaminérgicos reduzindo a prolactina, o que regulariza o ciclo e alivia mastalgia. Padronização por agnusídeo/casticina.",
  blocos:[{d:"TPM / mastalgia",n:"A",t:"Extrato padronizado (ex.: Ze 440) 20 mg/dia; reduz sintomas de tensão pré-menstrual (TPM) e mastalgia cíclica."},{d:"Irregularidade menstrual (hiperprolactinemia leve)",n:"C",t:"Reduz prolactina; pode regularizar ciclos."}],
  dose:"Extrato padronizado, 20-40 mg/dia.",seg:"CONTRAINDICADO com agonistas/antagonistas dopaminérgicos, anticoncepcional e na gestação.",mani:"Vitex agnus-castus (ext. padr. Ze 440) 20 mg — 30 cápsulas.\nTomar 1 cápsula pela manhã.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"blackcohosh",nome:"Cimicífuga",sci:"Actaea racemosa",classe:"Fitoterápico",tags:["menopausa","fogachos"],
  resumo:"Rizoma da Actaea/Cimicifuga racemosa (black cohosh), fitoterápico mais estudado para fogachos da menopausa. Mecanismo não totalmente esclarecido (não é estrogênico clássico). Padronização por glicosídeos triterpênicos.",
  blocos:[{d:"Fogachos / sintomas da menopausa",n:"B",t:"Extrato padronizado (ex.: Remifemin) 40-80 mg/dia; reduz fogachos vs. placebo (heterogêneo)."}],
  dose:"Extrato padronizado, 40-80 mg/dia.",seg:"Há relatos raros de lesão no fígado — acompanhar com exames. Evitar em doença do fígado e câncer de mama (controverso).",mani:"Cimicífuga (ext. padr.) 40 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"redclover",nome:"Trevo-vermelho",sci:"Trifolium pratense",classe:"Fitoterápico",tags:["menopausa","fogachos","isoflavonas"],
  resumo:"Flores do Trifolium pratense, ricas em isoflavonas (biochanina A, formononetina) com ação fitoestrogênica. Usado para fogachos da menopausa, com evidência modesta e mista. Padronização por isoflavonas.",
  blocos:[{d:"Fogachos",n:"C",t:"40-80 mg/dia de isoflavonas; redução modesta e inconsistente de fogachos."}],
  dose:"40-80 mg/dia de isoflavonas de trevo-vermelho.",seg:"Cautela em câncer sensível a hormônios (como alguns de mama ou próstata) (fitoestrógeno) e com remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel).",mani:"Trevo-vermelho (ext. padr. isoflavonas) 40 mg — 60 cápsulas.\nTomar 1-2 cápsulas/dia.",reg:"Fitoterápico."},
 {id:"isoflavonasoja",nome:"Isoflavonas de soja",sci:"Glycine max",classe:"Nutracêutico",tags:["menopausa","fogachos","saúde óssea"],
  resumo:"Genisteína e daidzeína da soja, fitoestrógenos que se ligam a receptores de estrogênio (preferencialmente beta). Reduzem fogachos e têm sinal ósseo. O efeito depende de a pessoa produzir equol (microbiota).",
  blocos:[{d:"Fogachos",n:"B",t:"50-100 mg/dia de isoflavonas; reduz fogachos, melhor em produtoras de equol."},{d:"Saúde óssea (pós-menopausa)",n:"C",t:"Pequeno efeito sobre densidade óssea."}],
  dose:"50-100 mg/dia de isoflavonas de soja.",seg:"Cautela em câncer de mama hormônio-dependente (controverso). Pode afetar tireoide em deficiência de iodo.",mani:"Isoflavonas de soja 50 mg — 60 cápsulas.\nTomar 1-2 cápsulas/dia.",reg:"Nutracêutico."},
 {id:"dongquai",nome:"Dong quai",sci:"Angelica sinensis",classe:"Fitoterápico",tags:["menopausa","ciclo menstrual"],
  resumo:"Raiz da Angelica sinensis, 'ginseng feminino' da medicina chinesa, tradicional para queixas menstruais e da menopausa. Frequentemente em fórmulas combinadas. Evidência isolada fraca.",
  blocos:[{d:"Sintomas da menopausa / menstruais",n:"D",t:"Tradicional; isolada não superou placebo em fogachos."}],
  dose:"Extrato conforme rótulo, geralmente em fórmula combinada.",seg:"Deixa a pele mais sensível ao sol. Cautela com remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel) (substâncias que afinam o sangue (cumarinas)). Evitar na gestação.",mani:"Dong quai (ext. padr.) 500 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico."},
 {id:"maracujapassi",nome:"Erva-cidreira",sci:"Melissa officinalis",classe:"Fitoterápico",tags:["ansiedade","sono","digestivo","cognição"],
  resumo:"Folha da Melissa officinalis, calmante tradicional. Os ácidos rosmarínico e fenólicos têm ação ansiolítica leve (modulação GABA) e melhoram humor e cognição sob estresse. Também digestiva (carminativa).",
  blocos:[{d:"Ansiedade / estresse",n:"B",t:"Extrato padronizado 300-600 mg; reduz ansiedade aguda e melhora humor."},{d:"Sono",n:"C",t:"Combinada à valeriana, melhora sono subjetivo."}],
  dose:"300-600 mg/dia de extrato padronizado (ácido rosmarínico).",seg:"Sonolência. Cautela com remédios calmantes/para dormir e em tireoide lenta (hipotireoidismo) (dados conflitantes).",mani:"Erva-cidreira (ext. padr.) 300 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"kava",nome:"Kava",sci:"Piper methysticum",classe:"Fitoterápico",tags:["ansiedade"],
  resumo:"Raiz do Piper methysticum do Pacífico, ansiolítico potente via kavalactonas (modulação GABA). Tem boa evidência para ansiedade, mas o risco de hepatotoxicidade limita o uso. Padronização por kavalactonas.",
  blocos:[{d:"Ansiedade (TAG)",n:"B",t:"Kavalactonas 120-280 mg/dia; reduz ansiedade comparável a benzodiazepínico em curto prazo."}],
  dose:"Extrato padronizado fornecendo 120-280 mg/dia de kavalactonas, curto prazo.",seg:"RISCO de casos graves de lesão no fígado — monitorar enzimas, evitar álcool e uso prolongado, contraindicado em doença do fígado. Restrito/banido em alguns países.",mani:"Kava (ext. padr. kavalactonas) 100 mg — 30 cápsulas.\nUso de curto prazo, sob monitorização hepática.",reg:"Fitoterápico (uso restrito)."},
 {id:"mucuna",nome:"Mucuna pruriens",sci:"",classe:"Fitoterápico",tags:["dopamina","Parkinson","libido","humor"],
  resumo:"Semente da Mucuna pruriens, fonte natural de L-dopa (precursor direto da dopamina). Estudada como adjuvante no Parkinson e para libido/humor. Padronização pelo teor de L-dopa.",
  blocos:[{d:"Parkinson (adjuvante)",n:"B",t:"Padronizada em L-dopa; eficácia comparável à levodopa em estudos pequenos."},{d:"Libido / humor / fertilidade",n:"C",t:"Via dopaminérgica; sinal preliminar."}],
  dose:"Extrato padronizado em L-dopa (ex.: 15%), conforme objetivo e orientação.",seg:"Como funciona igual a um remédio de Parkinson (fornece L-dopa), interage com a levodopa, com antidepressivos antigos do tipo IMAO e com antipsicóticos. Pode causar enjoo e movimentos involuntários. Usar apenas com acompanhamento médico.",mani:"Mucuna pruriens (ext. 15% L-dopa) 300 mg — 60 cápsulas.\nTomar conforme orientação médica.",reg:"Fitoterápico."},
 {id:"sceletium",nome:"Sceletium (kanna)",sci:"Sceletium tortuosum",classe:"Fitoterápico",tags:["humor","ansiedade","estresse"],
  resumo:"Planta sul-africana (kanna), cujos alcaloides (mesembrina) inibem a recaptação de serotonina e a PDE4. Usada para humor, ansiedade e estresse. Padronização Zembrin. Evidência inicial promissora.",
  blocos:[{d:"Ansiedade / humor / estresse",n:"C",t:"Extrato Zembrin 25 mg/dia; melhora resposta ao estresse em estudos iniciais."}],
  dose:"25 mg/dia de extrato padronizado (Zembrin).",seg:"NÃO combinar com antidepressivos que mexem na serotonina — os do tipo ISRS (como sertralina, fluoxetina) ou os antigos do tipo IMAO — pelo risco de excesso de serotonina. Ainda há poucos dados sobre o uso prolongado.",mani:"Sceletium (ext. Zembrin) 25 mg — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Fitoterápico."},
 {id:"noni",nome:"Noni",sci:"Morinda citrifolia",classe:"Fitoterápico",tags:["antioxidante","imunidade","energia"],
  resumo:"Fruto da Morinda citrifolia do Pacífico, popular como 'superfruta'. Rico em antioxidantes, mas as alegações de saúde superam muito a evidência. Há relatos de hepatotoxicidade com sucos concentrados.",
  blocos:[{d:"Antioxidante / energia / imunidade",n:"D",t:"Alegações amplas sem suporte clínico robusto."}],
  dose:"Suco ou extrato conforme rótulo.",seg:"Há relatos de lesão no fígado. Rico em potássio (cautela em quem tem problema nos rins e remédios que retêm potássio).",mani:"Noni (ext. padr.) 500 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico / alimento."},
 {id:"graviola",nome:"Graviola",sci:"Annona muricata",classe:"Fitoterápico",tags:["antioxidante"],
  resumo:"Fruto e folha da Annona muricata, popular com alegações anticâncer baseadas em estudos in vitro (acetogeninas). Importante: as acetogeninas são neurotóxicas e associadas a parkinsonismo atípico no uso crônico das folhas.",
  blocos:[{d:"Alegação anticâncer",n:"D",t:"In vitro apenas; SEM evidência clínica e com sinal de neurotoxicidade."}],
  dose:"Uso não recomendado como suplemento crônico.",seg:"ALERTA: acetogeninas neurotóxicas — associação a parkinsonismo atípico. Evitar uso crônico das folhas/extrato.",mani:"Uso não recomendado pela relação risco/benefício desfavorável.",reg:"Fitoterápico (cautela)."},
 {id:"cardomariano2",nome:"Berberis vulgaris",sci:"",classe:"Fitoterápico",tags:["controle glicêmico","digestivo","fígado"],
  resumo:"Casca da raiz da Berberis vulgaris (espinheiro-comum), fonte de berberina, usada na fitoterapia europeia para fígado e digestão. Mesma farmacologia metabólica da berberina, com a matriz vegetal.",
  blocos:[{d:"Controle glicêmico / lipídios",n:"B",t:"Via berberina; melhora metabólica."},{d:"Digestivo / hepatobiliar",n:"D",t:"Uso tradicional colerético."}],
  dose:"Extrato padronizado em berberina, conforme objetivo.",seg:"Mesmas da berberina (interfere em uma enzima do fígado que processa medicamentos); contraindicada na gestação.",mani:"Berberis vulgaris (ext. padr. berberina) 400 mg — 60 cápsulas.\nTomar 1 cápsula antes das refeições.",reg:"Fitoterápico."},
 {id:"taraxacum",nome:"Dente-de-leão",sci:"Taraxacum officinale",classe:"Fitoterápico",tags:["diurético","digestivo","fígado"],
  resumo:"Raiz e folha do Taraxacum officinale. A folha é diurético tradicional (rica em potássio, compensando a perda); a raiz é colerética/digestiva. Evidência humana limitada, mas perfil de segurança bom.",
  blocos:[{d:"Diurético / digestivo",n:"D",t:"Uso tradicional; diurese e suporte digestivo, pouca evidência clínica."}],
  dose:"Folha (diurético) ou raiz (digestivo), extrato conforme rótulo.",seg:"Alergia a plantas da família da camomila/margarida (Asteraceae). Cautela com diuréticos, lítio e em obstrução biliar.",mani:"Dente-de-leão (ext. padr.) 250 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"uvaursi",nome:"Uva-ursina",sci:"Arctostaphylos uva-ursi",classe:"Fitoterápico",tags:["ITU","antisséptico urinário"],
  resumo:"Folha da Arctostaphylos uva-ursi, contendo arbutina, convertida em hidroquinona (antisséptica) na urina alcalina. Usada em infecção urinária não complicada de curto prazo. Uso limitado pela toxicidade da hidroquinona.",
  blocos:[{d:"ITU não complicada (curto prazo)",n:"C",t:"Arbutina padronizada; efeito antisséptico urinário em uso breve."}],
  dose:"Extrato fornecendo 400-840 mg/dia de arbutina, máximo ~1 semana, urina alcalina.",seg:"Hidroquinona é hepato/carcinogênica — máximo ~1 semana, não repetir mais de 5x/ano. Evitar na gestação e em problema nos rins.",mani:"Uva-ursina (ext. padr. arbutina) 200 mg — 30 cápsulas.\nTomar conforme orientação, uso breve.",reg:"Fitoterápico (uso restrito)."},
 {id:"dimateste",nome:"Pygeum",sci:"Prunus africana",classe:"Fitoterápico",tags:["HPB","próstata","sintomas urinários"],
  resumo:"Casca da Prunus africana (cerejeira-africana), fitoterápico para sintomas urinários da aumento benigno da próstata (HPB), com ação anti-inflamatória e sobre fatores de crescimento prostáticos. Frequentemente combinado ao saw palmetto. Padronização por fitosteróis.",
  blocos:[{d:"HPB — sintomas urinários",n:"B",t:"100-200 mg/dia de extrato padronizado; melhora fluxo e noctúria."}],
  dose:"100-200 mg/dia de extrato padronizado (13% fitosteróis).",seg:"desconforto leve no estômago/intestino. Bem tolerado. Pode atrapalhar o exame de próstata (PSA).",mani:"Pygeum (ext. padr. 13% fitosteróis) 100 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico."},
 {id:"urtiga",nome:"Urtiga (raiz)",sci:"Urtica dioica",classe:"Fitoterápico",tags:["HPB","próstata","SHBG"],
  resumo:"Raiz da Urtica dioica, usada na aumento benigno da próstata (HPB) por modular a SHBG e a aromatase, reduzindo o estímulo prostático. A folha tem outros usos (alergia, articular). Frequentemente em fórmula com saw palmetto/pygeum.",
  blocos:[{d:"HPB — sintomas urinários",n:"B",t:"Extrato de raiz 300-600 mg/dia; melhora sintomas, sobretudo combinado."},{d:"Rinite alérgica (folha)",n:"C",t:"Folha liofilizada; alívio sintomático modesto."}],
  dose:"Raiz: extrato 300-600 mg/dia.",seg:"desconforto leve no estômago/intestino. Cautela com remédios para pressão alta, diuréticos e remédios para diabetes.",mani:"Urtiga raiz (ext. padr.) 300 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"licopeno",nome:"Licopeno",sci:"",classe:"Nutracêutico",tags:["próstata","antioxidante","cardiovascular"],
  resumo:"Carotenoide vermelho do tomate (mais biodisponível cozido/com gordura), antioxidante com tropismo prostático. Dado epidemiológico associa maior ingestão a menor risco de câncer de próstata; suplementação tem evidência mista.",
  blocos:[{d:"Saúde prostática",n:"C",t:"10-30 mg/dia; dado observacional favorável, suplementação inconsistente."},{d:"Cardiovascular / antioxidante",n:"C",t:"Pequeno efeito sobre a pressão e LDL."}],
  dose:"10-30 mg/dia, com refeição gordurosa.",seg:"Bem tolerado. Doses muito altas: licopenodermia (inofensiva).",mani:"Licopeno 15 mg — 60 cápsulas.\nTomar 1 cápsula/dia com refeição.",reg:"Nutracêutico."}
,
 {id:"creatinahcl",nome:"Creatina HCl",sci:"",classe:"Nutracêutico",tags:["performance","massa magra","solubilidade"],
  resumo:"Forma de creatina ligada a cloridrato, mais solúvel que a monoidratada — vendida com a promessa de menor dose e menos retenção. Na prática, a monoidratada continua sendo o padrão-ouro custo-efetivo; a HCl não demonstrou superioridade clínica.",
  blocos:[{d:"Performance / massa magra",n:"C",t:"Mesmo efeito da monoidratada por grama de creatina; sem superioridade comprovada."}],
  dose:"~2-3 g/dia (equivalente em creatina à monoidratada).",seg:"Muito segura. Marketing supera a evidência vs. monoidratada.",mani:"Creatina HCl 2 g — dose diária.\nTomar 2-3 g/dia.",reg:"Nutracêutico."},
 {id:"betaina2",nome:"Betaína anidra (performance)",sci:"Trimetilglicina",classe:"Nutracêutico",tags:["performance","força","potência"],
  resumo:"A mesma TMG da homocisteína, aqui pelo ângulo ergogênico: como osmólito, hidrata a célula muscular e pode favorecer força e potência. Evidência modesta e heterogênea em performance.",
  blocos:[{d:"Força / potência",n:"C",t:"2,5 g/dia; sinal pequeno e inconsistente sobre potência."}],
  dose:"2,5 g/dia (2 doses de 1,25 g).",seg:"Desconforto no estômago/intestino. Pode elevar levemente o LDL em doses altas.",mani:"Betaína anidra 1,25 g — tomar 2x/dia.",reg:"Nutracêutico."},
 {id:"bicarbonato",nome:"Bicarbonato de sódio",sci:"",classe:"Nutracêutico",tags:["performance","tampão","alta intensidade"],
  resumo:"Tampão extracelular que neutraliza a acidose induzida pelo exercício de alta intensidade (60s-10min), retardando a fadiga. Ergogênico bem estabelecido, limitado pelo desconforto no estômago/intestino — formas com revestimento ajudam.",
  blocos:[{d:"Performance de alta intensidade",n:"B",t:"0,2-0,3 g/kg 60-90 min pré-treino; melhora desempenho em esforços de 1-10 min."}],
  dose:"0,2-0,3 g/kg, 60-150 min antes (fracionar para reduzir o desconforto no estômago/intestino).",seg:"Diarreia/distensão (frequente). Carga de sódio — cautela em hipertensão e problema nos rins.",mani:"Bicarbonato de sódio — 0,2-0,3 g/kg pré-treino, fracionado.",reg:"Nutracêutico / alimento."},
 {id:"cafeinatablet",nome:"Cafeína + L-teanina (nootrópico)",sci:"",classe:"Estimulante",tags:["foco","atenção","cognição"],
  resumo:"A dupla cafeína:L-teanina (proporção ~1:2) é o nootrópico mais validado: a cafeína dá o alerta, a teanina suaviza o nervosismo, resultando em foco limpo sem tremor nem queda. Sinergia clássica.",
  blocos:[{d:"Foco / atenção sustentada",n:"A",t:"100 mg cafeína + 200 mg teanina; melhora atenção e reduz jitter."}],
  dose:"100 mg cafeína + 200 mg L-teanina, conforme necessário.",seg:"Evitar após 15h. Cautela em arritmia, ansiedade e hipertensão.",mani:"Cafeína 100 mg + L-teanina 200 mg — 30 cápsulas.\nTomar 1 cápsula pela manhã ou pré-tarefa.",reg:"Estimulante / suplemento."},
 {id:"noopept",nome:"Noopept",sci:"",classe:"Nutracêutico",tags:["cognição","memória","nootrópico"],
  resumo:"Dipeptídeo nootrópico sintético de origem russa, estruturalmente relacionado ao piracetam, porém ~1000x mais potente por mg. Modula BDNF e NGF. Evidência majoritariamente russa/pré-clínica; status regulatório variável.",
  blocos:[{d:"Cognição / memória",n:"D",t:"10-30 mg/dia; estudos majoritariamente russos, qualidade limitada."}],
  dose:"10-30 mg/dia.",seg:"Dados de segurança de longo prazo escassos. Status regulatório incerto.",mani:"Noopept 10 mg — 30 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Nutracêutico (regulamentação variável)."},
 {id:"piracetam",nome:"Piracetam",sci:"",classe:"Nutracêutico",tags:["cognição","nootrópico"],
  resumo:"O primeiro nootrópico (anos 60), derivado do GABA, modula membranas neuronais e neurotransmissão colinérgica/glutamatérgica. Usado em declínio cognitivo e mioclonia; nos EUA não é suplemento aprovado. Frequentemente com colina.",
  blocos:[{d:"Declínio cognitivo (idosos)",n:"C",t:"1,2-4,8 g/dia; sinal modesto em demência/declínio vascular."},{d:"Cognição (jovem saudável)",n:"D",t:"Sem benefício claro."}],
  dose:"1,2-4,8 g/dia, fracionado (com fonte de colina).",seg:"Bem tolerado. Cautela em insuficiência renal. Status regulatório variável.",mani:"Piracetam 800 mg — uso conforme orientação, com colina.",reg:"Nutracêutico / medicamento conforme país."},
 {id:"vinpocetina",nome:"Vinpocetina",sci:"Vinca minor",classe:"Fitoterápico",tags:["cognição","circulação cerebral"],
  resumo:"Derivado semissintético da vincamina (pervinca). Vasodilatador cerebral e neuroprotetor, usado em declínio cognitivo vascular. Evitar na gestação (risco fetal relatado).",
  blocos:[{d:"Cognição vascular / circulação cerebral",n:"C",t:"5-10 mg 3x/dia; sinal em declínio cognitivo vascular."}],
  dose:"5-10 mg 3x/dia com refeições.",seg:"CONTRAINDICADA na gestação. Cautela com remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel). Status de suplemento revogado em alguns países.",mani:"Vinpocetina 10 mg — 60 cápsulas.\nTomar 1 cápsula 2-3x/dia.",reg:"Fitoterápico / medicamento conforme país."},
 {id:"huperzina",nome:"Huperzina A",sci:"Huperzia serrata",classe:"Fitoterápico",tags:["memória","cognição","acetilcolinesterase"],
  resumo:"Alcaloide do musgo Huperzia serrata, inibidor potente e seletivo da acetilcolinesterase (eleva acetilcolina) — mecanismo igual ao de fármacos para Alzheimer. Usado em memória; potente, exige cautela com dose.",
  blocos:[{d:"Memória / declínio cognitivo",n:"C",t:"50-200 mcg/dia; melhora cognição em demência em estudos chineses."}],
  dose:"50-200 mcg/dia (microgramas — muito potente).",seg:"Efeitos colinérgicos (náusea, bradicardia). Não combinar com anticolinesterásicos. Cautela em asma/epilepsia.",mani:"Huperzina A 100 mcg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Fitoterápico."},
 {id:"galantamina",nome:"Galantamina",sci:"Galanthus",classe:"Fitoterápico",tags:["memória","cognição","sonho lúcido"],
  resumo:"Alcaloide do narciso (Galanthus), inibidor da acetilcolinesterase e modulador nicotínico — é fármaco aprovado para Alzheimer leve-moderado. Também popular para sonhos lúcidos. Uso exige supervisão.",
  blocos:[{d:"Alzheimer leve-moderado",n:"A",t:"16-24 mg/dia; melhora cognição (uso como medicamento)."}],
  dose:"Como medicamento: 16-24 mg/dia, titulado.",seg:"Efeitos colinérgicos. Cautela cardíaca, asma e Desconforto no estômago/intestino. Uso sob prescrição para Alzheimer.",mani:"Galantamina — uso como medicamento, sob prescrição.",reg:"Medicamento / fitoterápico isolado."},
 {id:"theacrine",nome:"Teacrina",sci:"",classe:"Estimulante",tags:["energia","foco","sem tolerância"],
  resumo:"Alcaloide semelhante à cafeína (do chá kucha), que age sobre adenosina e dopamina com início mais lento, duração maior e menos tolerância/taquifilaxia que a cafeína. Usado em pré-treinos e foco.",
  blocos:[{d:"Energia / foco",n:"C",t:"100-200 mg; energia sustentada, menos tolerância que cafeína."}],
  dose:"100-200 mg/dia.",seg:"Menos efeito cardiovascular que cafeína, mas cautela similar. Dados de longo prazo limitados.",mani:"Teacrina 100 mg — 30 cápsulas.\nTomar 1 cápsula pela manhã.",reg:"Nutracêutico."},
 {id:"dynamine",nome:"Metilliberina",sci:"Dynamine",classe:"Estimulante",tags:["energia","foco"],
  resumo:"Alcaloide purínico (do kucha) parecido com a teacrina, de ação ainda mais rápida sobre dopamina e adenosina. Usado em fórmulas energéticas, geralmente combinado à cafeína/teacrina. Evidência inicial.",
  blocos:[{d:"Energia / foco agudo",n:"D",t:"100-200 mg; efeito agudo, evidência preliminar."}],
  dose:"100-200 mg conforme necessário.",seg:"Estimulante — cautela cardiovascular. Dados limitados.",mani:"Metilliberina (Dynamine) 100 mg — 30 cápsulas.\nTomar 1 cápsula pré-tarefa.",reg:"Nutracêutico."},
 {id:"sabiarosa",nome:"Rhodiola + cordyceps (energia)",sci:"",classe:"Adaptógeno",tags:["fadiga","performance","energia"],
  resumo:"Combinação adaptogênica popular para fadiga e performance aeróbica: a rhodiola atua no estresse e a fadiga mental, o cordyceps na utilização de oxigênio. A evidência de cada um é preliminar; a combinação não foi testada como unidade.",
  blocos:[{d:"Fadiga / performance aeróbica",n:"C",t:"Rhodiola 200 mg + cordyceps 1 g; efeito antifadiga combinado."}],
  dose:"Rhodiola 200-400 mg + cordyceps 1-3 g/dia.",seg:"Cautela em bipolar (rhodiola) e com remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel)/remédios que baixam a imunidade (usados em transplante e em doenças autoimunes) (cordyceps).",mani:"Rhodiola 200 mg + Cordyceps 500 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico."},
 {id:"d3k2",nome:"Vitamina D3 + K2",sci:"",classe:"Vitamina",tags:["saúde óssea","saúde vascular","sinergia"],
  resumo:"Combinação racional: a D3 aumenta a absorção de cálcio, e a K2 (MK-7) direciona esse cálcio para o osso e o afasta das artérias (ativando osteocalcina e MGP). A dupla busca o benefício ósseo sem o risco vascular do cálcio mal direcionado.",
  blocos:[{d:"Saúde óssea / direcionamento de cálcio",n:"B",t:"D3 2000 UI + K2 100 mcg/dia; sinergia óssea e vascular."}],
  dose:"D3 1000-2000 UI + K2 (MK-7) 90-180 mcg/dia.",seg:"A vitamina K2 ANULA O EFEITO do remédio que afina o sangue varfarina (Marevan) — contraindicado nesse caso.",mani:"Vitamina D3 2000 UI + K2 (MK-7) 100 mcg — 60 cápsulas.\nTomar 1 cápsula/dia com refeição.",reg:"Vitamina / suplemento."},
 {id:"magtreonato",nome:"Magnésio L-treonato",sci:"Magtein",classe:"Mineral",tags:["cognição","memória","sono"],
  resumo:"Forma de magnésio que atravessa melhor a barreira hematoencefálica, elevando o magnésio cerebral — daí o foco em cognição e memória (não em câimbra/intestino). Forma cara e específica para o cérebro.",
  blocos:[{d:"Cognição / memória",n:"C",t:"~2 g/dia (≈144 mg Mg elementar); sinal em memória em estudos-piloto."},{d:"Sono",n:"C",t:"Pode melhorar sono via magnésio cerebral."}],
  dose:"~2 g/dia de L-treonato (≈144 mg de Mg elementar).",seg:"Bem tolerado. Custo elevado vs. outras formas.",mani:"Magnésio L-treonato (Magtein) 2 g — dose diária.\nTomar à noite.",reg:"Mineral / nutracêutico."},
 {id:"magmalato",nome:"Magnésio malato",sci:"",classe:"Mineral",tags:["fadiga","fibromialgia","energia"],
  resumo:"Magnésio ligado ao ácido málico (intermediário do ciclo de Krebs). Bem absorvido e com componente energético do malato — preferido em fadiga e fibromialgia. Menos laxativo que óxido/citrato.",
  blocos:[{d:"Fadiga / fibromialgia",n:"C",t:"Malato fornece magnésio + suporte energético; sinal em fadiga."}],
  dose:"Equiv. 200-400 mg de Mg elementar/dia.",seg:"Melhor tolerado que formas laxativas. Cautela na insuficiência renal.",mani:"Magnésio malato (equiv. 200 mg Mg) — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Mineral / suplemento."},
 {id:"zincopicolinato",nome:"Zinco picolinato",sci:"",classe:"Mineral",tags:["imunidade","absorção","acne"],
  resumo:"Zinco quelado ao ácido picolínico, uma das formas mais bem absorvidas. Mesmas indicações do zinco (imunidade, pele, testosterona em deficientes), com vantagem de biodisponibilidade.",
  blocos:[{d:"Imunidade / pele (deficiência)",n:"C",t:"Forma bem absorvida; corrige deficiência com eficiência."}],
  dose:"15-30 mg de zinco elementar/dia.",seg:"Náusea em jejum. Megadose crônica causa deficiência de cobre.",mani:"Zinco picolinato (15 mg elementar) — 60 cápsulas.\nTomar 1 cápsula/dia com refeição.",reg:"Mineral / suplemento."},
 {id:"molibdenio",nome:"Molibdênio",sci:"",classe:"Mineral",tags:["detox","sulfito","enzimas"],
  resumo:"Oligoelemento essencial, cofator da sulfito oxidase e da xantina oxidase (metabolismo de aminoácidos sulfurados e purinas). Deficiência é rara; reposição interessa em erros do metabolismo e sensibilidade a sulfitos.",
  blocos:[{d:"Cofator enzimático (deficiência)",n:"C",t:"Reposição em deficiência rara; cofator da sulfito oxidase."}],
  dose:"45-150 mcg/dia (RDA 45 mcg).",seg:"Excesso pode interferir no cobre e elevar ácido úrico.",mani:"Molibdênio 150 mcg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Mineral / suplemento."},
 {id:"boro",nome:"Boro",sci:"",classe:"Mineral",tags:["testosterona","saúde óssea","SHBG"],
  resumo:"Oligoelemento que influencia o metabolismo de hormônios esteroides (eleva testosterona livre reduzindo SHBG) e a saúde óssea (metabolismo de cálcio e vitamina D). Doses suplementares pequenas.",
  blocos:[{d:"Testosterona livre / hormônios",n:"C",t:"6-10 mg/dia; reduz SHBG e eleva testosterona livre em estudos pequenos."},{d:"Saúde óssea",n:"D",t:"Mecanístico; desfecho ósseo não estabelecido."}],
  dose:"3-10 mg/dia.",seg:"Doses altas (>20 mg) são tóxicas. Margem segura nas doses usuais.",mani:"Boro (quelato) 6 mg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Mineral / suplemento."},
 {id:"vanadio",nome:"Vanádio",sci:"Sulfato de vanadil",classe:"Mineral",tags:["controle glicêmico"],
  resumo:"Oligoelemento com ação insulino-mimética em modelos. Foi promovido para glicemia e ganho muscular, mas as doses eficazes ficam perto das tóxicas e a evidência humana é fraca — uso desencorajado.",
  blocos:[{d:"Controle glicêmico",n:"D",t:"Insulino-mimético em modelos; janela tóxica estreita, evidência humana fraca."}],
  dose:"Uso não recomendado rotineiramente (janela tóxica estreita).",seg:"Toxicidade no estômago/intestino e nos rins em doses 'eficazes'. Margem de segurança ruim.",mani:"Uso não recomendado pela relação risco/benefício.",reg:"Mineral (cautela)."},
 {id:"potassiocit",nome:"Citrato de potássio",sci:"",classe:"Mineral",tags:["litíase","pressão","alcalinizante"],
  resumo:"Sal de potássio alcalinizante, usado na prevenção de cálculos renais (cálcio/ácido úrico) por elevar o citrato urinário, e como fonte de potássio. Diferente do cloreto de potássio (reposição pura).",
  blocos:[{d:"Prevenção de litíase renal",n:"A",t:"Eleva citrato urinário; reduz recorrência de cálculos de cálcio (uso médico)."},{d:"Pressão arterial",n:"B",t:"Aporte de potássio reduz a pressão."}],
  dose:"Conforme indicação médica (ex.: 20-60 mEq/dia em litíase).",seg:"RISCO de hipercalemia — contraindicado em problema nos rins avançada e com remédios que retêm potássio/remédios de pressão do tipo IECA (como enalapril, losartana). Desconforto no estômago/intestino.",mani:"Citrato de potássio — uso conforme prescrição (litíase/pressão).",reg:"Mineral / medicamento."},
 {id:"epaalto",nome:"Ômega-3 alta concentração EPA",sci:"",classe:"Ácido graxo",tags:["humor","depressão","inflamação"],
  resumo:"Formulação de ômega-3 com predomínio de EPA sobre DHA (proporção ≥2:1 ou EPA puro). O EPA é a fração com melhor sinal em humor/depressão e inflamação — diferente do DHA, mais estrutural/cognitivo.",
  blocos:[{d:"Depressão (adjuvante)",n:"B",t:"≥1 g/dia de EPA (formulações ricas em EPA); adjuvante antidepressivo."},{d:"Inflamação",n:"B",t:"Reduz marcadores inflamatórios."}],
  dose:"1-2 g/dia de EPA (formulação rica em EPA).",seg:"Arrotos, Desconforto no estômago/intestino. Cautela com remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel) em doses altas.",mani:"Ômega-3 EPA alto (≥2:1 EPA:DHA) 1 g — 60 cápsulas.\nTomar 1-2 cápsulas 1-2x/dia.",reg:"Suplemento."},
 {id:"dhaalto",nome:"Ômega-3 alta concentração DHA",sci:"",classe:"Ácido graxo",tags:["cognição","gestação","visão","neurodesenvolvimento"],
  resumo:"Formulação rica em DHA, a fração estrutural das membranas neuronais e da retina. Prioritária na gestação/lactação (neurodesenvolvimento fetal) e em cognição/visão, onde supera as fórmulas ricas em EPA.",
  blocos:[{d:"Neurodesenvolvimento (gestação)",n:"B",t:"200-300 mg DHA/dia na gestação; suporte ao cérebro e retina fetais."},{d:"Cognição / visão",n:"C",t:"Suporte estrutural; benefício em déficit."}],
  dose:"Gestação: ≥200 mg DHA/dia; geral 500-1000 mg.",seg:"Bem tolerado. Cautela com remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel) em doses altas.",mani:"Ômega-3 DHA alto 500 mg — 60 cápsulas.\nTomar 1-2 cápsulas/dia.",reg:"Suplemento."},
 {id:"gla",nome:"GLA (borragem)",sci:"Borago officinalis",classe:"Ácido graxo",tags:["pele","dermatite atópica","artrite","TPM"],
  resumo:"Ácido gama-linolênico (ômega-6) do óleo de borragem (mais concentrado que a prímula). Precursor de prostaglandinas anti-inflamatórias da série 1. Usado em dermatite atópica, artrite reumatoide e tensão pré-menstrual (TPM).",
  blocos:[{d:"Artrite reumatoide (adjuvante)",n:"B",t:"1,4-2,8 g GLA/dia; reduz dor e rigidez articular."},{d:"Dermatite atópica / pele",n:"C",t:"Sinal inconsistente."}],
  dose:"GLA 1-3 g/dia (óleo de borragem padronizado).",seg:"Cautela com remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel) e em epilepsia. desconforto leve no estômago/intestino.",mani:"Óleo de borragem (≥20% GLA) 1 g — 60 cápsulas.\nTomar 1-2 cápsulas 2x/dia.",reg:"Suplemento."},
 {id:"oleococo",nome:"Óleo de coco",sci:"Cocos nucifera",classe:"Ácido graxo",tags:["energia","TCM","saciedade"],
  resumo:"Gordura saturada rica em triglicerídeos de cadeia média (TCM) (sobretudo láurico/C12). Promovido para energia, peso e cognição, mas o efeito é modesto e ele eleva o LDL como gordura saturada — não é o 'super-alimento' do marketing.",
  blocos:[{d:"Energia / saciedade",n:"C",t:"Parte como triglicerídeos de cadeia média (TCM); efeito modesto sobre saciedade."},{d:"Perda de peso / cognição",n:"D",t:"Alegações superam a evidência; eleva LDL."}],
  dose:"1-2 colheres/dia (uso culinário).",seg:"Eleva LDL (gordura saturada) — moderação em dislipidemia.",mani:"Óleo de coco — uso culinário, 1-2 colheres/dia.",reg:"Alimento."},
 {id:"oleoprimulaepo",nome:"Ácido linoleico conjugado (CLA t10c12)",sci:"",classe:"Ácido graxo",tags:["composição corporal"],
  resumo:"Isômero específico do CLA promovido para gordura corporal. Reforça o que já consta: o efeito é mínimo, clinicamente irrelevante, e pode piorar a resistência à insulina e marcadores hepáticos. Entra marcado como tal.",
  blocos:[{d:"Composição corporal",n:"D",t:"Efeito mínimo; pode piorar resistência à insulina e fígado."}],
  dose:"Não recomendado rotineiramente.",seg:"Possível piora de resistência à insulina e de marcadores hepáticos.",mani:"Uso não recomendado pela baixa relação benefício/risco.",reg:"Suplemento."},
 {id:"berberinacanela",nome:"Cromo + canela (metabólico)",sci:"",classe:"Nutracêutico",tags:["controle glicêmico","resistência insulínica"],
  resumo:"Combinação metabólica popular: cromo (sinalização da insulina) + canela (polifenóis sensibilizadores). Cada um tem efeito pequeno e inconsistente; a combinação é racional mas pouco testada como unidade.",
  blocos:[{d:"Controle glicêmico (adjuvante)",n:"C",t:"Efeitos modestos somados; não substitui medidas de base."}],
  dose:"Cromo 200-400 mcg + canela (extrato aquoso) conforme rótulo.",seg:"Hipoglicemia com remédios para diabetes. Preferir canela Ceylon/aquosa.",mani:"Cromo 200 mcg + Canela (ext. aquoso) 250 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Nutracêutico."},
 {id:"acaco",nome:"Açaí",sci:"Euterpe oleracea",classe:"Nutracêutico",tags:["antioxidante","energia"],
  resumo:"Fruto amazônico (Euterpe oleracea), rico em antocianinas e gorduras, com alta capacidade antioxidante in vitro. Popular como 'superfruta', mas os desfechos clínicos de saúde são limitados — é sobretudo um alimento antioxidante.",
  blocos:[{d:"Antioxidante",n:"C",t:"Alta capacidade antioxidante; desfechos clínicos limitados."}],
  dose:"Polpa/extrato conforme uso alimentar.",seg:"Alimento bem tolerado. Calórico na forma de polpa.",mani:"Açaí (extrato/polpa) — uso alimentar.",reg:"Alimento / nutracêutico."},
 {id:"camucamu",nome:"Camu-camu",sci:"Myrciaria dubia",classe:"Nutracêutico",tags:["vitamina C","antioxidante","imunidade"],
  resumo:"Fruto amazônico (Myrciaria dubia) com um dos maiores teores naturais de vitamina C do mundo, além de polifenóis. Fonte natural de vitamina C com matriz antioxidante completa.",
  blocos:[{d:"Vitamina C / antioxidante",n:"C",t:"Fonte rica de vitamina C natural; mesma lógica da vit C para resfriado."}],
  dose:"Pó/extrato fornecendo vitamina C conforme objetivo.",seg:"Bem tolerado. Acidez desconforto no estômago/intestino em doses altas.",mani:"Camu-camu (pó padr. vit C) — conforme rótulo.\nTomar 1x/dia.",reg:"Alimento / nutracêutico."},
 {id:"acerola",nome:"Acerola",sci:"Malpighia emarginata",classe:"Nutracêutico",tags:["vitamina C","antioxidante","imunidade"],
  resumo:"Fruta tropical (Malpighia emarginata) riquíssima em vitamina C natural com bioflavonoides. Fonte vegetal preferida de vitamina C por muitos, por trazer a matriz completa em vez do ácido ascórbico isolado.",
  blocos:[{d:"Vitamina C / imunidade",n:"C",t:"Vitamina C natural; mesma evidência da vit C para resfriado."}],
  dose:"Pó/extrato fornecendo 100-500 mg de vit C/dia.",seg:"Acidez Desconforto no estômago/intestino. Bem tolerada.",mani:"Acerola (pó padr. vit C) 500 mg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Alimento / nutracêutico."},
 {id:"rutina",nome:"Rutina",sci:"",classe:"Nutracêutico",tags:["fragilidade capilar","insuficiência venosa","antioxidante"],
  resumo:"Bioflavonoide (quercetina-rutinosídeo) que fortalece capilares e reduz sua permeabilidade. Tradicional em fragilidade capilar e insuficiência venosa, frequentemente com vitamina C e diosmina.",
  blocos:[{d:"Fragilidade capilar / venosa",n:"C",t:"Reduz permeabilidade capilar; adjuvante venoso."}],
  dose:"500 mg 1-2x/dia.",seg:"Bem tolerada. Cautela com remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel).",mani:"Rutina 500 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Nutracêutico."},
 {id:"hesperidina2",nome:"Hesperidina",sci:"",classe:"Nutracêutico",tags:["venoso","antioxidante","metabólico"],
  resumo:"Flavonoide cítrico (da casca da laranja), venotônico e antioxidante. Componente clássico das fórmulas venosas (com diosmina) e estudado isoladamente em função endotelial e metabolismo.",
  blocos:[{d:"Insuficiência venosa (com diosmina)",n:"A",t:"Parte da fração flavonoica venotônica."},{d:"Função endotelial / metabólica",n:"C",t:"Sinal isolado preliminar."}],
  dose:"500 mg/dia (ou em fórmula com diosmina).",seg:"Bem tolerada.",mani:"Hesperidina 500 mg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Nutracêutico."},
 {id:"antocianinas",nome:"Mirtilo (antocianinas)",sci:"Vaccinium myrtillus",classe:"Fitoterápico",tags:["visão","circulação","antioxidante"],
  resumo:"Fruto do mirtilo europeu (bilberry), riquíssimo em antocianinas que melhoram a microcirculação e a função retiniana. Tradicional para fadiga visual e visão noturna; também venotônico. Padronização por antocianosídeos.",
  blocos:[{d:"Fadiga visual / microcirculação",n:"C",t:"Extrato 25% antocianosídeos, 160-320 mg/dia; sinal em fadiga visual e venoso."},{d:"Visão noturna",n:"D",t:"Mito da 2ª guerra; evidência fraca."}],
  dose:"160-320 mg/dia de extrato padronizado (25% antocianosídeos).",seg:"Bem tolerado. Cautela com remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel).",mani:"Mirtilo (ext. 25% antocianosídeos) 160 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico."},
 {id:"grapeseed",nome:"Semente de uva (OPC)",sci:"Vitis vinifera",classe:"Fitoterápico",tags:["antioxidante","venoso","circulação","pele"],
  resumo:"Extrato da semente de uva, rico em proantocianidinas oligoméricas (OPC). Antioxidante potente, melhora a função endotelial e venosa e a microcirculação. Padronização por OPC/polifenóis.",
  blocos:[{d:"Insuficiência venosa / circulação",n:"B",t:"150-300 mg/dia de OPC; melhora sintomas venosos e função endotelial."},{d:"Antioxidante / pele",n:"C",t:"Antioxidante potente; sinal cutâneo."}],
  dose:"150-300 mg/dia de extrato padronizado em OPC.",seg:"Bem tolerado. Cautela com remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel).",mani:"Semente de uva (ext. padr. OPC) 150 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico / nutracêutico."},
 {id:"resveratrolbio",nome:"Trans-resveratrol",sci:"",classe:"Nutracêutico",tags:["antioxidante","cardiometabólico","longevidade"],
  resumo:"O isômero ativo (trans) do resveratrol, padronizado a alta pureza (do Polygonum cuspidatum) e às vezes microencapsulado para melhorar a notória baixa biodisponibilidade. Mesma promessa de sirtuínas/longevidade do resveratrol.",
  blocos:[{d:"Cardiometabólico",n:"C",t:"150-500 mg/dia; sinal glicêmico/lipídico, limitado pela biodisponibilidade."},{d:"Longevidade",n:"D",t:"Sem desfecho clínico em humanos."}],
  dose:"150-500 mg/dia de trans-resveratrol (com gordura).",seg:"Pode dar desconforto no estômago em doses altas. Interfere em enzimas do fígado que processam medicamentos, então pode mudar o efeito de outros remédios — usar com cautela se você toma medicação contínua.",mani:"Trans-resveratrol 250 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia com refeição.",reg:"Nutracêutico."},
 {id:"niacinamida",nome:"Niacinamida (B3)",sci:"Nicotinamida",classe:"Vitamina",tags:["pele","NAD","fotoproteção"],
  resumo:"Forma da vitamina B3 sem o rubor da niacina. Precursora de NAD+ e, em dermatologia, reduz a incidência de câncer de pele não melanoma em pacientes de risco e melhora a barreira cutânea.",
  blocos:[{d:"Prevenção de câncer de pele (não melanoma)",n:"B",t:"500 mg 2x/dia; reduz CBC/CEC em pacientes de alto risco (ONTRAC)."},{d:"NAD+ / pele (barreira)",n:"C",t:"Precursor de NAD+; melhora barreira cutânea."}],
  dose:"500 mg 1-2x/dia.",seg:"Bem tolerada (sem rubor). Doses muito altas: lesão no fígado.",mani:"Niacinamida 500 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Vitamina / suplemento."},
 {id:"nr",nome:"Nicotinamida ribosídeo (NR)",sci:"Niagen",classe:"Nutracêutico",tags:["NAD","longevidade","energia","mitocondrial"],
  resumo:"Precursor de NAD+ (forma ribosídeo), alternativa ao NMN com mais dados de segurança humana. Eleva NAD+ de forma comprovada; a tradução em desfechos clínicos de longevidade ainda não está estabelecida.",
  blocos:[{d:"NAD+ / metabolismo",n:"B",t:"250-500 mg/dia; eleva NAD+ de forma robusta e segura."},{d:"Longevidade / performance",n:"D",t:"Eleva NAD+, mas sem desfecho clínico de longevidade."}],
  dose:"250-500 mg/dia.",seg:"Bem tolerado em estudos. Dados de longo prazo emergindo.",mani:"Nicotinamida ribosídeo (Niagen) 300 mg — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Nutracêutico."},
 {id:"benfotiamina",nome:"Benfotiamina",sci:"",classe:"Vitamina",tags:["neuropatia diabética","glicação"],
  resumo:"Derivado lipossolúvel da vitamina B1 (tiamina), com biodisponibilidade muito superior. Ativa a transcetolase, reduzindo subprodutos tóxicos da glicose (AGEs) — daí o uso na neuropatia diabética.",
  blocos:[{d:"Neuropatia diabética",n:"B",t:"150-300 mg 2x/dia; melhora sintomas neuropáticos em diabéticos."}],
  dose:"150-300 mg 1-2x/dia.",seg:"Bem tolerada.",mani:"Benfotiamina 150 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Vitamina / nutracêutico."},
 {id:"metilfolato",nome:"Metilfolato (5-MTHF)",sci:"L-metilfolato",classe:"Vitamina",tags:["homocisteína","humor","MTHFR","gestação"],
  resumo:"Forma ativa do folato, que dispensa a conversão pela enzima MTHFR — útil em quem tem polimorfismo MTHFR (conversão reduzida). Preferida ao ácido fólico em depressão (adjuvante) e em gestantes com MTHFR.",
  blocos:[{d:"Defeitos do tubo neural / gestação (MTHFR)",n:"B",t:"Forma ativa; preferível em polimorfismo MTHFR."},{d:"Depressão (adjuvante)",n:"B",t:"L-metilfolato 7,5-15 mg/dia potencializa antidepressivos."}],
  dose:"400 mcg-1 mg (geral); até 15 mg em depressão adjuvante.",seg:"Pode esconder uma falta de vitamina B12 nos exames. Repor B12 junto.",mani:"L-metilfolato 1 mg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Vitamina / suplemento."},
 {id:"metilb12",nome:"Metilcobalamina (B12)",sci:"",classe:"Vitamina",tags:["neuropatia","fadiga","metilação"],
  resumo:"Forma ativa/coenzimática da B12 (vs. a cianocobalamina sintética), preferida por alguns para suporte neurológico e metilação. Na prática, ambas corrigem a deficiência; a metil pode ter leve vantagem em neuropatia.",
  blocos:[{d:"Deficiência de B12 / neuropatia",n:"B",t:"Corrige deficiência; forma ativa preferida em suporte neurológico."}],
  dose:"500-1000 mcg/dia (sublingual ou oral).",seg:"Muito segura. Investigar a causa da deficiência.",mani:"Metilcobalamina 1000 mcg — 60 cápsulas sublinguais.\nTomar 1/dia.",reg:"Vitamina / suplemento."},
 {id:"p5p",nome:"Piridoxal-5-fosfato (B6 ativa)",sci:"P5P",classe:"Vitamina",tags:["TPM","neuropatia","homocisteína","náusea"],
  resumo:"Forma coenzimática ativa da vitamina B6, que dispensa conversão hepática. Cofator de centenas de reações (neurotransmissores, homocisteína). Preferida em quem tem conversão prejudicada. Atenção ao teto da B6.",
  blocos:[{d:"TPM / náusea gestacional",n:"B",t:"B6 reduz sintomas de tensão pré-menstrual (TPM) e náusea da gestação."},{d:"Homocisteína (com B12/folato)",n:"B",t:"Cofator da remetilação."}],
  dose:"P5P 20-50 mg/dia (não exceder ~100 mg de B6 total cronicamente).",seg:"Excesso crônico de B6 causa NEUROPATIA sensitiva — respeitar o teto.",mani:"Piridoxal-5-fosfato 25 mg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Vitamina / suplemento."},
 {id:"vitb1",nome:"Tiamina (B1)",sci:"",classe:"Vitamina",tags:["energia","neuropatia","alcoolismo","cardíaco"],
  resumo:"Vitamina B1, cofator do metabolismo de carboidratos e da função neuronal. Deficiência (alcoolismo, bariátrica, desnutrição) causa beribéri e Wernicke. Reposição é crítica nesses contextos.",
  blocos:[{d:"Deficiência (beribéri / Wernicke)",n:"A",t:"Reposição (oral/IV) reverte/previne; emergência neurológica em Wernicke."}],
  dose:"Manutenção 1-2 mg/dia; reposição 100 mg+/dia conforme contexto.",seg:"Muito segura. Em suspeita de encefalopatia de Wernicke (uma emergência neurológica por falta de B1), repor ANTES de glicose.",mani:"Tiamina 100 mg — 60 cápsulas.\nTomar 1 cápsula/dia (ou conforme contexto clínico).",reg:"Vitamina / medicamento."},
 {id:"riboflavina",nome:"Riboflavina (B2)",sci:"",classe:"Vitamina",tags:["enxaqueca","energia","mitocondrial"],
  resumo:"Vitamina B2, precursora de FAD/FMN (cadeia respiratória mitocondrial). Em dose alta tem evidência de profilaxia de enxaqueca, provavelmente por melhorar o metabolismo energético neuronal.",
  blocos:[{d:"Profilaxia de enxaqueca",n:"B",t:"400 mg/dia; reduz frequência de crises (efeito após ~3 meses)."}],
  dose:"Profilaxia de enxaqueca: 400 mg/dia.",seg:"Muito segura. Urina amarelo-fluorescente (inofensivo).",mani:"Riboflavina 200 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia (profilaxia de enxaqueca).",reg:"Vitamina / suplemento."},
 {id:"vitb5",nome:"Ácido pantotênico (B5)",sci:"",classe:"Vitamina",tags:["energia","acne","pele","adrenal"],
  resumo:"Vitamina B5, componente da coenzima A (metabolismo de gorduras e energia). Deficiência é rara. Doses altas foram estudadas para acne, com sinal modesto, e há mito de 'suporte adrenal'.",
  blocos:[{d:"Acne (doses altas)",n:"C",t:"Doses altas; sinal modesto em acne em estudos pequenos."}],
  dose:"5-10 mg/dia (RDA); doses altas em acne sob orientação.",seg:"Muito segura. Doses muito altas: Desconforto no estômago/intestino.",mani:"Ácido pantotênico 500 mg — 60 cápsulas.\nTomar conforme objetivo.",reg:"Vitamina / suplemento."},
 {id:"vitb7",nome:"Inositol + colina (lipotrópico)",sci:"",classe:"Nutracêutico",tags:["fígado","metabolismo de gordura"],
  resumo:"Combinação 'lipotrópica' tradicional (inositol + colina, às vezes com metionina) promovida para metabolismo de gordura hepática. A colina tem base real na esteatose por deficiência; o conjunto é mais empírico.",
  blocos:[{d:"Metabolismo de gordura hepática",n:"D",t:"Lipotrópicos; base na colina, conjunto pouco testado."}],
  dose:"Conforme fórmula (colina + inositol).",seg:"Bem tolerado.",mani:"Inositol 500 mg + Colina 250 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Nutracêutico."},
 {id:"vitk1",nome:"Vitamina K1 (filoquinona)",sci:"",classe:"Vitamina",tags:["coagulação","recém-nascido"],
  resumo:"Forma vegetal da vitamina K (folhas verdes), essencial à coagulação (fatores II, VII, IX, X). Profilaxia obrigatória no recém-nascido (doença hemorrágica). Diferente da K2, que é mais óssea/vascular.",
  blocos:[{d:"Coagulação / profilaxia neonatal",n:"A",t:"Profilaxia neonatal previne doença hemorrágica do recém-nascido."}],
  dose:"Conforme indicação (neonatal IM padrão; oral em deficiência).",seg:"ANULA O EFEITO do remédio que afina o sangue varfarina (Marevan). Profilaxia neonatal é padrão de cuidado.",mani:"Vitamina K1 — uso conforme indicação clínica.",reg:"Vitamina / medicamento."}
,
 {id:"melatoninaliber",nome:"Melatonina liberação prolongada",sci:"",classe:"Hormônio",tags:["insônia","manutenção do sono","idosos"],
  resumo:"Versão da melatonina que libera o hormônio aos poucos ao longo da noite, imitando o ciclo natural. Mais voltada para quem acorda no meio da noite (manutenção do sono) do que para quem só demora a pegar no sono. Útil sobretudo em pessoas acima de 55 anos.",
  blocos:[{d:"Insônia de manutenção (idosos)",n:"B",t:"2 mg de liberação prolongada à noite; melhora a qualidade do sono e o despertar em pessoas mais velhas."}],
  dose:"2 mg de liberação prolongada, 1-2h antes de dormir.",seg:"Sonolência residual pela manhã em alguns. Cautela com remédios que afinam o sangue (como varfarina/Marevan).",mani:"Melatonina liberação prolongada 2 mg — 30 comprimidos.\nTomar 1 comprimido 1-2h antes de dormir.",reg:"Liberada em apresentações específicas."},
 {id:"triptofano",nome:"L-triptofano",sci:"",classe:"Aminoácido",tags:["humor","sono","serotonina"],
  resumo:"Aminoácido essencial que o corpo transforma em serotonina e depois em melatonina. É o ponto de partida da química do bem-estar e do sono. Diferente do 5-HTP, passa por uma etapa a mais e sofre mais concorrência de outros aminoácidos para entrar no cérebro.",
  blocos:[{d:"Humor / sono",n:"C",t:"1-3 g à noite; matéria-prima da serotonina, sinal modesto em humor e sono."}],
  dose:"1-3 g à noite, longe de refeições proteicas.",seg:"NÃO usar junto com antidepressivos que mexem na serotonina (tipo ISRS, como sertralina/fluoxetina, ou IMAO) — risco de excesso de serotonina. Pode dar sonolência.",mani:"L-triptofano 500 mg — 60 cápsulas.\nTomar 2-3 cápsulas à noite.",reg:"Aminoácido / suplemento."},
 {id:"magbisglic",nome:"Magnésio bisglicinato quelato",sci:"",classe:"Mineral",tags:["sono","ansiedade","absorção","câimbra"],
  resumo:"Magnésio ligado ao aminoácido glicina, uma das formas mais bem absorvidas e que menos solta o intestino. A glicina ainda tem efeito calmante próprio, o que reforça o uso para sono e ansiedade. Boa escolha para quem não tolera as formas que dão diarreia.",
  blocos:[{d:"Sono / ansiedade",n:"C",t:"Equivalente a 200-400 mg de magnésio à noite; relaxamento, sem soltar o intestino."},{d:"Câimbra / tensão muscular",n:"C",t:"Suporte ao relaxamento muscular."}],
  dose:"Equivalente a 200-400 mg de magnésio por dia.",seg:"Bem tolerado. Cautela em quem tem problema nos rins.",mani:"Magnésio bisglicinato (equiv. 200 mg de magnésio) — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Mineral / suplemento."},
 {id:"loftea",nome:"Lavanda (óleo oral)",sci:"Lavandula angustifolia",classe:"Fitoterápico",tags:["ansiedade","sono"],
  resumo:"Óleo essencial de lavanda em cápsula para uso oral (não é o aromaterápico). O componente linalol acalma o sistema nervoso. Tem boa evidência para ansiedade leve a moderada, com efeito comparável a alguns ansiolíticos leves, sem causar dependência.",
  blocos:[{d:"Ansiedade",n:"B",t:"80 mg/dia do óleo padronizado (Silexan); reduz ansiedade leve a moderada."},{d:"Sono",n:"C",t:"Melhora o sono de forma indireta ao reduzir a ansiedade."}],
  dose:"80 mg/dia do óleo de lavanda padronizado (ex.: Silexan).",seg:"Arrotos com gosto de lavanda. Bem tolerado.",mani:"Óleo de lavanda (Silexan) 80 mg — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Fitoterápico."},
 {id:"valerianamel",nome:"Valeriana + melissa",sci:"",classe:"Fitoterápico",tags:["sono","ansiedade"],
  resumo:"Combinação clássica de duas plantas calmantes: a valeriana (que age no sistema de relaxamento do cérebro) e a erva-cidreira/melissa. Juntas têm sinal melhor para o sono do que a valeriana sozinha, sem deixar a pessoa 'apagada'.",
  blocos:[{d:"Insônia leve",n:"B",t:"Extratos combinados à noite; melhora o sono subjetivo melhor que valeriana isolada."},{d:"Ansiedade leve",n:"C",t:"Relaxamento brando durante o dia."}],
  dose:"Valeriana 300-450 mg + melissa 80-240 mg, 30-60 min antes de dormir.",seg:"Sonolência. Cautela com álcool e remédios calmantes/para dormir.",mani:"Valeriana 360 mg + Melissa 240 mg — 30 cápsulas.\nTomar 1 cápsula 40 min antes de dormir.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"magsleep",tipo:"combo",nome:"Combo do sono (manipulado)",sci:"",classe:"Nutracêutico",tags:["insônia","latência","ansiedade noturna"],
  resumo:"Fórmula manipulada que reúne os ativos com melhor evidência para o sono, cada um agindo numa etapa: a melatonina ajusta o relógio, a L-teanina e o magnésio relaxam, e a glicina ajuda a baixar a temperatura corporal que induz o sono.",
  blocos:[{d:"Insônia leve a moderada",n:"B",t:"Combinação noturna; cada componente tem evidência própria para o sono."}],
  dose:"Cápsula única noturna combinando os ativos abaixo.",seg:"Sonolência. Evitar dirigir após tomar. Não combinar com outros calmantes sem orientação.",mani:"Melatonina 1 mg + L-teanina 200 mg + Magnésio bisglicinato (equiv. 100 mg de magnésio) + Glicina 1 g — 30 cápsulas.\nTomar 1 cápsula 40 min antes de dormir.",reg:"Nutracêutico manipulado."},
 {id:"ksm66",nome:"Ashwagandha KSM-66",sci:"Withania somnifera",classe:"Adaptógeno",tags:["estresse","ansiedade","testosterona","performance"],
  resumo:"Extrato de ashwagandha de uma marca específica (KSM-66), feito só da raiz e com alto teor dos ativos (withanolides). É a versão com mais estudos clínicos, voltada para estresse, ansiedade e desempenho. Diferencia-se por padronização e qualidade controlada.",
  blocos:[{d:"Estresse / ansiedade",n:"B",t:"300 mg 2x/dia; reduz o hormônio do estresse (cortisol) e escalas de ansiedade."},{d:"Testosterona / performance (homens)",n:"C",t:"Sinal de aumento de testosterona e força em homens."}],
  dose:"300 mg 1-2x/dia do extrato KSM-66 (raiz, alto teor de withanolides).",seg:"Evitar na gravidez (tradicionalmente associado a aborto). Cautela com tireoide e remédios calmantes. Casos raros de lesão no fígado.",mani:"Ashwagandha KSM-66 300 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico / nutracêutico."},
 {id:"l_teanina2",nome:"Suntheanine (L-teanina pura)",sci:"",classe:"Aminoácido",tags:["foco","ansiedade","relaxamento"],
  resumo:"Forma pura e patenteada da L-teanina (Suntheanine), o aminoácido do chá-verde que relaxa sem dar sono. Garante que se está usando o isômero correto (o ativo), diferente de versões misturadas mais baratas. Combina muito bem com a cafeína para foco.",
  blocos:[{d:"Ansiedade / relaxamento",n:"B",t:"200 mg; relaxa sem sedar."},{d:"Foco (com cafeína)",n:"B",t:"A dupla com cafeína melhora a atenção sem nervosismo."}],
  dose:"100-400 mg/dia.",seg:"Muito bem tolerada. Sem interações relevantes conhecidas.",mani:"L-teanina (Suntheanine) 200 mg — 60 cápsulas.\nTomar 1 cápsula até 2x/dia.",reg:"Aminoácido / suplemento."},
 {id:"saffrmood",nome:"Açafrão (affron)",sci:"Crocus sativus",classe:"Fitoterápico",tags:["humor","ansiedade","TPM"],
  resumo:"Extrato padronizado de açafrão de uma marca específica (affron), com teor garantido dos ativos. O açafrão verdadeiro (da flor, não a cúrcuma) age na serotonina e tem boa evidência para humor leve a moderado, com a vantagem de dose baixa e padronização.",
  blocos:[{d:"Humor leve a moderado",n:"B",t:"28 mg/dia do extrato padronizado; melhora o humor, comparável a alguns antidepressivos em estudos pequenos."},{d:"Tensão pré-menstrual (TPM)",n:"C",t:"Reduz sintomas de TPM."}],
  dose:"28-30 mg/dia de extrato de açafrão padronizado (ex.: affron).",seg:"Doses altas (acima de 1,5 g) são tóxicas — respeitar a dose. Evitar na gravidez.",mani:"Açafrão (affron) 28 mg — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Fitoterápico."},
 {id:"sintomasmenop",tipo:"combo",nome:"Combo menopausa (manipulado)",sci:"",classe:"Nutracêutico",tags:["fogachos","menopausa","humor"],
  resumo:"Fórmula manipulada para os sintomas da menopausa, combinando plantas e nutrientes que atuam em frentes diferentes: ondas de calor (fogachos), humor e sono. Pensada como alternativa ou complemento para quem não faz reposição hormonal.",
  blocos:[{d:"Sintomas da menopausa (fogachos, humor)",n:"C",t:"Combinação de fitoestrógenos e calmantes; cada parte com evidência própria."}],
  dose:"Conforme a fórmula combinada abaixo.",seg:"Cautela em câncer sensível a hormônios (os fitoestrógenos). Discutir com o médico se faz reposição hormonal.",mani:"Cimicífuga 40 mg + Isoflavonas de soja 50 mg + Açafrão 28 mg — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Nutracêutico manipulado."},
 {id:"quercefitossoma",nome:"Quercetina fitossoma",sci:"",classe:"Nutracêutico",tags:["alergia","imunidade","antioxidante","biodisponibilidade"],
  resumo:"Quercetina ligada a gordura (fitossoma) para melhorar muito a absorção — a quercetina comum é mal aproveitada pelo corpo. Mantém a ação antialérgica e antioxidante, mas com doses menores e efeito mais confiável.",
  blocos:[{d:"Alergia / rinite",n:"C",t:"Efeito anti-histamínico (estabiliza as células da alergia); forma melhor absorvida."},{d:"Imunidade / antioxidante",n:"C",t:"Antioxidante; popular em protocolos imunes."}],
  dose:"250-500 mg/dia da forma fitossoma.",seg:"Bem tolerada. Cautela com remédios que afinam o sangue.",mani:"Quercetina fitossoma 250 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Nutracêutico."},
 {id:"brom",nome:"Bromelina",sci:"Ananas comosus",classe:"Nutracêutico",tags:["anti-inflamatório","sinusite","digestão","edema"],
  resumo:"Enzima extraída do abacaxi que digere proteínas e tem ação anti-inflamatória e contra inchaço (edema). Usada em sinusite, recuperação pós-cirúrgica/trauma e como auxiliar digestivo. A força é medida em unidades GDU/MCU.",
  blocos:[{d:"Inchaço / inflamação pós-trauma ou cirurgia",n:"B",t:"500-1000 GDU/dia longe das refeições; reduz inchaço e dor."},{d:"Sinusite",n:"B",t:"Adjuvante que melhora sintomas de sinusite."},{d:"Digestão",n:"C",t:"Auxilia a digestão de proteínas quando tomada às refeições."}],
  dose:"Anti-inflamatório: 500-1000 GDU/dia em jejum. Digestivo: às refeições.",seg:"Alergia a abacaxi. Cautela com remédios que afinam o sangue. Pode potencializar antibióticos.",mani:"Bromelina 500 GDU — 60 cápsulas.\nAnti-inflamatório: 1 cápsula 2x/dia em jejum.",reg:"Nutracêutico."},
 {id:"serrapept",nome:"Serrapeptase",sci:"",classe:"Nutracêutico",tags:["anti-inflamatório","edema","muco"],
  resumo:"Enzima (originalmente do bicho-da-seda) que dissolve proteínas inflamatórias e muco. Popular para inflamação, inchaço e congestão, mas a evidência é mais fraca que a da bromelina. Usada em cápsula com revestimento que protege a enzima do ácido do estômago.",
  blocos:[{d:"Inflamação / inchaço",n:"C",t:"10-60 mg/dia em jejum; sinal anti-inflamatório, evidência limitada."}],
  dose:"10-60 mg/dia (cápsula com revestimento entérico), em jejum.",seg:"Cautela com remédios que afinam o sangue. Casos raros de reação pulmonar relatados.",mani:"Serrapeptase 20 mg (entérica) — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia em jejum.",reg:"Nutracêutico."},
 {id:"curcfitossoma",nome:"Curcumina fitossoma",sci:"Curcuma longa",classe:"Fitoterápico",tags:["osteoartrite","inflamação","biodisponibilidade"],
  resumo:"Curcumina ligada a gordura (fitossoma, ex.: Meriva) para resolver o grande problema da cúrcuma: ela é quase não absorvida. Essa forma chega ao sangue em quantidade muito maior, então faz efeito com doses menores. Voltada para dor articular e inflamação.",
  blocos:[{d:"Osteoartrite / dor articular",n:"A",t:"1000 mg/dia da forma fitossoma; reduz a dor articular, melhor absorvida que a curcumina comum."},{d:"Inflamação",n:"B",t:"Reduz marcadores de inflamação."}],
  dose:"500-1000 mg/dia da forma fitossoma (ex.: Meriva).",seg:"Cautela com remédios que afinam o sangue. Não usar com pedra na vesícula com sintomas.",mani:"Curcumina fitossoma (Meriva) 500 mg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Fitoterápico."},
 {id:"colageno2",nome:"Colágeno tipo II não desnaturado",sci:"UC-II",classe:"Aminoácido",tags:["osteoartrite","articulações"],
  resumo:"Tipo especial de colágeno (UC-II) que não é digerido como proteína comum: em dose pequena, ele 'reeduca' o sistema imune a parar de atacar a cartilagem das articulações. Mecanismo diferente do colágeno hidrolisado comum, e em dose muito menor.",
  blocos:[{d:"Osteoartrite de joelho",n:"B",t:"40 mg/dia; reduz dor e melhora função articular, superior à glucosamina+condroitina em um estudo."}],
  dose:"40 mg/dia (UC-II, em jejum).",seg:"Bem tolerado. Diferente do colágeno hidrolisado (que é usado para pele).",mani:"Colágeno tipo II não desnaturado (UC-II) 40 mg — 30 cápsulas.\nTomar 1 cápsula/dia em jejum.",reg:"Nutracêutico."},
 {id:"acidohialjoint",nome:"Ácido hialurônico (articular)",sci:"",classe:"Nutracêutico",tags:["osteoartrite","articulações","lubrificação"],
  resumo:"Componente natural do líquido que lubrifica as articulações. Por via oral, a evidência é modesta (parte é digerida), mas alguns estudos mostram alívio de dor no joelho. A injeção dentro da articulação é outra via, mais potente e feita pelo médico.",
  blocos:[{d:"Osteoartrite de joelho (oral)",n:"C",t:"80-200 mg/dia; sinal modesto de alívio da dor."}],
  dose:"80-200 mg/dia por via oral.",seg:"Bem tolerado por via oral.",mani:"Ácido hialurônico 120 mg — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Nutracêutico."},
 {id:"comboartic",tipo:"combo",nome:"Combo articular (manipulado)",sci:"",classe:"Nutracêutico",tags:["osteoartrite","dor articular","inflamação"],
  resumo:"Fórmula manipulada para a osteoartrite que junta ativos com mecanismos complementares: a curcumina e a boswellia atacam a inflamação por vias diferentes, e o ômega-3 reduz o componente inflamatório geral. Adjuvante — não substitui controle de peso e fisioterapia.",
  blocos:[{d:"Osteoartrite (dor e inflamação)",n:"A",t:"Combinação; curcumina e boswellia têm boa evidência em dor articular."}],
  dose:"Conforme a fórmula combinada abaixo.",seg:"Cautela com remédios que afinam o sangue (curcumina). Adjuvante, não substitui as medidas de base.",mani:"Curcumina (95%) 500 mg + piperina 5 mg + Boswellia (30% AKBA) 100 mg — cápsula combinada 2x/dia.\nÔmega-3 1 g — 1 cápsula 2x/dia.",reg:"Nutracêutico manipulado."},
 {id:"comboglic",tipo:"combo",nome:"Combo metabólico (manipulado)",sci:"",classe:"Nutracêutico",tags:["controle glicêmico","resistência à insulina","gordura no fígado"],
  resumo:"Fórmula manipulada para o controle do açúcar e da resistência à insulina, reunindo a berberina (potente sensibilizador de insulina), o ácido alfa-lipoico (antioxidante que ajuda na glicemia) e o cromo. Adjuvante das medidas de estilo de vida e da medicação.",
  blocos:[{d:"Controle do açúcar / resistência à insulina",n:"B",t:"Combinação; a berberina é o carro-chefe, com evidência forte."}],
  dose:"Conforme a fórmula combinada abaixo.",seg:"Pode baixar muito o açúcar se combinado a remédios de diabetes — ajustar com o médico. Berberina contraindicada na gravidez.",mani:"Berberina 500 mg + Ácido alfa-lipoico 300 mg + Cromo 200 mcg — cápsula combinada 2x/dia antes das refeições.",reg:"Nutracêutico manipulado."},
 {id:"chromiumchel",nome:"Cromo quelato",sci:"",classe:"Mineral",tags:["controle glicêmico","desejo por doce"],
  resumo:"Forma de cromo ligada a aminoácidos, mais bem absorvida que o picolinato. O cromo participa da ação da insulina; ajuda modestamente no controle do açúcar e é usado para reduzir a vontade de comer doce. Efeito pequeno e variável.",
  blocos:[{d:"Controle do açúcar",n:"C",t:"200-400 mcg/dia; efeito pequeno, mais visível em quem tem deficiência."}],
  dose:"200-400 mcg/dia.",seg:"Bem tolerado nas doses usuais.",mani:"Cromo quelato 200 mcg — 60 cápsulas.\nTomar 1 cápsula 1-2x/dia.",reg:"Mineral / suplemento."},
 {id:"berberinaceylon",tipo:"combo",nome:"Combo açúcar + canela (manipulado)",sci:"",classe:"Nutracêutico",tags:["controle glicêmico","picos de glicose"],
  resumo:"Fórmula simples para atenuar os picos de açúcar após as refeições, juntando a canela do Ceilão (mais segura que a comum) e o cromo. Adjuvante leve — útil em quem tem pré-diabetes ou resistência à insulina, sempre junto à dieta.",
  blocos:[{d:"Pico de açúcar após refeições",n:"C",t:"Efeitos modestos somados; tomar antes das refeições com carboidrato."}],
  dose:"Conforme a fórmula abaixo, antes das refeições.",seg:"Preferir canela do Ceilão (a comum tem cumarina, que estressa o fígado em excesso).",mani:"Canela do Ceilão (ext. aquoso) 250 mg + Cromo 200 mcg — 60 cápsulas.\nTomar 1 cápsula antes das refeições principais.",reg:"Nutracêutico manipulado."},
 {id:"omega3veg",nome:"Ômega-3 vegano (de algas)",sci:"",classe:"Ácido graxo",tags:["coração","cérebro","gestação","vegano"],
  resumo:"Ômega-3 (EPA e DHA) extraído direto das algas — a mesma fonte de onde os peixes obtêm o ômega-3. Opção para veganos, vegetarianos e quem não tolera o gosto de peixe. Mesmos benefícios para coração, cérebro e gestação, sem contaminantes marinhos.",
  blocos:[{d:"Coração / triglicérides",n:"B",t:"1-2 g/dia de EPA+DHA de algas; reduz triglicérides."},{d:"Gestação / cérebro",n:"B",t:"Fonte de DHA na gravidez, sem peixe."}],
  dose:"1-2 g/dia de EPA+DHA de óleo de algas.",seg:"Bem tolerado. Cautela com remédios que afinam o sangue em doses altas.",mani:"Ômega-3 de algas (EPA/DHA) 500 mg — 60 cápsulas.\nTomar 1-2 cápsulas 1-2x/dia.",reg:"Suplemento."},
 {id:"vitd3gotas",nome:"Vitamina D3 em gotas (óleo)",sci:"Colecalciferol",classe:"Vitamina",tags:["saúde óssea","imunidade","absorção"],
  resumo:"Vitamina D3 dissolvida em óleo, em gotas — forma prática para ajustar a dose e bem absorvida (a vitamina D é lipossolúvel, gosta de gordura). Mesma função da vitamina D em cápsula: ossos, imunidade e músculos. A dose é individualizada pelo exame de sangue.",
  blocos:[{d:"Correção de deficiência de vitamina D",n:"A",t:"Dose conforme o nível no sangue; corrige a deficiência."}],
  dose:"Conforme o exame de sangue (manutenção 1000-2000 UI/dia; reposição maior se baixa).",seg:"Megadoses sem controle podem causar excesso de cálcio. Dosar o nível no sangue.",mani:"Vitamina D3 1000 UI/gota (em óleo) — frasco 20 mL.\nPingar conforme orientação, com refeição.",reg:"Vitamina / suplemento."},
 {id:"vitdk2mag",tipo:"combo",nome:"Combo ósseo (manipulado)",sci:"",classe:"Vitamina",tags:["saúde óssea","osteoporose","direcionar cálcio"],
  resumo:"Fórmula manipulada para a saúde dos ossos que combina os nutrientes que trabalham juntos: a vitamina D ajuda a absorver o cálcio, a vitamina K2 leva esse cálcio para o osso (e o afasta das artérias) e o magnésio é cofator de tudo isso. Pensada para osteopenia/osteoporose.",
  blocos:[{d:"Saúde óssea / osteoporose (adjuvante)",n:"B",t:"Combinação; cada nutriente tem papel na mineralização do osso."}],
  dose:"Conforme a fórmula combinada abaixo.",seg:"A vitamina K2 ANULA O EFEITO do remédio que afina o sangue varfarina (Marevan) — não usar nesse caso.",mani:"Vitamina D3 2000 UI + Vitamina K2 (MK-7) 100 mcg + Magnésio bisglicinato (equiv. 100 mg de magnésio) — 60 cápsulas.\nTomar 1 cápsula/dia com refeição.",reg:"Vitamina / nutracêutico manipulado."},
 {id:"zincoquelimun",tipo:"combo",nome:"Combo imunidade (manipulado)",sci:"",classe:"Nutracêutico",tags:["imunidade","resfriado","gripe"],
  resumo:"Fórmula manipulada de suporte imune que junta os nutrientes com mais base para a defesa: zinco (encurta o resfriado se começado cedo), vitamina D (mais importante em quem tem deficiência) e vitamina C. Mais útil para corrigir deficiências e no início dos sintomas.",
  blocos:[{d:"Suporte imune / resfriado",n:"B",t:"Zinco encurta o resfriado; vitamina D corrige deficiência; vitamina C reduz duração."}],
  dose:"Conforme a fórmula abaixo, ao primeiro sinal de resfriado.",seg:"Não tomar zinco em megadose por muito tempo (atrapalha o cobre). Vitamina D conforme exame.",mani:"Zinco 15 mg + Vitamina D3 2000 UI + Vitamina C 500 mg — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Nutracêutico manipulado."},
 {id:"propolis",nome:"Própolis",sci:"",classe:"Fitoterápico",tags:["imunidade","garganta","antimicrobiano"],
  resumo:"Resina que as abelhas produzem para proteger a colmeia, rica em flavonoides com ação antimicrobiana e anti-inflamatória. Tradicional para dor de garganta, aftas e suporte imune. O própolis verde brasileiro (da alecrim-do-campo) é especialmente valorizado.",
  blocos:[{d:"Dor de garganta / boca (aftas)",n:"C",t:"Spray ou extrato; alívio sintomático local."},{d:"Suporte imune",n:"D",t:"Uso tradicional; evidência clínica limitada."}],
  dose:"Extrato ou spray conforme rótulo.",seg:"Alergia a produtos de abelha. Pode causar reação na boca em sensíveis.",mani:"Própolis (extrato padronizado) — spray ou gotas, conforme rótulo.",reg:"Fitoterápico / alimento."},
 {id:"geleiareal",nome:"Geleia real",sci:"",classe:"Nutracêutico",tags:["energia","imunidade","fertilidade"],
  resumo:"Alimento que as abelhas produzem para nutrir a rainha, rico em proteínas, vitaminas do complexo B e um ácido graxo único (10-HDA). Promovido para energia, imunidade e fertilidade, mas a evidência humana é fraca. Pode causar alergia grave em sensíveis.",
  blocos:[{d:"Energia / vitalidade",n:"D",t:"Alegações tradicionais; evidência clínica fraca."}],
  dose:"Conforme rótulo (fresca ou liofilizada).",seg:"RISCO de alergia grave (incluindo anafilaxia) em pessoas com asma/alergia a abelha.",mani:"Geleia real liofilizada — conforme rótulo.\nTomar pela manhã.",reg:"Alimento / nutracêutico."},
 {id:"oleorégano",nome:"Óleo de orégano",sci:"Origanum vulgare",classe:"Fitoterápico",tags:["antimicrobiano","intestino","candidíase"],
  resumo:"Óleo concentrado do orégano, rico em carvacrol e timol, com forte ação contra micróbios e fungos em laboratório. Usado em supercrescimento bacteriano e fúngico do intestino e em candidíase. Potente e irritante — usar diluído e por tempo curto.",
  blocos:[{d:"Supercrescimento bacteriano/fúngico intestinal",n:"C",t:"Padronizado em carvacrol; usado em protocolos de disbiose, evidência preliminar."}],
  dose:"Padronizado em carvacrol, conforme rótulo, por tempo limitado.",seg:"Irritante para mucosas — usar diluído/encapsulado. Pode afetar a flora boa também. Evitar na gravidez.",mani:"Óleo de orégano (padr. carvacrol) — cápsula entérica, conforme rótulo.\nUso por tempo limitado.",reg:"Fitoterápico."},
 {id:"berberineberb",tipo:"combo",nome:"Combo intestino (manipulado)",sci:"",classe:"Nutracêutico",tags:["disbiose","intestino","permeabilidade"],
  resumo:"Fórmula manipulada para a saúde intestinal, juntando o que repara a barreira (glutamina), o que alimenta as células do intestino (butirato) e um probiótico. Pensada para quadros de intestino sensível e permeabilidade aumentada.",
  blocos:[{d:"Saúde da mucosa / permeabilidade intestinal",n:"C",t:"Combinação de reparadores da barreira; evidência preliminar."}],
  dose:"Conforme a fórmula abaixo.",seg:"Bem tolerado. Probiótico com cautela em imunidade muito baixa.",mani:"L-glutamina 5 g + Butirato 300 mg + Probiótico multicepa 10 bilhões — 1-2x/dia.",reg:"Nutracêutico manipulado."},
 {id:"prebiotico",nome:"Prebiótico (FOS/inulina)",sci:"",classe:"Nutracêutico",tags:["intestino","microbiota","constipação"],
  resumo:"Fibras que não são digeridas por nós, mas servem de alimento para as bactérias boas do intestino (diferente do probiótico, que são as próprias bactérias). Nutrem a microbiota, melhoram o trânsito e a produção de substâncias protetoras do intestino.",
  blocos:[{d:"Saúde da microbiota / constipação",n:"B",t:"5-10 g/dia; alimenta a flora boa e melhora o trânsito intestinal."}],
  dose:"5-10 g/dia, aumentando aos poucos.",seg:"Gases e inchaço se aumentar rápido demais. Cautela em intestino muito sensível.",mani:"Inulina/FOS (prebiótico) — 5 g em água, 1-2x/dia.",reg:"Fibra / alimento."},
 {id:"simbiotico",nome:"Simbiótico (pro + prebiótico)",sci:"",classe:"Probiótico",tags:["intestino","microbiota","imunidade"],
  resumo:"Combinação de probiótico (bactérias boas) com prebiótico (a fibra que as alimenta) no mesmo produto — a ideia é que a fibra ajude as bactérias a se instalarem melhor. Usado para equilíbrio intestinal geral.",
  blocos:[{d:"Equilíbrio intestinal",n:"B",t:"Probiótico + a fibra que o alimenta; melhora sintomas intestinais."}],
  dose:"Conforme rótulo (bilhões de bactérias + fibra).",seg:"Cautela em imunidade muito baixa.",mani:"Simbiótico (probiótico 10 bilhões + inulina 3 g) — 30 sachês.\nTomar 1 sachê/dia.",reg:"Suplemento / alimento funcional."},
 {id:"carvao",nome:"Carvão ativado",sci:"",classe:"Nutracêutico",tags:["gases","intoxicação","detox"],
  resumo:"Pó pretíssimo e poroso que 'gruda' (adsorve) substâncias no intestino. É remédio de verdade em intoxicações agudas (no pronto-socorro). Fora disso, é usado para gases — mas atenção: ele também gruda nos seus remédios e nutrientes, anulando o efeito.",
  blocos:[{d:"Intoxicação aguda (uso hospitalar)",n:"A",t:"Adsorve venenos no intestino; uso de emergência sob supervisão."},{d:"Gases / inchaço",n:"C",t:"Pode reduzir gases; evidência modesta."}],
  dose:"Gases: conforme rótulo, longe de remédios e refeições.",seg:"GRUDA nos medicamentos e nutrientes — distanciar pelo menos 2h de tudo. Pode prender o intestino.",mani:"Carvão ativado 250 mg — usar longe de outros remédios.\nNão usar de forma contínua.",reg:"Medicamento / suplemento."},
 {id:"enzdig",nome:"Enzimas digestivas",sci:"",classe:"Nutracêutico",tags:["digestão","insuficiência pancreática","inchaço"],
  resumo:"Mistura de enzimas que quebram proteínas, gorduras e carboidratos, ajudando a digestão. Essenciais em quem tem o pâncreas que não produz enzimas suficientes (insuficiência pancreática). Em pessoas saudáveis, o benefício é menor.",
  blocos:[{d:"Insuficiência pancreática",n:"A",t:"Reposição de enzimas (lipase, etc.); essencial em pancreatite crônica/fibrose cística."},{d:"Inchaço / má digestão",n:"C",t:"Pode aliviar sintomas após refeições pesadas."}],
  dose:"Junto às refeições, dose conforme o tamanho da refeição.",seg:"Em insuficiência pancreática, a dose é médica. Bem tolerada em geral.",mani:"Enzimas digestivas (amilase, lipase, protease) — 60 cápsulas.\nTomar 1 cápsula no início das refeições.",reg:"Nutracêutico / medicamento."},
 {id:"betaina_hcl",nome:"Betaína HCl",sci:"",classe:"Nutracêutico",tags:["digestão","azia baixa","absorção"],
  resumo:"Fornece ácido clorídrico ao estômago, usado em quem tem pouco ácido estomacal (hipocloridria) — comum em idosos e em quem usa remédios para azia há muito tempo. O ácido é necessário para digerir proteínas e absorver ferro e vitamina B12.",
  blocos:[{d:"Pouco ácido no estômago (hipocloridria)",n:"C",t:"Com as refeições; melhora a digestão de proteínas e a absorção quando o ácido está baixo."}],
  dose:"Com as refeições proteicas, conforme tolerância.",seg:"NÃO usar quem tem úlcera, gastrite ativa ou usa remédios para azia. Pode causar queimação.",mani:"Betaína HCl 650 mg (com pepsina) — 90 cápsulas.\nTomar 1 cápsula no início das refeições com proteína.",reg:"Nutracêutico."},
 {id:"gengibreenj",nome:"Gengibre (enjoo)",sci:"Zingiber officinale",classe:"Fitoterápico",tags:["enjoo","náusea","gravidez","cinetose"],
  resumo:"O mesmo gengibre, aqui no uso específico contra enjoo e náusea. Age no estômago e em receptores ligados ao vômito (os mesmos de remédios antienjoo). Seguro na gravidez e útil no enjoo de viagem (cinetose) e pós-operatório.",
  blocos:[{d:"Enjoo da gravidez",n:"A",t:"1-1,5 g/dia; reduz náusea da gestação, com segurança."},{d:"Enjoo de viagem / pós-operatório",n:"B",t:"Reduz náusea em viagens e após cirurgias."}],
  dose:"250 mg 3-4x/dia (até 1,5 g/dia).",seg:"Azia leve. Cautela com remédios que afinam o sangue em doses altas.",mani:"Gengibre (extrato) 250 mg — 60 cápsulas.\nTomar 1 cápsula até 4x/dia.",reg:"Fitoterápico (lista ANVISA)."},
