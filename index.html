<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Fito.doc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c1220; --bg2:#0f1626; --surface:#161f33; --surface2:#1c2740;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.14);
  --gold:#d9bd84; --gold2:#c4a366; --tx:#f1ede3; --tx2:#9aa6bd; --tx3:#5f6c83;
  --aTx:#4ade80;--aBg:rgba(74,222,128,.13); --bTx:#60a5fa;--bBg:rgba(96,165,250,.13);
  --cTx:#fbbf24;--cBg:rgba(251,191,36,.13); --dTx:#94a3b8;--dBg:rgba(148,163,184,.11);
  --serif:'Fraunces',Georgia,serif; --sans:'Plus Jakarta Sans',-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:16px;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
#app{max-width:480px;margin:0 auto;padding-bottom:112px}
.screen{display:none;animation:fade .35s ease both}
.screen.on{display:block}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:up .5s cubic-bezier(.2,.7,.3,1) both}
.hero{position:relative;padding:max(30px,calc(env(safe-area-inset-top) + 18px)) 22px 26px;overflow:hidden}
.hero:before{content:"";position:absolute;top:-120px;right:-60px;width:320px;height:320px;
  background:radial-gradient(circle,rgba(217,189,132,.20),transparent 62%);pointer-events:none}
.brand{font-family:var(--serif);font-size:34px;font-weight:500;letter-spacing:-.5px;line-height:1}
.brand .d{color:var(--gold)}
.tagline{color:var(--tx2);font-size:14px;margin-top:8px;max-width:300px;line-height:1.5}
.stats{display:flex;gap:10px;margin-top:20px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 12px}
.stat .n{font-family:var(--serif);font-size:23px;font-weight:600;color:var(--gold)}
.stat .l{font-size:11px;color:var(--tx2);margin-top:2px;letter-spacing:.2px}
.sect{padding:6px 22px 0}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;margin:24px 0 13px}
.sect-h .t{font-family:var(--serif);font-size:19px;font-weight:500}
.sect-h .a{font-size:13px;color:var(--gold);font-weight:600;cursor:pointer}
.card{position:relative;display:flex;align-items:center;gap:14px;background:var(--surface);
  border:1px solid var(--line);border-radius:18px;padding:15px 16px 15px 18px;margin-bottom:12px;cursor:pointer;overflow:hidden;transition:.18s}
.card:active{transform:scale(.985);background:var(--surface2)}
.card .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.card .ico{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none}
.card .ico svg{width:22px;height:22px}
.card .mid{flex:1;min-width:0}
.card .nm{font-size:16.5px;font-weight:600;letter-spacing:-.2px}
.card .cl{font-size:12.5px;color:var(--tx3);margin-top:2px;font-style:italic}
.card .mt{font-size:12.5px;color:var(--gold);margin-top:5px;font-weight:500}
.lvl{font-size:11px;font-weight:700;padding:5px 10px;border-radius:9px;letter-spacing:.4px;flex:none}
.A{color:var(--aTx);background:var(--aBg)} .B{color:var(--bTx);background:var(--bBg)}
.C{color:var(--cTx);background:var(--cBg)} .D{color:var(--dTx);background:var(--dBg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding:4px 22px 0}
.cat{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 16px 17px;cursor:pointer;overflow:hidden;transition:.18s}
.cat:active{transform:scale(.97)}
.cat .glow{position:absolute;top:-30px;right:-30px;width:110px;height:110px;border-radius:50%;opacity:.22}
.cat .cico{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:13px;margin-bottom:13px}
.cat .cico svg{width:23px;height:23px}
.cat .cn{font-size:15.5px;font-weight:600;letter-spacing:-.2px}
.cat .cd{font-size:12px;color:var(--tx3);margin-top:3px}
/* COMBO CARD */
.combo{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:17px 18px;margin-bottom:13px;cursor:pointer;overflow:hidden;transition:.18s}
.combo:active{transform:scale(.985)}
.combo .glow{position:absolute;top:-40px;right:-40px;width:150px;height:150px;border-radius:50%;opacity:.16;pointer-events:none}
.combo .top{display:flex;align-items:center;gap:13px;margin-bottom:12px}
.combo .cico{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.combo .cico svg{width:24px;height:24px}
.combo .cn{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:-.3px}
.combo .cf{font-size:12.5px;color:var(--tx3);margin-top:2px}
.combo .pills{display:flex;flex-wrap:wrap;gap:6px}
.cpill{font-size:11.5px;padding:4px 9px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);color:var(--tx2)}
.cpill.more{color:var(--gold);border-color:transparent;background:transparent;font-weight:600}
.az-letter{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--gold);padding:18px 22px 8px;letter-spacing:1px}
.dhero{position:relative;padding:max(26px,calc(env(safe-area-inset-top) + 14px)) 22px 20px;overflow:hidden}
.dhero:before{content:"";position:absolute;top:-90px;right:-50px;width:240px;height:240px;background:radial-gradient(circle,rgba(217,189,132,.16),transparent 62%)}
.dclass{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:5px 11px;border-radius:8px;margin-bottom:13px}
.dname{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:-.5px;line-height:1.1}
.dsci{font-size:14px;color:var(--tx2);font-style:italic;margin-top:6px}
.dbody{padding:8px 22px 0}
.note{display:flex;gap:9px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:12.5px;color:var(--tx2);line-height:1.5;margin:6px 0 22px}
.note svg{width:17px;height:17px;flex:none;color:var(--gold);margin-top:1px}
.lbl{font-size:12px;font-weight:700;color:var(--tx3);letter-spacing:1px;text-transform:uppercase;margin:0 0 12px}
.bloco{display:flex;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:11px}
.bloco .blvl{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:20px;font-weight:600;flex:none}
.bloco .bt{font-size:15px;font-weight:600}
.bloco .bd{font-size:13px;color:var(--tx2);line-height:1.5;margin-top:5px}
/* COMPONENT ROW (combo detail) */
.comp{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin-bottom:10px}
.comp .dot{width:11px;height:11px;border-radius:50%;flex:none}
.comp .ci{flex:1;min-width:0}
.comp .cnm{font-size:15px;font-weight:600}
.comp .cdose{color:var(--gold);font-weight:600}
.comp .cwhy{font-size:12.5px;color:var(--tx2);margin-top:3px;line-height:1.45}
.field{margin-top:22px}
.field .fb{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px 16px;font-size:14px;color:var(--tx);line-height:1.6}
.rx{margin-top:22px;border:1px solid var(--gold);border-radius:18px;overflow:hidden}
.rx .rh{background:linear-gradient(180deg,rgba(217,189,132,.16),rgba(217,189,132,.06));color:var(--gold);font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:11px 16px;display:flex;align-items:center;gap:8px}
.rx .rh svg{width:16px;height:16px}
.rx .rb{padding:15px 16px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.7;white-space:pre-wrap;color:var(--tx)}
.acts{display:flex;gap:11px;margin-top:20px}
.acts button{flex:1;font-family:var(--sans);border:1px solid var(--line2);background:var(--surface);color:var(--tx);border-radius:14px;padding:14px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s}
.acts button:active{transform:scale(.97)}
.acts button.gold{background:var(--gold);color:#1a1408;border-color:var(--gold)}
.dtags{margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.dtags .h{font-size:11px;color:var(--tx3);letter-spacing:.5px;margin-bottom:9px}
.tagb{display:inline-block;font-size:12.5px;padding:6px 11px;border-radius:9px;background:var(--bg2);color:var(--tx2);margin:0 7px 7px 0;border:1px solid var(--line)}
.searchwrap{padding:max(26px,calc(env(safe-area-inset-top) + 14px)) 22px 4px}
.searchbox{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line2);border-radius:16px;padding:4px 8px 4px 15px}
.searchbox svg{width:19px;height:19px;color:var(--tx3);flex:none}
#q{flex:1;border:none;background:transparent;outline:none;font-family:var(--sans);font-size:16px;color:var(--tx);height:46px;min-width:0}
#q::placeholder{color:var(--tx3)}
.count{font-size:12.5px;color:var(--tx3);padding:18px 22px 6px}
.empty{text-align:center;color:var(--tx3);padding:60px 22px;font-size:14px}
.back{display:flex;width:fit-content;align-items:center;gap:6px;background:none;border:none;color:var(--tx2);font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;padding:6px 0;margin-bottom:6px}
.back svg{width:18px;height:18px}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(12,18,32,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);padding:9px 4px calc(9px + env(safe-area-inset-bottom));display:flex;max-width:480px;margin:0 auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;color:var(--tx3);font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.1px;cursor:pointer;padding:6px 0;transition:.15s}
.tab svg{width:22px;height:22px}
.tab.act{color:var(--gold)}
/* ===== HOME PREMIUM ===== */
.hhero{position:relative;padding:max(38px,calc(env(safe-area-inset-top) + 26px)) 22px 30px;overflow:hidden}
.hhero:before{content:"";position:absolute;top:-160px;right:-90px;width:380px;height:380px;
  background:radial-gradient(circle,rgba(217,189,132,.22),transparent 60%);pointer-events:none}
.hhero:after{content:"";position:absolute;left:-80px;bottom:-40px;width:240px;height:240px;
  background:radial-gradient(circle,rgba(96,165,250,.10),transparent 65%);pointer-events:none}
.hkick{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
.hkick .rule{height:1px;width:30px;background:linear-gradient(90deg,var(--gold),transparent)}
.hbrand{font-family:var(--serif);font-weight:500;font-size:60px;line-height:.92;letter-spacing:-1.5px}
.hbrand .d{color:var(--gold);font-style:italic}
.hsub{color:var(--tx2);font-size:14.5px;margin-top:14px;max-width:330px;line-height:1.55}
.hsub b{color:var(--tx);font-weight:600}
/* search trigger */
.hsearch{display:flex;align-items:center;gap:12px;margin:22px 22px 4px;background:var(--surface);
  border:1px solid var(--line2);border-radius:16px;padding:15px 16px;cursor:pointer;transition:.18s}
.hsearch:active{transform:scale(.99);background:var(--surface2)}
.hsearch svg{width:20px;height:20px;color:var(--gold);flex:none}
.hsearch .ph{flex:1;color:var(--tx3);font-size:15px}
.hsearch .kbd{font-size:11px;color:var(--tx3);border:1px solid var(--line);border-radius:7px;padding:3px 8px;letter-spacing:.3px}
/* evidence ruler — signature element */
.ruler{margin:26px 22px 0;background:linear-gradient(180deg,var(--surface),var(--bg2));
  border:1px solid var(--line);border-radius:20px;padding:18px 18px 16px;position:relative;overflow:hidden}
.ruler .rl-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.ruler .rl-t{font-family:var(--serif);font-size:15px;font-weight:600}
.ruler .rl-s{font-size:11.5px;color:var(--tx3)}
.grades{display:flex;gap:8px}
.grade{flex:1;border-radius:13px;padding:12px 10px 11px;border:1px solid var(--line);position:relative}
.grade .g{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1}
.grade .gl{font-size:10.5px;color:var(--tx2);margin-top:6px;line-height:1.3}
.grade.A{background:var(--aBg);border-color:rgba(74,222,128,.28)} .grade.A .g{color:var(--aTx)}
.grade.B{background:var(--bBg);border-color:rgba(96,165,250,.28)} .grade.B .g{color:var(--bTx)}
.grade.C{background:var(--cBg);border-color:rgba(251,191,36,.28)} .grade.C .g{color:var(--cTx)}
.grade.D{background:var(--dBg);border-color:rgba(148,163,184,.28)} .grade.D .g{color:var(--dTx)}
.ruler .rl-f{font-size:12px;color:var(--tx2);line-height:1.5;margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}
.ruler .rl-f b{color:var(--gold);font-weight:600}
/* stat strip */
.strip{display:flex;gap:10px;margin:14px 22px 0}
.scard{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 13px;position:relative;overflow:hidden}
.scard .sn{font-family:var(--serif);font-size:25px;font-weight:600;color:var(--gold);line-height:1}
.scard .sl{font-size:11px;color:var(--tx2);margin-top:4px;letter-spacing:.2px}
.scard svg{position:absolute;right:10px;top:10px;width:18px;height:18px;color:var(--tx3);opacity:.5}
/* systems quick grid */
.sysgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:0 22px}
.syscard{position:relative;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px;cursor:pointer;overflow:hidden;transition:.18s}
.syscard:active{transform:scale(.97)}
.syscard .sg{position:absolute;top:-24px;right:-24px;width:80px;height:80px;border-radius:50%;opacity:.2}
.syscard .si{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.syscard .si svg{width:21px;height:21px}
.syscard .st{font-size:14px;font-weight:600;letter-spacing:-.2px}
/* ===== RODA GIRATÓRIA DE DESTAQUES ===== */
.wheel-sect{padding:22px 0 6px}
.wheel-cap{padding:0 22px;display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.wheel-cap .t{font-family:var(--serif);font-size:19px;font-weight:500}
.wheel-cap .a{font-size:12.5px;color:var(--gold);font-weight:600;cursor:pointer}
.wheel-stage{position:relative;width:330px;max-width:92vw;aspect-ratio:1;margin:6px auto 0}
.wheel-orbit{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,rgba(217,189,132,.08),transparent 58%);
  border:1px solid var(--line)}
.wheel-orbit:before{content:"";position:absolute;inset:13%;border-radius:50%;border:1px dashed rgba(255,255,255,.07)}
.wheel-rot{position:absolute;inset:0;animation:spin 48s linear infinite}
.wheel-rot.paused{animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}}
.sat{position:absolute;top:50%;left:50%;width:70px;height:70px;margin:-35px 0 0 -35px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border-radius:18px;background:var(--surface);border:1px solid var(--line2);cursor:pointer;
  box-shadow:0 10px 24px -12px rgba(0,0,0,.7);transition:.16s;padding:4px}
.sat:active{filter:brightness(1.25)}.sat:active .si{transform:scale(.9)}
.sat .si{width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.sat .si svg{width:24px;height:24px}
.sat .sn{font-size:9.5px;font-weight:600;line-height:1.05;text-align:center;color:var(--tx);max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sat .sb{position:absolute;top:-5px;right:-5px;font-size:9px;font-weight:800;width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--bg)}
.sat .sb.A{background:var(--aBg);color:var(--aTx)} .sat .sb.B{background:var(--bBg);color:var(--bTx)}
.sat .sb.C{background:var(--cBg);color:var(--cTx)} .sat .sb.D{background:var(--dBg);color:var(--dTx)}
/* counter-rotate inner content so labels stay upright */
.sat-spin{animation:spin-rev 48s linear infinite}
.wheel-rot.paused .sat-spin{animation-play-state:paused}
@keyframes spin-rev{to{transform:rotate(-360deg)}}
.wheel-core{position:absolute;top:50%;left:50%;width:108px;height:108px;margin:-54px 0 0 -54px;border-radius:50%;
  background:radial-gradient(circle at 50% 38%,var(--surface2),var(--bg2));border:1px solid var(--line2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 18px 40px -18px rgba(0,0,0,.8);z-index:3}
.wheel-core .ce{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--gold);line-height:1}
.wheel-core .cl{font-size:10px;color:var(--tx2);margin-top:3px;letter-spacing:.4px;text-transform:uppercase}
.wheel-core .cd{width:30px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:7px 0 5px}
.wheel-hint{text-align:center;font-size:11.5px;color:var(--tx3);margin-top:12px}
</style>
</head>
<body>
<div id="app">
  <div id="s-home" class="screen on"></div>
  <div id="s-az" class="screen"></div>
  <div id="s-fn" class="screen"></div>
  <div id="s-combos" class="screen"></div>
  <div id="s-search" class="screen"></div>
  <div id="s-detail" class="screen"></div>
</div>
<nav id="tabs">
  <button class="tab act" data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Início</button>
  <button class="tab" data-go="az"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M4 12h9M4 17h6"/><path d="M17 8l2.5 8M22 8l-2.5 8M17.6 13.5h3.8"/></svg>A–Z</button>
  <button class="tab" data-go="fn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Funções</button>
  <button class="tab" data-go="combos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7l9 5 9-5-9-5Z"/><path d="m3 12 9 5 9-5M3 17l9 5 9-5"/></svg>Combos</button>
  <button class="tab" data-go="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>Buscar</button>
</nav>
<script>
var MOL='<circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>';
var CLASSES={
  "Adaptógeno":{c:"#b794f6",ic:'<path d="M12 2v6M5 9l3 3M19 9l-3 3M12 22a7 7 0 0 0 7-7c0-4-7-9-7-9s-7 5-7 9a7 7 0 0 0 7 7Z"/>'},
  "Nutracêutico (alcaloide)":{c:"#fbbf24",ic:MOL},

 {id:"ashwa",nome:"Ashwagandha",sci:"Withania somnifera",classe:"Adaptógeno",tags:["estresse","ansiedade","insônia","suporte à testosterona","performance"],
  resumo:"Raiz da planta Withania somnifera, adaptógeno central da medicina ayurvédica indiana. Os withanolides são os compostos ativos. Modula o eixo hipotálamo-hipófise-adrenal, atenuando a resposta de cortisol ao estresse.",
  refs:[{au:"Akhgarjand C et al.",yr:2022,jr:"Phytother Res",ty:"Revisão sistemática + meta-análise (12 RCTs, n=1002)",fd:"Reduz ansiedade (SMD −1,55) e estresse (SMD −1,75); certeza da evidência classificada como baixa.",doi:"10.1002/ptr.7598"},{au:"Fatima K et al.",yr:2024,jr:"Hum Psychopharmacol",ty:"Revisão sistemática + meta-análise (5 RCTs, n=254)",fd:"Reduz HAM-A e melhora latência e eficiência do sono; heterogeneidade alta.",doi:"10.1002/hup.2911"}],
  blocos:[{d:"Estresse / cortisol",n:"B",t:"Extrato padronizado (KSM-66 / Sensoril) 300–600 mg/dia, ≥8 sem."},{d:"Ansiedade",n:"B",t:"300 mg 12/12h. Redução de escalas de ansiedade vs. placebo."},{d:"Insônia",n:"C",t:"Sinal positivo em qualidade do sono; estudos heterogêneos."},{d:"Suporte à testosterona",n:"C",t:"Homens; amostras pequenas, efeito modesto."},{d:"Energia / vitalidade",n:"D",t:"Alegação de marketing — extrapolação."}],
  dose:"300–600 mg/dia de extrato seco padronizado (≥5% withanolides). Teto ~1000 mg/dia.",seg:"Evitar na gestação (tradicionalmente associado a aborto). Relatos raros de lesão no fígado. Cautela com remédios calmantes/para dormir, tireoide e remédios que baixam a imunidade (usados em transplante e em doenças autoimunes).",mani:"Ashwagandha (ext. padr. ≥5% withanolides) 300 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia, por 60 dias.",reg:"Fitoterápico / nutracêutico."},
 {id:"berb",nome:"Berberina",sci:"Berberis spp.",classe:"Nutracêutico (alcaloide)",tags:["resistência insulínica","controle glicêmico","dislipidemia","esteatose hepática","SOP"],
  resumo:"Alcaloide isoquinolínico extraído de plantas como Berberis, Coptis chinensis e Hydrastis canadensis, usado há séculos na medicina chinesa e ayurvédica. Ativa a AMPK (sensor energético da célula), melhora a sensibilidade à insulina, reduz a produção hepática de glicose e modula a microbiota intestinal.",
  refs:[{au:"Nazari A et al.",yr:2023,jr:"Clin Ther",ty:"Umbrella meta-análise",fd:"Reduz HbA1c, glicemia de jejum, HOMA-IR e marcadores inflamatórios em adultos.",doi:"10.1016/j.clinthera.2023.10.019"},{au:"Guo J et al.",yr:2021,jr:"Oxid Med Cell Longev",ty:"Revisão sistemática + meta-análise (46 RCTs)",fd:"HbA1c MD −0,73%; melhora de glicemia, resistência insulínica e perfil lipídico.",doi:"10.1155/2021/2074610"},{au:"Dong H et al.",yr:2012,jr:"Evid Based Complement Alternat Med",ty:"Meta-análise (14 RCTs, 1068 pacientes)",fd:"Eficaz em hiperglicemia e dislipidemia; qualidade metodológica baixa.",doi:"10.1155/2012/591654"}],
  blocos:[{d:"Controle do açúcar / resistência à insulina",n:"A",t:"500 mg 2–3x/dia. Queda de hemoglobina glicada (a média do açúcar de 3 meses) comparável a metformina em alguns estudos."},{d:"Dislipidemia",n:"B",t:"Redução de LDL e triglicérides."},{d:"Gordura no fígado",n:"B",t:"Melhora de enzimas e esteatose por imagem."},{d:"SOP",n:"B",t:"Melhora de resistência à insulina e perfil metabólico."},{d:"Detox",n:"D",t:"Sem base. Extrapolação."}],
  dose:"500 mg 2–3x/dia, 30 min antes das refeições. Teto ~1500 mg/dia.",seg:"desconforto no estômago/intestino que aumenta com a dose. Interfere em uma enzima do fígado, podendo aumentar o efeito de remédios de colesterol (estatinas) e de remédios que baixam a imunidade (como a ciclosporina). Não usar na gravidez nem na amamentação.",mani:"Berberina HCl 500 mg — 90 cápsulas.\nTomar 1 cápsula 30 min antes de café, almoço e jantar.",reg:"Nutracêutico."},
 {id:"curc",nome:"Cúrcuma",sci:"Curcuma longa",classe:"Fitoterápico",tags:["osteoartrite","esteatose hepática","inflamação"],
  resumo:"Rizoma da Curcuma longa, especiaria-base do açafrão-da-terra, usado há séculos na medicina ayurvédica. Os curcuminoides (sobretudo a curcumina) são os ativos; inibem vias inflamatórias (NF-κB, COX-2) e têm ação antioxidante. A absorção oral é baixa, por isso os extratos são padronizados a 95% de curcuminoides e associados à piperina para aumentar a biodisponibilidade.",
  refs:[{au:"Bideshki MV et al.",yr:2024,jr:"Phytother Res",ty:"Umbrella meta-análise (11 meta-análises de RCTs)",fd:"Reduz dor (VAS) e melhora WOMAC total, função e rigidez na osteoartrite de joelho.",doi:"10.1002/ptr.8153"}],
  blocos:[{d:"Osteoartrite",n:"A",t:"Extrato 95% curcuminoides + piperina 1000–1500 mg/dia. Reduz dor."},{d:"Gordura no fígado",n:"B",t:"Melhora de enzimas; estudos de médio porte."},{d:"Detox",n:"D",t:"Alegação sem desfecho clínico."}],
  dose:"1000–1500 mg/dia de extrato 95% curcuminoides com piperina.",seg:"Cautela com remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel). Contraindicada em pedra na vesícula com sintomas.",mani:"Curcumina (95%) 500 mg + piperina 5 mg — 90 cápsulas.\nTomar 1 cápsula 3x/dia às refeições.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"mela",nome:"Melatonina",sci:"",classe:"Hormônio",tags:["insônia","latência do sono","jet lag"],
  resumo:"Hormônio produzido pela glândula pineal à noite, sinalizador central do ritmo circadiano (relógio biológico). Por via oral, encurta o tempo para adormecer e ajuda a realinhar o sono em distúrbios de fase e jet lag. Mais cronobiótico (ajusta o relógio) do que hipnótico clássico — não força o sono à força.",
  refs:[{au:"Cruz-Sanabria F et al.",yr:2024,jr:"J Pineal Res",ty:"Revisão sistemática + meta-análise dose-resposta (26 RCTs, n=1689)",fd:"Reduz a latência do sono e aumenta o tempo total de sono; efeito pico ~4 mg/dia, melhor se administrada ~3 h antes do horário-alvo.",doi:"10.1111/jpi.12985"}],
  blocos:[{d:"Latência do sono",n:"A",t:"0,5–3 mg, 30–60 min antes de dormir."},{d:"Jet lag",n:"B",t:"Útil em viagens transmeridianas."}],
  dose:"0,5–3 mg, 30–60 min antes de dormir.",seg:"Sedação residual em doses altas. Cautela com remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel) e doenças autoimunes (como lúpus, artrite reumatoide).",mani:"Melatonina 1 mg — 30 cápsulas.\nTomar 1 cápsula 40 min antes de dormir.",reg:"Liberada em apresentações específicas."},
 {id:"val",nome:"Valeriana",sci:"Valeriana officinalis",classe:"Fitoterápico",tags:["insônia","ansiedade"],
  resumo:"Raiz da Valeriana officinalis, usada tradicionalmente como calmante. Seus compostos (ácido valerênico) parecem modular o sistema GABA, o principal freio inibitório do cérebro — mecanismo análogo ao de ansiolíticos, porém muito mais brando.",
  refs:[{au:"Valente V et al.",yr:2024,jr:"Eur Neuropsychopharmacol",ty:"Umbrella review (8 revisões sistemáticas)",fd:"Bom perfil de segurança, mas SEM evidência de eficácia objetiva na insônia; só melhora subjetiva da qualidade do sono.",doi:"10.1016/j.euroneuro.2024.01.008"}],
  blocos:[{d:"Insônia",n:"C",t:"Melhora subjetiva do sono, mas umbrella review não mostra eficácia objetiva. 300–600 mg 30 min antes de dormir."},{d:"Ansiedade",n:"C",t:"Sinal modesto."}],
  dose:"300–600 mg de extrato seco, 30–60 min antes de dormir.",seg:"Sonolência. Cautela com álcool e depressores do SNC.",mani:"Valeriana (ext. seco) 300 mg — 30 cápsulas.\nTomar 1–2 cápsulas 40 min antes de dormir.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"mag",nome:"Magnésio glicinato",sci:"",classe:"Mineral",tags:["insônia","câimbras","ansiedade","constipação"],
  resumo:"Mineral essencial, cofator de mais de 300 reações enzimáticas (energia, função muscular e nervosa). A forma importa: o glicinato é bem tolerado e usado para sono/ansiedade, enquanto formas osmóticas (óxido, citrato) têm efeito laxativo. A maioria dos benefícios é mais clara em quem tem ingestão baixa ou deficiência.",
  refs:[{au:"Morishita D et al.",yr:2021,jr:"Am J Gastroenterol",ty:"RCT duplo-cego controlado por placebo (n=90)",fd:"Óxido de magnésio 1,5 g/dia melhorou frequência evacuatória e qualidade de vida na constipação crônica vs. placebo, com perfil seguro.",doi:"10.14309/ajg.0000000000000942"}],
  blocos:[{d:"Câimbras",n:"C",t:"Evidência fraca/mista, exceto na gestação."},{d:"Insônia",n:"C",t:"Sinal modesto, sobretudo em idosos com déficit."},{d:"Constipação (formas osmóticas)",n:"B",t:"Citrato/óxido têm efeito laxativo estabelecido (RCT com óxido)."}],
  dose:"200–400 mg de magnésio elementar/dia. Glicinato é melhor tolerado.",seg:"Diarreia dose-dependente. Cautela na insuficiência renal.",mani:"Magnésio glicinato (equiv. 200 mg Mg elementar) — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Suplemento mineral."},
 {id:"rho",nome:"Rhodiola",sci:"Rhodiola rosea",classe:"Adaptógeno",tags:["fadiga","estresse","foco"],
  resumo:"Raiz da Rhodiola rosea, adaptógeno de regiões frias. Os ativos rosavinas e salidrosídeo modulam a resposta ao estresse e o equilíbrio de monoaminas e cortisol, o que embasa o uso antifadiga sem ser estimulante clássico.",
  refs:[{au:"Todorova V et al.",yr:2021,jr:"Nutrients",ty:"Revisão sistemática + meta-análise (adaptógenos vegetais)",fd:"Adaptógenos vegetais como a Rhodiola podem trazer benefício na fadiga crônica e no comprometimento cognitivo; ensaios clínicos ainda limitados.",doi:"10.3390/nu13082861"}],
  blocos:[{d:"Fadiga",n:"B",t:"200–400 mg/dia. Reduz fadiga relacionada ao estresse."},{d:"Estresse",n:"B",t:"Melhora de sintomas de estresse e burnout."}],
  dose:"200–400 mg/dia de extrato padronizado (3% rosavinas / 1% salidrosídeo).",seg:"Bem tolerado. Cautela em transtorno bipolar.",mani:"Rhodiola (ext. 3% rosavinas) 200 mg — 30 cápsulas.\nTomar 1 cápsula pela manhã.",reg:"Fitoterápico / nutracêutico."},
 {id:"sere",nome:"Saw palmetto",sci:"Serenoa repens",classe:"Fitoterápico",tags:["hiperplasia prostática (HPB)"],
  resumo:"Extrato dos frutos da palmeira-anã americana (Serenoa repens), o fitoterápico mais usado para sintomas urinários da próstata. Atua como inibidor fraco da 5-alfa-redutase e tem ação anti-inflamatória local. Atenção ao tipo de extrato: o lipídico/hexânico (ex.: Permixon) é o que concentra a evidência positiva — extratos não padronizados se mostraram inertes na Cochrane.",
  refs:[{au:"Vela-Navarrete R et al.",yr:2018,jr:"BJU Int",ty:"Revisão sistemática + meta-análise (27 estudos, n=5800)",fd:"Extrato hexânico (Permixon) 320 mg/dia reduziu noctúria e melhorou o fluxo urinário vs. placebo, com eficácia comparável à tansulosina e sem piorar função sexual.",doi:"10.1111/bju.14362"}],
  blocos:[{d:"HPB — sintomas urinários",n:"B",t:"320 mg/dia de extrato lipídico (hexânico/Permixon). Benefício pequeno; extratos não padronizados são inertes na Cochrane."}],
  dose:"320 mg/dia de extrato lipídico padronizado.",seg:"desconforto leve no estômago/intestino. Pode atrapalhar o exame de próstata (PSA), escondendo alterações.",mani:"Saw palmetto (ext. lipídico) 320 mg — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Fitoterápico."},
 {id:"nac",nome:"NAC",sci:"N-acetilcisteína",classe:"Nutracêutico",tags:["SOP","fertilidade","suporte hepático"],
  resumo:"Derivado do aminoácido cisteína e precursor da glutationa, o principal antioxidante intracelular. É fármaco consolidado como antídoto na intoxicação por paracetamol e mucolítico; na síndrome dos ovários policísticos (SOP) e na fertilidade o uso é adjuvante, sustentado por melhora de marcadores hormonais e de estresse oxidativo.",
  refs:[{au:"Shahveghar Asl Z et al.",yr:2023,jr:"Br J Nutr",ty:"Revisão sistemática + meta-análise (18 estudos, n=2185)",fd:"Reduz testosterona total e eleva FSH em mulheres com SOP, sugerindo melhora da função reprodutiva.",doi:"10.1017/S0007114522003270"}],
  blocos:[{d:"SOP",n:"B",t:"Melhora de resistência à insulina e ovulação em alguns RCTs."},{d:"Fertilidade masculina",n:"C",t:"Sinal positivo em parâmetros seminais."},{d:"Suporte hepático",n:"C",t:"Forte em paracetamol; uso crônico é extrapolação."}],
  dose:"600–1200 mg/dia, divididos.",seg:"Desconforto no estômago/intestino, náusea. Cautela em asma.",mani:"N-acetilcisteína 600 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Nutracêutico / isento conforme apresentação."},
 {id:"cran",nome:"Cranberry",sci:"Vaccinium macrocarpon",classe:"Fitoterápico",tags:["ITU de repetição"],
  resumo:"Fruto do oxicoco (Vaccinium macrocarpon). Suas proantocianidinas tipo A (PAC) impedem que a E. coli adira ao urotélio, o que justifica o uso na prevenção (não no tratamento) de infecções urinárias de repetição. A dose de pressão arterialC padronizada importa mais que o volume de suco — produtos sem PAC mensurada têm resultado inconsistente.",
  refs:[{au:"Xia JY et al.",yr:2021,jr:"PLoS One",ty:"Revisão sistemática + meta-análise (23 ensaios, n=3979)",fd:"Reduziu a incidência de ITU em populações suscetíveis (RR 0,70), com queda de ~32% em mulheres com ITU recorrente.",doi:"10.1371/journal.pone.0256992"}],
  blocos:[{d:"ITU de repetição",n:"B",t:"Extrato ≥36 mg de pressão arterialC/dia. Reduz recorrência em mulheres."}],
  dose:"Extrato padronizado com ≥36 mg de pressão arterialC/dia.",seg:"Bem tolerado. Cautela com o remédio que afina o sangue varfarina (Marevan).",mani:"Cranberry (ext. 36 mg PAC) — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Fitoterápico."},
 {id:"lte",nome:"L-teanina",sci:"",classe:"Aminoácido",tags:["ansiedade","foco","insônia","estresse"],
  resumo:"Aminoácido encontrado quase exclusivamente nas folhas de chá (Camellia sinensis). Atravessa a barreira hematoencefálica e aumenta a atividade alfa cerebral, gerando relaxamento sem sedação — por isso suaviza o efeito estimulante da cafeína. Perfil de segurança muito favorável, sem interações relevantes conhecidas.",
  refs:[{au:"Hidese S et al.",yr:2019,jr:"Nutrients",ty:"RCT cruzado duplo-cego (n=30)",fd:"200 mg/dia por 4 semanas reduziu escores de ansiedade, depressão e melhorou latência e qualidade do sono em adultos saudáveis.",doi:"10.3390/nu11102362"}],
  blocos:[{d:"Ansiedade / estresse",n:"B",t:"200 mg. Reduz estresse agudo; efeito ansiolítico leve sem sedação."},{d:"Foco (com cafeína)",n:"B",t:"Combinada à cafeína melhora atenção e reduz jitter."},{d:"Insônia",n:"C",t:"Melhora subjetiva da qualidade do sono."}],
  dose:"100–400 mg/dia. Combina bem com cafeína (2:1).",seg:"Muito bem tolerada. Sem interações relevantes conhecidas.",mani:"L-teanina 200 mg — 60 cápsulas.\nTomar 1 cápsula até 2x/dia.",reg:"Aminoácido / suplemento."},
 {id:"ino",nome:"Mio-inositol",sci:"",classe:"Nutracêutico",tags:["SOP","ansiedade","fertilidade"],
  resumo:"Açúcar-álcool (vitamina-like, antiga 'vitamina B8') que atua como segundo mensageiro da sinalização da insulina. Na síndrome dos ovários policísticos (SOP), a hipótese é melhorar a resistência à insulina e, com isso, ciclos e ovulação. Bem tolerado, mas a evidência é heterogênea: a revisão que embasou as diretrizes internacionais de síndrome dos ovários policísticos (SOP) (2023) a classificou como limitada e inconclusiva.",
  refs:[{au:"Fitz V et al.",yr:2024,jr:"J Clin Endocrinol Metab",ty:"Revisão sistemática + meta-análise (30 ensaios, n=2230; base das diretrizes de SOP 2023)",fd:"Possível benefício metabólico e ovulatório do inositol, porém evidência globalmente limitada e inconclusiva; menos desconforto no estômago/intestino que a metformina.",doi:"10.1210/clinem/dgad762"}],
  blocos:[{d:"SOP",n:"B",t:"2–4 g/dia. Melhora resistência à insulina, ciclos e ovulação; bom perfil de segurança."},{d:"Ansiedade / pânico",n:"C",t:"Doses altas; evidência limitada."}],
  dose:"2 g 2x/dia (relação mio:D-chiro 40:1 é a mais estudada).",seg:"desconforto leve no estômago/intestino em doses altas. Seguro na gestação sob orientação.",mani:"Mio-inositol 2 g (sachê ou cápsulas) — 60 doses.\nTomar 2 g 2x/dia.",reg:"Nutracêutico."},
 {id:"ome",nome:"Ômega-3 (EPA/DHA)",sci:"",classe:"Ácido graxo",tags:["dislipidemia","humor","esteatose hepática","inflamação"],
  resumo:"Ácidos graxos poli-insaturados de cadeia longa (EPA e DHA), obtidos sobretudo de óleo de peixe. São incorporados às membranas celulares e dão origem a mediadores que reduzem inflamação e triglicérides; o EPA tem o sinal cardiovascular e de humor mais consistente. O efeito é dose-dependente — doses terapêuticas (2–4 g/dia) ficam acima do que há em cápsulas de baixa concentração.",
  refs:[{au:"Rodriguez D et al.",yr:2022,jr:"Nutrients",ty:"Revisão com meta-análise",fd:"Reduz triglicérides séricos de forma robusta e, em alta dose, eventos cardiovasculares (IAM fatal e total).",doi:"10.3390/nu14235146"}],
  blocos:[{d:"Hipertrigliceridemia",n:"A",t:"2–4 g/dia de EPA+DHA. Reduz triglicérides de forma robusta."},{d:"Humor (depressão)",n:"B",t:"Fórmulas ricas em EPA como adjuvante."},{d:"Gordura no fígado",n:"B",t:"Melhora de enzimas e gordura hepática."}],
  dose:"1–4 g/dia de EPA+DHA, conforme objetivo. Priorizar alta concentração.",seg:"Arrotos, Desconforto no estômago/intestino. Cautela com remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel) em doses altas.",mani:"Ômega-3 (EPA/DHA alta concentração) 1 g — 90 cápsulas.\nTomar 1–2 cápsulas 2x/dia às refeições.",reg:"Suplemento / medicamento conforme apresentação."},
 {id:"coq",nome:"Coenzima Q10",sci:"Ubiquinona / ubiquinol",classe:"Nutracêutico",tags:["fadiga","miopatia por estatina","enxaqueca"],
  resumo:"Composto lipossolúvel sintetizado pelo próprio corpo, essencial à cadeia de transporte de elétrons da mitocôndria (produção de ATP) e antioxidante de membrana. As estatinas reduzem sua síntese, o que motiva o uso na mialgia por estatina. A forma ubiquinol é mais bem absorvida e a absorção melhora com refeição gordurosa.",
  refs:[{au:"Qu H et al.",yr:2018,jr:"J Am Heart Assoc",ty:"Meta-análise (12 RCTs, n=575)",fd:"Atenua os sintomas musculares associados à estatina (dor, fraqueza, câimbra, cansaço); sem redução de CK plasmática.",doi:"10.1161/JAHA.118.009835"}],
  blocos:[{d:"Miopatia por estatina",n:"B",t:"100–200 mg/dia. Pode reduzir mialgia em alguns pacientes."},{d:"Profilaxia de enxaqueca",n:"B",t:"300 mg/dia reduz frequência de crises."},{d:"Fadiga",n:"C",t:"Sinal modesto e inconsistente."}],
  dose:"100–300 mg/dia. Ubiquinol é melhor absorvido.",seg:"Bem tolerada. Pode reduzir efeito do remédio que afina o sangue varfarina (Marevan).",mani:"Coenzima Q10 (ubiquinol) 100 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia com refeição gordurosa.",reg:"Nutracêutico."},
 {id:"cre",nome:"Creatina",sci:"Creatina monoidratada",classe:"Nutracêutico",tags:["performance","massa magra","sarcopenia","foco"],
  resumo:"Composto nitrogenado que o corpo sintetiza no fígado e nos rins a partir de arginina, glicina e metionina, e que também vem da dieta (carne e peixe). Armazenada no músculo como fosfocreatina, regenera ATP em esforços curtos e intensos — o que sustenta força e ganho de massa quando combinada ao treino resistido.",
  refs:[{au:"Burke R et al.",yr:2023,jr:"Nutrients",ty:"Revisão sistemática + meta-análise",fd:"Aumento adicional pequeno de hipertrofia (medida por imagem) com creatina + treino vs. treino isolado.",doi:"10.3390/nu15092116"},{au:"Devries MC, Phillips SM",yr:2014,jr:"Med Sci Sports Exerc",ty:"Meta-análise (idosos, 357 participantes)",fd:"Creatina + treino eleva massa magra, força (chest/leg press) e desempenho funcional vs. treino isolado.",doi:"10.1249/MSS.0000000000000220"}],
  blocos:[{d:"Força / performance",n:"A",t:"3–5 g/dia. Um dos suplementos com melhor evidência em performance."},{d:"Massa magra / sarcopenia",n:"A",t:"Com treino resistido, ganho de massa e função em idosos."},{d:"Cognição",n:"C",t:"Sinal em privação de sono e idosos; emergente."}],
  dose:"3–5 g/dia, contínuo. Não precisa de fase de saturação.",seg:"Muito seguro. Retenção hídrica inicial. Hidratação adequada.",mani:"Creatina monoidratada 5 g (dose diária).\nTomar 5 g/dia, qualquer horário.",reg:"Suplemento."},
 {id:"vd",nome:"Vitamina D3",sci:"Colecalciferol",classe:"Vitamina",tags:["saúde óssea","imunidade"],
  resumo:"Vitamina lipossolúvel (na prática um pró-hormônio), sintetizada na pele pela luz solar e ativada no fígado e no rim. Regula a absorção de cálcio e a saúde óssea, além de funções imunes e musculares. O maior benefício clínico está na correção da deficiência — repor em quem já tem nível adequado tende a não trazer ganho extra.",
  refs:[{au:"Kong SH et al.",yr:2022,jr:"Endocrinol Metab (Seoul)",ty:"Meta-análise (32 RCTs)",fd:"Dose diária de 800–1000 UI reduziu risco de fratura osteoporótica e de quedas; doses intermitentes não. Benefício maior em deficientes.",doi:"10.3803/EnM.2021.1374"}],
  blocos:[{d:"Saúde óssea / quedas",n:"B",t:"Correção da deficiência reduz quedas/fraturas em idosos com déficit."},{d:"Imunidade",n:"C",t:"Benefício em deficientes; populacional inconsistente."}],
  dose:"Repor conforme dosagem sérica. Manutenção 1000–2000 UI/dia usual.",seg:"Risco de hipercalcemia em megadoses. Monitorar em doses altas.",mani:"Vitamina D3 2000 UI — 60 cápsulas.\nTomar 1 cápsula/dia com refeição.",reg:"Vitamina / suplemento."},
 {id:"htp",nome:"5-HTP",sci:"5-hidroxitriptofano",classe:"Aminoácido",tags:["humor","insônia","saciedade"],
  resumo:"Aminoácido precursor direto da serotonina, extraído da semente da Griffonia simplicifolia. Por ser o passo logo antes da serotonina, é usado para humor, sono e saciedade — mas por isso mesmo não pode ser combinado a antidepressivos serotoninérgicos.",
  blocos:[{d:"Humor",n:"C",t:"Precursor de serotonina; evidência limitada e de baixa qualidade."},{d:"Saciedade / sono",n:"C",t:"Sinais preliminares."}],
  dose:"50–100 mg, geralmente à noite.",seg:"NÃO usar junto com antidepressivos que mexem na serotonina — tanto os do tipo ISRS (como sertralina, fluoxetina, escitalopram) quanto os mais antigos do tipo IMAO. A combinação pode causar a síndrome serotoninérgica, um excesso perigoso de serotonina. Pode dar enjoo e desconforto no estômago.",mani:"5-HTP 100 mg — 30 cápsulas.\nTomar 1 cápsula à noite.",reg:"Aminoácido / suplemento."},
 {id:"gink",nome:"Ginkgo biloba",sci:"EGb 761",classe:"Fitoterápico",tags:["cognição","zumbido","circulação"],
  resumo:"Extrato das folhas da árvore Ginkgo biloba, padronizado como EGb 761 (24% flavonoides / 6% terpenolactonas). Melhora a microcirculação e tem ação antioxidante e antiplaquetária. O uso cognitivo se apoia na melhora de fluxo cerebral; o benefício é maior em quem já tem déficit (demência) do que em jovens saudáveis.",
  refs:[{au:"Perng CH et al.",yr:2018,jr:"Psychopharmacology (Berl)",ty:"Meta-análise de múltiplos tratamentos (235 estudos, n=44.854)",fd:"Tratamento sintomático da demência vascular (incluindo EGb 761) está entre os mais eficazes sobre a disfunção cognitiva; benefício modesto.",doi:"10.1007/s00213-018-4867-y"}],
  blocos:[{d:"Demência / declínio cognitivo",n:"B",t:"EGb 761 240 mg/dia. Benefício modesto em demência leve."},{d:"Zumbido",n:"C",t:"Resultados conflitantes."},{d:"Memória em jovem saudável",n:"D",t:"Sem benefício comprovado."}],
  dose:"240 mg/dia do extrato padronizado EGb 761 (24% flavonoides / 6% terpenos).",seg:"Risco de sangramento — suspender antes de cirurgia; cautela com remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel).",mani:"Ginkgo biloba (EGb 761) 120 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"caf",nome:"Cafeína",sci:"",classe:"Estimulante",tags:["foco","performance","fadiga"],
  resumo:"Estimulante do sistema nervoso central (uma metilxantina) presente no café, chá e guaraná. Bloqueia receptores de adenosina, o que reduz a percepção de fadiga e sono e aumenta alerta. É um dos recursos ergogênicos mais validados — o efeito sobre performance é dose-dependente (3–6 mg/kg) e a combinação com L-teanina suaviza o nervosismo.",
  refs:[{au:"Wang Z et al.",yr:2022,jr:"Nutrients",ty:"Revisão sistemática + meta-análise (21 RCTs cruzados)",fd:"3–9 mg/kg aumentaram o tempo até a exaustão (efeito médio) e melhoraram o desempenho em provas de corrida de endurance.",doi:"10.3390/nu15010148"}],
  blocos:[{d:"Alerta / atenção",n:"A",t:"50–200 mg. Melhora vigilância e tempo de reação."},{d:"Performance física",n:"A",t:"3–6 mg/kg pré-treino aumenta desempenho."}],
  dose:"50–200 mg por dose; teto ~400 mg/dia. Combina com L-teanina (2:1).",seg:"Insônia, taquicardia, ansiedade. Cautela em arritmia, hipertensão e gestação.",mani:"Cafeína anidra 100 mg + L-teanina 200 mg — 30 cápsulas.\nTomar 1 cápsula pela manhã.",reg:"Estimulante / suplemento."},
 {id:"zn",nome:"Zinco",sci:"",classe:"Mineral",tags:["imunidade","acne","suporte à testosterona"],
  resumo:"Mineral essencial, cofator de centenas de enzimas e da função imune, cicatrização e síntese hormonal. Na imunidade do resfriado, a forma em pastilha (lozenge) iniciada cedo é a que tem evidência; megadose crônica é contraproducente porque induz deficiência de cobre.",
  refs:[{au:"Singh M, Das RR",yr:2013,jr:"Cochrane Database Syst Rev",ty:"Revisão sistemática Cochrane (18 ensaios, n=1781)",fd:"Zinco iniciado em até 24h reduz a duração do resfriado (≥75 mg/dia em pastilha); efeitos adversos: gosto ruim e náusea.",doi:"10.1002/14651858.CD001364.pub4"}],
  blocos:[{d:"Resfriado comum (duração)",n:"B",t:"Iniciado nas primeiras 24h pode encurtar a duração."},{d:"Acne",n:"C",t:"Sinal modesto, sobretudo em deficientes."},{d:"Testosterona (em deficientes)",n:"C",t:"Corrige queda associada à deficiência."}],
  dose:"15–30 mg/dia de zinco elementar. Uso prolongado: vigiar cobre.",seg:"Náusea em jejum. Megadoses crônicas causam deficiência de cobre.",mani:"Zinco quelato (15 mg elementar) — 60 cápsulas.\nTomar 1 cápsula/dia com refeição.",reg:"Suplemento mineral."},
 {id:"bosw",nome:"Boswellia",sci:"Boswellia serrata",classe:"Fitoterápico",tags:["osteoartrite","inflamação"],
  resumo:"Resina (olíbano/incenso) da árvore Boswellia serrata, usada na medicina ayurvédica. O ativo principal é o AKBA (ácido acetil-11-ceto-beta-boswélico), que inibe a 5-lipoxigenase — uma via inflamatória diferente da dos AINEs e da curcumina, o que justifica a combinação dos dois.",
  refs:[{au:"Yu G et al.",yr:2020,jr:"BMC Complement Med Ther",ty:"Revisão sistemática + meta-análise (7 RCTs, n=545)",fd:"Boswellia e seu extrato aliviaram dor (VAS e WOMAC) e rigidez e melhoraram a função na osteoartrite; sugere-se uso por ≥4 semanas.",doi:"10.1186/s12906-020-02985-6"}],
  blocos:[{d:"Osteoartrite",n:"B",t:"Extrato padronizado em AKBA reduz dor e melhora função."}],
  dose:"100–250 mg/dia de extrato padronizado (≥30% ácidos boswélicos / AKBA).",seg:"desconforto leve no estômago/intestino. Bem tolerado.",mani:"Boswellia (ext. padr. 30% AKBA) 100 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico."},
 {id:"ala",nome:"Ácido alfa-lipóico",sci:"",classe:"Nutracêutico",tags:["neuropatia diabética","resistência insulínica"],
  resumo:"Ácido graxo com enxofre sintetizado pelo corpo, antioxidante que atua tanto em meio aquoso quanto lipídico e regenera outros antioxidantes (vitaminas C e E, glutationa). Na neuropatia diabética, reduz o estresse oxidativo e melhora a microcirculação do nervo — o desfecho com melhor evidência por via oral.",
  refs:[{au:"Hsieh RY et al.",yr:2023,jr:"Nutrients",ty:"Revisão sistemática + meta-análise (10 RCTs, n=1242)",fd:"ALA oral reduz sintomas sensoriais da neuropatia diabética (escore TSS) de forma dose-dependente; melhora a satisfação global.",doi:"10.3390/nu15163634"}],
  blocos:[{d:"Neuropatia diabética",n:"B",t:"600 mg/dia melhora sintomas neuropáticos."},{d:"Resistência insulínica",n:"C",t:"Efeito modesto sobre glicemia."}],
  dose:"600 mg/dia, em jejum.",seg:"desconforto leve no estômago/intestino. Pode reduzir glicemia — atenção com remédios para baixar o açúcar do sangue (diabetes).",mani:"Ácido alfa-lipóico 600 mg — 30 cápsulas.\nTomar 1 cápsula/dia em jejum.",reg:"Nutracêutico."},
 {id:"maca",nome:"Maca peruana",sci:"Lepidium meyenii",classe:"Fitoterápico",tags:["libido","fadiga","fertilidade"],
  resumo:"Raiz andina (Lepidium meyenii) usada como alimento e tônico de energia e libido. Não age por via hormonal direta; o mecanismo exato é incerto, e o efeito sobre libido aparece em estudos pequenos.",
  refs:[{au:"Shin BC et al.",yr:2010,jr:"BMC Complement Altern Med",ty:"Revisão sistemática (4 RCTs)",fd:"Evidência limitada de efeito da maca sobre função/desejo sexual; amostras pequenas e qualidade metodológica restrita.",doi:"10.1186/1472-6882-10-44"}],
  blocos:[{d:"Libido",n:"C",t:"1,5–3 g/dia. Sinal positivo em estudos pequenos, ambos os sexos."},{d:"Fertilidade",n:"D",t:"Evidência insuficiente."}],
  dose:"1,5–3 g/dia do pó/extrato.",seg:"Bem tolerada. Cautela em condições hormônio-sensíveis (dados escassos).",mani:"Maca peruana 1,5 g — 60 doses.\nTomar 1,5 g/dia.",reg:"Fitoterápico / alimento."},
 {id:"prob",nome:"Probiótico multicepa",sci:"",classe:"Probiótico",tags:["disbiose","intestino irritável","diarreia por antibiótico"],
  resumo:"Microrganismos vivos (lactobacilos, bifidobactérias, S. boulardii) que, em quantidade adequada, modulam a microbiota intestinal. O efeito é altamente cepa-específico — não existe 'probiótico genérico': a cepa e a dose precisam casar com a indicação, e a evidência varia bastante entre elas.",
  refs:[{au:"Goodoory VC et al.",yr:2023,jr:"Gastroenterology",ty:"Revisão sistemática + meta-análise (82 RCTs, n=10.332)",fd:"Algumas cepas/combinações melhoram sintomas globais e dor na síndrome do intestino irritável, mas a certeza da evidência (GRADE) é de baixa a muito baixa.",doi:"10.1053/j.gastro.2023.07.018"}],
  blocos:[{d:"Síndrome do intestino irritável",n:"B",t:"Cepas específicas melhoram sintomas globais (certeza GRADE baixa a muito baixa)."},{d:"Diarreia associada a antibiótico",n:"B",t:"Reduz incidência (ex.: S. boulardii, lactobacilos)."}],
  dose:"≥10 bilhões UFC/dia; escolher a cepa conforme a indicação.",seg:"Cautela em pessoas com imunidade muito baixa (transplantados, quimioterapia, HIV avançado).",mani:"Probiótico multicepa 10 bi UFC — 30 cápsulas.\nTomar 1 cápsula/dia.",reg:"Suplemento / alimento funcional."},
 {id:"vc",nome:"Vitamina C",sci:"Ácido ascórbico",classe:"Vitamina",tags:["imunidade"],
  resumo:"Vitamina hidrossolúvel antioxidante e cofator da síntese de colágeno e da absorção de ferro não-heme. O corpo não a armazena nem sintetiza, daí depender da dieta; o excesso é excretado na urina.",
  refs:[{au:"Hemilä H, Chalker E",yr:2013,jr:"Cochrane Database Syst Rev",ty:"Revisão sistemática Cochrane (29 ensaios, n=11.306)",fd:"Uso regular não previne resfriado na população geral, mas reduz a duração (8% adultos, 14% crianças); sem efeito quando iniciado já com sintomas.",doi:"10.1002/14651858.CD000980.pub4"}],
  blocos:[{d:"Resfriado comum",n:"C",t:"Uso regular reduz levemente a duração; não previne na população geral."}],
  dose:"500–1000 mg/dia.",seg:"Doses altas: desconforto no estômago/intestino e risco de cálculo de oxalato.",mani:"Vitamina C 500 mg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Vitamina / suplemento."},
 {id:"sily",nome:"Silimarina",sci:"Silybum marianum",classe:"Fitoterápico",tags:["suporte hepático","esteatose hepática"],
  resumo:"Complexo de flavonoides (silimarina) extraído do cardo-mariano (Silybum marianum). Tem ação antioxidante e estabilizadora da membrana do hepatócito, o que fundamenta o uso tradicional no suporte hepático.",
  refs:[{au:"Shahsavari K et al.",yr:2025,jr:"BMC Complement Med Ther",ty:"Revisão sistemática + meta-análise (55 RCTs, n=3545)",fd:"Silimarina reduziu AST e ALT (mais na esteatose e hepatite viral; sem efeito em lesão por álcool ou fármacos); melhor com dose <400 mg e ≤2 meses.",doi:"10.1186/s12906-025-04886-y"}],
  blocos:[{d:"Suporte hepático",n:"C",t:"Antioxidante hepático; evidência clínica fraca e heterogênea."},{d:"Gordura no fígado",n:"C",t:"Sinal modesto em enzimas."}],
  dose:"140 mg de silimarina 2–3x/dia (extrato 70–80%).",seg:"Bem tolerada. desconforto leve no estômago/intestino.",mani:"Silimarina 140 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"gins",nome:"Ginseng coreano",sci:"Panax ginseng",classe:"Adaptógeno",tags:["fadiga","cognição","disfunção erétil"],
  resumo:"Raiz do Panax ginseng, adaptógeno central da medicina tradicional do leste asiático. Os ginsenosídeos modulam o eixo do estresse e têm ação sobre óxido nítrico (vasodilatação), o que embasa tanto o uso na fadiga quanto na disfunção erétil. 'Panax' vem do grego panacea — reflexo do uso tradicional amplo, que a ciência só sustenta em parte.",
  refs:[{au:"Zhu J et al.",yr:2022,jr:"Medicine (Baltimore)",ty:"Revisão sistemática + meta-análise (12 RCTs, n=1298)",fd:"Suplementos de ginseng reduziram de forma estatisticamente significativa a fadiga relacionada a doenças (SMD 0,33).",doi:"10.1097/MD.0000000000029767"}],
  blocos:[{d:"Fadiga",n:"B",t:"Reduz fadiga em alguns RCTs."},{d:"Disfunção erétil",n:"B",t:"Ginseng vermelho com sinal positivo."},{d:"Cognição",n:"C",t:"Resultados mistos."}],
  dose:"200–400 mg/dia de extrato padronizado (≥4% ginsenosídeos).",seg:"Insônia, dor de cabeça. Cautela com remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel) e remédios para baixar o açúcar do sangue (diabetes).",mani:"Ginseng (Panax) 200 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico."},
 {id:"egcg",nome:"Chá verde (EGCG)",sci:"Camellia sinensis",classe:"Fitoterápico",tags:["controle de peso","antioxidante","dislipidemia"],
  resumo:"Catequina majoritária do chá verde (Camellia sinensis). Antioxidante que modula termogênese e oxidação de gordura; o efeito sobre peso é pequeno. Em altas doses concentradas há relatos de hepatotoxicidade.",
  refs:[{au:"Vázquez Cisneros LC et al.",yr:2017,jr:"Nutr Hosp",ty:"Revisão sistemática (15 estudos)",fd:"Chá verde com EGCG 100–460 mg/dia por ≥12 semanas teve efeito sobre gordura e peso corporal, potencializado por cafeína em quem não a consome em excesso.",doi:"10.20960/nh.753"}],
  blocos:[{d:"Controle de peso",n:"C",t:"Efeito pequeno sobre peso/gordura, sobretudo com cafeína."},{d:"Antioxidante / lipídios",n:"C",t:"Melhora modesta do perfil lipídico."}],
  dose:"Extrato com 300–400 mg de EGCG/dia.",seg:"Risco raro de lesão no fígado com extratos concentrados em jejum — tomar com alimento. Contém cafeína.",mani:"Chá verde (ext. 50% EGCG) 300 mg — 60 cápsulas.\nTomar 1 cápsula/dia com refeição.",reg:"Fitoterápico."},
 {id:"saff",nome:"Açafrão (safranal)",sci:"Crocus sativus",classe:"Fitoterápico",tags:["humor","ansiedade"],
  resumo:"Especiaria extraída dos estigmas da flor Crocus sativus (o açafrão-verdadeiro, não confundir com a cúrcuma/açafrão-da-terra). Os ativos crocina e safranal modulam a serotonina, o que embasa o uso no humor. É um dos fitoterápicos com melhor sinal em depressão leve a moderada.",
  refs:[{au:"Tóth B et al.",yr:2019,jr:"Planta Med",ty:"Meta-análise (11 RCTs)",fd:"Açafrão foi superior ao placebo (g=0,89) e não inferior a antidepressivos na depressão leve a moderada.",doi:"10.1055/a-0660-9565"}],
  blocos:[{d:"Depressão leve a moderada",n:"B",t:"30 mg/dia com eficácia comparável a ISRS em RCTs pequenos."}],
  dose:"30 mg/dia de extrato padronizado (safranal/crocina).",seg:"desconforto leve no estômago/intestino. Doses altas (>1,5 g) são tóxicas.",mani:"Açafrão (ext. padr.) 15 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico."},
 {id:"pass",nome:"Passiflora",sci:"Passiflora incarnata",classe:"Fitoterápico",tags:["ansiedade","insônia"],
  resumo:"Extrato da Passiflora incarnata (maracujá), usada como calmante. Parece potencializar a sinalização GABA, gerando efeito ansiolítico leve sem a sedação intensa de fármacos.",
  refs:[{au:"Janda K et al.",yr:2020,jr:"Nutrients",ty:"Revisão sistemática (9 ensaios clínicos)",fd:"A maioria dos estudos mostrou redução da ansiedade com preparações de passiflora; efeito menos evidente em sintomas leves, sem efeitos adversos.",doi:"10.3390/nu12123894"}],
  blocos:[{d:"Ansiedade",n:"B",t:"Sinal ansiolítico em RCTs pequenos."},{d:"Insônia",n:"C",t:"Melhora subjetiva do sono."}],
  dose:"Extrato seco 200–400 mg/dia.",seg:"Sonolência. Cautela com remédios calmantes/para dormir.",mani:"Passiflora (ext. seco) 200 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"camo",nome:"Camomila",sci:"Matricaria chamomilla",classe:"Fitoterápico",tags:["ansiedade","insônia","dispepsia"],
  resumo:"Flores da Matricaria chamomilla. O flavonoide apigenina liga-se a receptores de benzodiazepínicos, o que explica o efeito calmante leve; também tem ação digestiva tradicional.",
  refs:[{au:"Mao JJ et al.",yr:2016,jr:"Phytomedicine",ty:"RCT duplo-cego (n=179)",fd:"Extrato 1500 mg/dia foi seguro e reduziu significativamente sintomas de ansiedade generalizada moderada-grave; não reduziu a taxa de recaída.",doi:"10.1016/j.phymed.2016.10.012"}],
  blocos:[{d:"Ansiedade generalizada",n:"C",t:"Sinal modesto em RCT de extrato padronizado."},{d:"Insônia / dispepsia",n:"C",t:"Uso tradicional; evidência limitada."}],
  dose:"Extrato 200–400 mg/dia (1,2% apigenina).",seg:"Alergia em sensíveis a plantas da família da camomila/margarida (Asteraceae).",mani:"Camomila (ext. padr.) 200 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"hyp",nome:"Hipérico",sci:"Hypericum perforatum",classe:"Fitoterápico",tags:["humor","ansiedade"],
  resumo:"Erva-de-são-joão (Hypericum perforatum), usada há séculos para o humor. A hiperforina e a hipericina inibem a recaptação de monoaminas (serotonina, noradrenalina, dopamina), de forma análoga aos antidepressivos. O ponto crítico não é a eficácia, mas a segurança: é um forte indutor enzimático com interações graves.",
  refs:[{au:"Apaydin EA et al.",yr:2016,jr:"Syst Rev",ty:"Revisão sistemática + meta-análise (35 estudos, n=6993)",fd:"Monoterapia superior ao placebo e equivalente a antidepressivos na depressão leve a moderada, com menos efeitos adversos (qualidade GRADE moderada).",doi:"10.1186/s13643-016-0325-2"}],
  blocos:[{d:"Depressão leve a moderada",n:"A",t:"Eficácia comparável a ISRS na depressão leve-moderada."}],
  dose:"300 mg 3x/dia de extrato padronizado (0,3% hipericina).",seg:"INTERAÇÕES GRAVES. Acelera a eliminação de vários remédios no fígado, fazendo eles pararem de funcionar — pode falhar a pílula anticoncepcional (risco de gravidez), o remédio que afina o sangue varfarina (Marevan), remédios para transplante e para HIV. Também não deve ser usado com antidepressivos do tipo ISRS (como sertralina, fluoxetina), pelo risco de excesso de serotonina. Pode deixar a pele mais sensível ao sol.",mani:"Hipérico (ext. 0,3% hipericina) 300 mg — 90 cápsulas.\nTomar 1 cápsula 3x/dia.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"ging",nome:"Gengibre",sci:"Zingiber officinale",classe:"Fitoterápico",tags:["náusea","dispepsia"],
  resumo:"Rizoma do Zingiber officinale. Os gingeróis e shogaóis aceleram o esvaziamento gástrico e agem sobre receptores 5-HT3 no trato digestivo — o mesmo alvo de antieméticos como a ondansetrona, o que explica o efeito antináusea. É um dos fitoterápicos mais seguros e usados, inclusive na gestação.",
  refs:[{au:"Tan MY et al.",yr:2023,jr:"Front Public Health",ty:"Revisão sistemática + meta-análise (33 RCTs)",fd:"Gengibre reduziu náusea da gestação vs. placebo (índice de Rhodes e VAS) com efeito antiemético semelhante a fármacos; evidência de qualidade baixa a moderada.",doi:"10.3389/fpubh.2023.1108756"}],
  blocos:[{d:"Náusea (gestação, pós-op, quimio)",n:"A",t:"1–1,5 g/dia reduz náusea de forma consistente."}],
  dose:"250 mg 3–4x/dia (até 1,5 g/dia).",seg:"Azia leve. Cautela com remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel) em doses altas.",mani:"Gengibre (ext.) 250 mg — 60 cápsulas.\nTomar 1 cápsula 3x/dia.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"garl",nome:"Alho",sci:"Allium sativum",classe:"Fitoterápico",tags:["hipertensão","dislipidemia"],
  resumo:"Bulbo do Allium sativum. Quando o dente é amassado, libera alicina, precursora de compostos sulfurados que promovem vasodilatação (via óxido nítrico) e têm ação antiplaquetária. O extrato de alho envelhecido (Kyolic) é a forma mais estudada para pressão arterial.",
  refs:[{au:"Ried K",yr:2020,jr:"Exp Ther Med",ty:"Revisão + meta-análise (12 ensaios, n=553 hipertensos)",fd:"Suplemento de alho reduziu a PA sistólica em ~8 mmHg e a diastólica em ~5,5 mmHg em hipertensos, magnitude comparável a anti-hipertensivos de primeira linha.",doi:"10.3892/etm.2019.8374"}],
  blocos:[{d:"Hipertensão",n:"B",t:"Extrato envelhecido reduz modestamente a pressão arterial."},{d:"Dislipidemia",n:"C",t:"Efeito pequeno sobre lipídios."}],
  dose:"600–1200 mg/dia de extrato (padronizado em alicina).",seg:"Hálito, Desconforto no estômago/intestino. Cautela com remédios que afinam o sangue (como varfarina/Marevan, aspirina, clopidogrel).",mani:"Alho (ext. padr. alicina) 600 mg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Fitoterápico (lista ANVISA)."},
 {id:"baco",nome:"Bacopa",sci:"Bacopa monnieri",classe:"Fitoterápico",tags:["cognição","memória","ansiedade"],
  resumo:"Erva (Brahmi) usada há milênios na medicina ayurvédica para memória. Os bacosídeos são os ativos; têm ação antioxidante no tecido nervoso e parecem favorecer a transmissão sináptica. O efeito é lento — aparece após uso contínuo de ≥12 semanas, não de forma aguda.",
  refs:[{au:"Kongkeaw C et al.",yr:2014,jr:"J Ethnopharmacol",ty:"Meta-análise de RCTs (9 estudos, n=518)",fd:"Extrato de Bacopa melhorou a cognição, sobretudo a velocidade de atenção (Trail B e tempo de reação de escolha); uso ≥12 semanas.",doi:"10.1016/j.jep.2013.11.008"}],
  blocos:[{d:"Memória / cognição",n:"B",t:"300 mg/dia (≥50% bacosídeos) melhora memória após 8–12 sem."}],
  dose:"300 mg/dia de extrato (≥50% bacosídeos).",seg:"Desconforto no estômago/intestino, cólica — tomar com alimento.",mani:"Bacopa (ext. 50% bacosídeos) 300 mg — 30 cápsulas.\nTomar 1 cápsula/dia com refeição.",reg:"Fitoterápico."},
 {id:"heri",nome:"Leão-da-juba",sci:"Hericium erinaceus",classe:"Fitoterápico",tags:["cognição","humor"],
  resumo:"Cogumelo medicinal (Hericium erinaceus) com aparência de juba. Contém hericenonas e erinacinas, que em modelos pré-clínicos estimulam o fator de crescimento neural (NGF) — base da hipótese cognitiva, ainda pouco testada em humanos.",
  refs:[{au:"La Monica MB et al.",yr:2023,jr:"Nutrients",ty:"RCT cruzado duplo-cego",fd:"Dose única de 1 g de Leão-da-juba melhorou memória de trabalho, atenção e tempo de reação 2h após a ingestão.",doi:"10.3390/nu15245018"}],
  blocos:[{d:"Cognição",n:"C",t:"Sinais preliminares em cognição leve; estudos pequenos."}],
  dose:"500–1000 mg/dia de extrato.",seg:"Bem tolerado. Alergia rara.",mani:"Hericium (ext.) 500 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico / cogumelo funcional."},
 {id:"trib",nome:"Tribulus",sci:"Tribulus terrestris",classe:"Fitoterápico",tags:["libido","suporte à testosterona"],
  resumo:"Planta (Tribulus terrestris) com saponinas, popular como suposto pró-testosterona. A maioria dos estudos não confirma elevação de testosterona; o efeito relatado sobre libido independe disso.",
  blocos:[{d:"Libido",n:"C",t:"Sinal modesto em mulheres; inconsistente em homens."},{d:"Testosterona",n:"D",t:"Não eleva testosterona de forma confiável."}],
  dose:"Extrato 250–750 mg/dia (padronizado em saponinas).",seg:"Desconforto no estômago/intestino. Casos raros de lesão no fígado, ligados a produtos adulterados.",mani:"Tribulus (ext. 45% saponinas) 250 mg — 60 cápsulas.\nTomar 1 cápsula 2x/dia.",reg:"Fitoterápico."},
 {id:"feno",nome:"Feno-grego",sci:"Trigonella foenum-graecum",classe:"Fitoterápico",tags:["libido","suporte à testosterona","controle glicêmico"],
  resumo:"Semente (Trigonella foenum-graecum) rica em fibras e saponinas. Estudada para libido/testosterona e controle glicêmico; o mecanismo combina retardo de absorção de carboidratos e possível ação hormonal modesta.",
  refs:[{au:"Shabil M et al.",yr:2023,jr:"Medicina (Kaunas)",ty:"Revisão sistemática + meta-análise (14 ensaios, n=894)",fd:"Feno-grego reduziu a HbA1c na hiperglicemia; qualidade e heterogeneidade dos estudos permanecem uma limitação.",doi:"10.3390/medicina59020248"}],
  blocos:[{d:"Libido",n:"C",t:"Sinal positivo em extratos padronizados."},{d:"Controle glicêmico",n:"C",t:"Redução modesta da glicemia."}],
  dose:"500–600 mg/dia de extrato padronizado.",seg:"Desconforto no estômago/intestino, odor corporal. Cautela com remédios para baixar o açúcar do sangue (diabetes).",mani:"Feno-grego (ext. padr.) 500 mg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Fitoterápico."},
 {id:"garc",nome:"Garcinia cambogia",sci:"Garcinia gummi-gutta",classe:"Fitoterápico",tags:["controle de peso"],
  resumo:"Fruto asiático cujo ácido hidroxicítrico (HCA) inibe uma enzima da lipogênese. A promessa de emagrecimento não se confirma na prática, e há alertas de hepatotoxicidade — entra marcado como tal.",
  blocos:[{d:"Perda de peso",n:"D",t:"Eficácia não comprovada; efeito clinicamente irrelevante."}],
  dose:"Não recomendada.",seg:"JÁ HOUVE CASOS GRAVES DE LESÃO NO FÍGADO. O risco supera qualquer benefício.",mani:"Não recomendado — ausência de eficácia e risco hepático.",reg:"Fitoterápico."},
 {id:"taur",nome:"Taurina",sci:"",classe:"Aminoácido",tags:["performance","saúde cardiovascular"],
  resumo:"Aminoácido sulfonado abundante no músculo e no cérebro, com papel na osmorregulação e na função cardíaca e neuronal. Ingrediente comum em energéticos, mais como modulador do que como estimulante.",
  refs:[{au:"López-Torres O et al.",yr:2022,jr:"Nutrients",ty:"Revisão sistemática + meta-análise (32 estudos)",fd:"Entre os recursos ergogênicos, a taurina ajudou a melhorar testes aeróbicos; efeito modesto.",doi:"10.3390/nu15010081"}],
  blocos:[{d:"Performance física",n:"C",t:"Efeito ergogênico pequeno e inconsistente."},{d:"Cardiometabólico",n:"C",t:"Sinais preliminares; emergente."}],
  dose:"1–3 g/dia.",seg:"Muito bem tolerada.",mani:"Taurina 1 g — 60 cápsulas.\nTomar 1 cápsula 1–2x/dia.",reg:"Aminoácido / suplemento."},
 {id:"citr",nome:"L-citrulina",sci:"",classe:"Aminoácido",tags:["performance","disfunção erétil"],
  resumo:"Aminoácido que o corpo converte em arginina e depois em óxido nítrico, um vasodilatador. Aumenta o fluxo sanguíneo muscular — daí o uso pré-treino (geralmente como citrulina malato) e na disfunção erétil leve. Curiosamente, eleva a arginina plasmática mais que a própria suplementação de arginina.",
  refs:[{au:"Vårvik FT et al.",yr:2021,jr:"Int J Sport Nutr Exerc Metab",ty:"Revisão sistemática + meta-análise (8 RCTs, n=137)",fd:"6–8 g de citrulina malato 40–60 min antes do treino aumentaram modestamente o número de repetições até a falha (efeito pequeno).",doi:"10.1123/ijsnem.2020-0295"}],
  blocos:[{d:"Performance / fluxo (NO)",n:"B",t:"Citrulina malato 6–8 g pré-treino melhora desempenho."},{d:"Disfunção erétil leve",n:"C",t:"Sinal modesto."}],
  dose:"Citrulina malato 6–8 g pré-treino, ou L-citrulina 3 g/dia.",seg:"desconforto leve no estômago/intestino. Cautela com remédios para pressão alta.",mani:"Citrulina malato 6 g — dose pré-treino.\nTomar 30–40 min antes do treino.",reg:"Aminoácido / suplemento."},
 {id:"bala",nome:"Beta-alanina",sci:"",classe:"Aminoácido",tags:["performance"],
  resumo:"Aminoácido precursor da carnosina muscular, um tampão que neutraliza a acidez (íons H+) gerada no esforço intenso. Por isso o ganho aparece sobretudo em exercícios de 1–4 minutos de alta intensidade. O efeito colateral típico é a parestesia (formigamento) transitória, inofensiva.",
  refs:[{au:"Saunders B et al.",yr:2017,jr:"Br J Sports Med",ty:"Revisão sistemática + meta-análise (40 estudos, n=1461)",fd:"Efeito ergogênico pequeno mas significativo (SMD 0,18), maior em exercícios de 0,5–10 min e na capacidade de exercício.",doi:"10.1136/bjsports-2016-096396"}],
  blocos:[{d:"Performance (alta intensidade)",n:"A",t:"3,2–6,4 g/dia melhora esforços de 1–4 min (carnosina muscular)."}],
  dose:"3,2–6,4 g/dia, fracionada.",seg:"Parestesia transitória (formigamento) — fracionar reduz.",mani:"Beta-alanina 3,2 g/dia (fracionar em 2 doses).\nTomar diariamente.",reg:"Aminoácido / suplemento."},
 {id:"carn",nome:"L-carnitina",sci:"",classe:"Aminoácido",tags:["performance","fertilidade","fadiga"],
  resumo:"Aminoácido que transporta ácidos graxos para a mitocôndria para serem queimados como energia. O corpo o sintetiza; a suplementação interessa sobretudo em deficiência e situações específicas, não como queimador de gordura.",
  refs:[{au:"Salas-Huetos A et al.",yr:2018,jr:"Adv Nutr",ty:"Revisão sistemática + meta-análise de RCTs",fd:"Carnitina melhorou a motilidade total e progressiva e a morfologia espermática; benefício na fertilidade masculina (heterogeneidade considerável).",doi:"10.1093/advances/nmy057"}],
  blocos:[{d:"Fertilidade masculina",n:"C",t:"Sinal em parâmetros seminais."},{d:"Performance / recuperação",n:"C",t:"Efeito pequeno, melhor na recuperação."}],
  dose:"1–2 g/dia (L-carnitina ou tartarato).",seg:"Desconforto no estômago/intestino. Odor de peixe em doses altas (TMAO).",mani:"L-carnitina 1 g — 60 cápsulas.\nTomar 1 cápsula 1–2x/dia.",reg:"Aminoácido / suplemento."},
 {id:"glic",nome:"Glicina",sci:"",classe:"Aminoácido",tags:["insônia","controle glicêmico"],
  resumo:"Aminoácido mais simples, também neurotransmissor inibitório e componente do colágeno e da glutationa. À noite, parece melhorar a qualidade subjetiva do sono ao reduzir levemente a temperatura corporal.",
  refs:[{au:"Bannai M, Kawai N",yr:2012,jr:"J Pharmacol Sci",ty:"Revisão de ensaios humanos + modelo animal",fd:"Glicina antes de dormir melhorou a qualidade subjetiva do sono em pessoas com tendência à insônia; mecanismo ligado à queda da temperatura corporal central.",doi:"10.1254/jphs.11r04fm"}],
  blocos:[{d:"Qualidade do sono",n:"C",t:"3 g antes de dormir melhora o sono subjetivo."}],
  dose:"3 g, 30–60 min antes de dormir.",seg:"Muito bem tolerada.",mani:"Glicina 3 g (sachê ou cápsulas).\nTomar 3 g antes de dormir.",reg:"Aminoácido / suplemento."},
 {id:"coll",nome:"Colágeno (peptídeos)",sci:"",classe:"Aminoácido",tags:["pele","osteoartrite","cabelo"],
  resumo:"Proteína estrutural da pele, ossos e cartilagem, hidrolisada em peptídeos curtos para ser absorvida. A hipótese é que os peptídeos (ricos em prolina/glicina) estimulem fibroblastos a produzir mais matriz dérmica. O benefício na pele aparece em 8–12 semanas; a fotoproteção tópica continua sendo a base.",
  refs:[{au:"Nukaly HY et al.",yr:2026,jr:"Front Med (Lausanne)",ty:"Revisão sistemática + meta-análise (19 RCTs, n=1341)",fd:"Peptídeos orais melhoraram hidratação e luminosidade da pele, com efeito modesto sobre rugas; bem tolerados.",doi:"10.3389/fmed.2026.1618306"}],
  blocos:[{d:"Elasticidade / hidratação da pele",n:"B",t:"2,5–10 g/dia melhora parâmetros cutâneos em RCTs."},{d:"Dor articular",n:"C",t:"Sinal modesto (peptídeos / tipo II)."}],
  dose:"2,5–10 g/dia de peptídeos de colágeno hidrolisado.",seg:"Bem tolerado.",mani:"Peptídeos de colágeno 10 g — dose diária.\nTomar 10 g/dia.",reg:"Suplemento proteico."},
 {id:"b12",nome:"Vitamina B12",sci:"Cobalamina",classe:"Vitamina",tags:["fadiga","neuropatia"],
  resumo:"Vitamina hidrossolúvel essencial à formação do sangue e à bainha de mielina dos nervos. A deficiência (comum em veganos, idosos e no uso crônico de metformina/IBP) causa anemia e dano neurológico que pode ser irreversível se não tratado a tempo. Repor em quem não é deficiente não traz benefício — investigar sempre a causa.",
  refs:[{au:"Stabler SP",yr:2013,jr:"N Engl J Med",ty:"Revisão de prática clínica",fd:"A deficiência de B12 causa anemia megaloblástica e manifestações neurológicas; o tratamento (oral ou parenteral) corrige as alterações, mas o dano neurológico pode ser irreversível se tardio.",doi:"10.1056/NEJMcp1113996"}],
  blocos:[{d:"Deficiência de B12",n:"A",t:"Reposição corrige anemia, fadiga e sintomas neurológicos."},{d:"Fadiga sem deficiência",n:"D",t:"Sem benefício."}],
  dose:"Repor conforme dosagem. Manutenção oral 500–1000 mcg/dia.",seg:"Muito seguro. Investigar a causa da deficiência.",mani:"Metilcobalamina 1000 mcg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Vitamina / suplemento."},
 {id:"k2",nome:"Vitamina K2 (MK-7)",sci:"Menaquinona",classe:"Vitamina",tags:["saúde óssea","saúde vascular"],
  resumo:"Forma da vitamina K (menaquinona, MK-7) que ativa proteínas que direcionam o cálcio para o osso e o afastam das artérias. A hipótese óssea/vascular é plausível, mas a evidência clínica ainda é emergente.",
  refs:[{au:"Kuang X et al.",yr:2020,jr:"Food Funct",ty:"Meta-análise (8 RCTs, n=971)",fd:"Vitamina K (sobretudo K2) combinada à vitamina D aumentou a densidade mineral óssea total e reduziu a osteocalcina subcarboxilada.",doi:"10.1039/c9fo03063h"}],
  blocos:[{d:"Saúde óssea",n:"C",t:"Sinergia com vitamina D; evidência emergente."},{d:"Calcificação vascular",n:"C",t:"Preliminar."}],
  dose:"90–180 mcg/dia de MK-7.",seg:"INTERAGE com o remédio que afina o sangue varfarina (Marevan) (efeito contrário) — contraindicada nesse caso.",mani:"Vitamina K2 (MK-7) 100 mcg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Vitamina / suplemento."},
 {id:"sel",nome:"Selênio",sci:"",classe:"Mineral",tags:["tireoide","antioxidante"],
  resumo:"Oligoelemento essencial, cofator de enzimas antioxidantes (glutationa peroxidase) e do metabolismo tireoidiano. Tem janela estreita: a falta e o excesso (selenose) são ambos prejudiciais.",
  refs:[{au:"Wang YS et al.",yr:2023,jr:"Nutrients",ty:"Overview de revisões sistemáticas (6 RS, 75 RCTs)",fd:"Selênio pode reduzir anticorpos anti-TPO aos 3 e 6 meses na tireoidite autoimune, mas com baixa certeza de evidência; impacto clínico incerto.",doi:"10.3390/nu15143194"}],
  blocos:[{d:"Tireoidite de Hashimoto",n:"C",t:"Pode reduzir anti-TPO; impacto clínico incerto."}],
  dose:"100–200 mcg/dia (selenometionina).",seg:"Janela estreita — selenose em doses altas (>400 mcg).",mani:"Selênio (selenometionina) 100 mcg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Suplemento mineral."},
 {id:"crom",nome:"Cromo (picolinato)",sci:"",classe:"Mineral",tags:["controle glicêmico","saciedade"],
  resumo:"Oligoelemento que participa da sinalização da insulina. A suplementação foi muito promovida para glicemia e emagrecimento, mas o efeito real é pequeno e inconsistente.",
  refs:[{au:"Asbaghi O et al.",yr:2020,jr:"Pharmacol Res",ty:"Revisão sistemática + meta-análise (28 RCTs)",fd:"Em diabéticos tipo 2, cromo reduziu glicemia de jejum, insulina, HbA1c e HOMA-IR; heterogeneidade muito alta entre estudos.",doi:"10.1016/j.phrs.2020.105098"}],
  blocos:[{d:"Controle glicêmico",n:"C",t:"Efeito pequeno e inconsistente."}],
  dose:"200–400 mcg/dia.",seg:"Bem tolerado nas doses usuais.",mani:"Cromo picolinato 200 mcg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Suplemento mineral."},
 {id:"fe",nome:"Ferro",sci:"",classe:"Mineral",tags:["anemia ferropriva","fadiga"],
  resumo:"Mineral essencial à hemoglobina (transporte de oxigênio) e a enzimas. A reposição corrige a anemia ferropriva e a fadiga que vem dela — mas só faz sentido com deficiência comprovada por ferritina. Tomar em dias alternados melhora a absorção (menos bloqueio pela hepcidina) e reduz desconforto no estômago/intestino.",
  refs:[{au:"Rehman T et al.",yr:2025,jr:"PLoS One",ty:"Revisão sistemática + meta-análise (28 estudos, n=8829)",fd:"Suplementação oral de ferro elevou a hemoglobina em ~2 g/dL na anemia ferropriva; sulfato ferroso oral com efeito significativo.",doi:"10.1371/journal.pone.0319068"}],
  blocos:[{d:"Anemia ferropriva",n:"A",t:"Reposição corrige anemia e a fadiga associada."},{d:"Fadiga sem deficiência",n:"D",t:"Sem benefício e com risco de sobrecarga."}],
  dose:"Conforme déficit; 40–80 mg de ferro elementar (dias alternados melhora absorção).",seg:"Prende o intestino e causa desconforto digestivo. NÃO tomar sem antes dosar a ferritina (reserva de ferro) no sangue. Perigoso para quem tem hemocromatose (uma doença de excesso de ferro).",mani:"Ferro (bisglicinato) 30 mg elementar — 60 cápsulas.\nTomar 1 cápsula em dias alternados, com vitamina C.",reg:"Suplemento mineral / medicamento."},
 {id:"resv",nome:"Resveratrol",sci:"",classe:"Nutracêutico",tags:["antioxidante","longevidade"],
  resumo:"Polifenol da casca da uva e do vinho tinto, ativador de vias de longevidade (sirtuínas) em modelos animais. Em humanos esbarra na biodisponibilidade muito baixa, e os desfechos clínicos seguem preliminares.",
  refs:[{au:"Abdelhaleem IA et al.",yr:2021,jr:"Med Clin (Barc)",ty:"Revisão sistemática + meta-análise (17 RCTs, n=871)",fd:"Em diabéticos tipo 2, doses ≥500 mg reduziram glicemia de jejum, colesterol total, HbA1c e pressão sistólica.",doi:"10.1016/j.medcli.2021.06.028"}],
  blocos:[{d:"Cardiometabólico / antioxidante",n:"C",t:"Sinais preliminares; biodisponibilidade baixa."},{d:"Longevidade",n:"D",t:"Sem evidência clínica em humanos."}],
  dose:"150–500 mg/dia.",seg:"Pode dar desconforto no estômago em doses altas. Interfere em enzimas do fígado que processam medicamentos, então pode mudar o efeito de outros remédios — usar com cautela se você toma medicação contínua.",mani:"Resveratrol 250 mg — 60 cápsulas.\nTomar 1 cápsula/dia.",reg:"Nutracêutico."},
 {id:"quer",nome:"Quercetina",sci:"",classe:"Nutracêutico",tags:["alergia","antioxidante"],
  resumo:"Flavonoide presente em cebola, maçã e alcaparra, com ação antioxidante e estabilizadora de mastócitos — daí o uso como anti-histamínico natural. A absorção oral é baixa.",
  refs:[{au:"Popiolek-Kalisz J, Fornal E",yr:2022,jr:"Curr Probl Cardiol",ty:"Meta-análise (10 RCTs, n=841)",fd:"Quercetina reduziu a pressão sistólica na população geral e a diastólica em (pré-)hipertensos.",doi:"10.1016/j.cpcardiol.2022.101350"}],
  blocos:[{d:"Rinite alérgica",n:"C",t:"Efeito anti-histamínico modesto."}],
  dose:"500 mg 1–2x/dia.",seg:"Desconforto no estômago/intestino. Doses muito altas: lesão nos rins rara.",mani:"Quercetina 500 mg — 60 cápsulas.\nTomar 1 cápsula 1–2x/dia.",reg:"Nutracêutico."},
 {id:"gluc",nome:"Glucosamina + condroitina",sci:"",classe:"Nutracêutico",tags:["osteoartrite"],
  resumo:"Componentes naturais da cartilagem articular. A glucosamina (sulfato) é o substrato dos glicosaminoglicanos; a condroitina retém água na matriz. A evidência é controversa e depende da forma — o sulfato de glucosamina (formulação europeia patenteada) é o que concentra o sinal positivo, não o cloridrato.",
  refs:[{au:"Gregori D et al.",yr:2018,jr:"JAMA",ty:"Revisão sistemática + meta-análise em rede (47 RCTs, n=22.037)",fd:"Sulfato de glucosamina associou-se a melhora da dor e do estreitamento do espaço articular no joelho em ≥12 meses; alta incerteza nas estimativas.",doi:"10.1001/jama.2018.19319"}],
  blocos:[{d:"Osteoartrite de joelho",n:"B",t:"Glucosamina sulfato 1500 mg ± condroitina; benefício real, mas controverso."}],
  dose:"Glucosamina sulfato 1500 mg/dia + condroitina 1200 mg/dia.",seg:"desconforto leve no estômago/intestino. Cautela em alergia a frutos do mar. Pode afetar glicemia.",mani:"Glucosamina sulfato 1500 mg + condroitina 1200 mg — 60 doses.\nTomar 1 dose/dia.",reg:"Nutracêutico / medicamento conforme apresentação."},
 {id:"ps",nome:"Fosfatidilserina",sci:"",classe:"Nutracêutico",tags:["cognição","estresse"],
  resumo:"Fosfolipídio componente das membranas dos neurônios. Dá suporte à sinalização celular cerebral; é estudada para memória em idosos e para atenuar o cortisol pós-exercício.",
  blocos:[{d:"Cognição (idosos)",n:"C",t:"100 mg 3x/dia; sinal modesto em memória."},{d:"Cortisol pós-exercício",n:"C",t:"Pode atenuar a resposta de cortisol."}],
  dose:"100 mg 1–3x/dia.",seg:"Bem tolerada. desconforto leve no estômago/intestino.",mani:"Fosfatidilserina 100 mg — 60 cápsulas.\nTomar 1 cápsula 1–3x/dia.",reg:"Nutracêutico."},
 {id:"psyl",nome:"Psyllium",sci:"Plantago ovata",classe:"Nutracêutico",tags:["constipação","dislipidemia","controle glicêmico"],
  resumo:"Fibra solúvel extraída da casca da semente do Plantago ovata. Forma gel no intestino: aumenta o bolo fecal (efeito sobre constipação), sequestra ácidos biliares (reduz LDL) e retarda a absorção de glicose (atenua picos pós-prandiais). É uma das poucas fibras com evidência de redução de LDL classificada como de alta qualidade.",
